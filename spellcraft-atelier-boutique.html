<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Atelier — Boutique et coffres</title>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
body{margin:0;background:var(--bg-void,#0b0a12);color:var(--parchment,#efe6c8);font-family:'Inter',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
h1{font-family:'Cinzel',serif;font-size:22px;margin:0 0 4px;color:#d4af37;}
.sub{font-size:13px;color:#a89f86;margin:0 0 16px;}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab{cursor:pointer;padding:9px 18px;border-radius:999px;border:1px solid #3a3260;background:#1f1a30;color:inherit;font-family:'Cinzel',serif;font-weight:700;font-size:14px;}
.tab.active{background:#d4af37;color:#1c1830;border-color:#d4af37;}
.view{display:none;}.view.active{display:block;}
.split{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start;}
@media(max-width:760px){.split{grid-template-columns:1fr;}}
.panel{background:#171325;border:1px solid #2b2440;border-radius:12px;padding:16px 18px;}
.panel h2{font-family:'Cinzel',serif;font-size:15px;color:#d4af37;margin:0 0 12px;}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:8px;background:#1f1a30;border:1px solid transparent;cursor:pointer;font-size:13px;}
.item:hover{border-color:#4a3f6e;}
.item.sel{border-color:#d4af37;}
.item img{width:34px;height:34px;object-fit:cover;border-radius:6px;border:1px solid #3a3260;flex-shrink:0;background:#0f0c1a;}
.item .nm{flex:1;min-width:0;}
.item .nm small{display:block;color:#a89f86;font-size:11px;}
.field{margin-bottom:13px;}
.field>label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#a89f86;margin-bottom:5px;}
input[type=text],input[type=number],select{box-sizing:border-box;width:100%;background:#0f0c1a;color:#efe6c8;border:1px solid #3a3260;border-radius:6px;padding:8px 10px;font-size:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.rar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.rar label{font-size:11px;color:#a89f86;display:block;margin-bottom:3px;}
.hint{font-size:12px;color:#a89f86;line-height:1.5;}
.btn{background:#1f1a30;border:1px solid #3a3260;color:#efe6c8;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;cursor:pointer;}
.btn:hover{border-color:#d4af37;}
.btn.primary{background:linear-gradient(180deg,#7c5cff,#5537c2);border:none;color:#fff;}
.btn.danger{border-color:#c23b3b;color:#e88;}
.btn.sm{padding:5px 10px;font-size:12px;}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;}
.ok{color:#6fd39a;}.ko{color:#e46a6a;}
.preview{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #3a3260;background:#0f0c1a;display:none;}
.empty{color:#a89f86;font-style:italic;font-size:13px;padding:10px 0;}
.denied{padding:60px 20px;text-align:center;color:#d9cfae;}
.modal{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:80;}
.modal.show{display:flex;}
.modal .box{background:#171325;border:1px solid #3a3260;border-radius:12px;padding:20px;width:620px;max-width:92vw;max-height:84vh;overflow:auto;}
.modal textarea{width:100%;box-sizing:border-box;min-height:90px;background:#0f0c1a;color:#efe6c8;border:1px solid #3a3260;border-radius:8px;padding:10px;font-family:monospace;}
.pgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.pgrid div{width:84px;text-align:center;cursor:pointer;font-size:10px;color:#a89f86;}
.pgrid img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:2px solid #3a3260;display:block;}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="hint">Chargement…</p></div>

<div class="modal" id="picker"><div class="box">
  <h2 style="font-family:'Cinzel',serif;color:#d4af37;margin:0 0 6px;">📁 Choisir une illustration</h2>
  <p class="hint">Le site est statique : il ne peut pas lister le dossier. Colle ici les noms des fichiers présents dans <code>images/card/back/</code> (un par ligne), puis clique sur une vignette.</p>
  <textarea id="picker-list" placeholder="dos-flammes.png&#10;booster-aube.png"></textarea>
  <div class="pgrid" id="picker-grid"></div>
  <div class="actions"><button class="btn" data-act="picker-close">Fermer</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-auth.js"></script>
<script src="spellcraft-atelier-nav.js"></script>
<script>
(function(){
const FOLDER='images/card/back/', STORE='spellcraft_cardback_filelist';
const RARS=['Basique','Commune','Rare','Épique','Mythique'];
const RAR_DEFAULT={Basique:30,Commune:40,Rare:20,'Épique':8,Mythique:2};
let SETS=[], BOOSTERS=[], BACKS=[], TITLES=[], TAB='boosters', SEL={boosters:null,backs:null}, pickTarget=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
function say(id,t,ok){const e=$(id); if(!e) return; e.textContent=t; e.className=ok===true?'ok':ok===false?'ko':'hint';}
const imgSrc=u=>u?(/^(https?:|data:|\/)/.test(u)?u:u):'';

async function loadAll(){
  const [s,b,c,t]=await Promise.all([
    sb.from('card_sets').select('id,name,in_shop').order('name'),
    sb.from('boosters').select('*').order('created_at'),
    sb.from('card_backs').select('*').order('created_at'),
    sb.from('achievement_definitions').select('id,name,description,category,active,title_masculine,title_feminine').eq('grants_title',true).order('created_at')]);
  SETS=s.data||[]; BOOSTERS=b.data||[]; BACKS=c.data||[]; TITLES=t.data||[];
}

/* ---------- Vues ---------- */
function render(){
  $('root').innerHTML=`<h1>Boutique & coffres</h1><p class="sub">Boosters et dos de cartes, dons d'or, et les récompenses des coffres de Velkrin.</p>
  <div class="tabs">
    <button class="tab ${TAB==='boosters'?'active':''}" data-act="tab" data-v="boosters">📦 Boosters</button>
    <button class="tab ${TAB==='backs'?'active':''}" data-act="tab" data-v="backs">🎴 Dos de cartes</button>
    <button class="tab ${TAB==='or'?'active':''}" data-act="tab" data-v="or">🪙 Or & distribution</button>
    <button class="tab ${TAB==='coffres'?'active':''}" data-act="tab" data-v="coffres">🎁 Coffres de Velkrin</button>
  </div>
  <div class="view ${TAB==='boosters'?'active':''}" id="v-boosters"></div>
  <div class="view ${TAB==='backs'?'active':''}" id="v-backs"></div>
  <div class="view ${TAB==='or'?'active':''}" id="v-or"></div>
  <div class="view ${TAB==='coffres'?'active':''}" id="v-coffres"></div>`;
  renderBoosters(); renderBacks(); renderGold();
  if(TAB==='coffres') showCoffres();
}

function imageField(prefix,val){
  return `<div class="field"><label>Image (URL, ou fichier du dossier images/card/back/)</label>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="text" id="${prefix}-image" value="${esc(val||'')}" placeholder="https://… ou nom-fichier.png" data-prev="${prefix}">
      <button class="btn sm" data-act="picker-open" data-p="${prefix}">📁 Parcourir</button>
      <img class="preview" id="${prefix}-prev" ${val?`src="${esc(imgSrc(val))}" style="display:inline-block"`:''}>
    </div></div>`;
}

/* ---------- Boosters ---------- */
function renderBoosters(){
  const sel=SEL.boosters, b=BOOSTERS.find(x=>x.id===sel)||((sel==='new'||sel==='new-miniset')?{id:null,name:'',set_id:(SETS[0]||{}).id,price:120,image_url:'',in_shop:true,kind:(sel==='new-miniset'?'miniset':'booster'),miniset_copies:'max',rarity_distribution:RAR_DEFAULT}:null);
  const list=BOOSTERS.map(x=>{const set=(SETS.find(s=>s.id===x.set_id)||{}).name||'(set introuvable)';
    return `<div class="item ${sel===x.id?'sel':''}" data-act="sel-b" data-id="${esc(x.id)}">${x.image_url?`<img src="${esc(imgSrc(x.image_url))}">`:'<img>'}<div class="nm">${esc(x.name)}<small>${x.kind==='miniset'?'🗂️ Mini-set · ':''}${esc(set)} · ${x.in_shop===false?'🎁 hors boutique':esc(x.price)+' or'}</small></div></div>`;}).join('')||'<div class="empty">Aucun booster ni mini-set créé.</div>';
  let form='<div class="empty">Choisis un booster dans la liste, ou crée-en un.</div>';
  if(b){
    const d=b.rarity_distribution||{};
    const isMs=b.kind==='miniset';
    form=`<div class="field"><label>Type</label><select id="b-kind"><option value="booster" ${isMs?'':'selected'}>📦 Booster (6 cartes au hasard, achetable à volonté)</option><option value="miniset" ${isMs?'selected':''}>🗂️ Mini-set (toutes les cartes du set, achat unique par joueur)</option></select></div>
    <div class="field"><label>Nom</label><input type="text" id="b-name" value="${esc(b.name)}" placeholder="Ex : Booster Aube"></div>
    <div class="row2"><div class="field"><label id="b-set-label">${isMs?'Set contenu (toutes ses cartes)':'Set source'}</label><select id="b-set">${SETS.map(s=>`<option value="${esc(s.id)}" ${s.id===b.set_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Prix (or)</label><input type="number" id="b-price" min="1" value="${esc(b.price)}"></div></div>
    ${imageField('b',b.image_url)}
    <div class="field"><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;color:#efe6c8;cursor:pointer;"><input type="checkbox" id="b-shop" ${b.in_shop!==false?'checked':''} style="width:auto;"> Vendu dans la boutique (décoché : le booster reste utilisable comme récompense, mais n'apparaît pas en boutique)</label></div>
    <div id="b-box-booster" style="${isMs?'display:none':''}"><div class="field"><label>Répartition des raretés (%) — total : <b id="b-total"></b>/100</label>
    <div class="rar">${RARS.map(r=>`<div><label>${r}</label><input type="number" min="0" max="100" class="b-rar" data-r="${r}" value="${esc(d[r]!=null?d[r]:0)}"></div>`).join('')}</div></div></div>
    <div id="b-box-miniset" style="${isMs?'':'display:none'}"><div class="field"><label>Exemplaires donnés par carte</label><select id="b-copies"><option value="max" ${b.miniset_copies==='one'?'':'selected'}>Le maximum autorisé en deck (2 exemplaires ; 1 pour les héros, régions et légendaires)</option><option value="one" ${b.miniset_copies==='one'?'selected':''}>1 seul exemplaire de chaque carte</option></select></div>
    <p class="hint" id="b-count">Nombre de cartes du set : …</p>
    <p class="hint">Achat unique : le joueur reçoit toutes les cartes d'un coup, une seule fois. S'il possède déjà des exemplaires, on complète sans dépasser le maximum, et le prix reste le même.</p></div>
    <div class="actions"><button class="btn primary" data-act="save-b">💾 Enregistrer</button>${b.id?`<button class="btn danger" data-act="del-b">🗑 Supprimer</button>`:''}<span id="b-status" class="hint"></span></div>`;
  }
  $('v-boosters').innerHTML=`<div class="split"><div class="panel"><h2>Boosters et mini-sets (${BOOSTERS.length})</h2>${list}<button class="btn sm" data-act="new-b">+ Nouveau booster</button> <button class="btn sm" data-act="new-ms">+ Nouveau mini-set</button></div><div class="panel"><h2>${b?(b.id?(b.kind==='miniset'?'Modifier le mini-set':'Modifier le booster'):(b.kind==='miniset'?'Nouveau mini-set':'Nouveau booster')):'Booster / mini-set'}</h2>${form}</div></div>`;
  updTotal(); updMsCount();
}
async function updMsCount(){
  const e=$('b-count'), st=$('b-set'); if(!e||!st) return;
  const {count,error}=await sb.from('cards').select('id',{count:'exact',head:true}).eq('set_id',st.value);
  if(error||count==null){e.textContent='Nombre de cartes du set : inconnu';return;}
  e.textContent='Nombre de cartes du set : '+count+(count<30||count>50?' (conseillé pour un mini-set : 30 à 50)':'');
  e.style.color=(count<30||count>50)?'#e4b86a':'';
}
function onKindChange(){
  const ms=$('b-kind').value==='miniset';
  $('b-box-booster').style.display=ms?'none':''; $('b-box-miniset').style.display=ms?'':'none';
  $('b-set-label').textContent=ms?'Set contenu (toutes ses cartes)':'Set source';
}
function updTotal(){const t=[...document.querySelectorAll('.b-rar')].reduce((a,i)=>a+(parseInt(i.value)||0),0);const e=$('b-total'); if(e){e.textContent=t;e.style.color=t===100?'#6fd39a':'#e46a6a';}}
async function saveBooster(){
  const name=$('b-name').value.trim(); if(!name) return say('b-status','Donne un nom au booster.',false);
  const isMs=$('b-kind').value==='miniset';
  const dist={}; document.querySelectorAll('.b-rar').forEach(i=>dist[i.dataset.r]=parseInt(i.value)||0);
  const total=Object.values(dist).reduce((a,b)=>a+b,0);
  if(!isMs && total!==100 && !confirm(`La répartition fait ${total} % au lieu de 100 %. Enregistrer quand même ?`)) return;
  const cur=BOOSTERS.find(x=>x.id===SEL.boosters);
  const row={id:cur?cur.id:'booster_'+Date.now(),name,set_id:$('b-set').value,price:parseInt($('b-price').value)||120,image_url:$('b-image').value.trim()||null,rarity_distribution:isMs?(cur&&cur.rarity_distribution)||RAR_DEFAULT:dist};
  const hasKind=BOOSTERS.some(x=>'kind' in x);
  if(hasKind){row.kind=isMs?'miniset':'booster'; row.miniset_copies=$('b-copies').value;}
  else if(isMs) return say('b-status',"Les mini-sets n'existent pas encore dans la base : exécute d'abord le fichier SQL minisets_20261010.sql dans Supabase (SQL Editor).",false);
  const hasCol=BOOSTERS.some(x=>'in_shop' in x);
  if(hasCol) row.in_shop=$('b-shop').checked;
  else if(!$('b-shop').checked) return say('b-status',"La colonne « in_shop » n'existe pas encore : exécute d'abord le fichier SQL de la livraison (boutique_recompenses_rarete).",false);
  const {error}=await sb.from('boosters').upsert(row);
  if(error) return say('b-status','Erreur : '+error.message,false);
  const setRow=SETS.find(x=>x.id===row.set_id);
  if(isMs && setRow && setRow.in_shop!==false && confirm(`Le set « ${setRow.name} » est encore proposé en boutique (cartes à l'unité et offres du jour). Le retirer de la boutique, pour qu'on ne puisse l'obtenir que via ce mini-set ?`)){
    const r2=await sb.from('card_sets').update({in_shop:false}).eq('id',setRow.id);
    if(r2.error) alert('Impossible de modifier le set : '+r2.error.message);
  }
  await loadAll(); SEL.boosters=row.id; renderBoosters(); say('b-status','✓ Enregistré',true);
}
async function delBooster(){
  const b=BOOSTERS.find(x=>x.id===SEL.boosters); if(!b||!confirm(`Supprimer le booster « ${b.name} » ?`)) return;
  const {error}=await sb.from('boosters').delete().eq('id',b.id);
  if(error) return say('b-status','Erreur : '+error.message,false);
  SEL.boosters=null; await loadAll(); renderBoosters();
}

/* ---------- Dos de cartes ---------- */
function renderBacks(){
  const sel=SEL.backs, c=BACKS.find(x=>x.id===sel)||(sel==='new'?{id:null,name:'',price:150,image_url:'',shop_visible:true}:null);
  const list=BACKS.map(x=>`<div class="item ${sel===x.id?'sel':''}" data-act="sel-c" data-id="${esc(x.id)}">${x.image_url?`<img src="${esc(imgSrc(x.image_url))}">`:'<img>'}<div class="nm">${esc(x.name)}<small>${x.shop_visible===false?'🎁 récompense (hors boutique)':esc(x.price)+' or'}</small></div></div>`).join('')||'<div class="empty">Aucun dos créé.</div>';
  let form='<div class="empty">Choisis un dos dans la liste, ou crée-en un.</div>';
  if(c){
    form=`<div class="row2"><div class="field"><label>Nom</label><input type="text" id="c-name" value="${esc(c.name)}" placeholder="Ex : Dos flammes"></div>
    <div class="field"><label>Prix (or)</label><input type="number" id="c-price" min="1" value="${esc(c.price)}"></div></div>
    ${imageField('c',c.image_url)}
    <div class="field"><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;color:#efe6c8;cursor:pointer;"><input type="checkbox" id="c-shop" ${c.shop_visible!==false?'checked':''} style="width:auto;"> Vendu dans la boutique</label>
    <div class="hint" style="margin-top:4px;">Décoché = dos « récompense » : il n'apparaît jamais dans la boutique et s'obtient par les coffres de Velkrin ou par distribution.</div></div>
    <div class="actions"><button class="btn primary" data-act="save-c">💾 Enregistrer</button>${c.id?`<button class="btn danger" data-act="del-c">🗑 Supprimer</button>`:''}<span id="c-status" class="hint"></span></div>`;
  }
  $('v-backs').innerHTML=`<div class="split"><div class="panel"><h2>Dos de cartes (${BACKS.length})</h2>${list}<button class="btn sm" data-act="new-c">+ Nouveau dos</button></div><div class="panel"><h2>${c?(c.id?'Modifier le dos':'Nouveau dos'):'Dos de carte'}</h2>${form}</div></div>`;
}
async function saveBack(){
  const name=$('c-name').value.trim(); if(!name) return say('c-status','Donne un nom au dos.',false);
  const cur=BACKS.find(x=>x.id===SEL.backs);
  const row={id:cur?cur.id:'back_'+Date.now(),name,price:parseInt($('c-price').value)||150,image_url:$('c-image').value.trim()||null,shop_visible:$('c-shop').checked};
  const {error}=await sb.from('card_backs').upsert(row);
  if(error) return say('c-status','Erreur : '+error.message,false);
  await loadAll(); SEL.backs=row.id; renderBacks(); renderGold(); say('c-status','✓ Enregistré',true);
}
async function delBack(){
  const c=BACKS.find(x=>x.id===SEL.backs); if(!c||!confirm(`Supprimer le dos « ${c.name} » ?`)) return;
  const {error}=await sb.from('card_backs').delete().eq('id',c.id);
  if(error) return say('c-status','Erreur : '+error.message,false);
  SEL.backs=null; await loadAll(); renderBacks(); renderGold();
}

/* ---------- Or & distribution ---------- */
function renderGold(){
  $('v-or').innerHTML=`<div class="split" style="grid-template-columns:1fr 1fr;">
  <div class="panel"><h2>🪙 Donner de l'or</h2><p class="hint">Crédite le compte d'un joueur (ou de tous), sans passer par une quête ou un achat. Un montant négatif retire de l'or.</p>
    <div class="field"><label>Cible</label><select id="g-mode"><option value="single">Un joueur précis</option><option value="all">Tous les joueurs</option></select></div>
    <div class="field" id="g-user-f"><label>Pseudo</label><input type="text" id="g-user" placeholder="Ex : Kroquette"></div>
    <div class="field"><label>Montant</label><input type="number" id="g-amount" value="100" step="1"></div>
    <div class="actions"><button class="btn primary" data-act="gold">💰 Valider</button><span id="g-status" class="hint"></span></div></div>
  <div class="panel"><h2>🎁 Donner un dos de carte</h2><p class="hint">Donne un dos à un joueur précis, vendable ou non (récompense d'événement, par exemple).</p>
    <div class="field"><label>Pseudo</label><input type="text" id="d-user" placeholder="Ex : Kroquette"></div>
    <div class="field"><label>Dos</label><select id="d-back">${BACKS.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}${c.shop_visible===false?' (récompense)':''}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn primary" data-act="grant-back">🎁 Donner</button><span id="d-status" class="hint"></span></div></div></div>
  <div class="split" style="grid-template-columns:1fr 1fr;margin-top:16px;">
  <div class="panel"><h2>🏷️ Donner un titre</h2><p class="hint">Offre un titre de profil à un joueur (ou à tous). Le joueur l'équipe ensuite depuis son profil. « Retirer » reprend le titre (et le déséquipe s'il le portait).</p>
    <div class="field"><label>Titre</label><select id="t-title">${titleOptions()}</select></div>
    <div class="field"><label>Cible</label><select id="t-mode"><option value="single">Un joueur précis</option><option value="all">Tous les joueurs</option></select></div>
    <div class="field" id="t-user-f"><label>Pseudo</label><input type="text" id="t-user" placeholder="Ex : Kroquette"></div>
    <div class="actions"><button class="btn primary" data-act="title-give">🏷️ Donner</button><button class="btn danger" data-act="title-revoke">Retirer</button><button class="btn" data-act="title-owners">Qui l'a ?</button></div>
    <p id="t-status" class="hint" style="margin-top:8px;"></p></div>
  <div class="panel"><h2>✏️ Créer un titre</h2><p class="hint">Crée un nouveau titre de profil (il n'apparaît pas dans la liste des succès). Si les deux formes sont identiques, laisse le féminin vide.</p>
    <div class="row2"><div class="field"><label>Titre (masculin)</label><input type="text" id="tc-m" placeholder="Ex : Champion"></div>
    <div class="field"><label>Titre (féminin)</label><input type="text" id="tc-f" placeholder="Ex : Championne"></div></div>
    <div class="actions"><button class="btn primary" data-act="title-create">➕ Créer le titre</button><span id="tc-status" class="hint"></span></div>
    <div id="t-mine" style="margin-top:14px;">${myTitlesHtml()}</div></div></div>`;
}
const MANUAL='manual';
const titleLabel=t=>{const m=t.title_masculine||t.name, f=t.title_feminine; return f&&f!==m?m+' / '+f:m;};
function titleOptions(){
  const mine=TITLES.filter(t=>t.category===MANUAL), other=TITLES.filter(t=>t.category!==MANUAL);
  const opt=t=>`<option value="${esc(t.id)}">${esc(titleLabel(t))}</option>`;
  return (mine.length?`<optgroup label="Titres créés ici">${mine.map(opt).join('')}</optgroup>`:'')
    + (other.length?`<optgroup label="Autres titres (succès, calendrier, pass…)">${other.map(opt).join('')}</optgroup>`:'')
    || '<option value="">Aucun titre : crées-en un →</option>';
}
function myTitlesHtml(){
  const mine=TITLES.filter(t=>t.category===MANUAL);
  if(!mine.length) return '<div class="empty">Aucun titre créé ici pour l\'instant.</div>';
  return mine.map(t=>`<div class="item" style="cursor:default"><div class="nm">${esc(titleLabel(t))}<small>${esc(t.id)}</small></div><button class="btn sm danger" data-act="title-del" data-id="${esc(t.id)}">Supprimer</button></div>`).join('');
}
const RPC_MISSING="Fonction manquante : exécute d'abord le fichier titres_donnes_20261009.sql dans Supabase (SQL Editor).";
function titleErr(r,user){
  const e=r.error, code=(r.data&&r.data.error)||(e&&(e.message||e.code))||'erreur';
  if(e&&(e.code==='PGRST202'||/could not find the function|schema cache/i.test(e.message||''))) return RPC_MISSING;
  const m={'not-authorized':"Seul le compte Kroquette peut gérer les titres.",'player-not-found':`Aucun joueur « ${user} ».`,'unknown-title':"Ce titre n'existe plus (rafraîchis la page).",'already-owned':`${user} possède déjà ce titre.`,'not-owned':`${user} n'a pas ce titre.`};
  return m[code]||('Erreur : '+code);
}
async function createTitle(){
  const m=$('tc-m').value.trim(), f=$('tc-f').value.trim()||m;
  if(!m) return say('tc-status','Indique le titre (masculin).',false);
  const id='title_'+Date.now();
  say('tc-status','Création…');
  const {error}=await sb.from('achievement_definitions').insert({id,name:m,description:'Titre offert par l\'équipe',condition_type:'manual',category:MANUAL,target_count:1,rewards:[],active:false,order_index:9200,grants_title:true,title_masculine:m,title_feminine:f});
  if(error) return say('tc-status','Erreur : '+error.message,false);
  await loadAll(); renderGold(); $('t-title').value=id; say('t-status',`✓ Titre « ${m}${f!==m?' / '+f:''} » créé : tu peux le donner.`,true);
}
async function deleteTitle(id){
  const t=TITLES.find(x=>x.id===id); if(!t||t.category!==MANUAL) return;
  if(!confirm(`Supprimer le titre « ${titleLabel(t)} » ? Les joueurs qui l'ont le perdent.`)) return;
  const {error}=await sb.from('achievement_definitions').delete().eq('id',id);
  if(error) return say('tc-status','Erreur : '+error.message,false);
  await loadAll(); renderGold(); say('t-status','✓ Titre supprimé.',true);
}
async function giveTitle(revoke){
  const id=$('t-title').value, all=$('t-mode').value==='all', user=$('t-user').value.trim();
  const t=TITLES.find(x=>x.id===id);
  if(!id||!t) return say('t-status',"Choisis un titre (ou crée-en un).",false);
  if(revoke){
    if(all) return say('t-status','Pour retirer un titre, indique un joueur précis.',false);
    if(!user) return say('t-status','Indique le pseudo du joueur.',false);
    say('t-status','Envoi…');
    const r=await sb.rpc('admin_revoke_title',{p_username:user,p_title_id:id});
    if(r.error||(r.data&&r.data.error)) return say('t-status',titleErr(r,user),false);
    return say('t-status',`✓ Titre « ${titleLabel(t)} » retiré à ${r.data.username}.`,true);
  }
  if(!all&&!user) return say('t-status','Indique le pseudo du joueur.',false);
  if(all&&!confirm(`Confirmer : donner le titre « ${titleLabel(t)} » à TOUS les joueurs ?`)) return;
  say('t-status','Envoi…');
  const r=all?await sb.rpc('admin_grant_title_all',{p_title_id:id}):await sb.rpc('admin_grant_title',{p_username:user,p_title_id:id});
  if(r.error||(r.data&&r.data.error)) return say('t-status',titleErr(r,user),false);
  say('t-status',all?`✓ Titre « ${titleLabel(t)} » donné à ${r.data.new_count} joueur(s) (sur ${r.data.player_count}, les autres l'avaient déjà).`:`✓ Titre « ${titleLabel(t)} » donné à ${r.data.username}.`,true);
}
async function titleOwners(){
  const id=$('t-title').value, t=TITLES.find(x=>x.id===id);
  if(!id||!t) return say('t-status',"Choisis un titre.",false);
  say('t-status','Recherche…');
  const r=await sb.rpc('admin_title_owners',{p_title_id:id});
  if(r.error||(r.data&&r.data.error)) return say('t-status',titleErr(r,''),false);
  const o=r.data.owners||[];
  say('t-status',o.length?`« ${titleLabel(t)} » : ${o.length} joueur(s) — ${o.join(', ')}`:`Personne n'a encore « ${titleLabel(t)} ».`, o.length?true:undefined);
}
async function giveGold(){
  const all=$('g-mode').value==='all', user=$('g-user').value.trim(), amount=parseInt($('g-amount').value,10);
  if(!amount||isNaN(amount)) return say('g-status','Indique un montant non nul.',false);
  if(!all&&!user) return say('g-status','Indique le pseudo du joueur.',false);
  if(all&&!confirm(`Confirmer : donner ${amount} or à TOUS les joueurs ?`)) return;
  say('g-status','Envoi…');
  const {data,error}=await sb.functions.invoke('game-action',{body:all?{action:'adminGrantGoldAll',amount}:{action:'adminGrantGold',username:user,amount}});
  if(error||(data&&data.error)){const code=(data&&data.error)||(error&&error.message)||'erreur';
    const m={'not-authorized':"Seul le compte Kroquette peut donner de l'or.",'not-logged-in':'Tu dois être connecté.','player-not-found':`Aucun joueur « ${user} ».`,'invalid-amount':'Montant invalide.','missing-params':'Champs manquants.'};
    return say('g-status',m[code]||('Erreur : '+code),false);}
  say('g-status',all?`✓ ${amount} or donné à ${data.player_count} joueur(s).`:`✓ ${amount} or donné à ${data.username} (solde : ${data.new_balance}).`,true);
}
async function giveBack(){
  const user=$('d-user').value.trim(), id=$('d-back').value;
  if(!user) return say('d-status','Indique le pseudo du joueur.',false);
  if(!id) return say('d-status',"Crée d'abord un dos de carte.",false);
  say('d-status','Envoi…');
  const {data,error}=await sb.functions.invoke('game-action',{body:{action:'grantCardBack',username:user,cardBackId:id}});
  if(error||(data&&data.error)){const code=(data&&data.error)||(error&&error.message)||'erreur';
    const m={'not-authorized':'Seul le compte Kroquette peut distribuer des dos.','not-logged-in':'Tu dois être connecté.','player-not-found':`Aucun joueur « ${user} ».`,'unknown-card-back':"Ce dos n'existe plus (rafraîchis la page).",'already-owned':`${user} possède déjà ce dos.`};
    return say('d-status',m[code]||('Erreur : '+code),false);}
  say('d-status',`✓ « ${data.card_back_name} » donné à ${data.username}.`,true); $('d-user').value='';
}

/* ---------- Coffres de Velkrin (page d'administration intégrée) ---------- */
function showCoffres(){
  const v=$('v-coffres'); if(v.firstChild) return;
  v.innerHTML='<iframe id="coffres-frame" src="spellcraft-calendar-admin.html?embed=1" title="Coffres de Velkrin" style="width:100%;border:0;min-height:1200px;background:transparent;"></iframe>';
}

/* ---------- Sélecteur d'illustration ---------- */
function pickerGrid(){
  const files=$('picker-list').value.split('\n').map(s=>s.trim()).filter(Boolean);
  $('picker-grid').innerHTML=files.length?files.map(f=>`<div data-act="picker-pick" data-f="${esc(f)}"><img src="${FOLDER}${esc(f)}" onerror="this.style.opacity=.25;this.title='Introuvable : vérifie le nom exact'">${esc(f)}</div>`).join(''):'<div class="empty">Colle des noms de fichiers ci-dessus.</div>';
}

/* ---------- Événements ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act;
  if(a==='tab'){TAB=t.dataset.v;render();}
  else if(a==='sel-b'){SEL.boosters=t.dataset.id;renderBoosters();}
  else if(a==='new-b'){SEL.boosters='new';renderBoosters();}
  else if(a==='new-ms'){SEL.boosters='new-miniset';renderBoosters();}
  else if(a==='save-b') saveBooster(); else if(a==='del-b') delBooster();
  else if(a==='sel-c'){SEL.backs=t.dataset.id;renderBacks();}
  else if(a==='new-c'){SEL.backs='new';renderBacks();}
  else if(a==='save-c') saveBack(); else if(a==='del-c') delBack();
  else if(a==='gold') giveGold(); else if(a==='grant-back') giveBack();
  else if(a==='title-create') createTitle(); else if(a==='title-del') deleteTitle(t.dataset.id);
  else if(a==='title-give') giveTitle(false); else if(a==='title-revoke') giveTitle(true); else if(a==='title-owners') titleOwners();
  else if(a==='picker-open'){pickTarget=t.dataset.p;try{$('picker-list').value=localStorage.getItem(STORE)||'';}catch(x){}pickerGrid();$('picker').classList.add('show');}
  else if(a==='picker-close') $('picker').classList.remove('show');
  else if(a==='picker-pick'){const inp=$(pickTarget+'-image'); inp.value=FOLDER+t.dataset.f; inp.dispatchEvent(new Event('input')); $('picker').classList.remove('show');}
});
document.addEventListener('change',e=>{
  if(e.target.id==='b-kind') onKindChange();
  if(e.target.id==='b-set') updMsCount();
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('b-rar')) updTotal();
  if(e.target.id==='picker-list'){try{localStorage.setItem(STORE,e.target.value);}catch(x){} pickerGrid();}
  if(e.target.dataset&&e.target.dataset.prev){const im=$(e.target.dataset.prev+'-prev'),v=e.target.value.trim(); if(v){im.src=imgSrc(v);im.style.display='inline-block';}else{im.style.display='none';}}
});
window.addEventListener('message',e=>{ if(e.data&&e.data.type==='coffres-admin-height'){const f=$('coffres-frame'); if(f) f.style.height=Math.ceil(e.data.h)+20+'px';} });
document.addEventListener('change',e=>{ if(e.target.id==='g-mode') $('g-user-f').style.display=e.target.value==='all'?'none':''; if(e.target.id==='t-mode') $('t-user-f').style.display=e.target.value==='all'?'none':''; });

(async function init(){
  try{
    await initSpellcraftAuth();
    atelierNav('boutique');
    const user=await scGetCurrentUser();
    if(!user){ $('root').innerHTML='<div class="denied">Connecte-toi pour accéder à cette page.</div>'; return; }
    const {data:adm}=await sb.rpc('is_admin');
    if(adm!==true){ $('root').innerHTML='<div class="denied">Accès réservé à l\'administrateur.</div>'; return; }
    if(location.hash==='#coffres') TAB='coffres';
    await loadAll(); render();
  }catch(err){ $('root').innerHTML='<div class="denied">Erreur de chargement : '+esc(err.message)+'</div>'; }
})();
})();
</script>
