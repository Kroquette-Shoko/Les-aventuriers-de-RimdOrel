<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimd'Orël — Plateau serveur</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu (même
// principe que les pages de menu — le plateau suit maintenant les 5
// thèmes pour la cohérence, sans changer sa mise en page).
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

/* Les jetons d'interface (--bg-void, --bg-panel, --parchment, --gold,
   etc.) viennent maintenant de spellcraft-ui-kit.css et suivent le
   thème actif. On ne garde ici que les couleurs propres au jeu — les
   teintes des classes de magie — qui n'ont pas à changer avec le thème
   (l'identité visuelle d'une carte reste la même quel que soit le thème
   d'interface choisi). */
:root{
  --aube:#d4af37; --crepuscule:#4b0082; --prima:#228b22; --volonte:#8b0000; --arcane-c:#4682b4; --neutre:#c0c0c0;
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;}
.title-font{font-family:'Cinzel',serif;}

#board-scale-outer{position:fixed;inset:0;background:var(--bg-void,hsl(calc(var(--th, 252) - 4.5) calc(var(--ts-n, 1) * 28.6%) 5.5%));overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:1;}
/* Écran qui tremble sur un gros coup — voir shakeScreen(). Sur le conteneur
   plein écran (pas #app-outer, déjà utilisé pour la mise à l'échelle du
   plateau) pour que ce soit TOUT l'écran qui vibre, pas juste le plateau. */
@keyframes screen-shake-medium{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-6px,3px);}
  40%{transform:translate(5px,-4px);}
  60%{transform:translate(-4px,4px);}
  80%{transform:translate(3px,-2px);}
}
@keyframes screen-shake-large{
  0%,100%{transform:translate(0,0);}
  15%{transform:translate(-13px,6px);}
  30%{transform:translate(11px,-9px);}
  45%{transform:translate(-9px,8px);}
  60%{transform:translate(8px,-6px);}
  75%{transform:translate(-5px,4px);}
  90%{transform:translate(3px,-2px);}
}
#board-scale-outer.shake-medium{animation:screen-shake-medium .36s ease-in-out;}
#board-scale-outer.shake-large{animation:screen-shake-large .46s ease-in-out;}
#app-outer{width:1920px;height:1080px;transform-origin:center center;flex-shrink:0;display:flex;flex-direction:column;}
#app{display:flex;flex:1;width:100%;min-height:0;}

/* ---------- Barre du haut ---------- */
/* Même style que la barre partagée #app-topbar (spellcraft-shared.js,
   utilisée sur le hub/lobby/boutique/etc.) — mêmes classes, mêmes
   couleurs, même bouton "☰ Menu". La différence avec les autres pages :
   ici elle est injectée directement dans le HTML du plateau (au lieu
   d'être ajoutée par injectAppTopbar()) et réserve un vrai espace de
   56px (padding-top de #board) au lieu de flotter en position:fixed —
   #board-scale-outer occupe tout l'écran en position:fixed, la barre
   partagée flottante passerait donc SOUS lui et resterait invisible,
   ou par-dessus et recouvrirait la zone adverse (c'est justement pour
   ça qu'elle était désactivée ici via APP_TOPBAR_DISABLED). */
#board-topbar{width:1920px;height:56px;box-sizing:border-box;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg-panel, hsl(calc(var(--th, 252) + 10.5) calc(var(--ts-n, 1) * 25%) 6.3% / .92));border-bottom:1.5px solid var(--line, rgba(212,175,55,.4));font-family:'Inter',sans-serif;}
#board-topbar{--gear-size:54px;}
#board-topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
#board-back-btn{font-family:'Cinzel',serif;font-weight:700;font-size:12.5px;color:var(--parchment, #f2ead2);background:none;text-decoration:none;border:1.5px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;padding:7px 14px;white-space:nowrap;cursor:pointer;}
#board-back-btn:hover{border-color:var(--gold, #d4af37);color:var(--gold, #d4af37);}
/* #sc-options-slot : quand présent, spellcraft-shared.js y ancre
   automatiquement l'engrenage en version compacte (38px, statique) au
   lieu de la grosse pastille flottante 80px par défaut — exactement
   comme sur les autres pages. */

/* ---------- Board ---------- */
#board{flex:1;position:relative;display:flex;flex-direction:column;padding:12px 16px 100px;gap:6px;min-width:0;min-height:0;background:none;}
#board-scroll-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;padding-right:2px;scrollbar-width:none;}
#board-scroll-area::-webkit-scrollbar{width:0;height:0;background:transparent;}

.hero-row{display:flex;flex-direction:column;gap:6px;padding:8px 14px;background:var(--bg-panel);border-radius:14px;border:1px solid hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 28%) 19.6%);max-width:400px;width:fit-content;flex-shrink:0;}
.draw-anim-card{
  position:fixed;width:150px;height:204px;z-index:150;pointer-events:none;
  transform-origin:top left;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.65));
}
.hero-row.enemy{align-self:flex-end;}
.hero-row.self{align-self:flex-start;}

.hero-top{display:flex;align-items:center;gap:14px;}

.hero-portrait{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--arcane), hsl(calc(var(--th, 252) + 0.2) calc(var(--ts-n, 1) * 46.6%) 22.7%));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;border:3px solid var(--gold);position:relative;}
.hp-badge{position:absolute;bottom:-6px;right:-9px;min-width:26px;height:26px;padding:0 5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e85858,#8a1f1f);border:2px solid #4a0f0f;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.65);z-index:2;}

.hero-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
.hero-name{font-family:'Cinzel',serif;font-size:17px;font-weight:600;color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.hp{background:var(--blood);}

.hpbar-wrap{width:110px;height:7px;background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 28%) 19.6%);border-radius:6px;overflow:hidden;}
.hpbar{height:100%;background:linear-gradient(90deg,var(--blood),#e06060);transition:width .3s;}

.power-btn{background:var(--bg-panel-2);border:1.5px solid var(--frost);color:var(--frost);border-radius:9px;padding:6px 12px;font-family:'Inter';font-size:11.5px;font-weight:600;cursor:pointer;white-space:normal;text-align:left;line-height:1.3;width:100%;}
.power-btn:disabled{opacity:.35;cursor:not-allowed;border-color:#444;color:#777;}
.power-btn:not(:disabled):hover{background:var(--frost);color:var(--ink);}

.region-tag{font-size:12.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.mana-bar{display:flex;align-items:center;gap:10px;}
.mana-region-thumb{width:32px;height:32px;border-radius:7px;background-size:cover;background-position:center;background-color:var(--bg-panel-2);border:2px solid var(--green);flex-shrink:0;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.mana-dots{display:flex;flex-wrap:wrap;gap:4px;align-content:center;}
.mana-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.45);flex-shrink:0;}
.mana-dot.filled{background:radial-gradient(circle at 35% 30%,#8fe0ff,#155a94);box-shadow:0 0 5px rgba(111,208,255,.7);}
.mana-dot.empty{background:var(--bg-panel-3, hsl(calc(var(--th, 252) + 0) calc(var(--ts-n, 1) * 28.7%) 17.1%));}
.mana-dot.fragile{background:radial-gradient(circle at 35% 30%,#d8f4ff,var(--frost));box-shadow:0 0 5px rgba(79,179,217,.75);}
.mana-dot.reserved{outline:2px dashed var(--gold);outline-offset:1.5px;}

.zone-badges{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:86px;border-radius:8px;background:var(--bg-panel-2);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));cursor:pointer;user-select:none;}
.badge-label{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--parchment-dim);margin-top:1px;}
.badge:hover{border-color:var(--gold);}
.badge .badge-icon{font-size:20px;line-height:1;}
.badge .badge-count{font-size:14px;font-weight:700;color:var(--parchment);}
.badge.deck .badge-icon{color:var(--gold);}
.badge.discard .badge-icon{color:hsl(calc(var(--th, 252) + 1.5) calc(var(--ts-n, 1) * 23.7%) 59.4%);}
.badge.discard:not(.has-cards){opacity:.4;cursor:default;}

.board-divider{display:flex;align-items:center;gap:12px;margin:0 4px;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 25.8%) 34.9%) 15%,hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 25.8%) 34.9%) 85%,transparent);}

#discard-modal{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:60;}
#discard-modal.show{display:flex;}
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:9999;}
.modal-overlay.show{display:flex;}
.modal-overlay .modal-box{background:var(--bg-panel);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:12px;padding:20px 24px;max-width:90vw;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:12px;}
.modal-overlay .modal-box h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-modal .modal-box{background:var(--bg-panel);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:12px;padding:20px 24px;max-width:520px;max-height:70vh;display:flex;flex-direction:column;gap:12px;}
#discard-modal h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-list{overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;padding-right:4px;}
#discard-modal .close-btn{align-self:flex-end;background:var(--arcane);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;}

#card-preview{position:fixed;z-index:99999;pointer-events:none;display:none;opacity:0;transition:opacity .15s ease;}
.hero-preview-linked{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:visible;min-width:140px;background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 33.3%) 7.1% / .9);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;padding:8px 10px;}
.hero-preview-linked-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);text-align:center;margin-bottom:2px;}
.hero-preview-linked-item{font-size:12px;color:#f2ead2;text-align:center;padding:2px 4px;white-space:nowrap;}
#card-preview .ncard{box-shadow:0 16px 34px rgba(0,0,0,.65);}
#card-preview.show{display:flex;align-items:flex-start;gap:10px;opacity:1;}
.kw-tooltip-col{display:flex;flex-direction:column;gap:6px;max-width:220px;}
.kw-tooltip-item{display:flex;align-items:flex-start;gap:8px;background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 33.3%) 7.1% / .92);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;padding:7px 10px;box-shadow:0 6px 14px rgba(0,0,0,.5);}
.kw-tooltip-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
.kw-tooltip-txt{font-size:11.5px;line-height:1.4;color:#f2ead2;}
.kw-tooltip-txt strong{color:var(--gold);font-family:'Cinzel',serif;font-size:11.5px;}
/* Aperçu d'une créature en jeu : écarts avec la carte de base */
.kw-tooltip-item.kw-added{border-color:#58c27d;}
.kw-tooltip-item.kw-added .kw-tooltip-txt strong{color:#8df0b0;}
.kw-tooltip-item.kw-lost{border-color:#d86a6a;}
.kw-tooltip-item.kw-lost .kw-tooltip-txt strong{color:#ffa3a3;text-decoration:line-through;}
.kw-tooltip-item.kw-lost .kw-tooltip-icon{opacity:.55;}
.kw-tooltip-tag{font-size:10px;font-weight:700;color:#f2ead2;}
.kw-added .kw-tooltip-tag{color:#8df0b0;}
.kw-lost .kw-tooltip-tag{color:#ffa3a3;}
.preview-card-col{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.preview-mods{width:300px;box-sizing:border-box;background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 33.3%) 7.1% / .92);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;padding:7px 10px;font-size:11.5px;line-height:1.4;color:#f2ead2;}
.preview-mods-title{font-family:'Cinzel',serif;font-size:11.5px;color:var(--gold);margin-bottom:2px;}
.preview-mods .pm-added{color:#8df0b0;}
.preview-mods .pm-lost{color:#ffa3a3;}
.preview-mods .pm-note{font-size:10.5px;color:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 29.5%) 76.1%);margin-top:2px;}
.preview-base-tag{width:300px;box-sizing:border-box;text-align:center;font-family:'Cinzel',serif;font-size:11.5px;color:var(--gold);background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 33.3%) 7.1% / .92);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;padding:4px 8px;}
.preview-base-hint{width:300px;box-sizing:border-box;font-size:10.5px;color:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 29.5%) 76.1%);text-align:center;}
.preview-base-btn{display:none;pointer-events:auto;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;color:#f2ead2;background:var(--arcane);border:none;border-radius:8px;padding:8px 16px;}
@media (hover: none){
  .preview-base-hint .pbh-key{display:none;}
  .preview-base-btn{display:inline-block;}
}
/* Capacités perdues (silence) : texte du catalogue atténué + estampille */
.ncard.n-text-lost .ncard-text{opacity:.35;}
.ncard.n-big .n-text-lost-stamp{position:absolute;left:16%;top:65.79%;width:68%;height:27.5%;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.ncard .n-text-lost-stamp span{transform:rotate(-8deg);font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:#ffa3a3;border:2px solid #ffa3a3;border-radius:6px;padding:2px 8px;background:hsl(calc(var(--th, 252) - 4.5) calc(var(--ts-n, 1) * 28.6%) 5.5% / .78);text-shadow:0 0 2px #000;}

#card-reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:85;opacity:0;background:rgba(5,4,10,0);transition:opacity .3s ease, background .3s ease;}
#card-reveal.show{opacity:1;background:rgba(5,4,10,.5);}
#card-reveal-inner .card{transform:scale(2.3);box-shadow:0 24px 60px rgba(0,0,0,.75), 0 0 70px hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%)) / .45);}
#card-reveal.show #card-reveal-inner{animation:card-reveal-pop .3s ease-out;}
@keyframes card-reveal-pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ---------- Lanes ---------- */
/* Hauteur de la ZONE fixée à 216px (comme sur la maquette) — plus petite
   que la carte (265px) : les cartes débordent volontairement au-dessus
   et en dessous du bandeau de la lane (effet de "bleed"), sans agrandir
   la lane elle-même. C'est un height fixe (pas min-height) : la lane ne
   grandit donc plus avec la taille des cartes, ce qui évite qu'elle ne
   pousse le reste du plateau hors de l'écran. */
.lane{display:flex;gap:10px;justify-content:center;align-items:center;height:200px;overflow:visible;padding:6px;background:radial-gradient(ellipse at center, hsl(calc(var(--th, 252) + 0) calc(var(--ts-n, 1) * 35.2%) 13.9%) 0%, transparent 75%);border-radius:10px;flex-wrap:wrap;margin:0 130px;flex-shrink:0;}
.lane.enemy{transform:scaleY(-1);}
.lane.enemy .card-slot{transform:scaleY(-1);}
.slot-empty{width:170px;height:170px;border:1.5px dashed hsl(calc(var(--th, 252) - 0.3) calc(var(--ts-n, 1) * 29%) 24.3%);border-radius:11px;}
/* Cartes posées sur le plateau agrandies (195×265 au lieu de 150×204) —
   scopé aux lanes uniquement : la main (.hand-row), les reliques
   (.relic-slot) et les previews gardent la taille de base de .card,
   donc rien d'autre n'est affecté par ce changement. */
.lane .card{width:240px;height:326px;}

/* ---------- Cards ---------- */
.card{
  --cc: var(--neutre);
  width:150px;height:204px;background:#f7f2e2;color:hsl(calc(var(--th, 252) + 4.4) calc(var(--ts-n, 1) * 27.5%) 15.7%);border-radius:11px;
  position:relative;cursor:pointer;flex-shrink:0;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  border:4px solid var(--cc);
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;overflow:hidden;
  user-select:none;
}
.card.class-Aube{--cc:var(--aube);}
.card.class-Crépuscule{--cc:var(--crepuscule);}
.card.class-Prima{--cc:var(--prima);}
.card.class-Volonté{--cc:var(--volonte);}
.card.class-Arcane{--cc:var(--arcane-c);}
.card.class-Neutre{--cc:var(--neutre);}

.card-foil-layer{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:9;}
.card-foil-layer::before{
  content:'';position:absolute;top:-60%;left:-70%;width:70%;height:220%;
  background:linear-gradient(115deg,
    transparent 0%, rgba(255,90,90,.5) 14%, rgba(255,210,80,.5) 28%,
    rgba(120,255,150,.5) 42%, rgba(80,190,255,.5) 56%, rgba(190,110,255,.5) 70%,
    rgba(255,120,200,.5) 84%, transparent 100%);
  transform:translateX(-40%) rotate(8deg);
  mix-blend-mode:color-dodge;
  opacity:.55;
}
.card.foil-play .card-foil-layer::before{animation:foil-sweep 1.05s ease-in-out;}
@keyframes foil-sweep{
  0%{transform:translateX(-160%) rotate(8deg);opacity:0;}
  15%{opacity:.9;}
  85%{opacity:.9;}
  100%{transform:translateX(160%) rotate(8deg);opacity:0;}
}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 16px rgba(0,0,0,.6);}
.card.selected{outline:3px solid var(--arcane);transform:translateY(-6px);}
.card.attacking{outline:3px solid var(--blood);}
.card.blocked-by::after{content:"🛡";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:14px;z-index:5;}
/* Cartes premium sur le plateau : immobiles au repos, elles ne bougent qu'au survol de la souris. */
body .ncard.n-prem:not(.n-live) .nfin{animation:none;}
.card.self-targetable{cursor:crosshair;box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);animation:self-target-pulse 1.3s ease-in-out infinite;}
@keyframes self-target-pulse{0%,100%{box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);}50%{box-shadow:0 0 0 5px var(--gold), 0 4px 20px rgba(212,175,55,.8);}}
.card.targetable{outline:3px solid var(--blood);animation:pulse 1s infinite;}
.card.dragging{opacity:.35;}
.card.trap-pending{outline:3px dashed var(--gold);outline-offset:2px;opacity:.75;cursor:default;}
.card.trap-active{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 16px rgba(212,175,55,.6);cursor:default;animation:trap-armed-pulse 1.8s ease-in-out infinite;}
.trap-wolf-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));z-index:10;pointer-events:none;}
@keyframes trap-armed-pulse{0%,100%{box-shadow:0 0 12px rgba(212,175,55,.45);}50%{box-shadow:0 0 22px rgba(212,175,55,.85);}}
.hand-card.discard-choosable{cursor:pointer;}
/* Carte de la main non jouable (ou tenue en main pendant un glisser) : assombrie, jamais transparente
   (une carte transparente laisserait voir celles qu'elle chevauche dans l'éventail). */
.hand-card.hand-card-dim{filter:brightness(.5);}
.hand-card.discard-selected{outline:4px solid #3d9bff;outline-offset:2px;border-radius:12px;box-shadow:0 0 22px 4px rgba(61,155,255,.85);}
/* Placement d'une créature par glisser-déposer : les créatures s'écartent de part et d'autre pour montrer l'emplacement */
#lane-p1 .card-slot{transition:translate .14s ease-out;}
#lane-p1 .card-slot.ins-shift-left{translate:-18px 0;}
#lane-p1 .card-slot.ins-shift-right{translate:18px 0;}
#lane-p1.drop-hover, #hero-p2.drop-hover{outline:3px dashed var(--gold);outline-offset:4px;border-radius:12px;}
.card-slot.drop-hover .card{outline:3px dashed var(--gold);}
.card.frozen{filter:hue-rotate(180deg) saturate(1.4) brightness(.9);}
.card.stunned{filter:grayscale(.7) brightness(.75);}
.card.summon-sick{transform:rotate(-4deg);}
.card.summon-sick:hover{transform:rotate(-4deg) translateY(-6px);}
.ncard.is-stunned{filter:grayscale(.7) brightness(.75);}
.ncard.is-frozen{filter:hue-rotate(180deg) saturate(1.4) brightness(.9);}
.ncard .nstat-txt.n-up{color:#8df0b0;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px rgba(0,0,0,.9);}
.ncard .nstat-txt.n-down{color:#ffa3a3;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px rgba(0,0,0,.9);}
.ncard.is-unavailable{opacity:.55;outline:2px dashed rgba(220,220,220,.55);outline-offset:-2px;}
/* Posture de combat (voir « Posture de combat » dans le script). Retrait : décalage
   vers l'arrière de la ligne via la propriété `translate` (indépendante de
   `transform`) ; la valeur signée --withdraw-y est posée en ligne par le script
   d'après WITHDRAW_OFFSET_PX (bas pour ma ligne, haut pour l'adverse : la carte
   est dans un .card-slot déjà retourné sur la ligne adverse, son « bas » est
   donc celui de l'écran). La transition n'est posée en ligne que si le retrait
   change (durée via cms(), aucune en Instantané). */
.ncard.is-withdrawn{translate:0 var(--withdraw-y,16px);}
/* Flèche rouge clignotante sur un attaquant déclaré non bloqué : au-dessus (ma
   créature) ou en dessous (créature adverse), sans capter les clics. */
.ncard .attacker-arrow{position:absolute;left:50%;width:26px;height:30px;margin-left:-13px;z-index:12;pointer-events:none;
  animation:attacker-arrow-blink-kf .9s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--blood)) drop-shadow(0 1px 2px rgba(0,0,0,.9));}
.ncard .attacker-arrow svg{display:block;fill:var(--blood);stroke:#ffd0d0;stroke-width:2;}
.ncard .attacker-arrow.is-above{bottom:100%;margin-bottom:-6px;}
.ncard .attacker-arrow.is-below{top:100%;margin-top:-6px;transform:rotate(180deg);}
.ncard .attacker-arrow.is-static{animation:none;opacity:1;}
@keyframes attacker-arrow-blink-kf{0%,100%{opacity:1;}50%{opacity:.2;}}
@media (prefers-reduced-motion: reduce){
  .ncard .attacker-arrow{animation:none;opacity:1;}
  .ncard.is-withdrawn{transition:none !important;}
}
.card-unavailable-badge{position:absolute;bottom:2px;left:2px;z-index:11;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11% / .9);border:1.5px solid #bbb;box-shadow:0 1px 4px rgba(0,0,0,.7);cursor:help;}
.card-status-badge{position:absolute;bottom:2px;right:2px;z-index:11;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11% / .9);border:1.5px solid var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.7);cursor:help;}
.zzz{position:absolute;top:2px;right:3px;display:flex;align-items:flex-end;z-index:4;pointer-events:none;}
.zzz span{font-family:'Cinzel',serif;font-weight:700;color:#ffd76b;text-shadow:0 1px 2px rgba(0,0,0,.7);animation:zzz-float 1.8s ease-in-out infinite;display:inline-block;}
.zzz span:nth-child(1){font-size:9px;animation-delay:0s;}
.zzz span:nth-child(2){font-size:12px;animation-delay:.3s;margin-left:1px;}
.zzz span:nth-child(3){font-size:15px;animation-delay:.6s;margin-left:1px;}
@keyframes zzz-float{
  0%{opacity:0;transform:translateY(3px) scale(.6);}
  30%{opacity:1;transform:translateY(0) scale(1);}
  70%{opacity:1;transform:translateY(-3px) scale(1.12);}
  100%{opacity:0;transform:translateY(-7px) scale(.75);}
}

.card.kw-fearful{animation:fearful-tremble 5s ease-in-out infinite;}
@keyframes fearful-tremble{
  0%,92%,100%{transform:translateX(0) rotate(0);}
  93%{transform:translateX(-3px) rotate(-1.5deg);}
  94%{transform:translateX(3px) rotate(1.5deg);}
  95%{transform:translateX(-3px) rotate(-1.5deg);}
  96%{transform:translateX(3px) rotate(1.5deg);}
  97%{transform:translateX(-2px) rotate(-1deg);}
  98%{transform:translateX(0) rotate(0);}
}

.card-armor-shield{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(135deg, rgba(255,215,110,.32), rgba(255,215,110,.04) 60%);box-shadow:inset 0 0 12px rgba(255,215,110,.6);animation:armor-glow 2.2s ease-in-out infinite;}
@keyframes armor-glow{0%,100%{opacity:.65;}50%{opacity:1;}}

.status-stack-tr{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;z-index:6;pointer-events:none;max-width:80%;flex-wrap:wrap-reverse;}
.kw-icon{width:24px;height:24px;filter:invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.7));}
@keyframes protection-pulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.18);}}

/* Vol : la carte plane, ombre portée dessous via drop-shadow (respecte la découpe de la carte) */
.card.kw-flying{transform:translateY(-9px);filter:drop-shadow(0 16px 7px rgba(0,0,0,.5));}
.card.kw-flying:hover{transform:translateY(-15px);}

/* Furtif : légèrement transparente, volutes de fumée à des coins différents */
.card.kw-stealth{opacity:.78;}
.card.kw-stealth::before, .card.kw-stealth::after{
  content:'';position:absolute;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.6), transparent 70%);
  filter:blur(2px);pointer-events:none;z-index:5;
  animation:smoke-wisp 4s ease-in-out infinite;
}
.card.kw-stealth::before{top:-4px;left:-4px;animation-delay:0s;}
.card.kw-stealth::after{bottom:10px;right:-4px;animation-delay:2s;}
@keyframes smoke-wisp{
  0%{opacity:0;transform:translateY(4px) scale(.6);}
  30%{opacity:.75;transform:translateY(-2px) scale(1);}
  70%{opacity:.35;transform:translateY(-10px) scale(1.35);}
  100%{opacity:0;transform:translateY(-16px) scale(1.6);}
}

/* Perçant : petit pic acéré animé */
@keyframes pierce-jab{0%,100%{transform:translateX(0) rotate(-30deg);}50%{transform:translateX(2px) rotate(-30deg) scale(1.15);}}

/* Initiative : reflet métallique qui balaie la carte */
.card.kw-initiative::before{
  content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,.7), transparent);
  transform:skewX(-20deg);pointer-events:none;z-index:5;
  animation:initiative-shine 2.8s ease-in-out infinite;
}
@keyframes initiative-shine{0%{left:-60%;}55%{left:120%;}100%{left:120%;}}

/* Vol de vie : lueur violette-rose périodique */
.card.kw-lifesteal{animation:lifesteal-glow 6s ease-in-out infinite;}
@keyframes lifesteal-glow{
  0%,84%,100%{filter:none;}
  90%{filter:drop-shadow(0 0 7px rgba(255,90,220,.85)) brightness(1.08);}
  95%{filter:drop-shadow(0 0 12px rgba(200,80,255,.95)) brightness(1.15);}
}

/* Choisi pour attaquer : épées */
.card.attack-selecting{transform:translateY(-20px);box-shadow:0 12px 22px rgba(194,59,59,.55);}
.card.attack-selecting:hover{transform:translateY(-24px);}
.sword-icons{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;z-index:8;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));}
.sword-icons img{width:100%;height:100%;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(90%);}
.sword-icons.confirmed{font-size:28px;animation:sword-clash 1.3s ease-in-out infinite;}
@keyframes sword-clash{0%,100%{transform:translate(-50%,-50%) rotate(-5deg);}50%{transform:translate(-50%,-50%) rotate(5deg);}}
@keyframes pulse{0%,100%{outline-color:var(--blood);}50%{outline-color:#ff8a8a;}}

.card-art{position:relative;height:42%;background:linear-gradient(135deg,#c9bd93,#a89968);background-size:cover;background-position:center;flex-shrink:0;}
.card-cost{position:absolute;top:6px;left:6px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fd0ff,#155a94);border:2px solid #0c2b45;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-hero-hp{position:absolute;top:5px;right:6px;width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7de08f,#1f7a3d);border:2px solid #0c3d1a;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-divider{height:7px;flex-shrink:0;position:relative;background:var(--cc);display:flex;align-items:center;justify-content:center;}
.card-set-icon{width:15px;height:15px;background:var(--gold);border:1.5px solid #7a611c;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.card-set-icon span{transform:rotate(-45deg);font-size:6.5px;font-weight:700;color:#3a2c05;font-family:'Cinzel',serif;}
.card-set-logo-img{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background-size:cover;background-position:center;transform:rotate(-45deg);}
.card-body{flex:1;padding:3px 7px 2px;display:flex;flex-direction:column;min-height:0;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:11px;text-align:center;text-decoration:underline;text-underline-offset:2.5px;color:hsl(calc(var(--th, 252) - 2) calc(var(--ts-n, 1) * 33.3%) 14.1%);line-height:1.2;margin-bottom:3px;min-height:24px;}
.card-kw{font-size:8px;color:var(--arcane);font-weight:700;min-height:10px;text-align:center;}
.card-text{font-size:8.2px;line-height:1.2;flex:1;color:hsl(calc(var(--th, 252) + 8) calc(var(--ts-n, 1) * 23.1%) 17.8%);overflow-y:auto;white-space:pre-wrap;text-align:center;}
.card-typeline{position:absolute;left:0;top:0;bottom:0;width:11px;background:hsl(calc(var(--th, 252) + 10.5) calc(var(--ts-n, 1) * 25%) 6.3% / .6);color:#f2ead2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:flex-start;justify-content:flex-start;font-size:5px;letter-spacing:.2px;text-transform:uppercase;padding:5px 0 16px;text-align:center;z-index:1;}
.card-footer{height:27px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 7px 4px;}
.card-atk,.card-hp{width:20px;height:20px;border-radius:50%;background:#efe6c8;border:2px solid hsl(calc(var(--th, 252) - 2) calc(var(--ts-n, 1) * 33.3%) 14.1%);display:flex;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:9.5px;}
.atk-icon{width:9px;height:9px;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(85%);}
.card-atk{color:var(--blood);}
.card-hp{color:var(--green);}
.card-rarity-gem{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;border:2px solid rgba(0,0,0,.35);box-shadow:0 0 4px currentColor;}
.card-rarity-gem.rarity-Basique{background:#6b6558;color:#6b6558;}
.card-rarity-gem.rarity-Commune{background:#c7c2b3;color:#c7c2b3;}
.card-rarity-gem.rarity-Rare{background:var(--frost);color:var(--frost);}
.card-rarity-gem.rarity-Épique{background:var(--arcane);color:var(--arcane);}
.card-rarity-gem.rarity-Mythique{background:var(--gold);color:var(--gold);}
.charges{color:var(--frost);font-size:11px;font-weight:700;position:absolute;bottom:5px;right:6px;z-index:2;}

.hand-row{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:nowrap;overflow:visible;gap:0;justify-content:center;padding:55px 14px 6px;pointer-events:none;scrollbar-width:none;background:transparent !important;box-shadow:none;border:none;transform:translateY(136px);transition:transform .22s ease;}
.hand-row .card{pointer-events:auto;}
.hand-row::-webkit-scrollbar{height:0;width:0;background:transparent;}
/* Main en éventail : applyHandFan() pose --fr (inclinaison) et --fy (descente des cartes de bord) sur chaque carte,
   et un léger chevauchement (marge négative). Au survol, la carte se redresse, monte et passe devant. */
.hand-card-slot{pointer-events:auto;position:relative;width:177px;height:250px;flex-shrink:0;}
.hand-card-slot:hover{z-index:50;}
.hand-card-slot.hand-reorder-src{z-index:49;}
/* IMPORTANT : l'éventail et l'effet de survol s'appliquent à l'IMAGE de la carte (.ncard), jamais à la case (.hand-card-slot)
   qui reçoit la souris. Si la case bougeait au survol, la carte se dérobait sous le curseur, perdait le survol, revenait,
   le retrouvait... et la main « sautillait » sans que la souris bouge. Pivot de l'inclinaison = bas centre de la carte (88,5 × 250). */
.hand-card-slot .ncard.hand-card{transform-origin:0 0;transform:translateY(var(--fy,0px)) translate(88.5px,250px) rotate(var(--fr,0deg)) translate(-88.5px,-250px) scale(0.59);transition:transform .15s ease;}
.hand-card-slot:hover .ncard.hand-card{transform:translateY(-34px) translate(88.5px,125px) scale(1.08) translate(-88.5px,-125px) scale(0.59);}

.enemy-hand-row{position:fixed;top:56px;left:0;right:0;z-index:39;display:flex;flex-wrap:nowrap;overflow:visible;gap:0;justify-content:center;padding:6px 14px 30px;pointer-events:none;}
.enemy-hand-card{width:92px;height:130px;border-radius:8px;background-size:cover;background-position:center;background-color:hsl(calc(var(--th, 252) + 0.9) calc(var(--ts-n, 1) * 28%) 19.6%);border:2px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));box-shadow:0 4px 10px rgba(0,0,0,.5);transform:translateY(var(--ey,0px)) rotate(calc(180deg + var(--er,0deg)));flex-shrink:0;}
.enemy-hand-card-revealed{flex-shrink:0;transform:scale(.72);transform-origin:top center;margin:0 -18px;}

.side-zone{position:absolute;display:flex;flex-direction:column;gap:8px;z-index:6;}
.side-zone.self{right:16px;top:calc(50% + 100px);}
.side-zone.enemy{right:16px;top:50%;transform:translateY(-50%);}
.relic-slot{width:78px;height:106px;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:default;}
.artifact-used-this-turn{filter:grayscale(85%) brightness(.55);transition:filter .2s ease;}
@keyframes artifactActivateFlash{
  0%{box-shadow:0 0 0 0 rgba(212,175,55,0);filter:brightness(1);}
  35%{box-shadow:0 0 22px 6px rgba(212,175,55,.9);filter:brightness(1.5);}
  100%{box-shadow:0 0 0 0 rgba(212,175,55,0);filter:brightness(1);}
}
.artifact-activate-flash{animation:artifactActivateFlash .75s ease-out;}
.relic-slot .card{transform:scale(.52);transform-origin:top left;}
.relic-charges-badge{position:absolute;bottom:3px;right:3px;background:hsl(calc(var(--th, 252) + 10.5) calc(var(--ts-n, 1) * 25%) 6.3% / .8);border:1px solid var(--gold);color:var(--gold);font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 6px;z-index:2;}
.mini-tag{width:52px;height:44px;border-radius:6px;background:var(--bg-panel-2);border:1px solid var(--frost);display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;padding:2px;position:relative;}
.mini-tag.relic{border-color:var(--gold);}

.phase-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0;}
.phase-bar-stack{display:flex;flex-direction:column;align-items:stretch;gap:8px;}
.phase-bar-subrow{display:flex;gap:8px;justify-content:flex-end;}
.phase-btn{background:linear-gradient(180deg,var(--arcane),hsl(calc(var(--th, 252) + 0.9) calc(var(--ts-a, 1) * 55.8%) calc(48.8% + var(--tl-a, 0%))));color:#fff;border:none;border-radius:10px;padding:10px 22px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%)) / .4);letter-spacing:.4px;white-space:nowrap;}
/* Rappel clignotant — quand le bouton d'action (combat/fin de tour/fin de
   blocage) reste cliquable sans que le joueur agisse, voir setupPhaseReminder. */
@keyframes phase-btn-reminder{
  0%,100%{transform:scale(1);box-shadow:0 4px 12px hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%)) / .4);}
  50%{transform:scale(1.08);box-shadow:0 4px 12px hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%)) / .4), 0 0 26px 8px rgba(212,175,55,.9);}
}
.phase-btn.reminder-blink{animation:phase-btn-reminder 1s ease-in-out infinite;}
.phase-btn.small{padding:6px 14px;font-size:11px;box-shadow:none;}
.phase-btn:hover{filter:brightness(1.15);}
.phase-btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
.phase-btn.secondary{background:var(--bg-panel-2);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));box-shadow:none;}
.phase-label{font-family:'Cinzel',serif;font-size:12px;color:var(--parchment-dim);}

/* ---------- Log panel ---------- */
#log-panel{width:230px;background:var(--bg-panel);border-left:1px solid hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 28%) 19.6%);padding:14px 14px 40px;display:flex;flex-direction:column;min-height:0;}

#log-panel h3{font-family:'Cinzel',serif;font-size:13px;margin:0 0 10px;color:var(--gold);letter-spacing:1px;}
#log{flex:1;overflow-y:auto;font-size:11px;line-height:1.5;color:var(--parchment-dim);display:flex;flex-direction:column-reverse;}
#log div{padding:3px 0;border-bottom:1px solid var(--bg-panel-3, hsl(calc(var(--th, 252) + 0) calc(var(--ts-n, 1) * 28.7%) 17.1%));}

#overlay{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50;}
#turn-timer{display:none;position:absolute;left:50%;top:-38px;transform:translateX(-50%);align-items:center;gap:6px;padding:5px 14px;border-radius:20px;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11% / .9);border:1.5px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--parchment);z-index:30;white-space:nowrap;}
#turn-timer.timer-mine{border-color:var(--gold);}
#turn-timer.timer-low{border-color:var(--blood);color:#ff8080;animation:timer-pulse 1s infinite;}
#turn-timer.timer-block{border-color:var(--frost);}
@keyframes timer-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
#overlay-summary{background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11% / .9);border:1.5px solid var(--gold);border-radius:14px;padding:20px 26px;min-width:340px;max-width:92vw;}
#overlay-summary table{border-collapse:collapse;width:100%;font-family:'Inter',sans-serif;color:var(--parchment);}
#overlay-summary th, #overlay-summary td{padding:6px 14px;text-align:center;font-size:13px;}
#overlay-summary th{font-family:'Cinzel',serif;color:var(--gold);font-weight:700;border-bottom:1.5px solid var(--gold);}
#overlay-summary td:first-child, #overlay-summary th:first-child{text-align:left;color:var(--parchment-dim);}
#overlay-summary tr.summary-sep td{padding-top:10px;}
#overlay-summary .summary-coins{margin-top:14px;text-align:center;font-family:'Cinzel',serif;color:var(--gold);font-size:15px;}
#overlay.show{display:flex;}
#overlay h1{font-family:'Cinzel',serif;font-size:36px;color:var(--gold);}
#overlay button{background:var(--arcane);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:14px;}

#mulligan-overlay{position:fixed;inset:0;background:rgba(5,4,10,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:55;}
#mulligan-overlay.show{display:flex;}
#mulligan-overlay h2{font-family:'Cinzel',serif;font-size:26px;color:var(--gold);margin:0;}
#mulligan-overlay .mulligan-sub{font-size:13px;color:var(--parchment-dim);margin:0 0 6px;max-width:420px;text-align:center;}
#mulligan-cards{display:flex;gap:16px;}
.mulligan-card-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;}
.mulligan-card-wrap:hover{transform:translateY(-6px);}
.mulligan-card-wrap.marked .card{opacity:.4;filter:grayscale(70%);}
.mulligan-tag{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--green);padding:4px 12px;border-radius:14px;border:1px solid var(--green);}
.mulligan-card-wrap.marked .mulligan-tag{color:var(--blood);border-color:var(--blood);}
.mulligan-confirm-btn{background:var(--arcane);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:14px;margin-top:8px;}

/* ===== Écran d'annonce de match (joueur vs adversaire) ===== */
#match-announce-overlay{position:fixed;inset:0;background:#0b0905;display:none;z-index:70;opacity:0;transition:opacity .3s ease;overflow:hidden;}
#match-announce-overlay.show{display:block;}
#match-announce-overlay.visible{opacity:1;}
.ma-side{position:absolute;inset:0;}
.ma-side-left{clip-path:polygon(0 0, 33.333% 0, 66.667% 100%, 0 100%);}
.ma-side-right{clip-path:polygon(33.333% 0, 100% 0, 100% 100%, 66.667% 100%);}
/* Couche interne portant l'image de fond : la découpe diagonale reste sur .ma-side-left/right
   (ci-dessus), le miroir éventuel (côté droit) ne s'applique qu'à cette couche, jamais à la découpe. */
.ma-side-bg{position:absolute;inset:0;}
.ma-vignette-left{clip-path:polygon(0 0, 33.333% 0, 66.667% 100%, 0 100%);background:radial-gradient(ellipse 46vw 70vh at 22% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 60%, rgba(0,0,0,.08) 100%);}
.ma-vignette-right{clip-path:polygon(33.333% 0, 100% 0, 100% 100%, 66.667% 100%);background:radial-gradient(ellipse 46vw 70vh at 78% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 60%, rgba(0,0,0,.08) 100%);}
/* Ligne dorée = un fin ruban taillé avec le MÊME clip-path (33.333%/66.667%)
   que les deux zones d'illustration ci-dessus, au lieu d'un <svg> séparé
   avec son propre système de coordonnées (viewBox 1280x720 étiré) — ce
   dernier pouvait très légèrement diverger du découpage CSS réel selon le
   navigateur. En réutilisant exactement les mêmes pourcentages (juste
   élargis de ±0.3 point), la ligne est géométriquement garantie de tomber
   pile sur la séparation des deux images, sans possibilité de décalage. */
.ma-divider-glow{background:#D4AF37;clip-path:polygon(33.033% 0, 33.633% 0, 66.967% 100%, 66.367% 100%);filter:drop-shadow(0 0 7px #D4AF37);z-index:4;pointer-events:none;}
.ma-vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#120d08;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 0 6px rgba(11,9,5,.9),0 0 22px rgba(0,0,0,.6);}
.ma-vs-badge span{font-family:'Cinzel',serif;font-size:20px;font-weight:700;letter-spacing:1px;}
/* Toutes les tailles ci-dessous sont en vw (relatif à la largeur de la
   fenêtre, calées sur une référence de 1280px), comme la découpe diagonale
   (clip-path en %) et la ligne dorée (SVG en viewBox 1280x720) — ainsi le
   cadre de joueur reste TOUJOURS correctement aligné avec la ligne, quelle
   que soit la taille d'écran réelle (avant : tailles fixes en px, qui
   pouvaient déborder de la découpe sur certaines résolutions). */
.ma-block{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1vw,15px);width:clamp(230px,29.7vw,420px);z-index:3;}
.ma-block-left{left:22%;}
.ma-block-right{left:78%;}
.ma-cardback{width:clamp(74px,9.5vw,135px);height:clamp(103px,13.3vw,188px);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
.ma-name{font-family:'Cinzel',serif;color:#f1e6c8;font-size:clamp(19px,2.5vw,35px);font-weight:700;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.7);text-align:center;}
.ma-name-link{color:inherit;text-decoration:none;cursor:pointer;}
.ma-name-link:hover,.ma-name-link:focus-visible{text-decoration:underline;}
#match-announce-overlay.show{cursor:pointer;}
.ma-skip-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;pointer-events:none;font-size:12px;letter-spacing:.5px;color:rgba(241,230,200,.55);text-shadow:0 1px 4px rgba(0,0,0,.8);}
.ma-deckname{font-style:italic;color:rgba(241,230,200,.65);font-size:clamp(10px,1.25vw,17px);text-align:center;}
.ma-avatar{width:clamp(65px,8.4vw,120px);height:clamp(65px,8.4vw,120px);border-radius:50%;margin-top:5px;box-shadow:0 5px 15px rgba(0,0,0,.6);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;}
.ma-title{font-family:'Cinzel',serif;font-size:clamp(9px,1.17vw,16px);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px;}
.ma-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,0.7vw,10px);margin-top:4px;min-height:clamp(70px,8.9vw,128px);}
.ma-badge{width:clamp(70px,8.9vw,128px);height:clamp(70px,8.9vw,128px);border-radius:50%;background-size:cover;background-position:center;background-color:#1a1510;border:2px solid rgba(241,230,200,.5);box-shadow:0 2px 6px rgba(0,0,0,.5);cursor:default;}

.tip{position:fixed;transform:translate(-50%,-100%);font-size:11px;color:var(--parchment-dim);background:rgba(0,0,0,.6);padding:5px 12px;border-radius:20px;pointer-events:none;text-align:center;max-width:280px;z-index:45;transition:left .15s ease, top .15s ease;}

#targeting-layer{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%;}
#block-arrows-layer{position:fixed;inset:0;pointer-events:none;z-index:35;width:100%;height:100%;}
.block-arrow-line{stroke:var(--blood);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 10px rgba(194,59,59,.85)) drop-shadow(0 0 20px rgba(194,59,59,.6));stroke-dasharray:13 7;animation:block-arrow-dash .6s linear infinite;}
.block-arrow-head{fill:var(--blood);filter:drop-shadow(0 0 10px rgba(194,59,59,.85)) drop-shadow(0 0 20px rgba(194,59,59,.6));}
@keyframes block-arrow-dash{to{stroke-dashoffset:-16;}}

.dmg-popup{position:fixed;transform:translate(-50%,-50%);font-family:'Cinzel',serif;font-weight:700;font-size:24px;color:#ff5252;text-shadow:0 2px 5px rgba(0,0,0,.85);z-index:95;pointer-events:none;animation:dmg-float 1.4s ease-out forwards;}
@keyframes dmg-float{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5);}
  15%{opacity:1;transform:translate(-50%,-62%) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-150%) scale(1);}
}
#target-line{stroke:var(--arcane);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 12px var(--arcane)) drop-shadow(0 0 22px var(--arcane));stroke-dasharray:14 8;animation:dash .5s linear infinite;}
#target-origin{fill:var(--arcane);opacity:.95;filter:drop-shadow(0 0 10px var(--arcane));}
#target-arrow{fill:var(--arcane);filter:drop-shadow(0 0 10px var(--arcane)) drop-shadow(0 0 20px var(--arcane));}
@keyframes dash{to{stroke-dashoffset:-18;}}

body.targeting *{cursor:crosshair !important;}

#deck-select-box h1{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);margin:0 0 6px;}
#deck-select-box p.sub{color:var(--parchment-dim);font-size:13px;margin:0 0 20px;line-height:1.5;}
.deck-pick-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-panel-2);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:10px;cursor:pointer;margin-bottom:10px;transition:border-color .15s;}
.deck-pick-item:hover{border-color:var(--gold);}
.deck-pick-item .dp-icon{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--arcane),hsl(calc(var(--th, 252) + 0.2) calc(var(--ts-n, 1) * 46.6%) 22.7%));display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:#fff;flex-shrink:0;}
.deck-pick-item .dp-info{flex:1;min-width:0;}
.deck-pick-item .dp-name{font-family:'Cinzel',serif;font-size:14px;color:var(--parchment);}
.deck-pick-item .dp-meta{font-size:11.5px;color:var(--parchment-dim);margin-top:2px;}
.dsel-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.dsel-empty{text-align:center;padding:30px 10px;color:var(--parchment-dim);font-size:13px;line-height:1.6;}

/* ============================================================
   NOUVEAU TEMPLATE — frames illustrées (big / small), reprises
   telles quelles du deckbuilder/éditeur.
   ============================================================ */
.ncard{position:relative;flex-shrink:0;user-select:none;}
.ncard .nart-layer{position:absolute;background-size:cover;background-repeat:no-repeat;background-color:hsl(calc(var(--th, 252) + 0.9) calc(var(--ts-n, 1) * 21.2%) 25.9%);z-index:1;overflow:hidden;}

.ncard .nstat-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.ncard .nstat-wrap .nstat-txt{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none;}
.ncard .nname-wrap{position:absolute;z-index:7;display:flex;align-items:center;justify-content:center;}
.ncard .nname-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.ncard .nname-wrap .nname-text{position:relative;z-index:1;left:auto;right:auto;top:auto;transform:none;width:84%;max-width:84%;}
.ncard .nname-text{position:absolute;z-index:8;text-align:center;font-family:'Cinzel',serif;font-weight:700;color:#2a1f10;text-shadow:0 1px 0 rgba(255,255,255,.25);pointer-events:none;overflow:hidden;white-space:nowrap;}
.ncard .nname-curved{position:absolute;z-index:8;left:50%;top:4%;width:80%;transform:translateX(-50%);
  display:flex;justify-content:center;align-items:flex-end;font-family:'Cinzel',serif;font-weight:700;

.ncard .nlegendary-gem{position:absolute;z-index:8;aspect-ratio:231/297;object-fit:contain;}
.ncard .nkeyword-icon{position:absolute;z-index:8;aspect-ratio:1/1;}

/* Superpositions d'état de jeu (repères visuels de combat, appliqués
   par-dessus le nouveau template) */
.ncard.attacking{outline:3px solid #e8b64a;outline-offset:2px;}
.ncard.targetable{outline:3px solid var(--gold);outline-offset:2px;cursor:crosshair;}
.ncard.attack-selecting{cursor:pointer;}
.ncard.summon-sick{filter:grayscale(.4) brightness(.75);}
.ncard .zzz{position:absolute;top:2px;right:2px;z-index:10;font-size:11px;color:#bcd6ff;text-shadow:0 0 4px #000;pointer-events:none;}
.ncard .card-armor-shield{position:absolute;top:2px;left:2px;width:22px;height:22px;z-index:10;background:radial-gradient(circle, #cfd8e8 0%, #8fa3c0 70%);border-radius:50%;border:2px solid #fff;pointer-events:none;}
.ncard .status-stack-tr{position:absolute;top:2px;right:2px;z-index:10;display:flex;flex-direction:column;gap:2px;pointer-events:none;}
.ncard .status-stack-tr .kw-icon{width:48px;height:48px;box-sizing:border-box;padding:0;background:none;box-shadow:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));} /* pas de pastille autour : les icônes ont déjà leur propre forme */
/* Gain / perte d'un badge de mot-clé (voir playKeywordBadgeChanges). Couleurs
   « gain » / « perte » = celles des stats (n-up / n-down). Les durées sont
   posées en ligne (style.animationDuration) pour suivre la vitesse choisie. */
.ncard .status-stack-tr .kw-icon.kw-badge-gain{animation:kw-badge-gain-kf .7s ease-out both;}
.ncard .status-stack-tr .kw-icon.kw-badge-pending{visibility:hidden;}
@keyframes kw-badge-gain-kf{
  0%{transform:scale(0);opacity:0;filter:drop-shadow(0 0 0 rgba(141,240,176,0));}
  55%{transform:scale(1.45);opacity:1;filter:drop-shadow(0 0 6px #8df0b0) drop-shadow(0 0 12px #8df0b0);}
  100%{transform:scale(1);opacity:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));}
}
.kw-ghost{position:fixed;z-index:9992;pointer-events:none;animation:kw-ghost-kf .8s ease-in forwards;}
.kw-ghost img{display:block;width:100%;height:100%;}
.kw-ghost-strike{position:absolute;left:-10%;top:50%;width:120%;height:3px;border-radius:2px;background:#ffa3a3;box-shadow:0 0 6px #ff6b6b;transform:rotate(-35deg) scaleX(0);animation:kw-ghost-strike-kf .8s ease-out forwards;}
@keyframes kw-ghost-kf{
  0%{transform:scale(1);opacity:1;filter:none;}
  35%{transform:scale(1.1);opacity:1;filter:drop-shadow(0 0 6px #ff6b6b);}
  100%{transform:scale(.4);opacity:0;filter:drop-shadow(0 0 4px #ff6b6b) grayscale(1);}
}
@keyframes kw-ghost-strike-kf{
  0%{transform:rotate(-35deg) scaleX(0);}
  40%,100%{transform:rotate(-35deg) scaleX(1);}
}

#targeting-layer{position:fixed;inset:0;pointer-events:none;z-index:9998;width:100%;height:100%;}

.target-fixed-line{stroke:var(--arcane);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 12px var(--arcane)) drop-shadow(0 0 22px var(--arcane));stroke-dasharray:14 8;animation:target-dash .5s linear infinite;}

body.targeting *{cursor:crosshair !important;}
/* Choix de la cible d'un blocage : même flèche que le ciblage, mais elle alterne bleu / rouge */
@keyframes block-target-line{
  0%,100%{stroke:#3d9bff;filter:drop-shadow(0 0 12px #3d9bff) drop-shadow(0 0 22px #3d9bff);}
  50%{stroke:#ff4a40;filter:drop-shadow(0 0 12px #ff4a40) drop-shadow(0 0 22px #ff4a40);}
}
@keyframes block-target-fill{

  50%{fill:#ff4a40;filter:drop-shadow(0 0 10px #ff4a40) drop-shadow(0 0 20px #ff4a40);}
}
body.block-targeting #target-line{animation:target-dash .5s linear infinite, block-target-line 1.2s ease-in-out infinite;}
body.block-targeting #target-origin,
body.block-targeting #target-arrow{animation:block-target-fill 1.2s ease-in-out infinite;}

@keyframes dmg-float{

  15%{opacity:1;transform:translate(-50%,-62%) scale(1.2);}

   porte la capacité et fonce vers chaque cible touchée (voir
   fireAbilityArrow). Couleur par CAMP : bleu = effet de votre côté,
   rouge = effet de l'adversaire (classes .fx-mine / .fx-enemy, qui

   « sur soi-même » ci-dessous.
   ============================================================ */
.fx-mine{--fx:#3d9bff;--fx-rgb:61,155,255;}      /* effets de VOTRE camp : lueur bleue */

   propre source, pas de flèche (rien à relier) : un éclat qui CONVERGE
   sur la carte (forme distincte de la flèche). Couleur par camp :

.ability-self-burst{position:fixed;z-index:9994;left:0;top:0;width:120px;height:120px;margin:-60px;border-radius:50%;

  100%{opacity:0;transform:scale(.35);}

  html,body{overflow:hidden !important;}
  /* IMPORTANT : #board-scroll-area doit pouvoir défiler (overflow-y:auto,
     scrollbar masquée) plutôt que "overflow:hidden" — un "hidden" ici
     ROGNE silencieusement tout contenu qui dépasse la hauteur disponible
     (héros/deck/artefacts poussés hors de vue, invisibles, sans aucun
     moyen de les voir), au lieu de laisser défiler jusqu'à eux. C'est ce
     qui causait le plateau "à moitié caché" même une fois les cartes et
     zones agrandies. */
  #board-scroll-area{overflow-y:auto !important;overflow-x:hidden !important;}
  html::-webkit-scrollbar, body::-webkit-scrollbar,
  #board-scroll-area::-webkit-scrollbar{width:0;height:0;background:transparent;}
  .card.dragging{opacity:.4;}
  .lane.drop-target{outline:3px dashed var(--gold);outline-offset:-4px;background:rgba(212,175,55,.08);}
  body.action-busy #ai-debug-btn, body.action-busy .phase-btn{opacity:.6;pointer-events:none;cursor:wait;}

  /* ---------- Nouvelle disposition : mana / héros / deck en coins séparés ---------- */
  /* min-height réduit (265→190) : les enfants (mana-box, hero-frame,
     deck-zone, artifact-stack) sont tous en position:absolute, ils ne
     poussent pas la hauteur de la rangée — 265px ne servait qu'à réserver
     un espace jamais entièrement utilisé, et empêchait tout de tenir sur
     l'écran une fois la barre du haut et les cartes agrandies. */
  .board-row{display:flex;align-items:center;gap:14px;padding:8px 16px;position:relative;min-height:220px;flex-shrink:0;}

  .mana-box{position:absolute;bottom:8px;width:auto;min-width:44px;height:auto;max-height:280px;border-radius:12px;background:var(--bg-void, hsl(calc(var(--th, 252) - 4.5) calc(var(--ts-n, 1) * 28.6%) 5.5%));border:2px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));overflow-x:visible;overflow-y:hidden;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:4px;z-index:6;}
  .board-row.self{margin-top:auto;}
  .board-row.self .mana-box{left:16px;bottom:16px;}
  .board-row.enemy .mana-box{right:14px;top:14px;bottom:auto;flex-direction:column;padding-bottom:0;padding-top:4px;}
  .board-row.self .hero-frame{left:92px;bottom:16px;}
  .board-row.enemy .hero-frame{right:90px;top:14px;bottom:auto;}
  .mana-box-region-thumb{width:44px;height:44px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--bg-panel-3, hsl(calc(var(--th, 252) + 0) calc(var(--ts-n, 1) * 28.7%) 17.1%));border:1px solid var(--gold);flex-shrink:0;}
  .mana-box-count{flex-shrink:0;width:100%;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:var(--gold);}
  .mana-box-fill{display:flex;flex-direction:column-reverse;flex-wrap:wrap;align-content:center;justify-content:center;gap:4px;padding:5px 8px;max-height:280px;}
  .board-row.enemy .mana-box-fill{flex-direction:column;flex-wrap:wrap;}
  .mana-box-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center;}
  .mana-box-dot.filled{background-image:url('images/mana-plein.png');}
  .mana-box-dot:not(.filled):not(.fragile):not(.bonus){background-image:url('images/mana-vide.png');}
  .mana-box-dot.fragile{background-image:url('images/mana-fragile.png');}
  .mana-box-dot.bonus{background:radial-gradient(circle at 35% 30%,#fff3d0,var(--gold));box-shadow:0 0 6px rgba(212,175,55,.8);border-radius:50%;}
  /* Nouvel affichage du mana : [icône] valeur/max au-dessus de l'illustration de la région ;
     mana fragile au-dessus, avec des icônes plus grosses. Plus de colonnes de points. */
  .board-row.self .mana-box,.board-row.enemy .mana-box{flex-direction:column;align-items:center;gap:5px;padding:6px 6px 6px;max-height:none;}
  .mana-box-line{display:flex;align-items:center;justify-content:center;gap:4px;font-family:'Cinzel',serif;font-weight:700;color:var(--gold);white-space:nowrap;}
  .mana-box-line.normal{font-size:17px;}
  .mana-box-line.fragile{font-size:20px;color:#9fd8ff;}
  .devotion-bubble{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff3d0 0%,#e8c25a 45%,#9a6b12 100%);border:2px solid #ffd98a;box-shadow:0 0 8px rgba(255,217,138,.7);line-height:1;}
  .devotion-bubble:hover{box-shadow:0 0 14px rgba(255,217,138,1);}
  .devotion-bubble-ico{font-size:13px;}
  .devotion-bubble-count{font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:#3a2500;}
  .mana-ico{width:26px;height:26px;flex-shrink:0;background:url('images/mana-plein.png') center/contain no-repeat;}
  .mana-box-line.fragile .mana-ico{width:38px;height:38px;background-image:url('images/mana-fragile.png');}

  .hero-frame{position:absolute;bottom:8px;z-index:7;}
  .hero-portrait-big{width:178px;height:178px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--arcane), hsl(calc(var(--th, 252) + 0.2) calc(var(--ts-n, 1) * 46.6%) 22.7%));background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:55px;color:#fff;flex-shrink:0;border:4px solid var(--gold);position:relative;cursor:pointer;padding:0;}
  .hero-portrait-big:hover{border-color:#fff;}
  /* Repères visuels de héros (compteurs, effets en attente, tour de jeu) */
  .hero-indicators{position:absolute;left:-14px;bottom:-14px;display:flex;gap:1px;align-items:center;z-index:3;pointer-events:none;max-width:200px;}
  /* Cadre adverse : en bas à gauche. Cadre du joueur : en haut à droite. */
  .hero-indicators{flex-direction:column;gap:2px;}
  .hero-ind-row{display:flex;gap:1px;align-items:center;}
  #hero-frame-p1 .hero-indicators{left:auto;top:auto;right:-14px;bottom:calc(100% - 24px);align-items:flex-end;}
  #hero-frame-p2 .hero-indicators{left:-14px;bottom:auto;top:calc(100% - 24px);align-items:flex-start;}
  .hero-ind-row.sub{min-height:26px;}
  .hero-ind-row.sub img{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.85));}
  .hero-ind-plus{font-family:'Cinzel',serif;font-weight:900;font-size:24px;line-height:1;color:#7be08a;text-shadow:0 0 3px #000,0 2px 3px #000;}
  .hero-indicator.shark-black{filter:brightness(0) drop-shadow(0 0 2px rgba(255,255,255,.55));}
  .hero-indicator.shark-white{filter:brightness(0) invert(1) drop-shadow(0 1px 3px rgba(0,0,0,.9));}
  .hero-indicator.turtle-black{--ind-fill:#000;--ind-edge:rgba(255,255,255,.55);--ind-crack:#fff;}
  .hero-indicator.turtle-white{--ind-fill:#fff;--ind-edge:#000;--ind-crack:#000;}
  .hero-indicator{font-size:34px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.85));}
  .hero-indicator svg{width:38px;height:38px;display:block;}
  .hero-indicator.dim{opacity:.28;filter:grayscale(.7) drop-shadow(0 2px 3px rgba(0,0,0,.6));}
  .hero-indicator.ready{animation:heroIndPulse 1.4s ease-in-out infinite;}
  @keyframes heroIndPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  @media (prefers-reduced-motion: reduce){.hero-indicator.ready{animation:none;}}
  .hero-portrait-big.can-activate{border-color:var(--green, #4a9d6b);box-shadow:0 0 14px rgba(74,157,107,.6);}
  .hero-portrait-big.targetable{border-color:var(--gold);box-shadow:0 0 16px rgba(212,175,55,.75);cursor:crosshair;}
  .card.targetable{outline:3px solid var(--gold);outline-offset:2px;cursor:crosshair;}
  .hp-badge-big{position:absolute;bottom:-12px;right:-17px;min-width:62px;height:62px;padding:0 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e85858,#8a1f1f);border:3px solid #4a0f0f;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.65);z-index:2;pointer-events:none;}

  .deck-zone{position:absolute;bottom:16px;display:flex;align-items:center;gap:12px;z-index:6;}
  .board-row.self .deck-zone{right:27px;}
  .board-row.enemy .deck-zone{left:16px;top:14px;bottom:auto;flex-direction:row-reverse;}
  .deck-back-visual{width:135px;height:189px;border-radius:12px;background:linear-gradient(135deg, var(--bg-panel-3, hsl(calc(var(--th, 252) + 0) calc(var(--ts-n, 1) * 28.7%) 17.1%)), var(--bg-panel, hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11%)));border:3px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.55);flex-shrink:0;}
  .deck-counts{display:grid;grid-template-columns:repeat(2,76px);gap:8px;}
  .badge.exile .badge-icon{color:#9fd8ff;}
  .badge.devotion .badge-icon{color:#ffd98a;}
  /* Rituel (set La guerre élémentaire) : emplacement à côté du portrait du héros */
  .ritual-slot{position:absolute;width:118px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:4;font-family:'Cinzel',serif;}
  #hero-frame-p1 .ritual-slot{left:calc(100% + 14px);bottom:0;}
  #hero-frame-p2 .ritual-slot{right:calc(100% + 14px);top:0;}
  .ritual-ring{width:84px;height:84px;border-radius:50%;padding:6px;background:conic-gradient(var(--rit-c,#c98bff) calc(var(--rit-p,0)*1%), rgba(255,255,255,.08) 0);box-shadow:0 0 14px rgba(0,0,0,.6);cursor:pointer;border:none;}
  .ritual-ring-inner{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b1d3d,#0e0816);border:2px solid #3a2a4e;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f2ead2;}
  .ritual-ring-inner .rit-num{font-weight:700;font-size:19px;line-height:1;}
  .ritual-ring-inner .rit-lbl{font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-top:2px;}
  .ritual-name{font-size:11px;color:#e9d9a8;text-align:center;max-width:118px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.9);}
  .ritual-slot .phase-btn{font-size:11px;padding:4px 10px;min-width:0;}
  .ritual-ring.can-pour{animation:rit-glow 1.6s ease-in-out infinite;}
  @keyframes rit-glow{0%,100%{box-shadow:0 0 10px rgba(201,139,255,.35)}50%{box-shadow:0 0 22px rgba(201,139,255,.9)}}
  /* Édifice : Endurance et cible d'attaque */
  .edifice-hp{position:absolute;right:4px;bottom:4px;min-width:30px;height:30px;padding:0 6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5d7ea8,#1f3550);border:2px solid #0e1a2a;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none;}
  .edifice-target-badge{position:absolute;right:4px;top:4px;padding:2px 7px;border-radius:9px;background:#8b1d1d;color:#fff;font-size:11px;font-weight:700;z-index:6;pointer-events:none;box-shadow:0 2px 5px rgba(0,0,0,.6);}
  .relic-slot.edifice-clickable{cursor:crosshair;z-index:30;}
  .artifact-stack{z-index:12;}
  .relic-slot.edifice-clickable::after,.relic-slot.edifice-selected::after{content:'';position:absolute;inset:0;border:3px solid var(--gold);border-radius:8px;z-index:7;pointer-events:none;box-shadow:inset 0 0 12px rgba(212,175,55,.6);}
  .relic-slot.edifice-selected::after{border-color:#ff5d5d;box-shadow:inset 0 0 12px rgba(255,93,93,.7);}
  .badge.deckbuffs .badge-icon{color:#c9a8ff;}
  .badge.exile:not(.has-cards),.badge.deckbuffs:not(.has-cards){opacity:.4;cursor:default;}
  .zone-list-line{font-size:13px;color:#f2ead2;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.05);}

  .artifact-stack{position:absolute;display:flex;gap:6px;align-items:center;}
  /* Zones d'artefact alliées : côte à côte (l'une à droite de l'autre), placées entre le bouton
     « Fin de tour » (en haut) et le deck (en bas), alignées sur le bord droit du deck.
     bottom = 16px (bas du deck) + 189px (hauteur du deck) + 10px d'écart. */
  .board-row.self .artifact-stack{right:27px;bottom:215px;flex-direction:row;align-items:flex-end;}
  .board-row.enemy .artifact-stack{left:345px;top:14px;bottom:auto;flex-direction:row;}
  /* Carré 142×142 = taille exacte de la petite carte d'artefact (.ncard.n-small.n-artifact-card) */
  .artifact-stack .relic-slot{width:142px;height:142px;}
  .relic-slot-empty{border:2px dashed hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 25.8%) 34.9%);border-radius:8px;background:hsl(calc(var(--th, 252) - 4.5) calc(var(--ts-n, 1) * 28.6%) 5.5% / .4);}
  .relic-slot-empty.drop-target{border-color:var(--gold);background:rgba(212,175,55,.12);}
  .artifact-stack .relic-slot .card{transform:scale(.5);transform-origin:top left;}

  /* ---------- Menus repliables (journal / chat) ---------- */
  .phase-bar-wrap{position:relative;}
  .menu-toggles-row{position:absolute;bottom:100%;right:0;margin-bottom:6px;display:flex;gap:6px;}
  #emote-toggle-btn, #journal-toggle-btn, #chat-toggle-btn, #leave-game-btn, #report-bug-btn{width:50px;height:50px;border-radius:10px;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 32.1%) 11% / .85);border:2px solid rgba(212,175,55,.45);color:#f2ead2;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}
  #bug-report-panel{
    display:none;position:fixed;top:60px;right:20px;z-index:9990;width:280px;
    background:hsl(calc(var(--th, 252) + 3) calc(var(--ts-n, 1) * 33.3%) 7.1% / .97);border:1.5px solid var(--gold);border-radius:12px;padding:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #bug-report-panel.show{display:block;}
  #bug-report-panel h3{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;margin:0 0 10px;}
  #bug-report-text{
    width:100%;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 29%) 12.2%);border:1.5px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;color:#f2ead2;
    font-size:12.5px;padding:8px;resize:vertical;font-family:'Inter',sans-serif;
  }
  #bug-report-status{font-size:11px;color:var(--parchment-dim);min-height:14px;margin:6px 0;}
  #bug-report-buttons{display:flex;gap:8px;}
  #bug-report-buttons button{flex:1;padding:7px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  #bug-report-cancel{background:transparent;border:1.5px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));color:var(--parchment-dim);}
  #bug-report-send{background:var(--arcane,hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%))));border:none;color:#fff;font-weight:600;}
  #emote-toggle-btn:hover, #journal-toggle-btn:hover, #leave-game-btn:hover{border-color:var(--gold, #d4af37);}
  #leave-game-btn:hover{border-color:var(--blood);}
  /* Position reprise de la maquette : panneau vertical ancré en haut à
     gauche (sous la barre du haut), pas flottant en bas à droite. */
  #journal-panel{position:fixed;left:17px;top:65px;width:250px;height:745px;max-height:calc(100% - 85px);background:var(--bg-panel);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:12px;padding:12px;z-index:99997;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);}
  #journal-panel.show{display:flex;}
  /* ---------- Chat de la partie ---------- */
  #chat-toggle-btn{position:relative;}
  #chat-unread-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e0584f;color:#fff;font:700 11px/18px 'Inter',sans-serif;text-align:center;box-sizing:border-box;}
  #chat-panel{position:fixed;right:17px;top:65px;width:270px;height:430px;max-height:calc(100% - 85px);background:var(--bg-panel);border:1px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:12px;padding:12px;z-index:99997;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);}
  #chat-panel.show{display:flex;}
  #chat-panel h3{margin:0 0 8px;font-family:'Cinzel',serif;color:var(--gold);font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #chat-list{flex:1;min-height:0;overflow-y:auto;font-size:12px;line-height:1.45;color:var(--parchment-dim);}
  #chat-list .chat-msg{padding:4px 0 4px 7px;border-bottom:1px dashed var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-left:3px solid transparent;word-wrap:break-word;overflow-wrap:anywhere;}
  #chat-list .chat-msg.mine{border-left-color:#4aa3ff;}
  #chat-list .chat-msg.opp{border-left-color:#e0584f;}
  #chat-list .chat-msg.spec{border-left-color:#8a8a99;}
  #chat-list .chat-name{font-weight:700;color:var(--parchment, #f2ead2);}
  #chat-list .chat-tag{font-size:10px;margin-left:4px;padding:0 5px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--parchment-dim);}
  #chat-list .chat-empty{font-size:11.5px;opacity:.7;padding:6px 0;}
  #chat-form{display:flex;gap:6px;margin-top:8px;}
  #chat-input{flex:1;min-width:0;background:hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 29%) 12.2%);border:1.5px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-radius:8px;color:#f2ead2;font-size:12.5px;padding:7px 8px;font-family:'Inter',sans-serif;}
  #chat-send-btn{background:var(--arcane,hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%))));border:none;color:#fff;font-weight:600;border-radius:8px;padding:0 10px;font-size:12px;cursor:pointer;}
  #chat-hint{font-size:10.5px;color:var(--parchment-dim);opacity:.75;margin-top:6px;}
  #journal-panel h3{margin:0 0 8px;font-family:'Cinzel',serif;color:var(--gold);font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #journal-panel h3 .close-journal-btn{cursor:pointer;font-size:16px;color:var(--parchment-dim);}
  #journal-panel h3 .close-journal-btn:hover{color:var(--gold);}
  #journal-panel #log{flex:1;min-height:0;overflow-y:auto;font-size:11.5px;}
  .journal-entry{padding:6px 0;border-bottom:1px dashed var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));}
  .journal-entry:last-child{border-bottom:none;}
  .journal-entry .who{color:var(--gold);font-weight:600;}
  .journal-entry .card-name-ref{color:var(--frost);text-decoration:underline dotted;cursor:default;font-weight:600;}
  .journal-entry .card-name-ref:hover{color:#7dd3f0;}
  .journal-entry .hl-ref{text-decoration:underline dotted;cursor:default;}
  .ncard.journal-highlight{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px rgba(212,175,55,.8);z-index:50;position:relative;}
  /* Assombrit tout le plateau sauf les cibles en surbrillance — le
     survol d'un effet du journal (dégâts, soin, etc. sur une ou plusieurs
     cartes précises) active ce mode. */
  #board.journal-spotlight-active .ncard{opacity:.25;filter:grayscale(60%);transition:opacity .15s ease;}
  #board.journal-spotlight-active .ncard.journal-highlight{opacity:1;filter:none;}
  #board.journal-spotlight-active .hero-frame{opacity:.25;filter:grayscale(60%);transition:opacity .15s ease;}
  #board.journal-spotlight-active .hero-frame.journal-highlight-hero{opacity:1;filter:none;outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px rgba(212,175,55,.8);}
  /* Structure hiérarchique du journal — le nom de la carte reste visible,
     le détail des effets se déroule au survol. */
  .journal-entry-card{cursor:default;}
  /* Fige les actions des deux joueurs tant qu'une charge de combat joue
     encore dans la file (voir queueCombatAnim / processCombatAnimQueue) —
     évite qu'un clic pendant l'animation ne parte sur un plateau qui va
     encore changer sous nos yeux. */
  body.combat-anim-lock #board,
  body.combat-anim-lock #hand-p1,
  body.bfx-busy #board,
  body.bfx-busy #hand-p1{
    pointer-events:none;
  }
  /* Bouton « Passer » : option de la modale d'options (classe combat-skip-enabled
     sur <body>), visible uniquement tant que la file d'animations joue. */
  #combat-skip-btn{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99990;
    padding:7px 18px;font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.4px;color:var(--parchment,#f0e6c8);
    background:hsl(calc(var(--th, 252) + 10.5) calc(var(--ts-n, 1) * 25%) 6.3% / .72);border:1.5px solid rgba(212,175,55,.55);border-radius:18px;cursor:pointer;opacity:.8;}
  #combat-skip-btn:hover{opacity:1;background:hsl(calc(var(--th, 252) + 10.5) calc(var(--ts-n, 1) * 25%) 6.3% / .92);}
  body.combat-anim-lock.combat-skip-enabled #combat-skip-btn{display:block;}
  /* --- Journal : lisibilité --- */
  /* Ordre chronologique (le plus récent en bas, le panneau suit la dernière
     ligne) : l'ancien « column-reverse » collait le défilement en bas tout en
     affichant le plus récent en haut, donc hors de vue dès que le journal
     débordait. Les règles ci-dessous sont préfixées pour passer devant
     « #log div » (padding / filet commun à tous les div). */
  #journal-panel #log{display:block;flex-direction:initial;}
  #journal-panel #log .journal-entry{padding:5px 0 5px 7px;border-bottom:1px dashed var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));}
  #journal-panel #log .journal-entry.mine{border-left:3px solid #4aa3ff;}
  #journal-panel #log .journal-entry.opp{border-left:3px solid #e0584f;}
  #journal-panel #log .journal-entry-card, #journal-panel #log .journal-effect-line{padding:0;border-bottom:none;}
  #journal-panel #log .journal-entry .jicon{display:inline-block;width:1.5em;text-align:center;margin-left:-.2em;}
  #journal-panel #log .journal-turn{position:sticky;top:0;z-index:2;margin:8px 0 4px;padding:3px 8px;border-radius:6px;border:1px solid var(--line,hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));border-bottom-width:1px;font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.5px;color:var(--parchment,#f0e6c8);background:hsl(calc(var(--th, 252) + 0.9) calc(var(--ts-n, 1) * 30.4%) 18%);}
  #journal-panel #log .journal-turn.mine{background:#16304a;border-color:#2b6ea8;}
  #journal-panel #log .journal-turn.opp{background:#40201f;border-color:#a8423b;}
  #journal-panel #log .journal-combat{margin:6px 0;padding:2px 0 2px 6px;border-radius:6px;background:rgba(255,255,255,.035);border:1px solid var(--line,hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));}
  #journal-panel #log .journal-combat.mine{border-left:3px solid #4aa3ff;}
  #journal-panel #log .journal-combat.opp{border-left:3px solid #e0584f;}
  #journal-panel #log .journal-combat-head{padding:2px 0;border-bottom:none;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.6px;color:var(--gold);}
  #journal-panel #log .journal-combat .journal-entry{border-bottom:none;border-left:none;padding:2px 0;}
  .jr-dmg{color:#ff7a70;font-weight:700;}
  .jr-heal{color:#6fd98d;font-weight:700;}
  .jr-mana{color:#6cc6ff;font-weight:700;}
  .jr-stat{color:var(--gold);font-weight:700;}
  @keyframes journal-fresh-kf{0%{background:rgba(212,175,55,.35);}100%{background:transparent;}}
  .journal-fresh{animation:journal-fresh-kf 1.6s ease-out;}
  .journal-entry-effects{max-height:0;overflow:hidden;transition:max-height .18s ease;padding-left:14px;border-left:2px solid var(--line, hsl(calc(var(--th, 252) - 1.6) calc(var(--ts-n, 1) * 31.5%) 28.6%));margin-left:4px;}
  .journal-entry:hover .journal-entry-effects, .journal-entry-effects.force-open{max-height:200px;}
  .journal-effect-line{font-size:11px;color:var(--parchment-dim,#d9cfae);padding:2px 0;cursor:default;}
  .journal-effect-line.hl-ref{text-decoration:underline dotted;}
</style>
