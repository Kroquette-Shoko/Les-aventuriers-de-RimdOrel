// Reconstruit l'affichage du journal à partir de S.__gameLog — traduit
// "Vous"/"L'adversaire" selon le rôle du joueur qui regarde (la donnée
// stockée côté serveur est neutre, sans ça les deux joueurs verraient
// "Vous" pour les mêmes actions).

// ---------------- Suivi des entrées de journal déjà jouées ----------------
// Avant : un simple compteur (nombre d'entrées vues) + slice(compteur). Or le
// serveur élague le journal (il ne garde que les derniers tours) : le tableau
// pouvait RACCOURCIR, le slice ne renvoyait plus rien et sons/animations des
// nouvelles entrées étaient perdus. Et au rechargement de la page le compteur
// repartait à 0 : tout l'historique récent était rejoué d'un coup.
//
// createGameLogTracker() renvoie un suivi indépendant de la taille du tableau :
//  - entrée avec `seq` (compteur croissant posé par le serveur, jamais
//    réutilisé) : elle est nouvelle si seq > dernier seq traité ;
//  - entrée SANS seq (ancien serveur / partie commencée avant la mise à jour) :
//    on retrouve la position de la dernière entrée vue grâce à une empreinte
//    "tour # rang dans le tour # contenu". Le rang dans le tour ne change pas
//    quand les tours anciens sont élagués, donc l'empreinte reste valable ;
//  - tout premier appel (chargement de la page) : on considère tout ce qui
//    existe comme déjà vu, sans rien rejouer ;
//  - si le journal semble avoir été remis à zéro (seq plus petit qu'avant,
//    empreinte introuvable alors qu'elle devrait être là) : on se recale
//    silencieusement plutôt que de rejouer ou de planter.
// peek(entries) = liste des nouvelles entrées SANS rien mémoriser ;
// take(entries) = pareil, et mémorise (à n'appeler qu'une fois par rendu).
// Les entrées reviennent dans l'ordre du tableau (donc dans l'ordre du jeu),
// même si une reconnexion en apporte plusieurs d'un coup.
function createGameLogTracker(){
  let st = { initialized:false, lastSeq:-1, lastFp:null, lastFpTurn:null };
  const hasSeq = e => e && typeof e.seq==='number' && isFinite(e.seq);
  // Empreinte de chaque entrée sans seq (rang calculé par tour).
  function fingerprints(list){
    const rank = {};
    return list.map(e=>{
      const t = (e && typeof e.turn==='number') ? e.turn : 0;
      rank[t] = (rank[t]||0)+1;
      const content = JSON.stringify([
        e.ownerKey, e.raw, e.kind, e.cardId, e.cardName, e.deadInstId,
        e.highlightIds, (e.effects||[]).map(x=>x && x.text)
      ]);
      return { fp: t+'#'+rank[t]+'#'+content, turn:t };
    });
  }
  // État de référence après lecture de tout le tableau (rien à rejouer).
  function baseline(entries){
    const legacy = entries.filter(e=>!hasSeq(e));
    const fps = fingerprints(legacy);
    const last = fps.length ? fps[fps.length-1] : null;
    let maxSeq = -1;
    entries.forEach(e=>{ if(hasSeq(e) && e.seq>maxSeq) maxSeq = e.seq; });
    return { initialized:true, lastSeq:maxSeq, lastFp:last?last.fp:null, lastFpTurn:last?last.turn:null };
  }
  function scan(entries){
    entries = Array.isArray(entries) ? entries.filter(Boolean) : [];
    if(!st.initialized) return { fresh:[], next:baseline(entries) };

    const seqd = entries.filter(hasSeq);
    const legacy = entries.filter(e=>!hasSeq(e));
    let maxSeq = -1;
    seqd.forEach(e=>{ if(e.seq>maxSeq) maxSeq = e.seq; });
    // Compteur du serveur reparti plus bas : nouvelle partie / journal remis à zéro.
    if(seqd.length && maxSeq < st.lastSeq) return { fresh:[], next:baseline(entries) };

    // Entrées sans seq : retrouver la dernière entrée vue.
    const freshLegacy = new Set();
    const fps = fingerprints(legacy);
    if(legacy.length){
      if(st.lastFp===null){
        legacy.forEach(e=>freshLegacy.add(e));
      } else {
        let idx = -1;
        for(let i=fps.length-1;i>=0;i--){ if(fps[i].fp===st.lastFp){ idx=i; break; } }
        if(idx>=0){
          legacy.slice(idx+1).forEach(e=>freshLegacy.add(e));
        } else if(st.lastFpTurn < Math.min(...fps.map(f=>f.turn))){
          // la dernière entrée vue a été élaguée : tout ce qui reste est plus récent
          legacy.forEach(e=>freshLegacy.add(e));
        } else {
          return { fresh:[], next:baseline(entries) }; // journal incohérent : on se recale
        }
      }
    }
    const fresh = entries.filter(e=> hasSeq(e) ? e.seq>st.lastSeq : freshLegacy.has(e));
    const lastLegacy = fps.length ? fps[fps.length-1] : null;
    return { fresh, next:{
      initialized:true,
      lastSeq: Math.max(st.lastSeq, maxSeq),
      lastFp: lastLegacy ? lastLegacy.fp : st.lastFp,
      lastFpTurn: lastLegacy ? lastLegacy.turn : st.lastFpTurn
    }};
  }
  return {
    peek(entries){ return scan(entries).fresh; },
    take(entries){ const r = scan(entries); st = r.next; return r.fresh; }
  };
}
const GAMELOG_TRACKER = createGameLogTracker();
// Nouvelles entrées de S.__gameLog depuis le dernier rendu. commit=false :
// simple aperçu (ne marque rien comme vu).
function getNewGameLogEntries(commit=true){
  const entries = (S && S.__gameLog) || [];
  return commit ? GAMELOG_TRACKER.take(entries) : GAMELOG_TRACKER.peek(entries);
}
// ---------------- Événements de combat structurés (S.__combatEvents) ----------------
// Le serveur publie, en plus du journal, un tableau SÉPARÉ des 60 derniers
// événements de combat avec les dégâts RÉELS (après amplificateurs) :
//  - blockResolved : un attaquant bloqué par une créature (dégâts dans les
//    deux sens, armure absorbée, morts) ;
//  - heroDamage : dégâts non bloqués au héros, par attaquant.
// Même compteur `seq` que le journal : on réutilise donc la fabrique de suivi
// createGameLogTracker() (nouveaux = seq plus grand que le dernier vu). Le
// journal (S.__gameLog) continue de piloter QUELLE animation joue ; ces
// événements ne fournissent que les CHIFFRES. Sans événement (ancien serveur,
// partie commencée avant le déploiement, événement manquant) on retombe sur
// une estimation à partir de l'état affiché (PREV_S), sans erreur.
// <combat-events>
const SFX_ARMOR_ABSORB = 'clic';       // son léger déjà présent dans sfx/ (0,2 s) : coup absorbé par l'armure
const SFX_RIPOSTE_GAP_MS = 110;        // décalage entre le coup de l'attaquant et la riposte du bloqueur
// Son d'impact selon les dégâts : ≤4 léger, 5 à 10 moyen, au-delà fort.
// Seuils conservés : ils couvrent bien les créatures courantes (Force 1-10)
// et restent cohérents avec les dégâts au héros déjà réglés ainsi.
function hitSfxForDamage(n){ return n<=4 ? 'hitLight' : n<=10 ? 'hitMedium' : 'hitLarge'; }
function isCombatNumber(x){ return typeof x==='number' && isFinite(x); }
function cleanDamage(x){ return isCombatNumber(x) ? Math.max(0, Math.round(x)) : null; }
// Créature (état de jeu) par instId sur l'un des deux plateaux, ou null.
function findCreatureInState(state, instId){
  if(!state || !instId) return null;
  for(const key of ['p1','p2']){
    const c = ((state[key] && state[key].board) || []).find(x=>x && x.instId===instId);
    if(c) return c;
  }
  return null;
}
// Retire du lot `pool` (modifié) le premier événement `kind` qui satisfait
// `pred`, et le renvoie ; null sinon. Chaque événement sert donc une seule fois.
function takeCombatEvent(pool, kind, pred){
  if(!Array.isArray(pool)) return null;
  const i = pool.findIndex(e=>e && e.combatEvent===kind && (!pred || pred(e)));
  return i>=0 ? pool.splice(i,1)[0] : null;
}
// Résultat d'un blocage lu dans un événement blockResolved. Champ absent ou
// invalide = null (« inconnu »), complété ensuite par l'estimation.
function blockOutcomeFromEvent(ev){
  const dB = cleanDamage(ev.dmgToBlocker), dA = cleanDamage(ev.dmgToAttacker);
  const absB = typeof ev.armorAbsorbedBlocker==='boolean' ? ev.armorAbsorbedBlocker
             : (ev.armorAbsorbed===true && dB===0);
  const absA = typeof ev.armorAbsorbedAttacker==='boolean' ? ev.armorAbsorbedAttacker
             : (ev.armorAbsorbed===true && dA===0);
  return { exact:true, dmgToBlocker:dB, dmgToAttacker:dA, absorbedBlocker:absB, absorbedAttacker:absA,
           attackerDied:!!ev.attackerDied, blockerDied:!!ev.blockerDied };
}
// APPROXIMATIF (repli sans événement) : dégâts = force affichée (curAtk) de
// chaque créature dans l'état précédent PREV_S, donc sans amplificateurs,
// Initiative ni armure. Mort = présente avant, absente maintenant.
function estimateBlockOutcome(prevState, state, attackerId, blockerId){
  const att = findCreatureInState(prevState, attackerId);
  const blk = findCreatureInState(prevState, blockerId);
  return {
    exact:false,
    dmgToBlocker: att ? cleanDamage(att.curAtk ?? att.atk) : null,
    dmgToAttacker: blk ? cleanDamage(blk.curAtk ?? blk.atk) : null,
    absorbedBlocker:false, absorbedAttacker:false,
    attackerDied: !!att && !findCreatureInState(state, attackerId),
    blockerDied: !!blk && !findCreatureInState(state, blockerId)
  };
}
function resolveBlockOutcome(ev, prevState, state, attackerId, blockerId){
  const est = estimateBlockOutcome(prevState, state, attackerId, blockerId);
  if(!ev) return est;
  const out = blockOutcomeFromEvent(ev);
  if(out.dmgToBlocker===null){ out.dmgToBlocker = est.dmgToBlocker; out.exact = false; }
  if(out.dmgToAttacker===null){ out.dmgToAttacker = est.dmgToAttacker; out.exact = false; }
  return out;
}
// Dégâts au héros par attaquant : dmg + pierceExcess (excédent de Perforant)
// = ce que CET attaquant a réellement fait au héros ; la somme vaut `total`.
// Sans événement : amounts vide, seul le total (lu dans le journal) est connu.
function heroOutcome(ev, fallbackTotal){
  const amounts = {};
  let exact = false;
  if(ev && Array.isArray(ev.attackers)){
    exact = true;
    ev.attackers.forEach(a=>{
      if(a && a.instId) amounts[a.instId] = (cleanDamage(a.dmg)||0) + (cleanDamage(a.pierceExcess)||0);
    });
  }
  const total = (ev && cleanDamage(ev.total)!==null) ? cleanDamage(ev.total) : (cleanDamage(fallbackTotal)||0);
  return { exact, total, amounts };
}
// Chiffre flottant : {text, cls} ou null s'il n'y a rien à montrer (inconnu).
// Bouclier si l'armure a absorbé, « 0 » discret si aucun dégât, sinon -N
// (taille/couleur selon N : ≤4 petit, ≤10 moyen, au-delà grand).
function damagePopupSpec(amount, absorbed){
  if(absorbed) return { text:'🛡', cls:'dmg-shield' };
  if(!isCombatNumber(amount)) return null;
  if(amount<=0) return { text:'0', cls:'dmg-zero' };
  return { text:'-'+amount, cls: amount<=4 ? 'dmg-s' : amount<=10 ? 'dmg-m' : 'dmg-l' };
}
// Sons d'un blocage : un son par coup réellement porté (le coup de l'attaquant,
// puis la riposte SFX_RIPOSTE_GAP_MS plus tard : on les entend comme deux
// coups, pas comme un seul son écrasé). Armure absorbée = son léger distinct ;
// 0 dégât sans armure = silence (Initiative qui empêche le second coup...).
// Tout inconnu (aucun événement, aucune estimation) : ancien comportement,
// un hitMedium.
function planBlockSounds(o){
  const strikes = [
    { dmg:o.dmgToBlocker, absorbed:!!o.absorbedBlocker },
    { dmg:o.dmgToAttacker, absorbed:!!o.absorbedAttacker }
  ];
  if(!isCombatNumber(strikes[0].dmg) && !isCombatNumber(strikes[1].dmg) && !strikes[0].absorbed && !strikes[1].absorbed){
    return [{ key:'hitMedium', delayMs:0, volume:0.6 }];
  }
  const out = [];
  strikes.forEach(s=>{
    const key = s.absorbed ? SFX_ARMOR_ABSORB : (isCombatNumber(s.dmg) && s.dmg>0 ? hitSfxForDamage(s.dmg) : null);
    if(key) out.push({ key, delayMs: out.length*SFX_RIPOSTE_GAP_MS, volume: out.length ? 0.5 : 0.6 });
  });
  return out;
}
// Le plus fort des sons planifiés (mode instantané : un seul son, sans décalage).
function pickLoudestSound(plan){
  const rank = k => k==='hitLarge' ? 3 : k==='hitMedium' ? 2 : k==='hitLight' ? 1 : 0;
  let best = null;
  (plan||[]).forEach(p=>{ if(!best || rank(p.key)>rank(best.key)) best = p; });
  return best ? { key:best.key, delayMs:0, volume:best.volume } : null;
}
// Plus gros coup d'un blocage (pour le tremblement d'écran) ; null si inconnu.
function maxBlockDamage(o){
  const v = [o.dmgToBlocker, o.dmgToAttacker].filter(isCombatNumber);
  return v.length ? Math.max(...v) : null;
}
// </combat-events>
const COMBAT_EVENT_TRACKER = createGameLogTracker();
// Nouveaux événements de combat depuis le dernier rendu (voir getNewGameLogEntries).
// On ignore ce qui n'a pas de seq numérique : le suivi par empreinte du journal
// ne convient pas à ces objets, et le contrat serveur garantit un seq.
function getNewCombatEvents(commit=true){
  const all = (S && Array.isArray(S.__combatEvents)) ? S.__combatEvents : [];
  const evs = all.filter(e=>e && e.combatEvent && isCombatNumber(e.seq));
  return commit ? COMBAT_EVENT_TRACKER.take(evs) : COMBAT_EVENT_TRACKER.peek(evs);
}
// Fait trembler tout l'écran sur un gros coup — jamais sur un petit pichenette
// (tier 'hitLight' ignoré), pour que ça reste marquant plutôt que fatiguant.
function shakeScreen(tier){
  if(tier!=='hitMedium' && tier!=='hitLarge') return;
  const outer = document.getElementById('board-scale-outer');
  if(!outer) return;
  const cls = tier==='hitLarge' ? 'shake-large' : 'shake-medium';
  outer.classList.remove('shake-medium','shake-large');
  void outer.offsetWidth; // force le reflow pour pouvoir rejouer l'animation si elle tourne déjà
  outer.classList.add(cls);
  setTimeout(()=>outer.classList.remove(cls), tier==='hitLarge' ? 460 : 360);
}

function renderGameLog(){
  const el = document.getElementById('log');
  if(!el || !S) return;

  // Anime et sonorise les NOUVELLES entrées depuis le dernier rendu (marche
  // pour les deux joueurs, pas seulement celui qui vient d'agir, puisque
  // c'est basé sur l'état reçu et pas sur une action locale).
  // Événements de combat structurés (chiffres exacts) : une seule lecture par
  // rendu ; chaque entrée de journal « consomme » son événement (takeCombatEvent).
  const newCombatEvents = getNewCombatEvents();
  getNewGameLogEntries().forEach(entry=>{
    if(entry.raw){
      if(entry.raw.includes('attaque avec')){
        playSfx('attack');
      } else if(entry.highlightIds && entry.highlightIds.length===2){
        // "bloque la créature X avec Y" : les deux se ruent l'une sur l'autre
        const [attackerInstId, blockerInstId] = entry.highlightIds;
        debugLog(`[anim] combat bloqué détecté : attaquant=${attackerInstId} bloqueur=${blockerInstId}`, 'log-ok');
        // Chiffres exacts via l'événement blockResolved ; sans lui, estimation
        // depuis PREV_S (état encore affiché). Le(s) son(s) d'impact jouent
        // au moment du choc, dans playCombatStrike.
        const blockEv = takeCombatEvent(newCombatEvents, 'blockResolved',
          e=>e.attackerInstId===attackerInstId && e.blockerInstId===blockerInstId);
        playCombatStrike(attackerInstId, blockerInstId, resolveBlockOutcome(blockEv, PREV_S, S, attackerInstId, blockerInstId));
      } else if(entry.raw.includes('perdu') && entry.raw.includes('point')){
        // dégâts non bloqués au héros : popup + son selon l'ampleur, et
        // chaque attaquant se rue vers le héros (même animation que pour
        // un combat bloqué, la cible étant simplement le héros ici)
        const m = entry.raw.match(/(\d+) point/);
        if(m){
          const dmg = parseInt(m[1]);
          const heroSlot = entry.ownerKey===MY_KEY ? 'p1' : 'p2';
          // Événement heroDamage correspondant (même héros, même total) :
          // donne les dégâts de CHAQUE attaquant. Sans lui : un seul chiffre
          // (le total du journal) et un seul son, au premier choc.
          const heroEv = takeCombatEvent(newCombatEvents, 'heroDamage',
            e=>e.heroOwner===entry.ownerKey && e.total===dmg);
          const ho = heroOutcome(heroEv, dmg);
          const attackers = entry.highlightIds||[];
          const hitHero = (amount)=>{
            const heroEl = document.getElementById(`hero-frame-${heroSlot}`);
            if(heroEl){ flashCombatImpact(heroEl); spawnDamageNumber(heroEl, amount); }
            playSfx(hitSfxForDamage(amount));
            shakeScreen(hitSfxForDamage(amount));
          };
          if(!attackers.length){
            hitHero(ho.total); // aucun attaquant à animer : tout de suite, comme avant
          }
          let totalShown = false;
          if(combatInstant() && attackers.length){
            // mode instantané : pas de charge ni de chiffre, un seul son (le plus fort)
            const loudest = ho.exact ? Math.max(0, ...Object.values(ho.amounts)) : ho.total;
            if(loudest>0) playSfx(hitSfxForDamage(loudest));
            return;
          }
          attackers.forEach(attackerInstId=>{
            queueCombatAnim(()=>{
              const attRes = resolveCombatEl(attackerInstId);
              const attEl = attRes.el;
              const heroEl = document.getElementById(`hero-frame-${heroSlot}`);
              const onImpact = ()=>{
                if(ho.exact){
                  const amount = ho.amounts[attackerInstId];
                  if(amount>0) hitHero(amount);
                } else if(!totalShown){
                  totalShown = true;
                  hitHero(ho.total);
                }
              };
              // Pas d'élément à animer : on montre quand même chiffre et son.
              if(!attEl || !heroEl){ if(attRes.temp && attEl) attEl.remove(); onImpact(); return Promise.resolve(); }
              return arrowThenLunge(attEl, heroEl, { onImpact }).then(()=>{ if(attRes.temp) attEl.remove(); });
            });
          });
        }
      }
    } else if(entry.deadInstId){
      // Une créature vient de mourir au combat (voir logDirect côté
      // serveur) — cas à part : ni son de carte jouée, ni flèche
      // d'effet, juste l'animation de dissolution.
      if(combatInstant()) playSfx('card-death'); // mode instantané : le son seul, sans file
      else queueCombatAnim(()=>playCardDeathAnim(entry.deadInstId));
    } else if(entry.cardName){
      const full = entry.cardId ? JOURNAL_CARD_LOOKUP[entry.cardId] : null;
      if(entry.kind==='trap'){
        playSfx('trap');
      } else {
        playSfx(full && full.type==='Sortilège' ? 'cast' : 'cardPlay');
      }

      // Révélation 3D — uniquement pour une carte qui vient d'être jouée ou
      // un piège qui se déclenche (pas les capacités qui s'enchaînent
      // ensuite : ça spammerait l'écran à chaque tour un peu chargé).
      // Important : on ne teste PAS `full` ici (il peut encore être
      // manquant si JOURNAL_CARD_LOOKUP — chargé en arrière-plan — n'a pas
      // fini de se remplir à cet instant précis, typique en tout début de
      // partie), sinon l'animation est silencieusement sautée pour cette
      // carte. On relit JOURNAL_CARD_LOOKUP au moment où l'animation
      // s'exécute réellement (dans la file, donc après un léger délai qui
      // laisse largement le temps au chargement de se terminer).
      if(entry.kind==='play' || entry.kind==='trap'){
        const ownerP = S[entry.ownerKey];
        const ownerBackUrl = ownerP ? ownerP.cardBackUrl : null;
        const cardId = entry.cardId;
        queueCombatAnim(()=>{
          const fullAtAnimTime = cardId ? JOURNAL_CARD_LOOKUP[cardId] : null;
          if(!fullAtAnimTime) return Promise.resolve(); // carte vraiment introuvable (cas rarissime) : on ne bloque pas la file pour autant
          return playCardFlipReveal(fullAtAnimTime, {isTrap: entry.kind==='trap', backUrl: ownerBackUrl});
        });
      }

      // Flèche d'effet vers chaque cible touchée par une capacité — ou
      // éclat doré distinct si la capacité s'est ciblée elle-même. Si le
      // texte de l'effet indique que la cible meurt (détruite, sacrifiée...),
      // l'animation de dissolution remplace la flèche — une flèche vers une
      // carte déjà retirée du plateau ne pouvait de toute façon rien viser.
      (entry.effects||[]).forEach(eff=>{
        const isDeath = /meurt au combat|est détruite|^détruit "|^sacrifie "/i.test(eff.text||'');
        (eff.targetInstIds||[]).forEach(targetInstId=>{
          queueCombatAnim(()=>{
            if(isDeath) return playCardDeathAnim(targetInstId);
            const sourceEl = resolveLogSourceEl(entry);
            if(entry.sourceInstId && targetInstId===entry.sourceInstId){
              return flashSelfTrigger(sourceEl);
            }
            const targetEl = resolveLogTargetEl(targetInstId);
            return fireAbilityArrow(sourceEl, targetEl);
          });
        });
      });
    }
  });

  el.innerHTML = '';
  (S.__gameLog||[]).forEach(entry=>{
    const who = entry.ownerKey===MY_KEY ? 'Vous' : "L'adversaire";
    const isMe = entry.ownerKey===MY_KEY;
    const line = document.createElement('div');
    line.className = 'journal-entry';
    if(entry.raw){
      // message de combat : {who} est remplacé, et si des créatures sont
      // listées, tout le texte devient survolable — surbrillance sur
      // place si tout est encore là, sinon voyage dans le temps.
      line.textContent = entry.raw.replace('{who}', who);
      if(entry.highlightIds && entry.highlightIds.length){
        line.classList.add('hl-ref');
        line.onmouseenter = ()=>onJournalEffectHover(entry, entry.highlightIds);
        line.onmouseleave = onJournalEffectLeave;
      }
    } else {
      const nameSpan = `<span class="card-name-ref" data-cardid="${entry.cardId||''}">"${escapeHtmlGS(entry.cardName)}"</span>`;
      // Une phrase d'en-tête distincte par catégorie — validées ensemble,
      // voir la conversation sur la refonte du journal.
      const headerPhrase = ({
        play: isMe ? `Vous jouez la carte ${nameSpan}.` : `L'adversaire joue la carte ${nameSpan}.`,
        trap: isMe ? `Votre piège ${nameSpan} se déclenche.` : `Le piège ${nameSpan} de l'adversaire se déclenche.`,
        creature_trigger: `La capacité de ${nameSpan} se déclenche.`,
        creature_activate: isMe ? `Vous activez la capacité de ${nameSpan}.` : `L'adversaire active la capacité de ${nameSpan}.`,
        hero_activate: isMe ? `Vous activez le pouvoir de votre héros ${nameSpan}.` : `L'adversaire active le pouvoir de son héros ${nameSpan}.`,
        hero_trigger: isMe ? `Le pouvoir de votre héros ${nameSpan} se déclenche.` : `Le pouvoir du héros adverse ${nameSpan} se déclenche.`,
        artifact_activate: isMe ? `Vous activez ${nameSpan}.` : `L'adversaire active ${nameSpan}.`,
        artifact_trigger: `La capacité de ${nameSpan} se déclenche.`,
        region_trigger: isMe ? `La capacité de votre région ${nameSpan} se déclenche.` : `La capacité de la région adverse ${nameSpan} se déclenche.`,
        region_activate: isMe ? `Vous activez la capacité de votre région ${nameSpan}.` : `L'adversaire active la capacité de sa région ${nameSpan}.`,
      })[entry.kind] || `${who} joue ${nameSpan}.`;
      const effects = entry.effects || [];
      const header = document.createElement('div');
      header.className = 'journal-entry-card';
      if(effects.length <= 1){
        // Un seul effet (ou aucun) : deux phrases distinctes plutôt qu'une
        // seule avec "et" — "Vous jouez X. Vous gagnez 1 mana fragile."
        const eff = effects[0];
        header.innerHTML = eff
          ? `${headerPhrase} <span class="effect-sentence">${who} ${escapeHtmlGS(eff.text)}.</span>`
          : headerPhrase;
        if(eff && eff.targetInstIds && eff.targetInstIds.length){
          const effSpan = header.querySelector('.effect-sentence');
          effSpan.classList.add('hl-ref');
          effSpan.onmouseenter = ()=>onJournalEffectHover(entry, eff.targetInstIds);
          effSpan.onmouseleave = onJournalEffectLeave;
        }
      } else {
        header.innerHTML = `${headerPhrase} <span class="effect-count">(${effects.length} effets)</span>`;
      }
      line.appendChild(header);
      if(effects.length > 1){
        const list = document.createElement('div');
        list.className = 'journal-entry-effects';
        effects.forEach(eff=>{
          const effLine = document.createElement('div');
          effLine.className = 'journal-effect-line';
          effLine.textContent = `${who} ${eff.text}.`;
          if(eff.targetInstIds && eff.targetInstIds.length){
            effLine.classList.add('hl-ref');
            effLine.onmouseenter = ()=>onJournalEffectHover(entry, eff.targetInstIds);
            effLine.onmouseleave = onJournalEffectLeave;
          }
          list.appendChild(effLine);
        });
        line.appendChild(list);
      }
      const ref = line.querySelector('.card-name-ref');
      if(ref && entry.cardId){
        ref.onmouseenter = (ev)=>{ const c = JOURNAL_CARD_LOOKUP[entry.cardId]; if(c) showCardPreviewHover(c, ev); };
        ref.onmousemove = moveHeroPreview;
        ref.onmouseleave = hidePreview;
      }
    }
    el.appendChild(line);
  });
}

// ---------------- Connexion / session ----------------

function afterConnected(code){
  document.getElementById('app-outer').classList.add('show');
  MY_KEY = GS_ROLE === 'p2' ? 'p2' : 'p1';
  OPP_KEY = MY_KEY === 'p1' ? 'p2' : 'p1';
  gsConnect(onStateUpdate, onEmoteMessage);
  debugLog('Connecté (rôle : ' + GS_ROLE + ')', 'log-ok');
  gsFetchState().then(res=>{
    if(res.error){ debugLog('État initial → ' + res.error, 'log-error'); return; }
    onStateUpdate(res.state);
  });

  // Filet de sécurité : la diffusion temps réel devrait suffire à elle
  // seule, mais si un message venait à être manqué (déconnexion brève,
  // souci de livraison...), l'écran resterait figé sur un état périmé —
  // menant à des refus "wrong-phase" alors que tout semble normal à
  // l'écran. Une resynchronisation silencieuse toutes les 6 secondes
  // garantit qu'on ne dérive jamais durablement de la vérité serveur.
  setInterval(()=>{
    if(ACTION_IN_FLIGHT || !S || S.gameOver) return;
    gsFetchState().then(res=>{
      if(!res || res.error || !res.state) return;
      onStateUpdate(res.state);
    });
  }, 6000);

  // Minuteur de tour retiré pour l'instant (sondage toutes les 3s trop
  // lourd pour le serveur) — la logique reste construite côté serveur,
  // simplement jamais sollicitée, pour pouvoir la réactiver facilement.
}

let __pendingStateWhileAnimating = null;

// État reçu juste AVANT l'état courant S (null au tout premier état). Pendant
// une animation de combat, c'est exactement ce que le plateau affiche encore
// (voir "gel du rendu" plus bas) — utile pour comparer avant/après (diff de
// stats ou de mots-clés, estimation de dégâts de repli...). Mis à jour dans
// onStateUpdate uniquement, au moment où S est réaffecté.
let PREV_S = null;

// ---------------- Gel du rendu du plateau pendant une animation de combat ----
// Problème : le serveur renvoie l'état FINAL de l'action ; render() le dessinait
// tout de suite, donc au moment où l'animation de frappe jouait, les PV/ATK
// étaient déjà à leur valeur finale et les créatures mortes déjà disparues.
// Solution retenue (option A) : tant que des animations de combat sont dans la
// file, on NE reconstruit PAS le plateau — le DOM reste celui de l'ancien état
// (stats d'avant, créatures mortes encore visibles). S est quand même mis à
// jour tout de suite. À la fin de la file (ou au timeout de sécurité) on
// rend l'état final d'un coup. Pourquoi A plutôt que "afficher les stats
// d'avant sur le nouveau rendu" (B) : renderLane reconstruit tout le DOM, B
// aurait demandé de ré-insérer les cartes mortes et de réécrire les stats
// après chaque rendu, beaucoup plus invasif ; A ne touche qu'à render().
let __boardRenderFrozen = false;
let __boardRenderDirty = false;
function freezeBoardRender(){ __boardRenderFrozen = true; __boardRenderDirty = false; }
function unfreezeBoardRender(){
  if(!__boardRenderFrozen) return;
  __boardRenderFrozen = false;
  __boardRenderDirty = false;
  render(); // S est déjà l'état final : on l'affiche maintenant
}
// Cette entrée de journal va-t-elle jouer une animation de combat qui doit se
// dérouler sur l'ANCIEN plateau ? (même tri que dans renderGameLog)
function entryAnimatesBoardCombat(entry){
  if(!entry) return false;
  if(combatInstant()) return false; // mode instantané : rien à animer, donc pas de gel
  if(entry.raw){
    if(entry.raw.includes('attaque avec')) return false; // simple son
    if(entry.highlightIds && entry.highlightIds.length===2) return true; // combat bloqué
    return entry.raw.includes('perdu') && entry.raw.includes('point') && (entry.highlightIds||[]).length>0; // dégâts au héros
  }
  if(entry.deadInstId) return true;
  return (entry.effects||[]).some(eff=>/meurt au combat|est détruite|^détruit "|^sacrifie "/i.test(eff.text||''));
}

// ===== Écran d'annonce de match =====
let __matchAnnounceActive = false;
let __matchAnnounceDone = false;
const MATCH_ANNOUNCE_CLASS_ACCENT = {
  'Aube':'#D4AF37', 'Crépuscule':'#5B3A8E', 'Volonté':'#8B2E3C', 'Prima':'#1F6F54', 'Arcane':'#2C4A7C', 'Neutre':'#6b6b6b'
};
function matchAnnounceEscapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Construit les infos d'affichage d'un camp à partir de l'état de jeu (hero,
// dos de carte, nom de deck — déjà connus côté client) et, si ce n'est pas
// l'IA, du profil du joueur (titre équipé, badges mis en avant, avatar,
// pseudo) — récupéré via gsGetProfile, comme sur la page de profil.
async function buildMatchAnnounceSide(playerState, heroCollection, side){
  const accent = MATCH_ANNOUNCE_CLASS_ACCENT[playerState?.hero?.class] || MATCH_ANNOUNCE_CLASS_ACCENT.Neutre;
  // Cadrage dédié à l'écran d'annonce, réglé par héros ET par côté dans l'éditeur
  // de cartes (onglet "Cadrage héros — écran d'annonce") — indépendant du cadrage
  // utilisé sur la carte elle-même. Le côté droit utilise ses propres champs et
  // s'affiche en miroir pour que le héros fasse face au centre de l'écran.
  const isRight = side === 'right';
  let heroImageX = 50, heroImageY = 50, heroImageZoom = 100;
  // Par défaut : côté gauche normal, côté droit en miroir (pour faire face
  // au centre). Chaque héros peut cependant forcer son propre réglage par
  // côté (champs imageMirrorAnnounce / imageMirrorAnnounceRight, réglables
  // dans l'éditeur de cartes) — utile par exemple quand l'illustration
  // d'origine du héros est déjà orientée dans un sens qui rend le miroir
  // par défaut incorrect pour l'un des deux côtés, voire les deux.
  let heroImageMirror = isRight;
  if(playerState?.hero?.name && heroCollection){
    const heroCard = heroCollection.find(c=>c.name===playerState.hero.name && c.type==='Héros');
    if(heroCard){
      heroImageX = (isRight ? heroCard.imagePosXAnnounceRight : heroCard.imagePosXAnnounce) ?? 50;
      heroImageY = (isRight ? heroCard.imagePosYAnnounceRight : heroCard.imagePosYAnnounce) ?? 50;
      heroImageZoom = (isRight ? heroCard.imageZoomAnnounceRight : heroCard.imageZoomAnnounce) ?? 100;
      const mirrorField = isRight ? 'imageMirrorAnnounceRight' : 'imageMirrorAnnounce';
      if(heroCard[mirrorField] !== undefined) heroImageMirror = !!heroCard[mirrorField];
    }
  }
  const info = {
    accent,
    heroImage: playerState?.hero?.image || null,
    heroImageX, heroImageY, heroImageZoom, heroImageMirror,
    cardBackUrl: playerState?.cardBackUrl || null,
    deckName: playerState?.deckName || null,
    name: playerState?.isAI ? 'Intelligence artificielle' : 'Joueur',
    title: null,
    avatarUrl: null,
    badges: []
  };
  if(playerState?.isAI || !playerState?.userId) return info;
  try{
    const profile = await gsGetProfile(playerState.userId);
    if(profile && !profile.error){
      info.name = profile.username || info.name;
      info.title = profile.equippedTitle || null;
      info.badges = (profile.featuredAchievements || []).slice(0,5);
      if(profile.avatarHeroName && heroCollection){
        const hero = heroCollection.find(c=>c.name===profile.avatarHeroName && c.type==='Héros');
        if(hero && hero.image) info.avatarUrl = hero.image;
      }
      if(!info.avatarUrl && profile.discordAvatarUrl) info.avatarUrl = profile.discordAvatarUrl;
    }
  }catch(e){ /* un profil indisponible ne doit jamais bloquer le lancement de la partie */ }
  return info;
}

function matchAnnounceSideHtml(side, info){
  const badgesHtml = Array.from({length:5}).map((_,i)=>{
    const b = info.badges[i];
    const titleAttr = b && b.name ? ` title="${matchAnnounceEscapeHtml(b.name)}"` : '';
    return `<div class="ma-badge" ${titleAttr} style="${b && b.imageUrl ? `background-image:url('${b.imageUrl.replace(/'/g,'')}')` : `border:2px dashed rgba(241,230,200,.3);background-color:transparent;`}"></div>`;
  }).join('');
  const deckNameHtml = info.deckName ? `<div class="ma-deckname">${matchAnnounceEscapeHtml(info.deckName)}</div>` : '';
  const titleHtml = info.title ? `<div class="ma-title" style="color:${info.accent};">« ${matchAnnounceEscapeHtml(info.title)} »</div>` : '';
  return `
    <div class="ma-block ma-block-${side}">
      <div class="ma-cardback" style="border:2px solid ${info.accent};background-color:#1a1510;${info.cardBackUrl ? `background-image:url('${info.cardBackUrl.replace(/'/g,'')}')` : `background:linear-gradient(160deg, ${info.accent}55, #1a1510 70%);`}"></div>
      <div class="ma-name">${matchAnnounceEscapeHtml(info.name)}</div>
      ${deckNameHtml}
      <div class="ma-avatar" style="border:3px solid ${info.accent};${info.avatarUrl ? `background-image:url('${info.avatarUrl.replace(/'/g,'')}')` : `background:radial-gradient(circle at 35% 30%, ${info.accent}, #1a1510);`}"></div>
      ${titleHtml}
      <div class="ma-badges">${badgesHtml}</div>
    </div>`;
}

function playMatchAnnouncement(state){
  const el = document.getElementById('match-announce-overlay');
  // Le catalogue (pour résoudre un avatar "héros") est chargé une seule fois
  // puis réutilisé pour les deux camps.
  return loadAllCardsAcrossSets().catch(()=>[]).then(collection=>{
    return Promise.all([
      buildMatchAnnounceSide(state[MY_KEY], collection, 'left'),
      buildMatchAnnounceSide(state[OPP_KEY], collection, 'right')
    ]);
  }).then(([myInfo, oppInfo])=>{
    el.innerHTML = `
      <div class="ma-side ma-side-left" style="background:linear-gradient(145deg, ${myInfo.accent} 0%, #241a10 55%, #120d08 100%);">
        ${myInfo.heroImage ? `<div class="ma-side-bg" style="background-image:url('${myInfo.heroImage.replace(/'/g,'')}');background-size:${myInfo.heroImageZoom>100?myInfo.heroImageZoom+'%':'cover'};background-position:${myInfo.heroImageX}% ${myInfo.heroImageY}%;${myInfo.heroImageMirror?'transform:scaleX(-1);':''}"></div>` : ''}
      </div>
      <div class="ma-side ma-side-right" style="background:linear-gradient(215deg, ${oppInfo.accent} 0%, #241a10 55%, #120d08 100%);">
        ${oppInfo.heroImage ? `<div class="ma-side-bg" style="background-image:url('${oppInfo.heroImage.replace(/'/g,'')}');background-size:${oppInfo.heroImageZoom>100?oppInfo.heroImageZoom+'%':'cover'};background-position:${oppInfo.heroImageX}% ${oppInfo.heroImageY}%;${oppInfo.heroImageMirror?'transform:scaleX(-1);':''}"></div>` : ''}
      </div>
      <div class="ma-side ma-vignette-left"></div>
      <div class="ma-side ma-vignette-right"></div>
      <div class="ma-side ma-divider-glow"></div>
      <div class="ma-vs-badge" style="border:3px solid #D4AF37;"><span style="color:#D4AF37;">VS</span></div>
      ${matchAnnounceSideHtml('left', myInfo)}
      ${matchAnnounceSideHtml('right', oppInfo)}
    `;
    el.classList.add('show');
    return new Promise(resolve=>{
      // fondu d'entrée, puis maintien, puis fondu de sortie — 12s au total.
      requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.classList.add('visible'); }); });
      setTimeout(()=>{
        el.classList.remove('visible');
        setTimeout(()=>{
          el.classList.remove('show');
          el.innerHTML = '';
          resolve();
        }, 450);
      }, 11550);
    });
  });
}
// Compare l'état mana avant/après pour jouer le bon son de gain — un même
// son pour le mana normal ("plein") ET le mana fragile (comme demandé), un
// son distinct pour le mana "vide" (le maximum augmente sans qu'aucun mana
// utilisable ne soit gagné dans le même mouvement, ex: emptyManaEffect).
function detectAndPlayManaGainSfx(oldS, newS){
  if(!oldS) return; // pas d'état précédent (première connexion) : rien à comparer
  ['p1','p2'].forEach(key=>{
    const before = oldS[key], after = newS[key];
    if(!before || !after) return;
    const deltaNormal = (after.manaNormal||0) - (before.manaNormal||0);
    const deltaFragile = (after.manaFragile||0) - (before.manaFragile||0);
    const deltaMax = (after.manaNormalMax||0) - (before.manaNormalMax||0);
    if(deltaNormal > 0 || deltaFragile > 0){
      playSfx('mana-full');
    } else if(deltaMax > 0){
      playSfx('mana-empty');
    }
  });
}
function onStateUpdate(state){
  if(!state || !state.p1){
    debugLog("En attente d'un adversaire pour démarrer la partie...", 'log-ok');
    return;
  }
  // Anti-« retour en arrière » : l'état arrive par trois chemins (réponse de
  // l'action, signal temps réel, resynchro toutes les 6 s) et une réponse
  // lancée plus tôt peut arriver APRÈS une plus récente. Le serveur numérote
  // chaque sauvegarde (__rev) : on ignore tout état plus ancien que celui déjà
  // affiché ou déjà mis en attente pendant une animation.
  {
    const rev = (state.__rev|0);
    const known = Math.max((S && S.__rev)|0, (__pendingStateWhileAnimating && __pendingStateWhileAnimating.__rev)|0);
    if(rev < known){ return; }
  }
  // Une animation de combat est en cours (voir queueCombatAnim) : re-rendre
  // maintenant reconstruirait la carte en plein vol et la ferait
  // réapparaître à sa position d'origine, PENDANT que son clone animé
  // continue de se déplacer ailleurs — donnant l'impression trompeuse que
  // la carte s'est dédoublée. On garde donc cet état de côté, appliqué dès
  // que la file d'animation sera vide (voir processCombatAnimQueue).
  if(__combatAnimPlaying){
    __pendingStateWhileAnimating = state;
    return;
  }
  // Son de gain de mana — comparé à l'état précédent plutôt que lu dans le
  // journal, car le gain automatique en début de tour n'y est jamais
  // consigné (voir applyManaGain côté serveur, silencieux). Doit rester
  // AVANT la réaffectation de S ci-dessous.
  detectAndPlayManaGainSfx(S, state);

  // Instantané des cartes affichées AVANT que render() ne les remplace —
  // voir playCardDeathAnim plus bas, seul moyen d'animer la disparition
  // d'une carte qui vient de mourir (déjà absente du nouvel état).
  __lastBoardSnapshot = snapshotBoardForDeathAnim();

  // vue toujours du point de vue du joueur local : si je suis p2 côté
  // serveur, j'affiche quand même "moi" en bas et "adversaire" en haut,
  // en lisant simplement S[MY_KEY]/S[OPP_KEY] partout dans le rendu.
  PREV_S = S;
  S = state;

  // Écran d'annonce de match : dès que les deux joueurs sont connus pour la
  // première fois, on affiche quelques secondes un écran plein écran avec
  // les infos des deux camps AVANT de laisser apparaître le plateau (et
  // l'éventuel mulligan). Pendant qu'il tourne, S reste à jour mais le
  // rendu normal est suspendu — on rend une dernière fois à la fin, avec
  // l'état le plus récent reçu entre-temps.
  if(!__matchAnnounceDone && !__matchAnnounceActive && state.p2){
    __matchAnnounceActive = true;
    playMatchAnnouncement(state).then(()=>{
      __matchAnnounceActive = false;
      __matchAnnounceDone = true;
      finishStateUpdateTail(S);
    });
    return;
  }
  if(__matchAnnounceActive) return; // S est à jour ; le rendu reprendra à la fin de l'annonce

  finishStateUpdateTail(state);
}

function finishStateUpdateTail(state){
  // Si ce lot contient une animation de combat, on garde l'ancien plateau à
  // l'écran jusqu'à la fin de la file (voir "Gel du rendu"). L'aperçu
  // (commit=false) ne marque rien comme vu : renderGameLog s'en charge.
  if(!__boardRenderFrozen && getNewGameLogEntries(false).some(entryAnimatesBoardCombat)){
    freezeBoardRender();
  }
  render(); // sans effet si le plateau est gelé (voir render)
  renderGameLog();
  // Gel demandé mais rien n'est finalement parti dans la file : on affiche.
  if(__boardRenderFrozen && !__combatAnimPlaying && !__combatAnimQueue.length) unfreezeBoardRender();

  // Diagnostic temporaire : affiche les traces envoyées par le serveur
  // (voir recalculateContinuousEffects côté serveur) pour repérer où une
  // capacité continue s'arrête de fonctionner.
  if(state.__serverLog){
    const already = window.__seenServerLogCount || 0;
    state.__serverLog.slice(already).forEach(msg => debugLog(msg, 'log-ok'));
    window.__seenServerLogCount = state.__serverLog.length;
  }

  // Si c'est le tour de l'IA (et qu'elle a fini son mulligan), on déclenche
  // son tour automatiquement — le bouton de debug reste utilisable en secours,
  // mais on ne doit plus jamais avoir besoin d'y penser pour que la partie avance.
  // IMPORTANT : uniquement en phase 'main' — pendant declareBlockersMe,
  // S.active reste l'attaquant (donc l'IA si c'est elle qui attaque) alors
  // que c'est le joueur HUMAIN qui doit agir (bloquer). Sans cette
  // restriction, le client du joueur humain tentait de faire "jouer l'IA"
  // toutes les 700ms pendant qu'il essayait lui-même de bloquer, entrant en
  // conflit avec son propre clic ("une action est déjà en cours").
  const activeIsAI = S[S.active] && S[S.active].isAI;
  if(activeIsAI && !S.gameOver && S.phase==='main' && !ACTION_IN_FLIGHT){
    setTimeout(()=>{ uiProcessAi(); }, 700);
  }
}

// ============================================================
// NOUVEAU TEMPLATE — frames illustrées (big / small), repris tel
// quel du deckbuilder/éditeur.
// ============================================================
const NCLASS_TO_SLUG_NOACCENT = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const CARD_TYPE_TO_TEMPLATE_SLUG = {
  'Créature':'creature', 'Artefact':'artefact', 'Sortilège':'spell', 'Piège':'trap', 'Région':'region', 'Héros':'heros'
};
function ncardRealPath(size, slug, cardClass, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[cardClass] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bigframe.png`;
  }
  // Format small : nouveau schéma disponible uniquement pour Créature et
  // Artefact pour l'instant — les autres types restent sur l'ancien
  // système en attendant leurs propres illustrations.
  if(size==='small' && (cardType==='Créature' || cardType==='Artefact') && NCLASS_TO_SLUG_NOACCENT[cardClass]){
    return `images/card/small%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-smallframe.png`;
  }
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-${slug}.png`;
}
// Reprend les noms de fichiers exacts fournis (dont la coquille "creouscule"
// pour Crépuscule) — volontairement distincte de NCLASS_TO_SLUG ci-dessous,
// qui elle utilise l'orthographe correcte pour les cadres de base.
const HALF_FRAME_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté', 'Prima':'prima', 'Arcane':'arcane'
};
function ncardHalfFramePath(size, classSecondary, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[classSecondary] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[classSecondary]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bighalfframe.png`;
  }
  const slug = HALF_FRAME_SLUG[classSecondary];
  if(!slug) return null;
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-half-${slug}.png`;
}
const NCLASS_TO_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté',
  'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const NRARITY_TO_SLUG = {
  'Basique':'basique', 'Commune':'commun', 'Rare':'rare',
  'Épique':'epique', 'Mythique':'mythique'
};
function nEl(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function nImg(src, cls){ const i = document.createElement('img'); i.src = src; if(cls) i.className = cls; return i; }

function buildCurvedNameText(name, card, size){
  const wrap = nEl('div', 'nname-curved');
  wrap.style.top = (card.heroNameCurveTop ?? 4) + '%';
  const chars = (name || '').split('');
  const n = chars.length;
  const strength = (card.heroNameCurveStrength ?? 34) / 100;
  const maxAngle = Math.min(60, n * 4.2) * strength;
  const start = -maxAngle / 2;
  const step = n > 1 ? maxAngle / (n - 1) : 0;
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    const angle = start + step * i;
    span.style.transform = `rotate(${angle.toFixed(2)}deg)`;
    wrap.appendChild(span);
  });
  applyNameSizing(wrap, card, size);
  return wrap;
}

function buildNewCardEl(card, size, effectiveCostOverride, opts={}){
  const root = nEl('div', `ncard n-${size}`);
  const slug = NCLASS_TO_SLUG[card.class] || 'neutre';
  const isHero = card.type==='Héros';
  const isRegion = card.type==='Région';
  const hasMana = !isHero && !isRegion;
  const isCreature = card.type==='Créature';
  const isArtifact = card.type==='Artefact';
  if(isHero) root.classList.add('n-hero-card');
  if(isArtifact) root.classList.add('n-artifact-card');

  const posX = isHero ? (card.imagePosXHeroCard ?? 50) : size==='big' ? (card.imagePosX ?? 50) : (card.imagePosXSmall ?? 50);
  const posY = isHero ? (card.imagePosYHeroCard ?? 50) : size==='big' ? (card.imagePosY ?? 50) : (card.imagePosYSmall ?? 50);
  const zoom = isHero ? (card.imageZoomHeroCard ?? 100) : size==='big' ? (card.imageZoom ?? 100) : (card.imageZoomSmall ?? 100);
  const art = nEl('div', 'nart-layer');
  if(card.image){
    art.style.backgroundImage = `url('${card.image.replace(/'/g,'')}')`;
    art.style.backgroundPosition = `${posX}% ${posY}%`;
    art.style.backgroundSize = zoom>100 ? zoom+'%' : 'cover';
  }
  root.appendChild(art);
  root.appendChild(nImg(ncardRealPath(size, slug, card.class, card.type, opts.heroCardFrame), 'nframe-layer'));
  if(card.classSecondary){
    const halfPath = ncardHalfFramePath(size, card.classSecondary, card.type, opts.heroCardFrame);
    if(halfPath) root.appendChild(nImg(halfPath, 'nframe-half-layer'));
  }

  if(hasMana){
    const w = nEl('div','nstat-wrap n-mana');
    w.appendChild(nImg('images/card/icon/bubble/mana.png'));
    const t = nEl('div','nstat-txt'); t.textContent = effectiveCostOverride ?? (card.cost ?? 0);
    w.appendChild(t);
    root.appendChild(w);
  }
  if(isCreature){
    const wa = nEl('div','nstat-wrap n-atk');
    wa.appendChild(nImg('images/card/icon/bubble/attack.png'));
    const ta = nEl('div','nstat-txt'); ta.textContent = card.curAtk ?? card.atk ?? 0;
    wa.appendChild(ta);
    // Créature en jeu uniquement : force/PV colorés selon bonus/malus (+ infobulle)
    const live = opts.liveStats ? creatureStatInfo(card, (typeof JOURNAL_CARD_LOOKUP!=='undefined' ? JOURNAL_CARD_LOOKUP[card.id] : undefined), S && S.turn) : null;
    if(live && live.atk.cls){ ta.classList.add(live.atk.cls); wa.title = live.atk.title; }
    root.appendChild(wa);

    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = card.curHp ?? card.hp ?? 0;
    we.appendChild(te);
    if(live && live.hp.cls){ te.classList.add(live.hp.cls); we.title = live.hp.title; }
    root.appendChild(we);
  }
  if(isArtifact){
    const wf = nEl('div','nstat-wrap n-art');
    wf.appendChild(nImg('images/card/icon/bubble/artefact.png'));
    const t = nEl('div','nstat-txt'); t.textContent = (card.charges ?? 0)+'x';
    wf.appendChild(t);
    root.appendChild(wf);
  }
  if(isHero){
    const w = nEl('div','nstat-wrap n-mana');
    w.style.cssText += 'left:-6.5%;top:auto;bottom:-6.5%;';
    w.appendChild(nImg('images/card/icon/bubble/vie.png'));
    const t = nEl('div','nstat-txt'); t.textContent = card.curHp ?? card.hp ?? 0;
    w.appendChild(t);
    root.appendChild(w);
  }

  if(isHero){
    root.appendChild(buildCurvedNameText(card.name || '', card, size));
  } else {
    const nw = nEl('div','nname-wrap');
    nw.appendChild(nImg('images/card/icon/bubble/nom.png'));
    const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
    applyNameSizing(nameEl, card, size);
    nw.appendChild(nameEl);
    root.appendChild(nw);
  }

  if(size==='big' && (!isHero || opts.forceHeroText)){
    const textEl = nEl('div','ncard-text'); textEl.textContent = card.text || '';
    root.appendChild(textEl);
  }

  if(card.subtypes && card.subtypes.length && !isHero){
    const tl = nEl('div','ntypeline'); tl.textContent = card.subtypes.join(' - ');
    root.appendChild(tl);
  }

  if(!isHero && card.rarity && NRARITY_TO_SLUG[card.rarity]){
    root.appendChild(nImg(`images/card/icon/rare/${NRARITY_TO_SLUG[card.rarity]}.png`, 'nrarity-gem'));
  }
  if(!isHero && card.isLegendary){
    root.appendChild(nImg('images/card/icon/rare/legendaire.png', 'nlegendary-gem'));
  }

  // Icônes des mots-clés "Assaut" et "Finale" (pas "Début", volontairement
  // sans icône) — uniquement sur le plateau, format small, en rangée
  // au-dessus de la gemme de rareté.
  const kw = card.keywords || [];
  if(!isHero && size==='small' && kw.includes('assault')){
    root.appendChild(nImg(CARD_FRAME_KEYWORD_ICONS.assault, 'nkeyword-icon nkeyword-assault'));
  }
  if(!isHero && size==='small' && kw.includes('final')){
    root.appendChild(nImg(CARD_FRAME_KEYWORD_ICONS.final, 'nkeyword-icon nkeyword-final'));
  }

  return root;
}
// Applique le réglage manuel de taille de police du nom fait dans l'éditeur
// (card.nameFontSize / nameFontAuto / nameWrap) — sinon la taille auto
// (fitBoxFont, plus bas) prend le relais comme avant.
function applyNameSizing(nameEl, card, size){
  if(card.nameWrap){
    nameEl.style.whiteSpace = 'normal';
    nameEl.style.height = 'auto';
    nameEl.style.overflow = 'visible';
  }
  if(card.nameFontAuto === false){
    nameEl.dataset.auto = '0';
    // la taille choisie est calibrée sur le grand format (300px) ; on
    // l'adapte proportionnellement à la vraie taille du petit format ici (120px)
    const scale = size==='small' ? (120/300) : 1;
    nameEl.style.fontSize = ((card.nameFontSize || 14) * scale) + 'px';
  } else {
    nameEl.dataset.auto = '1';
  }
}
function fitBoxFont(el, minSize){
  if(!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  const floor = minSize || 7;
  let attempts = 0;
  while(attempts < 26 && size > floor){
    const overflowH = el.scrollHeight > el.clientHeight + 1;
    const overflowW = el.scrollWidth > el.clientWidth + 1;
    if(!overflowH && !overflowW) break;
    size -= 0.5;
    el.style.fontSize = size + 'px';
    attempts++;
  }
}
function fitNewCard(rootEl){
  if(!rootEl) return;
  const nameEl = rootEl.querySelector('.nname-text') || rootEl.querySelector('.nname-curved');
  if(nameEl && nameEl.dataset.auto !== '0'){
    fitBoxFont(nameEl, 6);
  }
  fitBoxFont(rootEl.querySelector('.ncard-text'), 7);
}

// Miroir exact de getEffectiveCost côté serveur — pour que l'affichage et
// le calcul "carte jouable ou non" tiennent compte des réductions actives.
function getEffectiveCostClient(p, card){
  let cost = card.cost || 0;
  (p.activeCostReductions||[]).forEach(r=>{
    if(r.cardType && r.cardType!==card.type) return;
    if(r.subtype && !(card.subtypes||[]).includes(r.subtype)) return;
    cost -= r.amount || 0;
  });
  return Math.max(0, cost);
}

function cardEl(card, opts={}){
  const inPlay = !!opts.inPlay;
  const size = inPlay ? 'small' : 'big';
  // le coût effectif (réductions actives) n'a de sens que pour une carte pas
  // encore jouée, appartenant au joueur local (seule main visible)
  const effectiveCost = (!inPlay && !opts.isPreview && S && S[MY_KEY]) ? getEffectiveCostClient(S[MY_KEY], card) : undefined;
  const el = buildNewCardEl(card, size, effectiveCost, {liveStats: inPlay});
  if(card.instId) el.dataset.instid = card.instId;
  requestAnimationFrame(()=>fitNewCard(el));

  if(opts.attacking) el.classList.add('attacking');
  if(opts.targetable) el.classList.add('targetable');
  const isSick = inPlay && card.summonSick && !card.keywords?.includes('charge');
  if(inPlay && opts.attackSelecting) el.classList.add('attack-selecting');
  if(isSick) el.classList.add('summon-sick');

  const kw = card.keywords || [];
  const hasArmorShield = inPlay && kw.includes('armor') && !card.armorUsed;
  // Même liste que celle comparée par les animations de badges (voir activeBadgeKeywords).
  const activeKeywordIcons = inPlay ? activeBadgeKeywords(card) : [];

  if(isSick){
    const zzz = nEl('div','zzz');
    zzz.innerHTML = '<span>Z</span><span>Z</span><span>Z</span>';
    el.appendChild(zzz);
  }
  if(hasArmorShield){
    const shield = nEl('div','card-armor-shield');
    shield.title = 'Armure';
    el.appendChild(shield);
  }
  if(activeKeywordIcons.length){
    const stack = nEl('div','status-stack-tr');
    activeKeywordIcons.forEach(k=>{
      const img = nImg(`images/${KEYWORD_ICON_FILES[k]}`, 'kw-icon');
      img.title = KEYWORD_LABELS[k]||k;
      img.dataset.kw = k; // repéré par les animations de gain/perte (playKeywordBadgeChanges)
      stack.appendChild(img);
    });
    el.appendChild(stack);
  }

  // Étourdie / gelée : créature grisée + pastille avec infobulle (le
  // serveur lui refuse déjà attaque, blocage et capacités).
  if(inPlay && card.stunned){
    el.classList.add('is-stunned');
    const badge = nEl('div','card-status-badge');
    badge.textContent = '💫';
    badge.title = ('Étourdie : ' + STATUS_DURATION_TEXT + '. ' + statusDurationNote(card, opts.ownerKey, S)).trim();
    el.appendChild(badge);
  } else if(inPlay && card.frozen){
    el.classList.add('is-frozen');
    const badge = nEl('div','card-status-badge');
    badge.textContent = '❄️';
    badge.title = ('Gelée : ' + STATUS_DURATION_TEXT + '. ' + statusDurationNote(card, opts.ownerKey, S)).trim();
    el.appendChild(badge);
  }

  // Indisponible pour l'action en cours (ne peut pas attaquer / bloquer, ou
  // ne peut pas être bloquée par le bloqueur choisi) : atténuée + contour
  // en pointillés + pastille ⛔ (distinct d'étourdie/gelée/malade). Le survol
  // (aperçu) reste actif.
  if(inPlay && opts.unavailableReason){
    el.classList.add('is-unavailable');
    const ub = nEl('div','card-unavailable-badge');
    ub.textContent = '⛔';
    ub.title = opts.unavailableReason.charAt(0).toUpperCase() + opts.unavailableReason.slice(1);
    el.appendChild(ub);
  }

  // survol : aperçu toujours en grande taille, avec le texte complet
  if(!opts.isPreview) attachHoverPreview(el, card, inPlay);

  if(opts.onClick) el.onclick = opts.onClick;
  return el;
}

// Aperçu au survol (toujours n-big, même pour une créature affichée en
// n-small sur le plateau — pour pouvoir lire le texte complet). Pour un
// artefact spécifiquement : léger délai de 1,5s avant l'affichage, plutôt
// qu'immédiat comme pour les autres cartes — annulé proprement si la
// souris quitte avant que ce délai ne soit écoulé.
function attachHoverPreview(el, card, inPlay){
  let pendingTimer = null;
  el.addEventListener('mouseenter', (ev)=>{
    if(card.type==='Artefact'){
      const evCopy = { clientX: ev.clientX, clientY: ev.clientY };
      pendingTimer = setTimeout(()=>{ pendingTimer = null; showCardPreviewHover(card, evCopy, inPlay); }, 1500);
    } else {
      showCardPreviewHover(card, ev, inPlay);
    }
  });
  el.addEventListener('mousemove', moveHeroPreview);
  el.addEventListener('mouseleave', ()=>{
    if(pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; }
    hidePreview();
  });
}
let __previewHoverToken = 0;
let __lastPreviewEvent = null;
// `classified` (optionnel, créature en jeu avec carte de base connue) : lignes
// { key, status:'base'|'added'|'lost', source } de classifyKeywordsVsBase.
// Ajouté = vert + « + » et sa source ; perdu = rouge, barré, « perdu ». Les
// mentions sont du TEXTE visible : l'aperçu ne reçoit pas la souris
// (pointer-events:none), une infobulle title ne s'afficherait jamais.
function buildKeywordTooltipCol(card, inPlay, classified){
  const rows = (classified || (card.keywords || []).map(key=>({ key, status:'base', source:null })))
    .filter(r=>KEYWORD_ICON_FILES[r.key] && KEYWORD_DESCRIPTIONS[r.key]
      && (r.status==='lost' || isKeywordActiveNow(r.key, card, inPlay)));
  if(!rows.length) return null;
  const col = document.createElement('div');
  col.className = 'kw-tooltip-col';
  rows.forEach(r=>{
    const k = r.key;
    const item = document.createElement('div');
    item.className = 'kw-tooltip-item' + (r.status==='added' ? ' kw-added' : r.status==='lost' ? ' kw-lost' : '');
    const icon = document.createElement('img');
    icon.className = 'kw-tooltip-icon';
    icon.src = `images/${KEYWORD_ICON_FILES[k]}`;
    const txt = document.createElement('div');
    txt.className = 'kw-tooltip-txt';
    let tag = '';
    if(r.status==='added') tag = ` <span class="kw-tooltip-tag">+ ajouté (${escapeHtmlGS(KEYWORD_SOURCE_LABELS[r.source]||r.source)})</span>`;
    else if(r.status==='lost') tag = ' <span class="kw-tooltip-tag">perdu</span>';
    txt.innerHTML = `<strong>${escapeHtmlGS(KEYWORD_LABELS[k]||k)}</strong>${tag}<br>${escapeHtmlGS(KEYWORD_DESCRIPTIONS[k])}`;
    item.appendChild(icon);
    item.appendChild(txt);
    col.appendChild(item);
  });
  return col;
}

// Carte du catalogue correspondant à cette instance (undefined si le catalogue
// n'est pas encore chargé — chargement en arrière-plan — ou si la carte n'y est
// pas : jeton généré par un effet).
function lookupBaseCard(card){
  const base = (typeof JOURNAL_CARD_LOOKUP!=='undefined' && card && card.id) ? JOURNAL_CARD_LOOKUP[card.id] : undefined;
  return (base && base.type==='Créature') ? base : undefined;
}
// Bloc « Modifications » affiché sous la carte (voir describeCreatureModifications).
function buildPreviewModsEl(mods){
  const box = nEl('div','preview-mods');
  const kwNames = (rs)=>rs.map(r=>escapeHtmlGS(KEYWORD_LABELS[r.key]||r.key) + (r.source ? ` (${escapeHtmlGS(KEYWORD_SOURCE_LABELS[r.source]||r.source)})` : '')).join(', ');
  const lines = [`<div class="preview-mods-title">Modifications</div>`];
  if(mods.silenced) lines.push(`<div class="pm-lost">Réduite au silence : les capacités du texte sont perdues.</div>`);
  if(mods.added.length) lines.push(`<div class="pm-added">+ Mots-clés ajoutés : ${kwNames(mods.added)}</div>`);
  if(mods.lost.length) lines.push(`<div class="pm-lost">Mots-clés perdus : ${kwNames(mods.lost)}</div>`);
  mods.statLines.forEach(t=>lines.push(`<div>${escapeHtmlGS(t)}</div>`));
  if(mods.added.some(r=>r.source==='temp')) lines.push(`<div class="pm-note">Un mot-clé temporaire est retiré au début du prochain tour de son contrôleur.</div>`);
  box.innerHTML = lines.join('');
  return box;
}

// ---- Bascule « voir la base » (touche Maj maintenue, ou bouton en tactile) ----
// L'aperçu agrandi d'une créature en jeu montre ses valeurs ACTUELLES ; la
// bascule affiche la carte telle qu'elle est au catalogue (stats, mots-clés et
// texte d'origine). Le bouton n'existe que sur les appareils sans survol
// ((hover: none), voir CSS) : l'aperçu ne reçoit pas la souris sur ordinateur.
let __previewPinned = false; // aperçu « épinglé » après un appui sur le bouton (tactile)
function setPreviewBaseView(on){
  const box = document.getElementById('card-preview');
  if(box && box.classList.contains('show') && typeof box._setBaseView==='function') box._setBaseView(!!on);
}
window.addEventListener('keydown', ev=>{ if(ev.key==='Shift') setPreviewBaseView(true); });
window.addEventListener('keyup', ev=>{ if(ev.key==='Shift') setPreviewBaseView(false); });
window.addEventListener('blur', ()=>setPreviewBaseView(false));
// Aperçu épinglé : un appui en dehors de lui le referme (sinon il resterait affiché)
document.addEventListener('pointerdown', ev=>{
  if(__previewPinned && !(ev.target.closest && ev.target.closest('#card-preview'))) hidePreview(true);
}, true);

// Branche la bascule sur l'aperçu d'une créature en jeu. `parts` = { col (colonne
// carte), big, modsEl, kwCol } ; le visuel de base est construit à la demande.
function attachBaseViewToggle(box, parts, baseCard, startOnBase){
  let baseBig = null, baseKwCol = null, on = false;
  const tag = nEl('div','preview-base-tag');
  tag.textContent = 'Carte de base (catalogue)';
  tag.style.display = 'none';
  parts.col.insertBefore(tag, parts.col.firstChild);
  const hint = nEl('div','preview-base-hint');
  const btn = nEl('button','preview-base-btn');
  btn.type = 'button';
  hint.innerHTML = '<span class="pbh-key">Maintenir Maj : voir la carte de base</span>';
  hint.appendChild(btn);
  parts.col.appendChild(hint);
  const setView = (wantBase)=>{
    wantBase = !!wantBase;
    if(wantBase === on) return;
    on = wantBase;
    if(on && !baseBig){
      baseBig = buildNewCardEl(baseCard, 'big', undefined, { heroCardFrame:true }); // sans liveStats : valeurs du catalogue
      parts.col.insertBefore(baseBig, parts.big);
      baseKwCol = buildKeywordTooltipCol(baseCard, false);
      if(baseKwCol){ baseKwCol.style.display = 'none'; box.appendChild(baseKwCol); }
    }
    parts.big.style.display = on ? 'none' : '';
    if(parts.modsEl) parts.modsEl.style.display = on ? 'none' : '';
    if(parts.kwCol) parts.kwCol.style.display = on ? 'none' : '';
    if(baseBig) baseBig.style.display = on ? '' : 'none';
    if(baseKwCol) baseKwCol.style.display = on ? '' : 'none';
    tag.style.display = on ? '' : 'none';
    btn.textContent = on ? "Voir l'état actuel" : 'Voir la base';
    if(on && baseBig) requestAnimationFrame(()=>fitNewCard(baseBig)); // mesure impossible tant qu'il était masqué
    if(__lastPreviewEvent) moveHeroPreview(__lastPreviewEvent);
  };
  btn.textContent = 'Voir la base';
  // pointerdown (et non click) : il précède les événements souris qui feraient
  // refermer l'aperçu (mouseleave de la carte) avant le clic.
  btn.addEventListener('pointerdown', ev=>{
    ev.preventDefault();
    __previewPinned = true;
    setView(!on);
  });
  box._setBaseView = setView;
  if(startOnBase) setView(true);
}

function showCardPreviewHover(card, ev, inPlay){
  const box = document.getElementById('card-preview');
  const myToken = ++__previewHoverToken;
  __lastPreviewEvent = ev;
  __previewPinned = false;
  box._setBaseView = null;
  box.innerHTML = '';
  if(card.type==='Héros'){
    box.classList.add('hero-preview');
    const big = buildNewCardEl(card, 'big', undefined, {heroCardFrame:true, forceHeroText:true});
    box.appendChild(big);
    requestAnimationFrame(()=>fitNewCard(big));
    box.classList.add('show');
    moveHeroPreview(ev);
    // Cartes liées à ce héros — chargées à la demande (pas de catalogue
    // complet préchargé côté client) puis ajoutées à côté une fois prêtes.
    loadCardsLinkedToHero(card.name).then(linked=>{
      // La souris a peut-être déjà quitté, ou survolé autre chose entre-
      // temps : on ignore ce résultat périmé plutôt que de l'ajouter au
      // mauvais aperçu.
      if(myToken !== __previewHoverToken) return;
      if(!linked.length) return;
      const col = document.createElement('div');
      col.className = 'hero-preview-linked';
      const title = document.createElement('div');
      title.className = 'hero-preview-linked-title';
      title.textContent = 'Cartes liées';
      col.appendChild(title);
      linked.forEach(lc=>{
        const item = document.createElement('div');
        item.className = 'hero-preview-linked-item';
        item.textContent = lc.name || '';
        col.appendChild(item);
      });
      box.appendChild(col);
      // La boîte vient de s'élargir — on recalcule sa position pour ne pas
      // déborder de l'écran (le premier calcul ne connaissait pas encore
      // la largeur finale, les cartes liées arrivant après coup).
      if(__lastPreviewEvent) moveHeroPreview(__lastPreviewEvent);
    }).catch(()=>{});
  } else if(inPlay && card.type==='Créature'){
    // Créature EN JEU (et seulement elle) : valeurs actuelles, écarts avec la
    // carte de base en couleur, bloc « Modifications », bascule « voir la base ».
    // Main, marché, deckbuilder, artefacts : chemin inchangé ci-dessous.
    box.classList.remove('hero-preview');
    const baseCard = lookupBaseCard(card);
    const mods = describeCreatureModifications(card, baseCard, S && S.turn);
    const col = nEl('div','preview-card-col');
    const big = buildNewCardEl(card, 'big', undefined, {heroCardFrame:true, liveStats:true});
    if(mods.silenced){
      // Le texte affiché est celui du catalogue (jamais modifié) : on l'atténue
      // et on l'estampille pour ne pas laisser croire que ces capacités agissent encore.
      big.classList.add('n-text-lost');
      const stamp = nEl('div','n-text-lost-stamp');
      stamp.innerHTML = '<span>Capacités perdues</span>';
      big.appendChild(stamp);
    }
    col.appendChild(big);
    const modsEl = mods.hasChanges ? buildPreviewModsEl(mods) : null;
    if(modsEl) col.appendChild(modsEl);
    box.appendChild(col);
    requestAnimationFrame(()=>fitNewCard(big));
    const kwCol = buildKeywordTooltipCol(card, true, mods.rows);
    if(kwCol) box.appendChild(kwCol);
    if(baseCard) attachBaseViewToggle(box, { col, big, modsEl, kwCol }, baseCard, !!(ev && ev.shiftKey));
    box.classList.add('show');
    moveHeroPreview(ev);
  } else {
    box.classList.remove('hero-preview');
    const big = buildNewCardEl(card, 'big', undefined, {heroCardFrame:true, liveStats: !!inPlay});
    box.appendChild(big);
    requestAnimationFrame(()=>fitNewCard(big));
    // Bulles contextuelles : une par mot-clé actuellement actif sur la
    // créature, affichées à côté de l'aperçu agrandi.
    const kwCol = buildKeywordTooltipCol(card, inPlay);
    if(kwCol) box.appendChild(kwCol);
    box.classList.add('show');
    moveHeroPreview(ev);
  }
}

function render(){
  if(!S) return;
  // Plateau gelé pendant une animation de combat : on note qu'il faudra
  // re-rendre (fait par unfreezeBoardRender à la fin de la file).
  if(__boardRenderFrozen){ __boardRenderDirty = true; return; }
  const keywordBadgePlan = planKeywordBadgeAnim(); // avant la reconstruction du DOM
  renderManaBox(MY_KEY, 'p1');
  renderManaBox(OPP_KEY, 'p2');
  renderHeroFrame(MY_KEY, 'p1');
  renderHeroFrame(OPP_KEY, 'p2');
  renderDeckZone(MY_KEY, 'p1');
  renderDeckZone(OPP_KEY, 'p2');
  renderLane(MY_KEY, 'p1');
  renderLane(OPP_KEY, 'p2');
  renderArtifactStack(MY_KEY, 'p1');
  renderArtifactStack(OPP_KEY, 'p2');
  renderHand();
  renderRevealHandToggle();
  renderEnemyHand();
  renderPhaseBar();
  renderGameOverOverlay();
  renderDiscoverChoiceModal();
  renderKeywordChoiceModal();
  syncTargetingArrow();
  playKeywordBadgeChanges(keywordBadgePlan); // après : les classes se posent sur le nouveau DOM
  // renderTurnTimer(); — minuteur désactivé pour l'instant (voir afterConnected)
}

// Démarre/arrête la flèche de ciblage visuelle selon l'état actuel — appelé
// à chaque rendu, une fois le DOM reconstruit (pour pouvoir localiser
// l'élément source).
function syncTargetingArrow(){
  let sourceEl = null;
  if(UI.pendingNewTarget){
    const extra = UI.pendingNewTarget.extra || {};
    if(UI.pendingNewTarget.kind==='card' && extra.index!==undefined){
      const slots = document.querySelectorAll('.hand-card-slot');
      sourceEl = slots[extra.index] || null;
    } else if(UI.pendingNewTarget.kind==='hero'){
      sourceEl = document.getElementById('hero-frame-p1');
    } else if(UI.pendingNewTarget.kind==='permanent' && extra.permanentInstId){
      sourceEl = document.querySelector(`[data-instid="${extra.permanentInstId}"]`);
    }
  } else if(UI.pendingCard && UI.pendingCard.index!==undefined){
    const slots = document.querySelectorAll('.hand-card-slot');
    sourceEl = slots[UI.pendingCard.index] || null;
  }
  if(sourceEl) beginTargeting(sourceEl);
  else endTargeting();
}

// Le plateau a une hauteur "naturelle" fixe (calculée pour être lisible),
// mais on la réduit (jamais on ne l'agrandit) pour qu'elle tienne toujours
// entièrement dans la fenêtre — jamais de barre de défilement.
// fitBoardToViewport() a été retirée : elle appliquait un DEUXIÈME
// rétrécissement (jusqu'à moitié plus petit) par-dessus la mise à l'échelle
// globale du plateau (updateBoardScale, cadre 1920×1080 → fenêtre réelle)
// dès que le contenu semblait dépasser la hauteur disponible. Depuis la
// refonte visuelle (lanes/cartes/portraits agrandis), ce cas se déclenchait
// quasi systématiquement, ce qui rendait tout minuscule même sur grand
// écran. #board-scroll-area a déjà overflow-y:auto (scrollbar masquée mais
// fonctionnelle) : le débordement, s'il y en a, se gère par un défilement
// normal plutôt que par un rétrécissement silencieux de tout le plateau.

let __gameOverSfxPlayed = false; // évite de relancer le jingle à chaque re-rendu tant que l'écran de fin reste affiché
function renderGameOverOverlay(){
  const overlay = document.getElementById('overlay');
  if(!S.gameOver){ overlay.classList.remove('show'); return; }
  document.getElementById('overlay-text').textContent = S.winnerKey===MY_KEY ? 'Victoire !' : 'Défaite...';
  // Musique de fin de partie (victoire/défaite) — jouée une seule fois, coupe
  // la musique de combat en cours. Comme c'est un simple objet Audio() non
  // rattaché au système de reprise entre pages, elle s'arrête automatiquement
  // si le joueur quitte la partie (navigation complète vers une autre page)
  // avant la fin du morceau — pas de code supplémentaire nécessaire pour ça.
  if(!__gameOverSfxPlayed){
    __gameOverSfxPlayed = true;
    playFinalSfx(S.winnerKey===MY_KEY ? 'victory' : 'defeat');
  }

  const summaryEl = document.getElementById('overlay-summary');
  const sm = S.matchSummary;
  if(!sm){ summaryEl.innerHTML = ''; overlay.classList.add('show'); return; }

  const mine = sm[MY_KEY] || {};
  const theirs = sm[OPP_KEY] || {};
  const durationLabel = (ms)=>{
    const totalSec = Math.floor((ms||0)/1000);
    const m = Math.floor(totalSec/60), s = totalSec%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  };
  const row = (label, mineVal, theirsVal)=>`<tr><td>${label}</td><td>${mineVal}</td><td>${theirsVal}</td></tr>`;

  summaryEl.innerHTML = `
    <table>
      <thead><tr><th></th><th>Vous</th><th>Adversaire</th></tr></thead>
      <tbody>
        <tr><td colspan="3" style="text-align:center;color:var(--parchment-dim);font-size:12px;padding-bottom:8px;">Durée de la partie : ${durationLabel(sm.durationMs)}</td></tr>
        ${row('Tours joués', mine.turnsPlayed||0, theirs.turnsPlayed||0)}
        ${row('Dégâts infligés', mine.damageDealt||0, theirs.damageDealt||0)}
        <tr class="summary-sep">${row('Cartes jouées (total)', mine.cardsPlayed?.total||0, theirs.cardsPlayed?.total||0)}</tr>
        ${row('— Créatures', mine.cardsPlayed?.['Créature']||0, theirs.cardsPlayed?.['Créature']||0)}
        ${row('— Sortilèges', mine.cardsPlayed?.['Sortilège']||0, theirs.cardsPlayed?.['Sortilège']||0)}
        ${row('— Artefacts', mine.cardsPlayed?.['Artefact']||0, theirs.cardsPlayed?.['Artefact']||0)}
        ${row('— Pièges', mine.cardsPlayed?.['Piège']||0, theirs.cardsPlayed?.['Piège']||0)}

// key = camp réel côté serveur (p1/p2) ; slot = 'p1' (moi) ou 'p2' (adversaire)
// — boîte de mana dédiée : illustration de région en fond, empilement des
// pastilles de mana vers le haut à mesure qu'on en gagne.
function renderManaBox(key, slot){
  const p = S[key];
  const el = document.getElementById(`mana-box-${slot}`);
  const region = p.region || {};
  const regionThumbStyle = region.image ? `background-image:url('${region.image.replace(/'/g,"")}');background-position:${region.imagePosX??50}% ${region.imagePosY??50}%;background-size:${(region.imageZoom??100)>100?region.imageZoom+'%':'cover'};` : '';
  // Le compteur numérique (juste en dessous) est la vraie valeur, sans
  // limite. L'affichage en points, lui, remplit une colonne de 10 puis en
  // ouvre une nouvelle à côté (voir .mana-box-fill en CSS, flex-wrap). Le
  // mana normal est plafonné à 20 par le moteur (vraie limite du jeu, donc
  // 2 colonnes suffisent toujours) — le mana fragile, lui, peut dépasser
  // cette limite, donc pas de plafond ici : autant de colonnes que
  // nécessaire s'ouvrent au fil de l'eau.
  const DOTS_PER_COLUMN = 10;
  const MAX_VISIBLE_DOTS = DOTS_PER_COLUMN * 2;
  const normalDots = Array.from({length:Math.min(p.manaNormalMax, MAX_VISIBLE_DOTS)}, (_,i)=>{
    const filled = i<p.manaNormal;
    return `<span class="mana-box-dot ${filled?'filled':''}"></span>`;
  }).join('');
  const bonusCount = Math.max(0, Math.min(p.manaNormal, MAX_VISIBLE_DOTS) - Math.min(p.manaNormalMax, MAX_VISIBLE_DOTS));
  const bonusDots = Array.from({length:bonusCount}, ()=>`<span class="mana-box-dot bonus"></span>`).join('');
  const fragileDots = Array.from({length:p.manaFragile}, ()=>`<span class="mana-box-dot fragile"></span>`).join('');
  el.title = region.name || 'Région';
  el.innerHTML = `
    <div class="mana-box-region-thumb" style="${regionThumbStyle}"></div>
    <div class="mana-box-count">${p.manaNormal + p.manaFragile}/${p.manaNormalMax}</div>
    <div class="mana-box-fill">${normalDots}${bonusDots}${fragileDots}</div>
  `;
  if(region.name){
    const thumbEl = el.querySelector('.mana-box-region-thumb');
    thumbEl.style.cursor = 'pointer';
    attachHoverPreview(thumbEl, region);
  }
}

// Cadre du héros : le portrait lui-même sert de bouton d'activation quand
// le héros a un pouvoir activable. Survoler affiche son aperçu complet.
function renderHeroFrame(key, slot){
  const p = S[key];
  const el = document.getElementById(`hero-frame-${slot}`);
  const hero = p.hero || {};
  const heroName = hero.name || (slot==='p1' ? 'Moi' : 'Adversaire');
  const heroPortraitStyle = hero.image ? `background-image:url('${hero.image.replace(/'/g,"")}');background-position:${hero.imagePosX??50}% ${hero.imagePosY??50}%;background-size:${(hero.imageZoom??100)>100?hero.imageZoom+'%':'cover'};` : '';
  const hasNewFormatPower = !!(hero.abilities && hero.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated')));
  const canActivate = slot==='p1' && S.active===MY_KEY && S.phase==='main' && (!!hero.activeEffect || hasNewFormatPower);
  const isPendingTarget = isValidPendingHeroTarget(key) || isValidNewFormatHeroTarget(key);
  const clickable = canActivate || isPendingTarget;

  el.innerHTML = `
    <button class="hero-portrait-big ${canActivate?'can-activate':''} ${isPendingTarget?'targetable':''}" id="hero-portrait-${slot}" style="${heroPortraitStyle}" ${clickable?'':'disabled'}>
      ${hero.image ? '' : (heroName[0]||'?')}
      <span class="hp-badge-big">${p.hp}</span>
    </button>
  `;
  const btn = el.querySelector('.hero-portrait-big');
  btn.onmouseenter = (ev)=>showHeroPreview(hero, ev);
  btn.onmousemove = moveHeroPreview;
  btn.onmouseleave = hidePreview;
  if(UI.pendingNewTarget && isValidNewFormatHeroTarget(key)){
    btn.onclick = ()=>pickNewFormatTarget(`hero:${key}`);
  } else if(isPendingTarget){
    btn.onclick = ()=>{
      confirmPendingTarget({ isHeroTarget:true, playerKey:key });
    };
  } else if(canActivate){
    btn.onclick = uiActivateHeroPower;
  }
}

async function uiActivateHeroPower(targetInfo, chosenTargets){
  if(!targetInfo && !chosenTargets){
    const hero = S[MY_KEY].hero;
    const chosen = findNewFormatChosenTarget(hero, 'activated');
    if(chosen){
      UI.pendingNewTarget = { kind:'hero', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: {} };
      render();
      return;
    }
    const eff = hero && hero.activeEffect;
    if(eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger'){
      UI.pendingPower = { kind:'hero', effect: eff };
      render();
      return;
    }
  }
  LAST_SACRIFICEABLE_ACTION = { action:'useHeroPower', targetInfo, chosenTargets };
  await runAction('Pouvoir de héros', ()=>gsUseHeroPower(targetInfo, chosenTargets));
}
async function uiActivatePermanent(permanentType, permanentInstId, targetInfo, chosenTargets){
  if(!targetInfo && !chosenTargets){
    let permanent = null;
    const p = S[MY_KEY];
    if(permanentType==='creature') permanent = p.board.find(c=>c.instId===permanentInstId);
    else if(permanentType==='artifact') permanent = p.relics.find(r=>r.instId===permanentInstId);
    else if(permanentType==='region') permanent = p.region;
    const chosen = permanent ? findNewFormatChosenTarget(permanent, 'activated') : null;
    if(chosen){
      UI.pendingNewTarget = { kind:'permanent', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: { permanentType, permanentInstId } };
      render();
      return;
    }
    const eff = permanent && permanent.triggeredEffects && permanent.triggeredEffects.activated;
    if(eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger'){
      UI.pendingPower = { kind:'permanent', effect: eff, permanentType, permanentInstId };
      render();
      return;
    }
  }
  LAST_SACRIFICEABLE_ACTION = { action:'activatePermanent', permanentType, permanentInstId, targetInfo, chosenTargets };
  const res = await runAction('Capacité activée', ()=>gsActivatePermanent(permanentType, permanentInstId, targetInfo, chosenTargets));
  if(permanentType==='artifact' && res && !res.error){
    // Le nouveau rendu (qui grise l'artefact désormais utilisé) vient de
    // reconstruire l'élément — on attend une frame pour cibler le NOUVEL
    // élément avant de lancer le flash, sinon on animerait un nœud déjà
    // remplacé et donc invisible.
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-instid="${permanentInstId}"]`);
      if(el){
        el.classList.add('artifact-activate-flash');
        el.addEventListener('animationend', ()=>el.classList.remove('artifact-activate-flash'), {once:true});
      }
    });
  }
}

function renderArtifactStack(key, slot){
  const el = document.getElementById(`artifacts-${slot}`);
  el.innerHTML = '';
  const p = S[key];
  const relics = p.relics || [];
  for(let i=0; i<2; i++){
    const wrap = document.createElement('div');
    wrap.className = 'relic-slot';
    if(relics[i]){
      const r = relics[i];
      // Un artefact peut être la cible en attente d'un sort/capacité en
      // cours de ciblage (ex : "Passage du temps", "détruisez un artefact
      // ennemi de votre choix") — ce cas manquait entièrement ici jusque-là :
      // isValidNewFormatTarget/pickNewFormatTarget n'étaient câblés que sur
      // les créatures (voir renderLane), jamais sur les artefacts. La cible
      // se mettait bien en attente côté client, mais il n'existait aucun
      // moyen de cliquer sur l'artefact visé pour la confirmer — le
      // ciblage restait bloqué indéfiniment, sans erreur visible.
      const isTargetable = UI.pendingNewTarget && isValidNewFormatTarget(key, r);
      const cardElNode = cardEl(r, {inPlay:true, targetable: isTargetable});
      wrap.appendChild(cardElNode);
      if(isTargetable){
        cardElNode.style.cursor = 'pointer';
        cardElNode.onclick = ()=>pickNewFormatTarget(r.instId);
      } else if(slot==='p1' && S.active===MY_KEY && S.phase==='main' && !UI.selectingAttackers){
