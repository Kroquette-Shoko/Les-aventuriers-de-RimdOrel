function renderArtifactStack(key, slot){
  const el = document.getElementById(`artifacts-${slot}`);
  el.innerHTML = '';
  const p = S[key];
  const relics = p.relics || [];
  for(let i=0; i<2; i++){
    const wrap = document.createElement('div');
    wrap.className = 'relic-slot';
    if(relics[i]){
      const r = relics[i];
      const cardElNode = cardEl(r, {inPlay:true});
      wrap.appendChild(cardElNode);
      if(slot==='p1' && S.active===MY_KEY && S.phase==='main' && !UI.selectingAttackers){
        // Nouveau format (card.abilities) — celui que l'éditeur actuel
        // produit. L'ancien format (triggeredEffects.activated) reste
        // vérifié en repli pour les cartes plus anciennes.
        const hasNewActivated = r.abilities && r.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated'));
        const hasOldActivated = r.triggeredEffects && r.triggeredEffects.activated;
        // Les artefacts sont désormais toujours gratuits et limités à une
        // fois par tour (voir _activatedThisTurn côté serveur) — plus de
        // cooldown à vérifier pour ce type de carte précis.
        const alreadyUsed = !!r._activatedThisTurn;
        if((hasNewActivated || hasOldActivated) && !alreadyUsed){
          cardElNode.style.cursor = 'pointer';
          cardElNode.onclick = ()=>uiActivatePermanent('artifact', r.instId);
        } else if((hasNewActivated || hasOldActivated) && alreadyUsed){
          cardElNode.classList.add('artifact-used-this-turn');
        }
      }
    } else {
      wrap.classList.add('relic-slot-empty');
      if(slot==='p1') wrap.dataset.artifactSlot = 'true';
    }
    el.appendChild(wrap);
  }
}

// key = camp réel serveur, slot = 'p1'/'p2' pour l'affichage (moi en bas, adversaire en haut)
function renderLane(key, slot){
  const el = document.getElementById(`lane-${slot}`);
  el.innerHTML = '';
  const p = S[key];
  (p.board||[]).slice(0,8).forEach(c=>{
    const isMine = key===MY_KEY;
    const attackSelecting = isMine && UI.selectingAttackers && UI.selectedAttackers.includes(c.instId);
    const attackConfirmed = (p.attackers||[]).includes(c.instId) && S.phase!=='main';
    const attacking = attackSelecting || attackConfirmed;
    const isPendingSacrificeTarget = !!(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY && key===MY_KEY);
    const targetable = isBlockTargetable(key, c) || isValidPendingTarget(key, c) || isValidNewFormatTarget(key, c) || isPendingSacrificeTarget;

    const cardWrap = document.createElement('div');
    cardWrap.className = 'card-slot';
    cardWrap.style.position = 'relative';
    cardWrap.dataset.instId = c.instId;
    const el2 = cardEl(c, { attacking, attackSelecting, targetable, inPlay:true, onClick: ()=>onBoardCreatureClick(key, c) });
    cardWrap.appendChild(el2);

    if(isMine && c.hasBlockedThisTurn){
      el2.style.opacity = '.5';
      const tag = document.createElement('div');
      tag.style.cssText = 'position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:12px;z-index:5;';
      tag.textContent = '🛡';
      cardWrap.appendChild(tag);
    }
    if(!isMine && c.hasBeenBlocked && S.phase==='declareBlockersMe'){
      const tag = document.createElement('div');
      tag.style.cssText = 'position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:12px;z-index:5;';
      tag.textContent = '🔒';
      cardWrap.appendChild(tag);
    }
    if(c.instId===UI.pendingBlocker){
      el2.style.outline = '3px solid var(--gold)';
    }
    el.appendChild(cardWrap);
  });
}

// Une créature adverse est-elle cliquable en ce moment pour lui assigner
// mon bloqueur déjà sélectionné (elle doit être parmi les attaquants) ?
function isBlockTargetable(key, c){
  if(!UI.pendingBlocker) return false;
  if(key!==OPP_KEY) return false;
  if(S.phase!=='declareBlockersMe' || S.active!==OPP_KEY) return false;
  return (S[OPP_KEY].attackers||[]).includes(c.instId);
}

const TARGETED_EFFECTS = ['damage','heal','stun','freeze','bounce','destroy','silence','weaken','buff','grantKeyword','keywordChoice'];
function cardPlayEffectClient(card){
  if(card.type==='Sortilège') return card.effect;
  if(card.type==='Créature') return card.onPlayEffect;
  if(card.type==='Artefact') return card.triggeredEffects && card.triggeredEffects.onPlay;
  return null;
}
function needsTargetClient(card){
  const eff = cardPlayEffectClient(card);
  return !!eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger';
}
// ---------------- Ciblage manuel : nouveau format (card.abilities) ----------------
// Cherche, pour une carte/permanent donné et un nom de déclencheur donné,
// la première capacité + cible nécessitant un choix manuel du joueur
// (selectionMode==='chosen'). Une seule cible "chosen" gérée à la fois pour
// ce lot — si une carte en a plusieurs, seule la première est proposée.
function findNewFormatChosenTarget(source, triggerName){
  if(!source || !source.abilities) return null;
  for(const ab of source.abilities){
    if(ab.kind!=='triggered') continue;
    if(triggerName && !(ab.triggers||[]).some(te=>te.trigger===triggerName)) continue;
    for(const tgt of (ab.targets||[])){
      if(tgt.selectionMode==='chosen' && tgt.targetOwner!=='self' && tgt.targetOwner!=='trigger'){
        return { ability: ab, target: tgt };
      }
    }
  }
  return null;
}
function newFormatTargetCount(tgt){
  if(tgt.countMode==='dynamic') return 1; // valeur dynamique : on ne peut pas la calculer côté client, on demande au moins 1
  return tgt.countFixed || 1;
}
// Une créature/carte est-elle un choix valide pour la cible du nouveau
// format actuellement en attente ? Miroir des filtres côté serveur.
function isValidNewFormatTarget(key, c){
  if(!UI.pendingNewTarget) return false;
  const tgt = UI.pendingNewTarget.target;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  if(!allowed.includes(key)) return false;
  if(tgt.targetCategory!=='creature' && tgt.targetCategory!=='hero_creature' && tgt.targetCategory!=='artifact') return false;
  if(tgt.subtypeFilter && !(c.subtypes||[]).some(s=>s.toLowerCase()===tgt.subtypeFilter.toLowerCase())) return false;
  if(tgt.statFilterEnabled){
    const stat = tgt.statFilterStat==='atk' ? c.curAtk : c.curHp;
    if(tgt.statFilterMode==='atLeast' && !(stat>=tgt.statFilterValue)) return false;
    if(tgt.statFilterMode==='atMost' && !(stat<=tgt.statFilterValue)) return false;
    if(tgt.statFilterMode==='exactly' && stat!==tgt.statFilterValue) return false;
  }
  if(UI.pendingNewTarget.selectedInstIds.includes(c.instId)) return false; // déjà choisie
  return true;
}
function isValidNewFormatHeroTarget(key){
  if(!UI.pendingNewTarget) return false;
  const tgt = UI.pendingNewTarget.target;
  if(tgt.targetCategory!=='player' && tgt.targetCategory!=='hero' && tgt.targetCategory!=='hero_creature') return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  if(!allowed.includes(key)) return false;
  const marker = `hero:${key}`;
  return !UI.pendingNewTarget.selectedInstIds.includes(marker);
}
// Ajoute une cible choisie ; si le nombre requis est atteint, lance l'action
// correspondante (carte jouée, pouvoir, capacité activée).
function pickNewFormatTarget(marker){
  const pn = UI.pendingNewTarget;
  pn.selectedInstIds.push(marker);
  const needed = newFormatTargetCount(pn.target);
  if(pn.selectedInstIds.length < needed){ render(); return; }
  const chosenTargets = { [pn.target.id]: pn.selectedInstIds };
  const kind = pn.kind;
  const extra = pn.extra;
  UI.pendingNewTarget = null;
  if(kind==='card') uiPlayCard(extra.index, null, chosenTargets);
  else if(kind==='hero') uiActivateHeroPower(null, chosenTargets);
  else if(kind==='permanent') uiActivatePermanent(extra.permanentType, extra.permanentInstId, null, chosenTargets);
}
function cancelPendingNewTarget(){
  UI.pendingNewTarget = null;
  render();
}

function pendingEffectClient(){
  if(UI.pendingCard) return cardPlayEffectClient(UI.pendingCard.card);
  if(UI.pendingPower) return UI.pendingPower.effect;
  return null;
}
function isValidPendingTarget(key, c){
  const eff = pendingEffectClient();
  if(!eff) return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = eff.targetOwner==='ally' ? [MY_KEY] : eff.targetOwner==='any' ? [MY_KEY, oppKey] : [oppKey];
  if(!allowed.includes(key)) return false;
  if(c.keywords?.includes('stealth') && c.summonSick) return false;
  return true;
}
function isValidPendingHeroTarget(key){
  const eff = pendingEffectClient();
  if(!eff || (eff.type!=='damage' && eff.type!=='heal')) return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = eff.targetOwner==='ally' ? [MY_KEY] : eff.targetOwner==='any' ? [MY_KEY, oppKey] : [oppKey];
  return allowed.includes(key);
}
// Confirme la cible choisie pour l'action actuellement en attente (carte,
// pouvoir de héros ou capacité activée) et envoie l'action correspondante.
function confirmPendingTarget(targetInfo){
  if(UI.pendingCard){
    const idx = UI.pendingCard.index;
    UI.pendingCard = null;
    uiPlayCard(idx, targetInfo);
  } else if(UI.pendingPower){
    const pw = UI.pendingPower;
    UI.pendingPower = null;
    if(pw.kind==='hero') uiActivateHeroPower(targetInfo);
    else uiActivatePermanent(pw.permanentType, pw.permanentInstId, targetInfo);
  }
}
function cancelPendingCard(){
  UI.pendingCard = null;
  UI.pendingPower = null;
  render();
}

// Relance l'action d'origine (poser un piège, pouvoir de héros, capacité
// activée) en fournissant cette fois la créature à sacrifier choisie par
// le joueur, pour compléter le coût additionnel resté en attente.
async function resolvePendingSacrifice(instId){
  const pending = S.pendingSacrifice;
  if(!pending) return;
  if(pending.action==='setTrap'){
    await runAction('Poser le piège', ()=>gsSetTrap(pending.handIndex, instId));
  } else if(pending.action==='useHeroPower'){
    const targetInfo = pending.targetIsHero ? { isHeroTarget:true, playerKey:pending.targetPlayerKey } : (pending.targetInstId ? { instId:pending.targetInstId } : null);
    await runAction('Pouvoir de héros', ()=>gsUseHeroPower(targetInfo, pending.chosenTargets, instId));
  } else if(pending.action==='activatePermanent'){
    const targetInfo = pending.targetIsHero ? { isHeroTarget:true, playerKey:pending.targetPlayerKey } : (pending.targetInstId ? { instId:pending.targetInstId } : null);
    await runAction('Capacité activée', ()=>gsActivatePermanent(pending.permanentType, pending.permanentInstId, targetInfo, pending.chosenTargets, instId));
  }
}

function onBoardCreatureClick(key, c){
  const isMine = key===MY_KEY;
  // confirmation d'un sacrifice en attente (priorité absolue — bloque tout le reste côté serveur)
  if(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY && isMine){
    resolvePendingSacrifice(c.instId);
    return;
  }
  // confirmation de ciblage nouveau format (priorité absolue)
  if(UI.pendingNewTarget && isValidNewFormatTarget(key, c)){
    pickNewFormatTarget(c.instId);
    return;
  }
  // confirmation de ciblage pour une carte/pouvoir/capacité en attente (priorité sur tout le reste)
  if((UI.pendingCard || UI.pendingPower) && isValidPendingTarget(key, c)){
    confirmPendingTarget({ instId: c.instId });
    return;
  }
  // sélection des attaquants (mon tour, phase principale)
  if(isMine && UI.selectingAttackers){
    const idx = UI.selectedAttackers.indexOf(c.instId);
    if(idx>=0) UI.selectedAttackers.splice(idx,1); else UI.selectedAttackers.push(c.instId);
    render();
    return;
  }
  // choix du bloqueur (l'adversaire m'attaque)
  if(isMine && S.phase==='declareBlockersMe' && S.active===OPP_KEY && !c.hasBlockedThisTurn && !c.keywords?.includes('fearful')){
    UI.pendingBlocker = c.instId;
    render();
    return;
  }
  // assignation du blocage sur un attaquant adverse
  if(!isMine && isBlockTargetable(key, c)){
    uiAssignBlock(c.instId);
    return;
  }
  // activation d'une créature ayant une capacité activée (mon tour, phase principale)
  if(isMine && S.active===MY_KEY && S.phase==='main' && !UI.selectingAttackers){
    const hasNewActivated = c.abilities && c.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated'));
    const hasOldActivated = c.triggeredEffects && c.triggeredEffects.activated;
    if((hasNewActivated || hasOldActivated) && (c._activationCooldownRemaining||0)<=0){
      uiActivatePermanent('creature', c.instId);
    }
  }
}

function renderHand(){
  const el = document.getElementById('hand-p1');
  el.innerHTML = '';
  const p = S[MY_KEY];
  const myTurn = S.active===MY_KEY;
  const hand = p.hand||[];
  // anime les cartes nouvellement arrivées en main depuis le dernier rendu
  // (mulligan, pioche normale, etc.) — repose sur le fait que les nouvelles
  // cartes sont toujours ajoutées à la fin côté serveur.
  const newCount = (PREV_HAND_LENGTH!==null && hand.length>PREV_HAND_LENGTH) ? (hand.length-PREV_HAND_LENGTH) : 0;
  PREV_HAND_LENGTH = hand.length;
  if(newCount>0) playSfx('draw');
  hand.forEach((card, i)=>{

    slot.appendChild(el2);

      badge.textContent = card.activeTrap ? 'Armé' : 'En attente...';
      el2.appendChild(badge);
    }
    el2.addEventListener('mouseenter', (ev)=>{ revealHand(); showHeroPreview(card, ev); });
    el2.addEventListener('mousemove', moveHeroPreview);
    el2.addEventListener('mouseleave', ()=>{ scheduleHideHand(); hidePreview(); });
    if(canPlay){
      el2.style.cursor = 'grab';
      el2.style.touchAction = 'none';
      el2.addEventListener('pointerdown', (ev)=>startCardDrag(ev, i, el2));
    }
    el.appendChild(slot);
  });

// La main entière glisse hors de l'écran, ne laissant dépasser qu'un tiers
// du haut des cartes — survoler une carte la fait toutes remonter. La zone
// elle-même reste "pointer-events:none" (chaque carte gère son propre survol)
// pour ne jamais bloquer les clics sur ce qu'il y a derrière (héros, défausse...).
let HAND_HIDE_TIMER = null;
function revealHand(){
  if(HAND_HIDE_TIMER){ clearTimeout(HAND_HIDE_TIMER); HAND_HIDE_TIMER = null; }
  document.getElementById('hand-p1').style.transform = 'translateY(0)';
}
function scheduleHideHand(){
  if(HAND_HIDE_TIMER) clearTimeout(HAND_HIDE_TIMER);
  HAND_HIDE_TIMER = setTimeout(()=>{
    if(!DRAG_STATE) document.getElementById('hand-p1').style.transform = '';
  }, 120);

// ---------------- Glisser-déposer "fait maison" (événements de pointeur) ----------------
// Remplace le drag-and-drop HTML5 natif, trop capricieux selon les
// navigateurs — ici on suit nous-mêmes le curseur/doigt avec un clone visuel.
let DRAG_STATE = null;

/* ============================================================
   CIBLAGE VISUEL — ligne fléchée qui suit la souris (portée depuis
   l'ancien prototype)
   ============================================================ */
let targetSource = null;
let targetMouse = null;

function elCenter(el){
  const r = el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}
function beginTargeting(el){
  if(!el) return;
  hidePreview();
  targetSource = elCenter(el);
  targetMouse = {...targetSource};
  document.body.classList.add('targeting');
  drawTargetLine();
}
function endTargeting(){
  targetSource = null; targetMouse = null;
  document.body.classList.remove('targeting');
  document.getElementById('target-line').style.display='none';
  document.getElementById('target-origin').style.display='none';
  document.getElementById('target-arrow').style.display='none';
}
function drawTargetLine(){
  if(!targetSource || !targetMouse) return;
  const {x:x1,y:y1} = targetSource;
  const {x:x2,y:y2} = targetMouse;
  const line = document.getElementById('target-line');
  const origin = document.getElementById('target-origin');
  const arrow = document.getElementById('target-arrow');
  const angle = Math.atan2(y2-y1, x2-x1);
  const shorten = 14;
  const ex = x2 - Math.cos(angle)*shorten, ey = y2 - Math.sin(angle)*shorten;
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', ex); line.setAttribute('y2', ey);
  line.style.display='block';
  origin.setAttribute('cx', x1); origin.setAttribute('cy', y1);
  origin.style.display='block';
  const backX = x2 - Math.cos(angle)*16, backY = y2 - Math.sin(angle)*16;
  const perpX = Math.cos(angle+Math.PI/2)*7, perpY = Math.sin(angle+Math.PI/2)*7;
  arrow.setAttribute('points', `${x2},${y2} ${backX+perpX},${backY+perpY} ${backX-perpX},${backY-perpY}`);
  arrow.style.display='block';
}
document.addEventListener('mousemove', (e)=>{
  if(!targetSource) return;
  targetMouse = {x:e.clientX, y:e.clientY};
  drawTargetLine();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    if(UI.pendingNewTarget){ cancelPendingNewTarget(); }
    else if(UI.pendingCard){ cancelPendingCard(); }
  }
});

/* ============================================================
   FLÈCHES DE BLOCAGE — affichent les assignations bloqueur → attaquant
   ============================================================ */
function drawBlockArrows(){
  const svg = document.getElementById('block-arrows-layer');
  if(!svg || !S) return;
  svg.innerHTML = '';
  ['p1','p2'].forEach(defKey=>{
    const defP = S[defKey];
    if(!defP) return;
    (defP.board||[]).forEach(blocker=>{
      if(!blocker.hasBlockedThisTurn) return;
      // le serveur ne garde pas de table blocage->attaquant après coup
      // (résolu immédiatement) — on ne dessine donc que pendant la phase
      // de blocage en cours, via UI.pendingBlockAssignments (rempli côté client)
    });
  });
  (UI.pendingBlockAssignments||[]).forEach(({attackerInstId, blockerInstId})=>{
    const attWrap = document.querySelector(`[data-instid="${attackerInstId}"]`);
    const blkWrap = document.querySelector(`[data-instid="${blockerInstId}"]`);
    if(!attWrap || !blkWrap) return;
    const a = attWrap.getBoundingClientRect();
    const b = blkWrap.getBoundingClientRect();
    const x1 = b.left + b.width/2, y1 = b.top + b.height/2;
    const x2 = a.left + a.width/2, y2 = a.top + a.height/2;
    const angle = Math.atan2(y2-y1, x2-x1);
    const shorten = 44;
    const ex = x2 - Math.cos(angle)*shorten, ey = y2 - Math.sin(angle)*shorten;

    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', ex); line.setAttribute('y2', ey);
    line.setAttribute('class', 'block-arrow-line');
    svg.appendChild(line);

    const backX = x2 - Math.cos(angle)*20, backY = y2 - Math.sin(angle)*20;
    const perpX = Math.cos(angle+Math.PI/2)*8, perpY = Math.sin(angle+Math.PI/2)*8;
    const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    arrow.setAttribute('points', `${ex+Math.cos(angle)*20},${ey+Math.sin(angle)*20} ${backX+perpX},${backY+perpY} ${backX-perpX},${backY-perpY}`);
    arrow.setAttribute('class', 'block-arrow-head');
    svg.appendChild(arrow);
  });
}

/* ============================================================
   ANIMATION DE FRAPPE — les cartes qui se ruent l'une sur l'autre (ou
   sur le héros) au moment du combat
   ============================================================ */
// Anime une charge de combat — recul exagéré (élan), puis fonce jusqu'au
// centre de la cible en passant par-dessus elle (façon MTG Arena), avant
// de revenir à sa position. Retourne une Promise résolue à la fin, pour
// pouvoir être mise en file (voir queueCombatAnim) plutôt que jouée
// immédiatement.
function lungeToward(el, targetEl, duration){
  if(!el || !targetEl) return Promise.resolve();
  const a = el.getBoundingClientRect(), b = targetEl.getBoundingClientRect();
  const dx = (b.left+b.width/2) - (a.left+a.width/2);
  const dy = (b.top+b.height/2) - (a.top+a.height/2);
  const len = Math.hypot(dx,dy) || 1;
  const ux = dx/len, uy = dy/len;
  const dur = duration||650;

  // Anime une copie indépendante plutôt que l'élément réel du plateau —
  // celui-ci est reconstruit à chaque mise à jour d'état (très fréquent :
  // ta propre action, la diffusion, la resynchronisation périodique), ce
  // qui détruisait l'élément en cours d'animation avant même qu'elle ait pu
  // se voir à l'écran.
  const ghost = el.cloneNode(true);
  ghost.style.position = 'fixed';
  ghost.style.left = a.left+'px';
  ghost.style.top = a.top+'px';
  ghost.style.width = a.width+'px';
  ghost.style.height = a.height+'px';
  ghost.style.margin = '0';
  ghost.style.zIndex = '9995';
  ghost.style.pointerEvents = 'none';
  document.body.appendChild(ghost);
  el.style.opacity = '0';
  return new Promise(resolve=>{
    const restore = ()=>{ ghost.remove(); if(el && el.style) el.style.opacity=''; resolve(); };
    if(ghost.animate){
      // Recul marqué (élan), puis fonce jusqu'au CENTRE de la cible (dx/dy
      // représentent déjà le vecteur exact jusqu'à ce centre) en le
      // dépassant légèrement, pour donner l'impression de passer par-
      // dessus elle plutôt que de simplement s'y arrêter.
      const anim = ghost.animate([
        { transform:'translate(0,0) scale(1)' },
        { transform:`translate(${-ux*22}px, ${-uy*22}px) scale(1.06)`, offset:0.25 },
        { transform:`translate(${dx*1.12}px, ${dy*1.12}px) scale(1.22)`, offset:0.6 },
        { transform:'translate(0,0) scale(1)' }
      ], { duration: dur, easing:'ease-in-out' });
      anim.onfinish = restore;
      anim.oncancel = restore;
    } else {
      setTimeout(restore, dur);
    }
  });
}

// ---------------- File d'animations de combat ----------------
// Toutes les frappes se jouent maintenant une par une, jamais simultanément
// (même quand plusieurs créatures attaquent la même cible) — et les
// actions des deux joueurs sont figées tant que la file n'est pas vide.
let __combatAnimQueue = [];
let __combatAnimPlaying = false;
function queueCombatAnim(fn){
  __combatAnimQueue.push(fn);
  processCombatAnimQueue();
}
async function processCombatAnimQueue(){
  if(__combatAnimPlaying) return;
  __combatAnimPlaying = true;
  document.body.classList.add('combat-anim-lock');
  while(__combatAnimQueue.length){
    const fn = __combatAnimQueue.shift();
    try { await fn(); } catch(e) { console.error('Erreur animation de combat', e); }
  }
  document.body.classList.remove('combat-anim-lock');
  __combatAnimPlaying = false;
}
function spawnDamageNumber(anchorEl, amount){
  if(!anchorEl || !amount) return;
  const r = anchorEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-popup';
  el.textContent = '-'+amount;
  el.style.left = (r.left+r.width/2)+'px';
  el.style.top = (r.top+r.height/2)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1450);
}
// Joue l'animation de frappe pour un combat entre deux instId (créature vs
// créature) — appelé juste après avoir reçu la confirmation du serveur.
// Seul l'attaquant charge — le bloqueur ne fait jamais de charge en
// retour, même s'il riposte (voir la discussion sur les animations : la
// bloqueuse ripostant n'est pas "agressive" au sens visuel du terme).
function playCombatStrike(attackerInstId, blockerInstId){
  queueCombatAnim(()=>{
    const attEl = document.querySelector(`[data-instid="${attackerInstId}"]`);
    const heroSlot = S.active===MY_KEY ? 'p2' : 'p1';
    const blkEl = blockerInstId ? document.querySelector(`[data-instid="${blockerInstId}"]`) : document.getElementById(`hero-frame-${heroSlot}`);
    debugLog(`[anim] playCombatStrike : attEl=${!!attEl} blkEl=${!!blkEl}`, attEl&&blkEl ? 'log-ok' : 'log-error');
    if(!attEl || !blkEl) return Promise.resolve();
    return lungeToward(attEl, blkEl, 480);
  });
}

let JOURNAL_CARD_LOOKUP = {}; // id -> carte complète, pour les aperçus au survol dans le journal

function startCardDrag(ev, handIndex, sourceEl){
  ev.preventDefault();
  const rect = sourceEl.getBoundingClientRect();
  const ghost = sourceEl.cloneNode(true);
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.margin = '0';
  ghost.style.zIndex = '9999';
  ghost.style.pointerEvents = 'none';
  ghost.style.transform = 'scale(1.08) rotate(-2deg)';
  ghost.style.boxShadow = '0 16px 30px rgba(0,0,0,.6)';
  ghost.classList.add('drag-ghost');
  document.body.appendChild(ghost);

  sourceEl.style.opacity = '.3';

  DRAG_STATE = {
    handIndex, ghost,
    offsetX: ev.clientX - rect.left,
    offsetY: ev.clientY - rect.top,
    sourceEl
  };

  document.addEventListener('pointermove', onCardDragMove);
  document.addEventListener('pointerup', onCardDragEnd);
}

function isOverDropZone(ev){
  const lane = document.getElementById('lane-p1');
  const laneRect = lane.getBoundingClientRect();
  // La zone valide s'étend du haut de la voie de combat jusqu'à une petite
  // marge en dessous (un geste vers le haut depuis la main suffit) — mais
  // PAS jusqu'à la main elle-même, sinon relâcher la carte sans vraiment la
  // déplacer (ou la reposer dans sa main) jouerait la carte par erreur.
  const forgivingMargin = 70;
  if(ev.clientX>=laneRect.left && ev.clientX<=laneRect.right && ev.clientY>=laneRect.top && ev.clientY<=laneRect.bottom+forgivingMargin) return true;

  // les emplacements d'artefacts comptent aussi comme zone de dépôt valide
  const slots = document.querySelectorAll('#artifacts-p1 .relic-slot');
  for(const s of slots){
    const r = s.getBoundingClientRect();
    if(ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom) return true;
  }
  return false;
}

function onCardDragMove(ev){
  if(!DRAG_STATE) return;
  const { ghost, offsetX, offsetY } = DRAG_STATE;
  ghost.style.left = (ev.clientX - offsetX) + 'px';
  ghost.style.top = (ev.clientY - offsetY) + 'px';

  const zone = document.getElementById('lane-p1');
  const over = isOverDropZone(ev);
  zone.classList.toggle('drop-target', over);
}

// Une créature qui vise une cible "alliée désignée" doit pouvoir se
// cibler elle-même une fois posée — mais au moment de cette vérification,
// elle n'existe pas encore visuellement sur le plateau (juste en main).
// On la compte donc comme candidate potentielle hypothétique ici, en plus
// des créatures déjà en jeu, pour savoir s'il existe VRAIMENT une raison
// de demander une cible au joueur.
function hasAnyPossibleTargetForPlay(card, tgt){
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowedKeys = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  const matchesFilters = (c)=>{
    if(tgt.subtypeFilter && !(c.subtypes||[]).some(s=>s.toLowerCase()===tgt.subtypeFilter.toLowerCase())) return false;
    if(tgt.statFilterEnabled){
      const stat = tgt.statFilterStat==='atk' ? (c.curAtk ?? c.atk) : (c.curHp ?? c.hp);
      if(tgt.statFilterMode==='atLeast' && !(stat>=tgt.statFilterValue)) return false;
      if(tgt.statFilterMode==='atMost' && !(stat<=tgt.statFilterValue)) return false;
      if(tgt.statFilterMode==='exactly' && stat!==tgt.statFilterValue) return false;
    }
    return true;
  };
  if(tgt.targetCategory==='creature' || tgt.targetCategory==='hero_creature' || tgt.targetCategory==='artifact'){
    for(const k of allowedKeys){
      const pool = tgt.targetCategory==='artifact' ? S[k].relics : S[k].board;
      if((pool||[]).some(matchesFilters)) return true;
    }
    // La carte en cours de pose elle-même, une fois en jeu — seulement si
    // "allié" est autorisé et qu'elle est bien une créature (les cibles
    // de type artefact ne peuvent jamais se référer à une créature qu'on
    // pose).
    if(card.type==='Créature' && tgt.targetCategory!=='artifact' && allowedKeys.includes(MY_KEY) && matchesFilters(card)) return true;
    if(tgt.targetCategory==='hero_creature') return true; // un héros est toujours une cible valide
  }
  return false;
}
function onCardDragEnd(ev){
  if(!DRAG_STATE) return;
  const { handIndex, ghost, sourceEl } = DRAG_STATE;
  const zone = document.getElementById('lane-p1');
  const over = isOverDropZone(ev);

  zone.classList.remove('drop-target');
  ghost.remove();
  if(sourceEl) sourceEl.style.opacity = '';
  document.removeEventListener('pointermove', onCardDragMove);
  document.removeEventListener('pointerup', onCardDragEnd);
  DRAG_STATE = null;

  if(over){
    const card = S[MY_KEY].hand[handIndex];
    const newTrigger = card && card.type==='Sortilège' ? null : 'onPlay'; // sortilège : n'importe quelle capacité s'applique direct
    const chosen = card ? findNewFormatChosenTarget(card, newTrigger) : null;
    if(card && card.type==='Piège'){
      uiSetTrap(handIndex);
    } else if(chosen && card.type==='Créature' && !hasAnyPossibleTargetForPlay(card, chosen.target)){
      // Aucune cible possible, même en comptant la créature elle-même une
      // fois posée — contrairement à un sort ou un piège, une créature
      // doit quand même pouvoir être jouée : son effet à la pose ne fera
      // simplement rien faute de cible.
      uiPlayCard(handIndex);
    } else if(chosen){
      UI.pendingNewTarget = { kind:'card', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: { index: handIndex } };
      render();
    } else if(card && needsTargetClient(card)){
      UI.pendingCard = { index: handIndex, card };
      render();
    } else {
      uiPlayCard(handIndex);
    }
  }
}

// Affiche un compte à rebours — interpolé localement entre deux passages du
// serveur (qui, lui, fait foi ; ceci n'est qu'un affichage). Rafraîchi
// toutes les 500ms, indépendamment des mises à jour d'état.
function renderTurnTimer(){
  const el = document.getElementById('turn-timer');
  if(!el || !S) return;
  if(S.gameOver || S.phase==='mulligan' || !S.active){ el.style.display='none'; return; }

  // minuteur de blocage (45s), prioritaire sur celui de tour
  if(S.phase==='declareBlockersMe' && S.blockClockStartedAt){
    const elapsed = (Date.now()-S.blockClockStartedAt)/1000;
    const remaining = Math.max(0, 45-elapsed);
    el.style.display='flex';
    el.className = 'timer-block' + (remaining<=10?' timer-low':'');
    const who = S.active===MY_KEY ? "L'adversaire bloque" : 'Vous bloquez';
    el.textContent = `${who} — ${Math.ceil(remaining)}s`;
    return;
  }

  const p = S[S.active];
  if(!p || p.isAI){ el.style.display='none'; return; }
  let budget = p.turnTimeBudget ?? 120;
  if(!S.turnClockPaused && S.turnClockStartedAt){
    const elapsed = (Date.now()-S.turnClockStartedAt)/1000;
    budget = Math.max(0, budget-elapsed);
  }
  el.style.display='flex';
  const mins = Math.floor(budget/60), secs = Math.floor(budget%60);
  const label = S.active===MY_KEY ? 'Votre tour' : "Tour adverse";
  el.className = (S.active===MY_KEY?'timer-mine':'') + (budget<=20?' timer-low':'') + (S.turnClockPaused?' timer-paused':'');
  el.textContent = `${label} — ${mins}:${String(secs).padStart(2,'0')}${S.turnClockPaused?' (pause)':''}`;
}

function renderPhaseBar(){
  const bar = document.getElementById('phase-bar');
  bar.innerHTML = '';
  if(S.gameOver) return;

  if(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY){
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    btn.textContent = 'Choisis une créature à sacrifier...';
    btn.disabled = true;
    bar.appendChild(btn);
    return;
  }

  if(UI.pendingCard || UI.pendingPower || UI.pendingNewTarget){
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    if(UI.pendingNewTarget){
      const needed = newFormatTargetCount(UI.pendingNewTarget.target);
      const got = UI.pendingNewTarget.selectedInstIds.length;
      btn.textContent = needed>1 ? `Choisis une cible (${got}/${needed})...` : 'Choisis une cible...';
    } else {
      btn.textContent = 'Choisis une cible...';
    }
    btn.disabled = true;
    bar.appendChild(btn);
    const cancel = document.createElement('button');
    cancel.className = 'phase-btn secondary small';
    cancel.textContent = 'Annuler';
    cancel.onclick = UI.pendingNewTarget ? cancelPendingNewTarget : cancelPendingCard;
    bar.appendChild(cancel);
    return;
  }

  if(S.phase==='mulligan'){
    if(!S.mulliganDone[MY_KEY]){
      showMulliganOverlay();
    } else {
      const btn = document.createElement('button');
      btn.className = 'phase-btn';
      btn.textContent = "En attente de l'adversaire...";
      btn.disabled = true;
      bar.appendChild(btn);
    }
    return;
  }

  const myTurn = S.active===MY_KEY;
  const me = S[MY_KEY];
  const btn = document.createElement('button');
  btn.className = 'phase-btn';

  if(!myTurn){
    if(S.phase==='declareBlockersMe'){
      btn.textContent = 'Passer (fin du blocage)';
      btn.onclick = uiFinishBlocking;
    } else {
      btn.textContent = 'Tour adverse';
      btn.disabled = true;
    }
  } else if(S.phase==='declareBlockersMe'){
    btn.textContent = "En attente du blocage adverse...";
    btn.disabled = true;
  } else if(UI.selectingAttackers){
    btn.textContent = UI.selectedAttackers.length ? `Valider ${UI.selectedAttackers.length} attaquant(s)` : "Passer l'attaque";
    btn.onclick = uiConfirmAttackers;
    const cancel = document.createElement('button');
    cancel.className = 'phase-btn secondary small';
    cancel.textContent = 'Annuler';
    cancel.onclick = ()=>{ UI.selectingAttackers = false; UI.selectedAttackers = []; render(); };
    bar.appendChild(cancel);
  } else if(S.phase==='main' && !me.attackPhaseDone){
    btn.textContent = '⚔ Passer au combat';
    btn.onclick = ()=>{ UI.selectingAttackers = true; UI.selectedAttackers = []; render(); };
  } else if(S.phase==='main' && me.attackPhaseDone){
    btn.textContent = 'Fin de tour';
    btn.onclick = uiEndTurn;
  }

  bar.appendChild(btn);
}

// ---------------- Aperçu du héros au survol ----------------

function showHeroPreview(hero, ev){ showCardPreviewHover(hero, ev); }
function moveHeroPreview(ev){
  __lastPreviewEvent = ev;
  const box = document.getElementById('card-preview');
  // Décalage large et volontaire — sur le plateau, les cartes (surtout les
  // artefacts) sont minuscules ; un aperçu trop proche du curseur les
  // recouvre entièrement, rendant impossible de viser le clic précis en
  // dessous (même si l'aperçu lui-même laisse passer les clics).
  // Largeur réelle de la boîte (variable : un héros avec ses cartes liées
  // est bien plus large qu'une carte seule) plutôt qu'une valeur fixe.
  const boxWidth = box.offsetWidth || 300;
  const boxHeight = box.offsetHeight || 420;
  const x = Math.min(ev.clientX + 60, window.innerWidth - boxWidth - 20);
  const y = Math.min(ev.clientY + 60, window.innerHeight - boxHeight - 20);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
function hidePreview(){
  __previewHoverToken++;
  document.getElementById('card-preview').classList.remove('show');
}

// ---------------- Menus repliables ----------------

function toggleJournal(){

}
// Quitter proprement : si la partie est déjà terminée, aucun risque, on
// part directement. Sinon, on prévient que partir compte comme un abandon
// (l'adversaire gagnera par forfait après le délai de déconnexion habituel).
function uiLeaveGame(){
  const ongoing = S && !S.gameOver;
  if(ongoing && !confirm("Quitter maintenant compte comme un abandon — ton adversaire gagnera la partie. Confirmer ?")) return;
  gsDisconnect();

function toggleEmotePanel(){
  const panel = document.getElementById('emote-panel');
  const willShow = !panel.classList.contains('show');
  panel.classList.toggle('show');
  if(willShow) renderEmoteGrid();
}
function renderEmoteGrid(){
  const grid = document.getElementById('emote-grid');
  const hero = S && S[MY_KEY] && S[MY_KEY].hero;
  const emotes = (hero && hero.emotes) || [];
  if(emotes.length===0){
    grid.innerHTML = `<div class="emote-empty">Ce héros n'a pas d'émotes configurées.</div>`;
    return;
  }
  grid.innerHTML = '';
  emotes.forEach(em=>{
    const img = document.createElement('img');
    img.src = em.image; img.title = em.label || '';
    img.onclick = ()=>{ uiSendEmote(em); document.getElementById('emote-panel').classList.remove('show'); };
    grid.appendChild(img);
  });
}
async function uiSendEmote(emote){
  const res = await gsSendEmote(emote.image, emote.label||'');
  if(res && res.error){ console.error('Émote → ' + res.error); alert("L'émote n'a pas pu être envoyée : " + res.error); }
}
// Reçue via le canal de diffusion de la partie (broadcast, event 'emote')
// — le payload transporte directement l'image, l'info-bulle et le camp de
// l'émetteur, plus besoin de passer par la base de données.
function onEmoteMessage(payload){
  if(!payload) return;
  const senderKey = payload.senderKey === 'p1' || payload.senderKey === 'p2' ? payload.senderKey : null;
  const isMine = senderKey===MY_KEY;
  const anchorId = isMine ? 'hero-frame-p1' : 'hero-frame-p2';
  const anchor = document.getElementById(anchorId);
  console.log('Émote reçue', {senderKey, MY_KEY, OPP_KEY, anchorId, anchorFound: !!anchor});
  const bubble = document.createElement('div');
  bubble.className = 'emote-bubble';
  if(anchor){
    const rect = anchor.getBoundingClientRect();
    bubble.style.left = (rect.left + rect.width/2 - 57) + 'px';
    // Notre propre cadre est en bas de l'écran : la bulle flotte au-dessus.
    // Le cadre adverse est en haut : la bulle flotte en dessous. Les deux
    // se rapprochent donc du centre du plateau, plutôt que de toujours
    // remonter (ce qui, pour le cadre adverse déjà en haut, la poussait
    // hors de l'écran ou la rendait à peine visible).
    bubble.style.top = isMine ? (rect.top - 100) + 'px' : (rect.bottom + 20) + 'px';
  } else {
    // Repli de diagnostic : si le cadre n'est pas trouvé, on affiche quand
    // même la bulle, bien visible au centre de l'écran, pour savoir si le
    // souci est la réception (rien n'apparaît jamais) ou le positionnement
    // (la bulle existe mais était invisible/mal placée).
    console.warn('Cadre de héros introuvable (' + anchorId + ') — affichage de secours au centre.');
    bubble.style.left = '50%';
    bubble.style.top = '50%';
    bubble.style.transform = 'translate(-50%,-50%)';
  }
  bubble.innerHTML = `<img src="${payload.image}" title="${escapeHtmlBoard(payload.label||'')}">`;
  document.body.appendChild(bubble);
  setTimeout(()=>bubble.remove(), 2700);
}
function escapeHtmlBoard(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Actions ----------------
// Empêche d'envoyer une nouvelle action tant que la précédente n'a pas
// fini de se traiter — sinon plusieurs clics rapides se marchent dessus
// sur le verrou serveur (409 "session-busy") et la partie semble bloquée.
let ACTION_IN_FLIGHT = false;
async function runAction(label, fn){
  if(ACTION_IN_FLIGHT){ debugLog(`${label} → une action est déjà en cours, patiente un instant.`, 'log-error'); return; }
  ACTION_IN_FLIGHT = true;
  document.body.classList.add('action-busy');
  try{
    const res = await fn();
    if(res && res.error){
      debugLog(`${label} → ${res.error}`, 'log-error');
    } else if(res && res.state){
      // Applique directement l'état renvoyé par l'action elle-même — ne
      // dépend plus uniquement de la diffusion temps réel (qui met à jour
      // les AUTRES clients connectés : adversaire, spectateurs). Sans ça,
      // si la diffusion ne passait pas pour une raison quelconque, l'action
      // réussissait silencieusement côté serveur sans jamais se refléter
      // à l'écran pour l'auteur de l'action lui-même.
      onStateUpdate(res.state);
    }
    return res;
  } catch(e){
    debugLog(`${label} → exception : ${e && e.message || e}`, 'log-error');
  } finally {
    ACTION_IN_FLIGHT = false;
    document.body.classList.remove('action-busy');
  }
}

let mulliganMarked = new Set(); // indices dans S[MY_KEY].hand marqués "à renvoyer"
let mulliganOverlayShown = false; // pour ne pas reconstruire (et perdre la sélection en cours) à chaque rendu
function showMulliganOverlay(){
  if(mulliganOverlayShown) return;
  mulliganOverlayShown = true;
  mulliganMarked = new Set();
  const overlay = document.getElementById('mulligan-overlay');
  const cardsEl = document.getElementById('mulligan-cards');
  cardsEl.innerHTML = '';
  S[MY_KEY].hand.forEach((card, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'mulligan-card-wrap';
    wrap.appendChild(cardEl(card, { inPlay:false, isPreview:true }));
    const tag = document.createElement('div');
    tag.className = 'mulligan-tag';
    tag.textContent = 'Garder';
    wrap.appendChild(tag);
    wrap.onclick = ()=>{
      if(mulliganMarked.has(idx)){
        mulliganMarked.delete(idx);
        wrap.classList.remove('marked');
        tag.textContent = 'Garder';
      } else {
        mulliganMarked.add(idx);
        wrap.classList.add('marked');
        tag.textContent = 'Renvoyer';
      }
    };
    cardsEl.appendChild(wrap);
  });
  overlay.classList.add('show');
}
async function confirmMulligan(){
  document.getElementById('mulligan-overlay').classList.remove('show');
  await runAction('Mulligan', ()=>gsMulligan([...mulliganMarked]));
  mulliganOverlayShown = false;
}
function getUseChoiceAbility(card){
  if(!card || !card.abilities) return null;
  return card.abilities.find(ab=>ab.kind==='triggered' && ab.useChoice && ab.choiceA && ab.choiceB) || null;
}
async function uiPlayCard(i, targetInfo, chosenTargets, choiceKey){
  const card = S[MY_KEY].hand[i];
  const choiceAbility = !choiceKey ? getUseChoiceAbility(card) : null;
  if(choiceAbility){
    showCardChoiceModal(card, choiceAbility, (pickedKey)=>{ uiPlayCard(i, targetInfo, chosenTargets, pickedKey); });
    return;
  }
  await runAction('Jouer carte', ()=>gsPlayCardSimple(i, targetInfo, chosenTargets, choiceKey));
}
function showCardChoiceModal(card, ability, onPick){
  const overlay = document.createElement('div');
  overlay.id = 'card-choice-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,4,10,.75);z-index:99998;display:flex;align-items:center;justify-content:center;gap:34px;flex-wrap:wrap;';
  const activeLetters = ['A','B','C','D'].slice(0, ability.numChoices||2);
  activeLetters.forEach(ck=>{
    const choice = ability['choice'+ck];
    if(!choice) return;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .15s ease;';
    wrap.onmouseenter = ()=>{ wrap.style.transform='translateY(-10px) scale(1.04)'; };
    wrap.onmouseleave = ()=>{ wrap.style.transform=''; };
    const cardVisual = cardEl(card, {isPreview:true});
    wrap.appendChild(cardVisual);
    const label = document.createElement('div');
    label.style.cssText = 'font-family:\'Cinzel\',serif;font-weight:700;color:var(--gold);font-size:15px;background:rgba(23,19,37,.9);border:1.5px solid var(--gold);border-radius:8px;padding:8px 16px;max-width:280px;text-align:center;';
    label.textContent = choice.label || `Choix ${ck}`;
    wrap.appendChild(label);
    wrap.onclick = ()=>{ overlay.remove(); onPick(ck); };
    overlay.appendChild(wrap);
  });
  document.body.appendChild(overlay);
}
async function uiSetTrap(i){ await runAction('Poser le piège', ()=>gsSetTrap(i)); }
async function uiEndTurn(){ playSfx('pass'); await runAction('Fin de tour', ()=>gsEndTurn()); }
async function uiConfirmAttackers(){
  await runAction('Attaquer', ()=>gsDeclareAttackers(UI.selectedAttackers));
  UI.selectingAttackers = false; UI.selectedAttackers = [];
  render();
}
async function uiAssignBlock(attackerId){
  if(!UI.pendingBlocker) return;
  const blockerId = UI.pendingBlocker;
  UI.pendingBlocker = null;
  await runAction('Bloquer', ()=>gsAssignBlock(blockerId, attackerId));
  render();
}
async function uiFinishBlocking(){
  UI.pendingBlocker = null;
  await runAction('Terminer blocage', ()=>gsFinishBlocking());
  render();
}
async function uiProcessAi(){ await runAction('Tour IA', ()=>gsProcessAiTurn()); }



// Arrivée depuis spellcraft-lobby.html — la sélection de deck et la
// création/jointe de partie sont maintenant sur cette page séparée. Le
// plateau se contente de lire l'identifiant de session et le rôle transmis
// dans l'URL, puis se connecte directement.
async function initFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('sid');
  const role = params.get('role');
  if(!sid || !role){
    window.location.href = 'spellcraft-lobby.html';
    return;
  }
  GS_SESSION_ID = sid;
  GS_ROLE = role;
  // Corrige un vrai bug : mettre GS_VS_AI à false sans condition faisait
  // tourner la détection de déconnexion même contre l'IA — qui n'envoie
  // jamais de présence, donc "expirait" après le délai de grâce et faisait
  // gagner le joueur humain par forfait automatique, comme si l'IA s'était
  // déconnectée.
  GS_VS_AI = params.get('vsai') === '1';
  // Musique dédiée au combat : rotation entre combat-1 à combat-4 (déjà
  // construite dans spellcraft-shared.js) pour toute la durée de la
  // partie — j'utilisais par erreur playMusic('combat',...) qui cherchait
  // un seul fichier combat.ogg inexistant.
  playCombatMusicRotation(0.35);
  // Chargé en arrière-plan (pas besoin d'attendre) — sert uniquement aux
  // aperçus de carte au survol dans le journal.
  loadAllCardsAcrossSets().then(cards=>{
    JOURNAL_CARD_LOOKUP = {};
    cards.forEach(c=>{ JOURNAL_CARD_LOOKUP[c.id] = c; });
  });
  afterConnected(null);
}
initSpellcraftAuth().then(initFromUrl);
