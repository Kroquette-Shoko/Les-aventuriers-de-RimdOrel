        // Nouveau format (card.abilities) — celui que l'éditeur actuel
        // produit. L'ancien format (triggeredEffects.activated) reste
        // vérifié en repli pour les cartes plus anciennes.
        const hasNewActivated = r.abilities && r.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated'));
        const hasOldActivated = r.triggeredEffects && r.triggeredEffects.activated;
        // Les artefacts sont désormais toujours gratuits et limités à une
        // fois par tour (voir _activatedThisTurn côté serveur) — plus de
        // cooldown à vérifier pour ce type de carte précis.
        const alreadyUsed = !!r._activatedThisTurn;
        if((hasNewActivated || hasOldActivated) && !alreadyUsed){
          cardElNode.style.cursor = 'pointer';
          cardElNode.onclick = ()=>uiActivatePermanent('artifact', r.instId);
        } else if((hasNewActivated || hasOldActivated) && alreadyUsed){
          cardElNode.classList.add('artifact-used-this-turn');
        }
      }
    } else {
      wrap.classList.add('relic-slot-empty');
      if(slot==='p1') wrap.dataset.artifactSlot = 'true';
    }
    el.appendChild(wrap);
  }
}

// ---------------- Posture de combat : retrait persistant + flèche d'attaquant ----------------
// ÉTAT VISUEL (pas une animation) recalculé à chaque rendu à partir de l'état S :
//  - EN RETRAIT (classe .is-withdrawn) : légèrement décalée vers l'arrière de
//    sa ligne, pour repérer d'un coup d'œil ce qui n'est plus actif :
//      * un attaquant qui a été BLOQUÉ (plus un danger) ;
//      * un bloqueur qui a DÉJÀ BLOQUÉ (ne peut plus bloquer).
//    Reste en retrait jusqu'à la fin du tour (voir les champs ci-dessous).
//    « Arrière » : ma ligne (en bas) -> vers le bas ; ligne adverse (en haut) -> vers le haut.
//  - FLÈCHE ROUGE CLIGNOTANTE (.attacker-arrow) : sur chaque attaquant déclaré et
//    encore NON bloqué, donc encore un danger. Au-dessus de mes créatures, en
//    dessous de celles de l'adversaire (elle pointe vers le camp visé). Elle
//    DISPARAÎT dès que l'attaquant est bloqué (il passe alors en retrait : un
//    seul signal à la fois, la flèche = danger, le retrait = neutralisé).
// Champs lus (état serveur, aucune modification serveur) :
//  - S.phase === 'declareBlockersMe' et S.active : combat en cours (seule phase
//    où des attaquants sont « déclarés » dans l'état) ;
//  - S[camp].attackers : instId des attaquants déclarés (vidé à la fin du blocage) ;
//  - créature.hasBeenBlocked : attaquant bloqué PENDANT le combat en cours (le
//    serveur le remet à false dès doFinishBlocking) ;
//  - S.__combatEvents (blockResolved, avec .turn = S.turn et .attackerInstId) :
//    mémoire « cet attaquant a été bloqué ce tour », qui survit à la fin du
//    combat (c'est ce qui garde un survivant en retrait jusqu'à la fin du tour) ;
//  - créature.hasBlockedThisTurn : bloqueur ayant bloqué (remis à false par le
//    serveur au début du tour de son propriétaire).
// Limite connue : les événements sont limités aux 60 derniers côté serveur ;
// un champ serveur dédié (ex. attacker.wasBlockedThisTurn, remis à zéro avec
// hasAttacked) rendrait ce repli inutile — non implémenté (consigne).
// Fonctions pures entre les marqueurs : testées sous Node (aucun accès DOM/global).
// <combat-posture>
const WITHDRAW_OFFSET_PX = 16;        // décalage vers l'arrière (px, échelle 1920×1080 du plateau)
const WITHDRAW_TRANSITION_MS = 220;   // apparition/disparition douce du retrait (passée dans cms() ; 0 en Instantané)
const ATTACKER_ARROW_BLINK_MS = 900;  // période du clignotement de la flèche rouge (fixe en Instantané)

// Contexte de décision pour UNE ligne (camp `ownerKey`), lu dans l'état.
function combatPostureCtx(state, ownerKey){
  const st = state || {};
  const owner = st[ownerKey] || {};
  const blocked = new Set();
  (Array.isArray(st.__combatEvents) ? st.__combatEvents : []).forEach(e=>{
    if(e && e.combatEvent==='blockResolved' && e.turn===st.turn && e.attackerInstId) blocked.add(e.attackerInstId);
  });
  return {
    ownerKey,
    phase: st.phase,
    activeKey: st.active,
    attackerIds: new Set(Array.isArray(owner.attackers) ? owner.attackers : []),
    blockedAttackerIds: blocked
  };
}
// Cette créature (attaquante) a-t-elle été bloquée pendant ce tour ?
function wasBlockedThisTurn(c, ctx){
  return !!(c && (c.hasBeenBlocked === true || ctx.blockedAttackerIds.has(c.instId)));
}
// Attaquant déclaré du combat EN COURS (jamais pendant le choix des attaquants :
// la phase est alors 'main', le contour doré de sélection existe déjà).
function isDeclaredAttacker(c, ctx){
  return !!c && ctx.phase==='declareBlockersMe' && ctx.ownerKey===ctx.activeKey && ctx.attackerIds.has(c.instId);
}
// En retrait : attaquant bloqué (un survivant le reste jusqu'à la fin du tour) ou bloqueur ayant bloqué.
function isWithdrawn(c, ctx){
  if(!c) return false;
  return c.hasBlockedThisTurn === true || wasBlockedThisTurn(c, ctx);
}
// Flèche rouge : attaquant déclaré du combat en cours, pas (encore) bloqué.
function showAttackerArrow(c, ctx){
  return isDeclaredAttacker(c, ctx) && !wasBlockedThisTurn(c, ctx);
}
// Direction du retrait / position de la flèche selon le camp (isMine : ma ligne, en bas).
function withdrawDirection(isMine){ return isMine ? 'down' : 'up'; }
function attackerArrowPlacement(isMine){ return isMine ? 'above' : 'below'; }
// </combat-posture>

// Dernier état de retrait RENDU, par créature : sert uniquement à savoir si un
// changement vient d'avoir lieu (pour la transition douce). Une créature
// inconnue (nouvelle, ou premier rendu) apparaît directement dans son état.
const __withdrawnRendered = new Map();
// Pose le retrait sur l'élément .ncard d'une créature en jeu. Le DOM étant
// reconstruit à chaque rendu, la classe vient toujours de l'état ; seule la
// transition est animée : départ dans l'ancien état puis bascule à l'image
// suivante. Propriété CSS `translate` (indépendante de `transform`, utilisé par
// les animations de charge et le survol).
function applyWithdrawState(el, instId, withdrawn, isMine){
  const sign = withdrawDirection(isMine)==='down' ? 1 : -1;
  el.style.setProperty('--withdraw-y', (sign*WITHDRAW_OFFSET_PX)+'px');
  const had = __withdrawnRendered.get(instId);
  __withdrawnRendered.set(instId, withdrawn);
  let reduced = false; // prefers-reduced-motion : pas de transition
  try { reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch(e){}
  const dur = reduced ? 0 : cms(WITHDRAW_TRANSITION_MS);
  if(had!==undefined && had!==withdrawn && dur>0){
    el.classList.toggle('is-withdrawn', had);
    el.style.transition = `translate ${dur}ms ease-out`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.toggle('is-withdrawn', withdrawn)));
  } else {
    el.classList.toggle('is-withdrawn', withdrawn);
  }
}
// Flèche rouge clignotante (SVG en ligne, aucune image). Enfant de la carte :
// elle suit donc son clone d'animation de charge (retiré par stripPostureFromGhost).
function buildAttackerArrowEl(isMine){
  const a = document.createElement('div');
  a.className = 'attacker-arrow is-' + attackerArrowPlacement(isMine) + (combatInstant() ? ' is-static' : '');
  a.style.animationDuration = ATTACKER_ARROW_BLINK_MS+'ms';
  a.setAttribute('aria-hidden', 'true');
  a.innerHTML = '<svg viewBox="0 0 40 48" width="100%" height="100%"><path d="M20 2 L38 24 H27 V46 H13 V24 H2 Z" stroke-linejoin="round"/></svg>';
  return a;
}
// Un clone d'animation (charge, mort) est placé à la position VISIBLE réelle
// (getBoundingClientRect, retrait compris) : il ne doit donc ni se décaler une
// 2e fois, ni emporter la flèche.
function stripPostureFromGhost(ghost){
  if(!ghost) return ghost;
  ghost.classList.remove('is-withdrawn');
  ghost.style.translate = 'none';
  ghost.style.transition = 'none';
  ghost.querySelectorAll('.attacker-arrow').forEach(n=>n.remove());
  return ghost;
}

// key = camp réel serveur, slot = 'p1'/'p2' pour l'affichage (moi en bas, adversaire en haut)
function renderLane(key, slot){
  const el = document.getElementById(`lane-${slot}`);
  el.innerHTML = '';
  const p = S[key];
  const postureCtx = combatPostureCtx(S, key);
  (p.board||[]).slice(0,8).forEach(c=>{
    const isMine = key===MY_KEY;
    const attackSelecting = isMine && UI.selectingAttackers && UI.selectedAttackers.includes(c.instId);
    const attackConfirmed = (p.attackers||[]).includes(c.instId) && S.phase!=='main';
    const attacking = attackSelecting || attackConfirmed;
    const isPendingSacrificeTarget = !!(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY && key===MY_KEY);
    const targetable = isBlockTargetable(key, c) || isValidPendingTarget(key, c) || isValidNewFormatTarget(key, c) || isPendingSacrificeTarget;

    const cardWrap = document.createElement('div');
    cardWrap.className = 'card-slot';
    cardWrap.style.position = 'relative';
    cardWrap.dataset.instId = c.instId;
    const el2 = cardEl(c, { attacking, attackSelecting, targetable, inPlay:true, ownerKey:key, unavailableReason: unavailableReasonFor(key, c), onClick: ()=>onBoardCreatureClick(key, c) });
    cardWrap.appendChild(el2);

    // Posture de combat (état, recalculé à chaque rendu) : retrait des créatures
    // bloquées / bloqueuses + flèche rouge sur les attaquants encore dangereux.
    applyWithdrawState(el2, c.instId, isWithdrawn(c, postureCtx), isMine);
    if(showAttackerArrow(c, postureCtx)) el2.appendChild(buildAttackerArrowEl(isMine));

    // Bloqueur ayant bloqué : le retrait porte maintenant l'information, on ne
    // l'atténue plus (ancienne opacité .5) ; la pastille 🛡 reste, pour les deux camps.
    if(c.hasBlockedThisTurn){
      const tag = document.createElement('div');
      tag.style.cssText = 'position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:12px;z-index:5;';
      tag.textContent = '🛡';
      cardWrap.appendChild(tag);
    }
    if(!isMine && c.hasBeenBlocked && S.phase==='declareBlockersMe'){
      const tag = document.createElement('div');
      tag.style.cssText = 'position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:12px;z-index:5;';
      // Plusieurs bloqueurs peuvent désormais se ranger sur un même attaquant :
      // le cadenas (« verrouillé ») était trompeur, on indique « déjà bloqué ».
      tag.textContent = '🛡';
      tag.title = "Déjà bloquée : d'autres créatures peuvent encore la bloquer";
      cardWrap.appendChild(tag);
    }
    if(c.instId===UI.pendingBlocker){
      el2.style.outline = '3px solid var(--gold)';
    }
    el.appendChild(cardWrap);
  });
}

// Les attaquants adverses (objets) pendant ma phase de blocage.
function currentAttackersOpp(){
  const opp = S[OPP_KEY];
  if(S.phase!=='declareBlockersMe' || S.active!==OPP_KEY) return [];
  return (opp.attackers||[]).map(id=>(opp.board||[]).find(x=>x.instId===id)).filter(Boolean);
}
// Raison pour laquelle cette créature est grisée en ce moment, ou null.
// Uniquement dans les deux phases concernées (choix des attaquants, choix des
// bloqueurs) pour ne pas encombrer le plateau le reste du temps.
//  - choix des attaquants : mes créatures qui ne peuvent pas attaquer ;
//  - choix des bloqueurs : mes créatures qui ne peuvent bloquer aucun
//    attaquant ; et, une fois un bloqueur choisi, les attaquants adverses
//    qu'il ne peut pas bloquer (Discret, Envol).
function unavailableReasonFor(key, c){
  const isMine = key===MY_KEY;
  if(isMine && UI.selectingAttackers && S.active===MY_KEY && S.phase==='main') return reasonCannotAttack(c);
  if(S.phase!=='declareBlockersMe' || S.active!==OPP_KEY) return null;
  if(isMine) return reasonCannotBlockAny(c, currentAttackersOpp());
  if(UI.pendingBlocker && (S[OPP_KEY].attackers||[]).includes(c.instId)){
    const blocker = (S[MY_KEY].board||[]).find(x=>x.instId===UI.pendingBlocker);
    return blocker ? reasonCannotBlock(blocker, c) : null;
  }
  return null;
}
// Message court (toast existant) expliquant pourquoi l'action est impossible.
function explainCannot(c, reason){
  showActionError(`${c.name||'Cette créature'} : ${reason}`);
}

// Une créature adverse est-elle cliquable en ce moment pour lui assigner
// mon bloqueur déjà sélectionné (elle doit être parmi les attaquants) ?
function isBlockTargetable(key, c){
  if(!UI.pendingBlocker) return false;
  if(key!==OPP_KEY) return false;
  if(S.phase!=='declareBlockersMe' || S.active!==OPP_KEY) return false;
  if(!(S[OPP_KEY].attackers||[]).includes(c.instId)) return false;
  // pas de surbrillance si le bloqueur choisi ne peut pas bloquer cet attaquant
  const blocker = (S[MY_KEY].board||[]).find(x=>x.instId===UI.pendingBlocker);
  return !blocker || canBlockClient(blocker, c);
}

const TARGETED_EFFECTS = ['damage','heal','stun','freeze','bounce','destroy','silence','weaken','buff','grantKeyword','keywordChoice'];
function cardPlayEffectClient(card){
  if(card.type==='Sortilège') return card.effect;
  if(card.type==='Créature') return card.onPlayEffect;
  if(card.type==='Artefact') return card.triggeredEffects && card.triggeredEffects.onPlay;
  return null;
}
function needsTargetClient(card){
  const eff = cardPlayEffectClient(card);
  return !!eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger';
}
// ---------------- Ciblage manuel : nouveau format (card.abilities) ----------------
// Cherche, pour une carte/permanent donné et un nom de déclencheur donné,
// la première capacité + cible nécessitant un choix manuel du joueur
// (selectionMode==='chosen'). Une seule cible "chosen" gérée à la fois pour
// ce lot — si une carte en a plusieurs, seule la première est proposée.
function findNewFormatChosenTarget(source, triggerName){
  if(!source || !source.abilities) return null;
  for(const ab of source.abilities){
    if(ab.kind!=='triggered') continue;
    if(triggerName && !(ab.triggers||[]).some(te=>te.trigger===triggerName)) continue;
    for(const tgt of (ab.targets||[])){
      if(tgt.selectionMode==='chosen' && tgt.targetOwner!=='self' && tgt.targetOwner!=='trigger'){
        return { ability: ab, target: tgt };
      }
    }
  }
  return null;
}
function newFormatTargetCount(tgt){
  if(tgt.countMode==='dynamic') return 1; // valeur dynamique : on ne peut pas la calculer côté client, on demande au moins 1
  return tgt.countFixed || 1;
}
// Une créature/carte est-elle un choix valide pour la cible du nouveau
// format actuellement en attente ? Miroir des filtres côté serveur.
function isValidNewFormatTarget(key, c){
  if(!UI.pendingNewTarget) return false;
  const tgt = UI.pendingNewTarget.target;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  if(!allowed.includes(key)) return false;
  if(tgt.targetCategory!=='creature' && tgt.targetCategory!=='hero_creature' && tgt.targetCategory!=='artifact') return false;
  if(tgt.subtypeFilter && !(c.subtypes||[]).some(s=>s.toLowerCase()===tgt.subtypeFilter.toLowerCase())) return false;
  if(tgt.statFilterEnabled){
    const stat = tgt.statFilterStat==='atk' ? c.curAtk : c.curHp;
    if(tgt.statFilterMode==='atLeast' && !(stat>=tgt.statFilterValue)) return false;
    if(tgt.statFilterMode==='atMost' && !(stat<=tgt.statFilterValue)) return false;
    if(tgt.statFilterMode==='exactly' && stat!==tgt.statFilterValue) return false;
  }
  if(UI.pendingNewTarget.selectedInstIds.includes(c.instId)) return false; // déjà choisie
  return true;
}
function isValidNewFormatHeroTarget(key){
  if(!UI.pendingNewTarget) return false;
  const tgt = UI.pendingNewTarget.target;
  if(tgt.targetCategory!=='player' && tgt.targetCategory!=='hero' && tgt.targetCategory!=='hero_creature') return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  if(!allowed.includes(key)) return false;
  const marker = `hero:${key}`;
  return !UI.pendingNewTarget.selectedInstIds.includes(marker);
}
// Ajoute une cible choisie ; si le nombre requis est atteint, lance l'action
// correspondante (carte jouée, pouvoir, capacité activée).
function pickNewFormatTarget(marker){
  const pn = UI.pendingNewTarget;
  pn.selectedInstIds.push(marker);
  const needed = newFormatTargetCount(pn.target);
  if(pn.selectedInstIds.length < needed){ render(); return; }
  const chosenTargets = { [pn.target.id]: pn.selectedInstIds };
  const kind = pn.kind;
  const extra = pn.extra;
  UI.pendingNewTarget = null;
  if(kind==='card') uiPlayCard(extra.index, null, chosenTargets);
  else if(kind==='hero') uiActivateHeroPower(null, chosenTargets);
  else if(kind==='permanent') uiActivatePermanent(extra.permanentType, extra.permanentInstId, null, chosenTargets);
}
function cancelPendingNewTarget(){
  UI.pendingNewTarget = null;
  render();
}

function pendingEffectClient(){
  if(UI.pendingCard) return cardPlayEffectClient(UI.pendingCard.card);
  if(UI.pendingPower) return UI.pendingPower.effect;
  return null;
}
function isValidPendingTarget(key, c){
  const eff = pendingEffectClient();
  if(!eff) return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = eff.targetOwner==='ally' ? [MY_KEY] : eff.targetOwner==='any' ? [MY_KEY, oppKey] : [oppKey];
  if(!allowed.includes(key)) return false;
  if(isStealthProtectedClient(c, key, MY_KEY)) return false; // Parade : protège seulement contre l'adversaire
  return true;
}
function isValidPendingHeroTarget(key){
  const eff = pendingEffectClient();
  if(!eff || (eff.type!=='damage' && eff.type!=='heal')) return false;
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowed = eff.targetOwner==='ally' ? [MY_KEY] : eff.targetOwner==='any' ? [MY_KEY, oppKey] : [oppKey];
  return allowed.includes(key);
}
// Confirme la cible choisie pour l'action actuellement en attente (carte,
// pouvoir de héros ou capacité activée) et envoie l'action correspondante.
function confirmPendingTarget(targetInfo){
  if(UI.pendingCard){
    const idx = UI.pendingCard.index;
    UI.pendingCard = null;
    uiPlayCard(idx, targetInfo);
  } else if(UI.pendingPower){
    const pw = UI.pendingPower;
    UI.pendingPower = null;
    if(pw.kind==='hero') uiActivateHeroPower(targetInfo);
    else uiActivatePermanent(pw.permanentType, pw.permanentInstId, targetInfo);
  }
}
function cancelPendingCard(){
  UI.pendingCard = null;
  UI.pendingPower = null;
  render();
}

// Relance l'action d'origine (poser un piège, pouvoir de héros, capacité
// activée) en fournissant cette fois la créature à sacrifier choisie par
// le joueur, pour compléter le coût additionnel resté en attente.
async function resolvePendingSacrifice(instId){
  const pending = S.pendingSacrifice;
  if(!pending) return;
  // On privilégie l'action mémorisée côté client (paramètres exacts envoyés),
  // et on se rabat sur les champs du sacrifice en attente fournis par le serveur.
  const mem = LAST_SACRIFICEABLE_ACTION;
  const kind = pending.action || (mem && mem.action);
  const src = (mem && mem.action===kind) ? mem : {
    action: kind,
    handIndex: pending.handIndex,
    targetInfo: pending.targetIsHero ? { isHeroTarget:true, playerKey:pending.targetPlayerKey } : (pending.targetInstId ? { instId:pending.targetInstId } : null),
    chosenTargets: pending.chosenTargets,
    choiceKey: pending.choiceKey,
    permanentType: pending.permanentType,
    permanentInstId: pending.permanentInstId
  };
  let res;
  if(kind==='setTrap'){
    res = await runAction('Poser le piège', ()=>gsSetTrap(src.handIndex, instId));
  } else if(kind==='useHeroPower'){
    res = await runAction('Pouvoir de héros', ()=>gsUseHeroPower(src.targetInfo, src.chosenTargets, instId));
  } else if(kind==='activatePermanent'){
    res = await runAction('Capacité activée', ()=>gsActivatePermanent(src.permanentType, src.permanentInstId, src.targetInfo, src.chosenTargets, instId));
  } else if(kind==='playCardSimple'){
    res = await runAction('Jouer la carte', ()=>gsPlayCardSimple(src.handIndex, src.targetInfo, src.chosenTargets, src.choiceKey, instId));
  } else {
    showActionError("Impossible de terminer le sacrifice : l'action d'origine est inconnue.");
    return;
  }
  if(res && !res.error) LAST_SACRIFICEABLE_ACTION = null;
}

function onBoardCreatureClick(key, c){
  const isMine = key===MY_KEY;
  // confirmation d'un sacrifice en attente (priorité absolue — bloque tout le reste côté serveur)
  if(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY && isMine){
    resolvePendingSacrifice(c.instId);
    return;
  }
  // confirmation de ciblage nouveau format (priorité absolue)
  if(UI.pendingNewTarget && isValidNewFormatTarget(key, c)){
    pickNewFormatTarget(c.instId);
    return;
  }
  // confirmation de ciblage pour une carte/pouvoir/capacité en attente (priorité sur tout le reste)
  if((UI.pendingCard || UI.pendingPower) && isValidPendingTarget(key, c)){
    confirmPendingTarget({ instId: c.instId });
    return;
  }
  // sélection des attaquants (mon tour, phase principale)
  if(isMine && UI.selectingAttackers){
    const why = reasonCannotAttack(c); // mêmes règles que le serveur
    if(why){ explainCannot(c, why); return; }
    const idx = UI.selectedAttackers.indexOf(c.instId);
    if(idx>=0) UI.selectedAttackers.splice(idx,1); else UI.selectedAttackers.push(c.instId);
    render();
    return;
  }
  // choix du bloqueur (l'adversaire m'attaque)
  if(isMine && S.phase==='declareBlockersMe' && S.active===OPP_KEY){
    const why = reasonCannotBlockAny(c, currentAttackersOpp());
    if(why){ explainCannot(c, why); return; }
    UI.pendingBlocker = c.instId;
    render();
    return;
  }
  // assignation du blocage sur un attaquant adverse
  if(!isMine && isBlockTargetable(key, c)){
    uiAssignBlock(c.instId);
    return;
  }
  // attaquant que le bloqueur choisi ne peut pas bloquer : on explique
  if(!isMine && S.phase==='declareBlockersMe' && S.active===OPP_KEY && UI.pendingBlocker && (S[OPP_KEY].attackers||[]).includes(c.instId)){
    const blocker = (S[MY_KEY].board||[]).find(x=>x.instId===UI.pendingBlocker);
    const why = blocker && reasonCannotBlock(blocker, c);
    if(why){ explainCannot(blocker, why); return; }
  }
  // activation d'une créature ayant une capacité activée (mon tour, phase principale)
  if(isMine && S.active===MY_KEY && S.phase==='main' && !UI.selectingAttackers){
    const hasNewActivated = c.abilities && c.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated'));
    const hasOldActivated = c.triggeredEffects && c.triggeredEffects.activated;
    if((hasNewActivated || hasOldActivated) && !c.stunned && (c._activationCooldownRemaining||0)<=0){
      uiActivatePermanent('creature', c.instId);
    }
  }
}

let PREV_HAND_LENGTH = null;
function renderEnemyHand(){
  const el = document.getElementById('enemy-hand-row');
  if(!el || !S) return;
  el.innerHTML = '';
  const opp = S[OPP_KEY];
  if(!opp) return;
  // En mode spectateur, cette main (celle du "haut") devient visible en
  // clair si son propriétaire a activé le partage — sinon dos de cartes
  // comme d'habitude.
  if(GS_ROLE==='spectator' && opp.showHandToSpectators){
    (opp.hand||[]).forEach(card=>{
      const c = cardEl(card, {});
      c.classList.add('enemy-hand-card-revealed');
      el.appendChild(c);
    });
    return;
  }
  const backUrl = opp.cardBackUrl;
  const count = (opp.hand||[]).length;
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'enemy-hand-card';
    if(backUrl) c.style.backgroundImage = `url('${backUrl.replace(/'/g,"")}')`;
    el.appendChild(c);
  }
}
// Bouton œil (révéler sa main aux spectateurs) — visible uniquement pour
// les deux joueurs (pas pour un spectateur lui-même, qui n'a pas de main
// à révéler), reflète l'état réel à chaque rendu.
function renderRevealHandToggle(){
  const btn = document.getElementById('reveal-hand-toggle-btn');
  if(!btn) return;
  if(GS_ROLE!=='p1' && GS_ROLE!=='p2'){ btn.style.display = 'none'; return; }
  btn.style.display = 'flex';
  const revealed = !!S[MY_KEY].showHandToSpectators;
  btn.textContent = revealed ? '👁️' : '🙈';
  btn.title = revealed ? 'Les spectateurs voient ta main — cliquer pour la cacher' : 'Révéler ta main aux spectateurs';
  btn.classList.toggle('active', revealed);
}
async function toggleRevealHandToSpectators(){
  const currentlyRevealed = !!S[MY_KEY].showHandToSpectators;
  await runAction('Main révélée', ()=>gsSetShowHandToSpectators(!currentlyRevealed));
}

function renderHand(){
  const el = document.getElementById('hand-p1');
  el.innerHTML = '';
  const p = S[MY_KEY];
  const myTurn = S.active===MY_KEY;
  const hand = p.hand||[];
  // Correctif d'un vrai bug préexistant : un spectateur héritait de
  // MY_KEY='p1' par défaut (voir plus haut), ce qui lui montrait la main
  // de p1 en clair sans le vouloir, en permanence. Désormais, en mode
  // spectateur, cette main ne s'affiche en clair que si son propriétaire
  // a explicitement activé le partage — sinon dos de cartes, comme pour
  // l'autre main.
  if(GS_ROLE==='spectator' && !p.showHandToSpectators){
    el.innerHTML = '';
    const backUrl = p.cardBackUrl;
    hand.forEach(()=>{
      const c = document.createElement('div');
      c.className = 'enemy-hand-card';
      if(backUrl) c.style.backgroundImage = `url('${backUrl.replace(/'/g,"")}')`;
      el.appendChild(c);
    });
    return;
  }
  // anime les cartes nouvellement arrivées en main depuis le dernier rendu
  // (mulligan, pioche normale, etc.) — repose sur le fait que les nouvelles
  // cartes sont toujours ajoutées à la fin côté serveur.
  const newCount = (PREV_HAND_LENGTH!==null && hand.length>PREV_HAND_LENGTH) ? (hand.length-PREV_HAND_LENGTH) : 0;
  PREV_HAND_LENGTH = hand.length;
  if(newCount>0) playSfx('draw');
  hand.forEach((card, i)=>{
    // Un Piège se pose gratuitement (le coût n'est payé qu'au déclenchement) :
    // le mana ne conditionne donc pas sa jouabilité.
    const isTrapCard = card.type==='Piège';
    const affordable = isTrapCard || getEffectiveCostClient(p, card) <= (p.manaNormal + p.manaFragile);
    const isPendingTrap = !!card.pendingTrap;
    const isLockedTrap = !!card.activeTrap; // un piège déjà armé, lui, reste verrouillé
    // Choix bloquant en attente pour nous (sacrifice, découverte, mot-clé) :
    // le serveur refuse toute autre action tant qu'il n'est pas résolu.
    const hasBlockingChoice = [S.pendingSacrifice, S.pendingDiscover, S.pendingKeywordChoice].some(x=>x && x.playerKey===MY_KEY);
    const hasSacrificeCost = !isTrapCard && card.extraCostEnabled && card.extraCostType==='sacrificeCreature';
    // Plateau plein (8 créatures) / artefacts pleins (2) — sauf si un coût de
    // sacrifice libère de la place (cas incertain : on ne grise pas).
    const noRoom = (card.type==='Créature' && (p.board||[]).length>=8 && !hasSacrificeCost)
                || (card.type==='Artefact' && (p.relics||[]).length>=2 && !hasSacrificeCost);
    // Coût additionnel impayable (pas de piège : pose gratuite, cas incertain)
    const extraCostUnpayable = !isTrapCard && card.extraCostEnabled && (
         (card.extraCostType==='sacrificeCreature' && (p.board||[]).length<1)
      || (card.extraCostType==='discardCard' && hand.filter((c,j)=>j!==i).length<1));
    const canPlay = GS_ROLE!=='spectator' && myTurn && S.phase==='main' && affordable && !UI.selectingAttackers && !isLockedTrap && !isPendingTrap
                    && !hasBlockingChoice && !noRoom && !extraCostUnpayable;
    const el2 = cardEl(card, {});
    el2.classList.add('hand-card');
    const slot = document.createElement('div');
    slot.className = 'hand-card-slot';
    if(newCount>0 && i>=hand.length-newCount) slot.classList.add('card-just-drawn');
    slot.appendChild(el2);
    if(!canPlay && !isPendingTrap) el2.style.opacity = '.5';
    if(isPendingTrap || isLockedTrap){
      const badge = document.createElement('div');
      badge.style.cssText = 'position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--gold);color:#231d33;white-space:nowrap;z-index:6;';
      badge.textContent = isLockedTrap ? 'Armé' : 'En attente... (cliquer pour annuler)';
      el2.appendChild(badge);
    }
    el2.addEventListener('mouseenter', (ev)=>{ revealHand(); showHeroPreview(card, ev); });
    el2.addEventListener('mousemove', moveHeroPreview);
    el2.addEventListener('mouseleave', ()=>{ scheduleHideHand(); hidePreview(); });
    if(canPlay){
      el2.style.cursor = 'grab';
      el2.style.touchAction = 'none';
      el2.addEventListener('pointerdown', (ev)=>startCardDrag(ev, i, el2));
    } else if(isPendingTrap && myTurn && S.phase==='main' && !UI.selectingAttackers){
      // Toujours interactif — un simple clic annule le piège, pas besoin de
      // glisser-déposer puisqu'il ne s'agit pas de le jouer une seconde fois.
      el2.style.cursor = 'pointer';
      el2.onclick = ()=>uiSetTrap(i);
    }
    el.appendChild(slot);
  });
}

// La main entière glisse hors de l'écran, ne laissant dépasser qu'un tiers
// du haut des cartes — survoler une carte la fait toutes remonter. La zone
// elle-même reste "pointer-events:none" (chaque carte gère son propre survol)
// pour ne jamais bloquer les clics sur ce qu'il y a derrière (héros, défausse...).
let HAND_HIDE_TIMER = null;
function revealHand(){
  if(HAND_HIDE_TIMER){ clearTimeout(HAND_HIDE_TIMER); HAND_HIDE_TIMER = null; }
  document.getElementById('hand-p1').style.transform = 'translateY(0)';
}
function scheduleHideHand(){
  if(HAND_HIDE_TIMER) clearTimeout(HAND_HIDE_TIMER);
  HAND_HIDE_TIMER = setTimeout(()=>{
    if(!DRAG_STATE) document.getElementById('hand-p1').style.transform = '';
  }, 120);
}

// ---------------- Glisser-déposer "fait maison" (événements de pointeur) ----------------
// Remplace le drag-and-drop HTML5 natif, trop capricieux selon les
// navigateurs — ici on suit nous-mêmes le curseur/doigt avec un clone visuel.
let DRAG_STATE = null;

/* ============================================================
   CIBLAGE VISUEL — ligne fléchée qui suit la souris (portée depuis
   l'ancien prototype)
   ============================================================ */
let targetSource = null;
let targetMouse = null;

function elCenter(el){
  const r = el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}
function beginTargeting(el){
  if(!el) return;
  hidePreview();
  targetSource = elCenter(el);
  targetMouse = {...targetSource};
  document.body.classList.add('targeting');
  drawTargetLine();
}
function endTargeting(){
  targetSource = null; targetMouse = null;
  document.body.classList.remove('targeting');
  document.getElementById('target-line').style.display='none';
  document.getElementById('target-origin').style.display='none';
  document.getElementById('target-arrow').style.display='none';
}
function drawTargetLine(){
  if(!targetSource || !targetMouse) return;
  const {x:x1,y:y1} = targetSource;
  const {x:x2,y:y2} = targetMouse;
  const line = document.getElementById('target-line');
  const origin = document.getElementById('target-origin');
  const arrow = document.getElementById('target-arrow');
  const angle = Math.atan2(y2-y1, x2-x1);
  const shorten = 22;
  const ex = x2 - Math.cos(angle)*shorten, ey = y2 - Math.sin(angle)*shorten;
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', ex); line.setAttribute('y2', ey);
  line.style.display='block';
  origin.setAttribute('cx', x1); origin.setAttribute('cy', y1);
  origin.style.display='block';
  const backX = x2 - Math.cos(angle)*26, backY = y2 - Math.sin(angle)*26;
  const perpX = Math.cos(angle+Math.PI/2)*12, perpY = Math.sin(angle+Math.PI/2)*12;
  arrow.setAttribute('points', `${x2},${y2} ${backX+perpX},${backY+perpY} ${backX-perpX},${backY-perpY}`);
  arrow.style.display='block';
}
document.addEventListener('mousemove', (e)=>{
  if(!targetSource) return;
  targetMouse = {x:e.clientX, y:e.clientY};
  drawTargetLine();
});
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){
    if(UI.pendingNewTarget){ cancelPendingNewTarget(); }
    else if(UI.pendingCard){ cancelPendingCard(); }
  }
});

/* ============================================================
   DURÉES DES ANIMATIONS DE COMBAT (ms, à vitesse NORMALE)
   Un seul endroit pour les régler. Elles sont passées dans cms() au moment de
   jouer l'animation : Rapide les divise par 2, Instantanée les supprime
   (voir « Vitesse des animations de combat » dans spellcraft-shared.js).
   ============================================================ */
const ANIM_LUNGE_WINDUP_MS = 150;  // recul d'élan avant la charge
const ANIM_LUNGE_CHARGE_MS = 200;  // course jusqu'au centre de la cible
const ANIM_IMPACT_HOLD_MS  = 130;  // arrêt à l'impact (laisse voir le choc, flash et chiffres)
const ANIM_LUNGE_RETURN_MS = 270;  // retour à sa place
//   => une charge dure 750 ms (480 ms avant), dont 130 ms d'arrêt à l'impact.
const ANIM_IMPACT_FX_MS = 450;     // anneau + éclat de lumière à l'impact
const ANIM_ARROW_LEAD_MS = 200;    // la flèche attaquant -> cible s'affiche seule avant que la charge parte

/* ============================================================
   FLÈCHES DE BLOCAGE — affichent les assignations bloqueur → attaquant
   ============================================================ */
// Flèche (ligne en pointillés + pointe) de (x1,y1) vers (x2,y2), ajoutée dans
// `parent` (le calque SVG #block-arrows-layer ou un <g> dedans). Style :
// .block-arrow-line / .block-arrow-head. La pointe s'arrête avant le centre
// de la cible pour ne pas la masquer.
function appendArrowShape(parent, x1, y1, x2, y2){
  const angle = Math.atan2(y2-y1, x2-x1);
  const shorten = 44;
  const ex = x2 - Math.cos(angle)*shorten, ey = y2 - Math.sin(angle)*shorten;

  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', x1); line.setAttribute('y1', y1);
  line.setAttribute('x2', ex); line.setAttribute('y2', ey);
  line.setAttribute('class', 'block-arrow-line');
  parent.appendChild(line);

  const backX = x2 - Math.cos(angle)*32, backY = y2 - Math.sin(angle)*32;
  const perpX = Math.cos(angle+Math.PI/2)*13, perpY = Math.sin(angle+Math.PI/2)*13;
  const arrow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  arrow.setAttribute('points', `${ex+Math.cos(angle)*32},${ey+Math.sin(angle)*32} ${backX+perpX},${backY+perpY} ${backX-perpX},${backY-perpY}`);
  arrow.setAttribute('class', 'block-arrow-head');
  parent.appendChild(arrow);
}
// Ancienne version : dessine bloqueur -> attaquant d'après UI.pendingBlockAssignments
// (jamais alimenté aujourd'hui, donc sans effet) ; garde la même géométrie via
// appendArrowShape. La flèche utilisée en jeu est showCombatArrow, ci-dessous.
function drawBlockArrows(){
  const svg = document.getElementById('block-arrows-layer');
  if(!svg || !S) return;
  svg.innerHTML = '';
  (UI.pendingBlockAssignments||[]).forEach(({attackerInstId, blockerInstId})=>{
    const attWrap = document.querySelector(`[data-instid="${attackerInstId}"]`);
    const blkWrap = document.querySelector(`[data-instid="${blockerInstId}"]`);
    if(!attWrap || !blkWrap) return;
    const a = attWrap.getBoundingClientRect();
    const b = blkWrap.getBoundingClientRect();
    appendArrowShape(svg, b.left + b.width/2, b.top + b.height/2, a.left + a.width/2, a.top + a.height/2);
  });
}
// Trace une flèche attaquant -> cible dans le calque #block-arrows-layer
// (fixed, hors du plateau mis à l'échelle : coordonnées d'écran, comme les
// autres animations). Renvoie la fonction qui la retire (idempotente) ; elle
// est aussi retirée si la file d'animations est interrompue. Le calque a
// pointer-events:none : aucun clic n'est bloqué au-delà du verrou existant.
function showCombatArrow(fromEl, toEl){
  const svg = document.getElementById('block-arrows-layer');
  if(!svg || !fromEl || !toEl) return ()=>{};
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  appendArrowShape(g, a.left+a.width/2, a.top+a.height/2, b.left+b.width/2, b.top+b.height/2);
  svg.appendChild(g);
  const remove = ()=>g.remove();
  registerCombatCleanup(remove);
  return remove;
}
// Une frappe complète : flèche attaquant -> cible seule pendant ANIM_ARROW_LEAD_MS
// (on voit QUI vise QUOI), puis la charge ; la flèche disparaît à la fin de
// l'arrêt à l'impact. `opts` : voir lungeToward.
function arrowThenLunge(attEl, targetEl, opts){
  opts = opts || {};
  const removeArrow = showCombatArrow(attEl, targetEl);
  const lead = cms(ANIM_ARROW_LEAD_MS);
  const wait = lead ? new Promise(r=>combatTimeout(r, lead)) : Promise.resolve();
  return wait.then(()=>lungeToward(attEl, targetEl, Object.assign({}, opts, {
    onImpact: ()=>{
      combatTimeout(removeArrow, cms(ANIM_IMPACT_HOLD_MS));
      if(opts.onImpact) opts.onImpact();
    }
  }))).then(removeArrow, e=>{ removeArrow(); throw e; });
}

/* ============================================================
   ANIMATION DE MORT — dissolution d'une carte qui quitte le plateau
   (combat, destruction, sacrifice...)
   ============================================================ */
// Instantané de toutes les cartes actuellement affichées sur le plateau
// (position + clone), repris juste avant que render() ne reconstruise le
// DOM avec le nouvel état. Une carte qui vient de mourir n'existe déjà
// plus dans le nouvel état : sans cet instantané pris à temps, elle serait
// introuvable au moment de jouer son animation de mort (render() l'a déjà
// fait disparaître d'un coup). Refait à chaque mise à jour d'état — peu
// coûteux (quelques cartes tout au plus).
let __lastBoardSnapshot = {};
function snapshotBoardForDeathAnim(){
  const snap = {};
  document.querySelectorAll('[data-instid]').forEach(el=>{
    const id = el.getAttribute('data-instid');
    if(!id || snap[id]) return;
    snap[id] = { rect: el.getBoundingClientRect(), clone: stripPostureFromGhost(el.cloneNode(true)) };
  });
  return snap;
}
// Retrouve l'élément d'une carte par son instId — sur le plateau réel si
// elle y est encore, sinon (elle vient de mourir dans le même échange de
// coups) un ghost invisible repositionné à sa dernière position connue
// (voir __lastBoardSnapshot), uniquement pour servir de point de départ ou
// d'arrivée à une animation de charge. Sans ce repli, une créature qui
// meurt pendant son propre assaut (ripostée à mort, piège, etc.) ne fonçait
// jamais sur sa cible : son élément avait déjà disparu du plateau au moment
// où l'animation tentait de le retrouver.
function resolveCombatEl(instId){
  const live = document.querySelector(`[data-instid="${instId}"]`);
  if(live) return { el: live, temp: false };
  const snap = __lastBoardSnapshot[instId];
  if(!snap) return { el: null, temp: false };
  const ghost = snap.clone;
  ghost.style.position = 'fixed';
  ghost.style.left = snap.rect.left+'px';
  ghost.style.top = snap.rect.top+'px';
  ghost.style.width = snap.rect.width+'px';
  ghost.style.height = snap.rect.height+'px';
  ghost.style.margin = '0';
  ghost.style.opacity = '0';
  ghost.style.pointerEvents = 'none';
  document.body.appendChild(ghost);
  return { el: ghost, temp: true };
}
// Joue l'animation de mort d'une carte (identifiée par son instId) à partir
// de l'instantané pris avant sa disparition — jamais sur l'élément réel,
// déjà retiré du plateau à ce stade. Un clone fantôme est placé à sa
// position exacte, éclate en une lueur blanche puis se dissout en tombant
// légèrement, avant d'être retiré.
function playCardDeathAnim(instId){
  playSfx('card-death');
  if(combatInstant()) return Promise.resolve(); // mode instantané : le son seul
  const snap = __lastBoardSnapshot[instId];
  if(!snap) return Promise.resolve();
  // Le plateau est gelé sur l'ancien état (voir "Gel du rendu") : la carte
  // réelle y est encore. On la cache pour ne pas voir l'original ET son
  // clone qui se dissout.
  const liveEl = document.querySelector(`[data-instid="${instId}"]`);
  if(liveEl) liveEl.style.visibility = 'hidden';
  const { rect, clone } = snap;
  clone.style.position = 'fixed';
  clone.style.left = rect.left+'px';
  clone.style.top = rect.top+'px';
  clone.style.width = rect.width+'px';
  clone.style.height = rect.height+'px';
  clone.style.margin = '0';
  clone.style.zIndex = '9992';
  clone.style.pointerEvents = 'none';
  document.body.appendChild(clone);
  const deathDur = cms(640);
  const cleanDeath = ()=>{ clone.remove(); };
  registerCombatCleanup(cleanDeath);
  return new Promise(resolve=>{
    const finish = ()=>{ clone.remove(); resolve(); };
    if(clone.animate){
      const anim = clone.animate([
        { transform:'scale(1) rotate(0deg)', opacity:1, filter:'brightness(1) saturate(1)' },
        { transform:'scale(1.08) rotate(-3deg)', opacity:1, filter:'brightness(1.8) saturate(0.2)', offset:0.22 },
        { transform:'scale(0.8) rotate(6deg) translateY(26px)', opacity:0, filter:'brightness(0.3) saturate(0)' }
      ], { duration: deathDur, easing:'ease-in' });
      anim.onfinish = finish;
      anim.oncancel = finish;
    } else {
      setTimeout(finish, deathDur);
    }
  });
}

/* ============================================================
   ANIMATION DES BADGES DE MOTS-CLÉS (gain / perte)
   ============================================================ */
// Un badge GAGNÉ apparaît (zoom + halo vert) ; un badge PERDU laisse un
// fantôme (clone position:fixed à son ancienne place, comme les clones de
// mort) qui rétrécit, rougit et est barré avant de disparaître.
//
// Principe : on compare ce qui était AFFICHÉ au dernier rendu (instantané
// __keywordBadgeSnapshot) à ce qui va l'être (S). Ce n'est volontairement pas
// « PREV_S vs S » : PREV_S peut contenir un état que le gel du rendu n'a
// jamais affiché (deux états reçus pendant une animation de combat). Avec
// l'instantané du dernier rendu : un resync sans changement ou un état rejoué
// à l'identique ne donne aucun écart, le tout premier rendu (instantané nul)
// n'anime rien, et pendant le gel (render() sort tôt) rien ne bouge ; les
// changements issus d'un combat s'animent donc au dégel, APRÈS la file.
const KW_BADGE_GAIN_MS = 700;
const KW_BADGE_LOSS_MS = 800;
// Son discret, UNE fois par lot (existants dans sfx/ ; playSfx respecte la
// sourdine). Gain prioritaire si le lot contient les deux. Conservé en mode
// Instantané, comme le son de mort des cartes : seul le visuel est supprimé.
const KW_BADGE_SFX = { gain:{ key:'cast', volume:0.22 }, loss:{ key:'clic', volume:0.3 } };
let __keywordBadgeSnapshot = null; // null tant qu'aucun rendu n'a eu lieu
function keywordBadgeEl(instId, kw){
  return document.querySelector(`[data-instid="${instId}"] .kw-icon[data-kw="${kw}"]`);
}
// À appeler AVANT que render() ne reconstruise le DOM (S est déjà le nouvel
// état, le DOM encore l'ancien : on y lit la position des badges perdus).
// Ne doit jamais empêcher le rendu : toute erreur renvoie null.
function planKeywordBadgeAnim(){
  try {
    const next = snapshotKeywordBadges(S, [MY_KEY, OPP_KEY]);
    const changes = diffKeywordBadgeSnapshots(__keywordBadgeSnapshot, next);
    __keywordBadgeSnapshot = next;
    if(!changes.length) return null;
    const ghosts = [];
    if(!combatInstant()){
      changes.forEach(ch=>ch.lost.forEach(kw=>{
        const old = keywordBadgeEl(ch.instId, kw);
        if(!old) return; // pas à l'écran (carte au-delà de la 8e, rendu partiel...) : rien à dissoudre
        ghosts.push({ rect: old.getBoundingClientRect(), src: old.getAttribute('src'), filter: getComputedStyle(old).filter });
      }));
    }
    return { changes, ghosts };
  } catch(e){ console.error('Badges de mots-clés : comparaison impossible', e); return null; }
}
function spawnKeywordGhost(g){
  const dur = cms(KW_BADGE_LOSS_MS);
  const wrap = document.createElement('div');
  wrap.className = 'kw-ghost';
  wrap.style.left = g.rect.left+'px';
  wrap.style.top = g.rect.top+'px';
  wrap.style.width = g.rect.width+'px';
  wrap.style.height = g.rect.height+'px';
  wrap.style.animationDuration = dur+'ms';
  const img = document.createElement('img');
  img.src = g.src;
  if(g.filter && g.filter!=='none') img.style.filter = g.filter; // l'ancien badge n'est plus dans .ncard : on recopie son rendu
  const strike = document.createElement('span');
  strike.className = 'kw-ghost-strike';
  strike.style.animationDuration = dur+'ms';
  wrap.appendChild(img);
  wrap.appendChild(strike);
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(), dur+80);
}
// À appeler APRÈS le rendu (classes posées sur le nouveau DOM, par instId).
function playKeywordBadgeChanges(plan){
  if(!plan) return;
  const instant = combatInstant();
  const gainedEls = [];
  plan.changes.forEach(ch=>ch.gained.forEach(kw=>{
    const el = keywordBadgeEl(ch.instId, kw);
    if(el) gainedEls.push({ el, ch, kw });
  }));
  const run = ()=>{
    if(!instant){
      gainedEls.forEach(({ el, ch, kw })=>{
        // le DOM a pu être reconstruit entre-temps (rendu pendant la file) : on relit
        const cur = el.isConnected ? el : keywordBadgeEl(ch.instId, kw);
        if(!cur) return;
        cur.classList.remove('kw-badge-pending');
        const dur = cms(KW_BADGE_GAIN_MS);
        cur.style.animationDuration = dur+'ms';
        cur.classList.add('kw-badge-gain');
        setTimeout(()=>{ cur.classList.remove('kw-badge-gain'); cur.style.animationDuration = ''; }, dur+80);
      });
      plan.ghosts.forEach(spawnKeywordGhost);
    }
    const snd = gainedEls.length ? KW_BADGE_SFX.gain : (plan.changes.some(c=>c.lost.length) ? KW_BADGE_SFX.loss : null);
    if(snd) playSfx(snd.key, snd.volume);
  };
  // Une file d'animations (révélation de capacité...) joue sans gel du
  // plateau : on attend son tour pour ne pas écraser ces animations, en
  // cachant les badges gagnés d'ici là. Si la file est interrompue
  // (« Passer », garde-fou), le nettoyage les remet visibles.
  if(__combatAnimPlaying && !instant){
    gainedEls.forEach(({ el })=>el.classList.add('kw-badge-pending'));
    registerCombatCleanup(()=>gainedEls.forEach(({ el })=>el.classList.remove('kw-badge-pending')));
    queueCombatAnim(run);
  } else {
    run();
  }
}

/* ============================================================
   ANIMATION DE FRAPPE — les cartes qui se ruent l'une sur l'autre (ou
   sur le héros) au moment du combat
   ============================================================ */
// Anime une charge de combat — recul exagéré (élan), puis fonce jusqu'au
// centre de la cible en passant par-dessus elle (façon MTG Arena), avant
// de revenir à sa position. Retourne une Promise résolue à la fin, pour
// pouvoir être mise en file (voir queueCombatAnim) plutôt que jouée
// immédiatement.
// Clone flottant (position:fixed dans le <body>) d'un élément du plateau, placé
// exactement sur lui. On anime ce clone plutôt que l'élément réel : celui-ci est
// reconstruit à chaque mise à jour d'état (très fréquent : ta propre action, la
// diffusion, la resynchronisation périodique), ce qui détruisait l'élément en
// cours d'animation avant même qu'elle ait pu se voir à l'écran. L'élément réel
// est masqué le temps de l'animation ; la fonction renvoyée retire le clone et
// le rend visible (idempotente, enregistrée pour une interruption de la file).
function makeCombatGhost(el, rect){
  const ghost = stripPostureFromGhost(el.cloneNode(true));
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left+'px';
  ghost.style.top = rect.top+'px';
  ghost.style.width = rect.width+'px';
  ghost.style.height = rect.height+'px';
  ghost.style.margin = '0';
  ghost.style.zIndex = '9995';
  ghost.style.pointerEvents = 'none';
  document.body.appendChild(ghost);
  el.style.opacity = '0';
  const restore = ()=>{ ghost.remove(); if(el && el.style) el.style.opacity=''; };
  registerCombatCleanup(restore);
  return { ghost, restore };
}
// Anime une charge de combat : recul d'élan, course jusqu'au CENTRE de la cible
// en passant par-dessus elle (façon MTG Arena), ARRÊT à l'impact, retour à sa
// place. Durées : constantes ANIM_* ci-dessus. (Le « recul » des créatures
// bloquées / bloqueuses n'est plus une animation : c'est un état visuel
// persistant, voir « Posture de combat » : is-withdrawn.)
// Retourne une Promise résolue à la fin, pour pouvoir être mise en file (voir
// queueCombatAnim) plutôt que jouée immédiatement.
// `opts` (tous facultatifs) :
//  - onImpact : appelé à l'arrivée sur la cible (son, flash, chiffres, tremblement).
function lungeToward(el, targetEl, opts){
  opts = (opts && typeof opts==='object') ? opts : {};
  if(!el || !targetEl) return Promise.resolve();
  const windup = cms(ANIM_LUNGE_WINDUP_MS), charge = cms(ANIM_LUNGE_CHARGE_MS);
  const hold = cms(ANIM_IMPACT_HOLD_MS), ret = cms(ANIM_LUNGE_RETURN_MS);
  if(!(windup+charge+hold+ret)){ if(opts.onImpact) opts.onImpact(); return Promise.resolve(); } // instantané : pas de mouvement
  const a = el.getBoundingClientRect(), b = targetEl.getBoundingClientRect();
  const dx = (b.left+b.width/2) - (a.left+a.width/2);
  const dy = (b.top+b.height/2) - (a.top+a.height/2);
  const len = Math.hypot(dx,dy) || 1;
  const ux = dx/len, uy = dy/len;
  const tImpact = windup+charge, tHoldEnd = tImpact+hold, tHome = tHoldEnd+ret, total = tHome;

  const { ghost, restore } = makeCombatGhost(el, a);
  if(opts.onImpact) combatTimeout(opts.onImpact, tImpact);
  return new Promise(resolve=>{
    const done = ()=>{ restore(); resolve(); };
    if(ghost.animate){
      // Recul marqué (élan), puis fonce jusqu'au CENTRE de la cible (dx/dy
      // représentent déjà le vecteur exact jusqu'à ce centre) en le
      // dépassant légèrement, pour donner l'impression de passer par-
      // dessus elle plutôt que de simplement s'y arrêter.
      const hit = `translate(${dx*1.12}px, ${dy*1.12}px) scale(1.22)`;
      const frames = [
        { transform:'translate(0,0) scale(1)', offset:0, easing:'ease-out' },
        { transform:`translate(${-ux*22}px, ${-uy*22}px) scale(1.06)`, offset:windup/total, easing:'cubic-bezier(.5,0,.9,.55)' },
        { transform:hit, offset:tImpact/total, easing:'linear' },
        { transform:hit, offset:tHoldEnd/total, easing:'ease-in-out' }, // arrêt à l'impact
        { transform:'translate(0,0) scale(1)', offset:tHome/total }
      ];
      const anim = ghost.animate(frames, { duration: total });
      anim.onfinish = done;
      anim.oncancel = done;
    } else {
      setTimeout(done, total);
    }
  });
}
// Anneau + éclat rouge/orangé sur la cible d'un coup de combat (distinct de
// l'éclat violet des capacités, voir flashImpact).
function flashCombatImpact(targetEl){
  if(!targetEl) return;
  const fxMs = cms(ANIM_IMPACT_FX_MS);
  if(!fxMs) return;
  const r = targetEl.getBoundingClientRect();
  const ring = document.createElement('div');
  ring.className = 'combat-impact-ring';
  ring.style.left = (r.left+r.width/2)+'px';
  ring.style.top = (r.top+r.height/2)+'px';
  ring.style.animationDuration = fxMs+'ms';
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(), fxMs+30);
  targetEl.style.animationDuration = fxMs+'ms';
  targetEl.classList.add('combat-hit-flash');
  setTimeout(()=>{ if(targetEl && targetEl.classList){ targetEl.classList.remove('combat-hit-flash'); targetEl.style.animationDuration = ''; } }, fxMs+30);
}

// ---------------- File d'animations de combat ----------------
// Toutes les frappes se jouent maintenant une par une, jamais simultanément
// (même quand plusieurs créatures attaquent la même cible) — et les
// actions des deux joueurs sont figées tant que la file n'est pas vide.
let __combatAnimQueue = [];
let __combatAnimPlaying = false;
let __combatAnimGen = 0;      // identifie la "session" de lecture en cours (voir releaseCombatAnimLock)
let __combatAnimWatchdog = null;
let __combatAnimStartedAt = 0;
// Garde-fous : la file ne doit jamais bloquer le jeu (animation qui ne se
// termine pas, onfinish jamais appelé, onglet en arrière-plan...). Passé ces
// délais on abandonne le reste de la file, on rend l'état final et on débloque
// les actions. Depuis que les séquences de combat sont plus longues, le
// minuteur est RELANCÉ avant chaque élément de la file : MAX_MS = temps
// maximal accordé à UN élément, TOTAL_MAX_MS = plafond pour toute la file.
const COMBAT_ANIM_MAX_MS = 10000;
const COMBAT_ANIM_TOTAL_MAX_MS = 30000;

// ---------------- Vitesse des animations de combat (options) ----------------
// Réglage « Vitesse des animations de combat » de la modale d'options
// (spellcraft-shared.js) : Normale (1x), Rapide (2x : toutes les durées /2),
// Instantanée (animations de combat ignorées, état final rendu directement,
// seul un son d'impact par coup est conservé). cms(ms) convertit une durée
// de référence (vitesse normale) en durée réelle ; 0 en mode instantané.
function combatSpeedMode(){
  try { return typeof scGetCombatSpeedMode==='function' ? scGetCombatSpeedMode() : 'normal'; }
  catch(e){ return 'normal'; }
}
function combatInstant(){ return combatSpeedMode()==='instant'; }
function cms(ms){
  try { return typeof scScaleMs==='function' ? scScaleMs(ms, combatSpeedMode()) : ms; }
  catch(e){ return ms; }
}

// Bouton « Passer » : la classe combat-skip-enabled sur <body> (voir CSS de
// #combat-skip-btn) suit la case à cocher des options, y compris changée en
// cours de partie (événement envoyé par spellcraft-shared.js).
function syncCombatSkipButton(){
  let on = false;
  try { on = typeof scGetShowSkipButton==='function' && scGetShowSkipButton(); } catch(e){}
  document.body.classList.toggle('combat-skip-enabled', !!on);
}
window.addEventListener('sc-combat-options-changed', syncCombatSkipButton);
syncCombatSkipButton();

// Nettoyages à exécuter si la file est interrompue (clones flottants à retirer,
// cartes réelles à rendre visibles) — idempotents. Vidés à chaque fin de file.
let __combatCleanups = [];
function registerCombatCleanup(fn){ __combatCleanups.push(fn); }
// setTimeout lié à la session de lecture en cours : si la file est
// interrompue (garde-fou, bouton Passer) entre-temps, le rappel ne s'exécute pas.
function combatTimeout(fn, ms){
  const gen = __combatAnimGen;
  return setTimeout(()=>{ if(gen === __combatAnimGen) fn(); }, ms);
}
function queueCombatAnim(fn){
  __combatAnimQueue.push(fn);
  processCombatAnimQueue();
}
// Fin de lecture (normale ou forcée) : lève le verrou, affiche l'état final
// puis applique l'éventuel état arrivé entre-temps. Idempotent.
function releaseCombatAnimLock(){
  clearTimeout(__combatAnimWatchdog);
  __combatAnimWatchdog = null;
  __combatAnimGen++; // invalide la boucle de lecture éventuellement encore suspendue
  __combatAnimQueue.length = 0;
  const cleanups = __combatCleanups; __combatCleanups = [];
  cleanups.forEach(fn=>{ try{ fn(); }catch(e){} });
  document.body.classList.remove('combat-anim-lock');
  __combatAnimPlaying = false;
  // Rend d'abord l'état final (S) que le gel avait retenu...
  unfreezeBoardRender();
  // ...puis applique maintenant le dernier état arrivé pendant que la file
  // jouait (voir onStateUpdate) — sinon le plateau resterait figé sur un état
  // périmé jusqu'à la prochaine mise à jour, qui peut tarder.
  if(__pendingStateWhileAnimating){
    const pending = __pendingStateWhileAnimating;
    __pendingStateWhileAnimating = null;
    onStateUpdate(pending);
  }
}
// Interruption immédiate (bouton « Passer » ou garde-fou) : coupe les sons en
// cours, retire tout ce qui flotte encore (chiffres, flèches, révélation,
// clones), puis lève le verrou et rend l'état final.
const COMBAT_ABORT_PURGE_SELECTOR = '.dmg-popup, .ability-reveal-overlay, .ability-bolt, .ability-impact-ring, .ability-self-burst, .combat-impact-ring, .kw-ghost';
function abortCombatAnimations(){
  try { if(typeof stopAllSfx==='function') stopAllSfx(); } catch(e){}
  document.querySelectorAll(COMBAT_ABORT_PURGE_SELECTOR).forEach(n=>n.remove());
  releaseCombatAnimLock();
}
// (Ré)arme le garde-fou : au plus MAX_MS pour l'élément qui démarre, sans
// jamais dépasser TOTAL_MAX_MS depuis le début de la lecture.
function armCombatWatchdog(){
  clearTimeout(__combatAnimWatchdog);
  const left = COMBAT_ANIM_TOTAL_MAX_MS - (Date.now() - __combatAnimStartedAt);
  __combatAnimWatchdog = setTimeout(()=>{
    console.warn('File d\'animations de combat : délai dépassé, rendu final forcé');
    abortCombatAnimations();
  }, Math.max(0, Math.min(COMBAT_ANIM_MAX_MS, left)));
}
async function processCombatAnimQueue(){
  if(__combatAnimPlaying) return;
  __combatAnimPlaying = true;
  const gen = ++__combatAnimGen;
  __combatAnimStartedAt = Date.now();
  document.body.classList.add('combat-anim-lock');
  while(__combatAnimQueue.length){
    if(gen !== __combatAnimGen) return; // déblocage forcé entre-temps
    const fn = __combatAnimQueue.shift();
    armCombatWatchdog();
    try { await fn(); } catch(e) { console.error('Erreur animation de combat', e); }
  }
  if(gen !== __combatAnimGen) return;
  releaseCombatAnimLock();
}
// Chiffre flottant au centre de `anchorEl`. Ancien appel (amount seul) : « -N »
// (rien si 0). `opts.spec` = résultat de damagePopupSpec (bouclier, « 0 »...).
function spawnDamageNumber(anchorEl, amount, opts){
  opts = opts || {};
  const spec = opts.spec || (amount ? damagePopupSpec(amount, false) : null);
  if(!anchorEl || !spec) return;
  const r = anchorEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'dmg-popup ' + spec.cls;
  el.textContent = spec.text;
  el.style.left = (r.left+r.width/2)+'px';
  el.style.top = (r.top+r.height/2)+'px';
  const lifeMs = cms(1400);
  el.style.animationDuration = lifeMs+'ms';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), lifeMs+50);
}
// Effets du choc d'un blocage, appelés au moment de l'impact : sons selon les
// dégâts (voir planBlockSounds), chiffres sur chacune des deux créatures, et
// tremblement d'écran selon le plus gros coup.
function applyBlockImpact(attEl, blkEl, o){
  planBlockSounds(o).forEach(snd=>{
    if(snd.delayMs>0) combatTimeout(()=>playSfx(snd.key, snd.volume), cms(snd.delayMs));
    else playSfx(snd.key, snd.volume);
  });
  // Le coup de l'attaquant (chiffre sur le bloqueur) puis la riposte (chiffre
  // sur l'attaquant, à son emplacement d'origine), avec le même décalage que les sons.
  const specB = damagePopupSpec(o.dmgToBlocker, o.absorbedBlocker);
  const specA = damagePopupSpec(o.dmgToAttacker, o.absorbedAttacker);
  flashCombatImpact(blkEl);
  if(specB) spawnDamageNumber(blkEl, 0, { spec:specB });
  if(specA) combatTimeout(()=>spawnDamageNumber(attEl, 0, { spec:specA }), cms(SFX_RIPOSTE_GAP_MS));
  const big = maxBlockDamage(o);
  if(big!==null) shakeScreen(hitSfxForDamage(big));
}
// Joue l'animation de frappe pour un combat entre deux instId (créature vs
// créature) — appelé juste après avoir reçu la confirmation du serveur.
// Seul l'attaquant charge — le bloqueur ne fait jamais de charge en
// retour, même s'il riposte (voir la discussion sur les animations : la
// bloqueuse ripostant n'est pas "agressive" au sens visuel du terme).
// `outcome` : résultat du blocage (voir resolveBlockOutcome) — dégâts exacts
// si le serveur a envoyé l'événement blockResolved, estimés sinon.
function playCombatStrike(attackerInstId, blockerInstId, outcome){
  if(combatInstant()){
    // mode instantané : pas de charge, de chiffres ni de tremblement ; un seul
    // son d'impact, celui du coup le plus fort
    const snd = pickLoudestSound(planBlockSounds(outcome || {}));
    if(snd) playSfx(snd.key, snd.volume);
    return;
  }
  queueCombatAnim(()=>{
    const attRes = resolveCombatEl(attackerInstId);
    const heroSlot = S.active===MY_KEY ? 'p2' : 'p1';
    const blkRes = blockerInstId ? resolveCombatEl(blockerInstId) : { el: document.getElementById(`hero-frame-${heroSlot}`), temp: false };
    const attEl = attRes.el, blkEl = blkRes.el;
    debugLog(`[anim] playCombatStrike : attEl=${!!attEl} blkEl=${!!blkEl}`, attEl&&blkEl ? 'log-ok' : 'log-error');
    const cleanup = ()=>{ if(attRes.temp) attEl.remove(); if(blkRes.temp) blkEl.remove(); };
    if(!attEl || !blkEl){ cleanup(); return Promise.resolve(); }
    // Dernier repli (ni événement ni créature dans PREV_S) : force lue dans le
    // DOM encore affiché — approximatif, comme avant l'ajout des événements.
    const domAtk = el=>{
      const t = el.querySelector('.nstat-wrap.n-atk .nstat-txt');
      return t ? (parseInt(t.textContent, 10) || 0) : null;
    };
    const o = Object.assign({}, outcome || {});
    if(!isCombatNumber(o.dmgToBlocker)) o.dmgToBlocker = domAtk(attEl);
    if(!isCombatNumber(o.dmgToAttacker)) o.dmgToAttacker = domAtk(blkEl);
    // Pas de recul en fin de coup : le retrait des créatures bloquées / bloqueuses
    // est un état persistant, posé par le rendu au dégel (voir « Posture de combat »).
    return arrowThenLunge(attEl, blkEl, {
      onImpact: ()=>applyBlockImpact(attEl, blkEl, o)
    }).then(cleanup);
  });
}

/* ============================================================
   RÉVÉLATION 3D — carte jouée / piège déclenché (voir renderGameLog,
   plus bas, qui appelle ceci via queueCombatAnim pour chaque nouvelle
   entrée kind==='play' ou kind==='trap').
   ============================================================ */
function playCardFlipReveal(card, opts={}){
  return new Promise(resolve=>{
    if(!card){ resolve(); return; }
    const overlay = document.createElement('div');
    overlay.className = 'ability-reveal-overlay';
    const flip = document.createElement('div');
    flip.className = 'ability-reveal-flip';
    const inner = document.createElement('div');
    inner.className = 'ability-reveal-inner';
    const back = document.createElement('div');
    back.className = 'ability-reveal-face ability-reveal-back';
    if(opts.backUrl){
      // Dos personnalisé du joueur propriétaire (celui équipé dans son
      // profil) — cohérent avec ce qu'il voit déjà à l'ouverture d'un
      // booster ou sur son deck. On garde quand même le loup en petit
      // repère visuel pour un piège, discret dans le coin.
      back.style.backgroundImage = `url('${opts.backUrl.replace(/'/g,'')}')`;
      back.style.backgroundSize = 'cover';
      back.style.backgroundPosition = 'center';
      if(opts.isTrap) back.innerHTML = `<span class="trap-reveal-icon trap-reveal-icon-corner">🐺</span>`;
    } else {
      back.innerHTML = `<span class="trap-reveal-icon">${opts.isTrap ? '🐺' : '🃏'}</span>`;
    }
    const front = document.createElement('div');
    front.className = 'ability-reveal-face ability-reveal-front';
    try {
      front.appendChild(cardEl(card, {isPreview:true}));
    } catch(e) {
      console.error('Erreur playCardFlipReveal (cardEl) :', e, card);
    }
    inner.appendChild(back); inner.appendChild(front);
    flip.appendChild(inner);
    overlay.appendChild(flip);
    document.body.appendChild(overlay);

    let done = false;
    const finish = ()=>{
      if(done) return; done = true;
      overlay.classList.remove('show');
      overlay.classList.add('closing');
      setTimeout(()=>{ overlay.remove(); resolve(); }, 300);
    };
    // Un clic sur l'overlay permet d'écourter — utile pour un joueur qui
    // enchaîne vite et ne veut pas attendre la fin de chaque révélation.
    overlay.onclick = finish;

    requestAnimationFrame(()=>{
      overlay.classList.add('show');
      setTimeout(()=>{ inner.classList.add('flipped'); }, 220);
    });
    const holdMs = opts.isTrap ? 1500 : 1150;
    setTimeout(finish, 220 + 550 + holdMs);
  });
}

/* ============================================================
   RÉSOLUTION SOURCE/CIBLE D'UNE ENTRÉE DE JOURNAL — voir le champ
   sourceInstId ajouté côté serveur (startLogContext/pushLogEntry) et
   les targetInstIds déjà présents par effet. 'hero-p1'/'hero-p2' sont
   des clés synthétiques (voir logCardOutcome côté serveur) qui
   désignent un héros plutôt qu'une créature — jamais un vrai instId.
   ============================================================ */
function resolveLogSourceEl(entry){
  if(entry.sourceInstId){
    const el = document.querySelector(`[data-instid="${entry.sourceInstId}"]`);
    if(el) return el;
  }
  // Repli : portrait du héros propriétaire de la capacité (piège, région,
  // pouvoir de héros, ou simplement une créature qui n'est plus sur le
  // plateau au moment où l'animation se joue).
  const slot = entry.ownerKey===MY_KEY ? 'p1' : 'p2';
  return document.getElementById(`hero-frame-${slot}`);
}
function resolveLogTargetEl(targetInstId){
  if(!targetInstId) return null;
  if(targetInstId==='hero-p1' || targetInstId==='hero-p2'){
    const serverKey = targetInstId==='hero-p1' ? 'p1' : 'p2';
    const slot = serverKey===MY_KEY ? 'p1' : 'p2';
    return document.getElementById(`hero-frame-${slot}`);
  }
  return document.querySelector(`[data-instid="${targetInstId}"]`);
}

/* ============================================================
   FLÈCHE DE CAPACITÉ — un projectile lumineux voyage de la source vers
   la cible, puis un éclat d'impact marque l'arrivée. Anime un élément
   flottant indépendant (comme lungeToward) — jamais l'élément réel de
   la carte, pour ne pas interférer avec son propre rendu.
   ============================================================ */
function fireAbilityArrow(sourceEl, targetEl){
  return new Promise(resolve=>{
    if(!sourceEl || !targetEl){ resolve(); return; }
    const a = sourceEl.getBoundingClientRect(), b = targetEl.getBoundingClientRect();
    const x1 = a.left+a.width/2, y1 = a.top+a.height/2;
    const x2 = b.left+b.width/2, y2 = b.top+b.height/2;
    const dx = x2-x1, dy = y2-y1;
    const dist = Math.hypot(dx,dy) || 1;
    const angle = Math.atan2(dy,dx) * 180/Math.PI;

    const bolt = document.createElement('div');
    bolt.className = 'ability-bolt';
    bolt.style.left = x1+'px';
    bolt.style.top = y1+'px';
    document.body.appendChild(bolt);

    const boltMs = cms(420);
    if(!bolt.animate || !boltMs){ bolt.remove(); flashImpact(targetEl); resolve(); return; }
    const anim = bolt.animate([
      { transform:`translate(0,-50%) rotate(${angle}deg) translateX(0)`, opacity:0 },
      { transform:`translate(0,-50%) rotate(${angle}deg) translateX(0)`, opacity:1, offset:0.08 },
      { transform:`translate(0,-50%) rotate(${angle}deg) translateX(${dist}px)`, opacity:1, offset:0.92 },
      { transform:`translate(0,-50%) rotate(${angle}deg) translateX(${dist}px)`, opacity:0 }
    ], { duration: boltMs, easing:'cubic-bezier(.3,.1,.2,1)' });
    anim.onfinish = ()=>{ bolt.remove(); flashImpact(targetEl); resolve(); };
    anim.oncancel = ()=>{ bolt.remove(); resolve(); };
  });
}
function flashImpact(targetEl){
  if(!targetEl) return;
  const r = targetEl.getBoundingClientRect();
  const ring = document.createElement('div');
  ring.className = 'ability-impact-ring';
  ring.style.left = (r.left+r.width/2)+'px';
  ring.style.top = (r.top+r.height/2)+'px';
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(), 520);
  targetEl.classList.add('ability-hit-flash');
  setTimeout(()=>{ if(targetEl && targetEl.classList) targetEl.classList.remove('ability-hit-flash'); }, 520);
}
// Effet distinct quand une capacité se cible elle-même : pas de flèche
// (rien à relier), un éclat doré qui converge sur la carte suffit à bien
// repérer le déclenchement, sans le confondre avec une flèche classique.
function flashSelfTrigger(el){
  return new Promise(resolve=>{
    if(!el){ resolve(); return; }
    el.classList.add('ability-self-trigger');
    setTimeout(()=>{ if(el && el.classList) el.classList.remove('ability-self-trigger'); }, 900);
    const r = el.getBoundingClientRect();
    const burst = document.createElement('div');
    burst.className = 'ability-self-burst';
    burst.style.left = (r.left+r.width/2)+'px';
    burst.style.top = (r.top+r.height/2)+'px';
    document.body.appendChild(burst);
    setTimeout(()=>{ burst.remove(); resolve(); }, 650);
  });
}

let JOURNAL_CARD_LOOKUP = {}; // id -> carte complète, pour les aperçus au survol dans le journal

function startCardDrag(ev, handIndex, sourceEl){
  ev.preventDefault();
  const rect = sourceEl.getBoundingClientRect();
  const ghost = sourceEl.cloneNode(true);
  ghost.style.position = 'fixed';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.margin = '0';
  ghost.style.zIndex = '9999';
  ghost.style.pointerEvents = 'none';
  ghost.style.transform = 'scale(1.08) rotate(-2deg)';
  ghost.style.boxShadow = '0 16px 30px rgba(0,0,0,.6)';
  ghost.classList.add('drag-ghost');
  document.body.appendChild(ghost);

  sourceEl.style.opacity = '.3';

  DRAG_STATE = {
    handIndex, ghost,
    offsetX: ev.clientX - rect.left,
    offsetY: ev.clientY - rect.top,
    sourceEl
  };

  document.addEventListener('pointermove', onCardDragMove);
  document.addEventListener('pointerup', onCardDragEnd);
}

function isOverDropZone(ev){
  const lane = document.getElementById('lane-p1');
  const laneRect = lane.getBoundingClientRect();
  // La zone valide s'étend du haut de la voie de combat jusqu'à une petite
  // marge en dessous (un geste vers le haut depuis la main suffit) — mais
  // PAS jusqu'à la main elle-même, sinon relâcher la carte sans vraiment la
  // déplacer (ou la reposer dans sa main) jouerait la carte par erreur.
  const forgivingMargin = 70;
  if(ev.clientX>=laneRect.left && ev.clientX<=laneRect.right && ev.clientY>=laneRect.top && ev.clientY<=laneRect.bottom+forgivingMargin) return true;

  // les emplacements d'artefacts comptent aussi comme zone de dépôt valide
  const slots = document.querySelectorAll('#artifacts-p1 .relic-slot');
  for(const s of slots){
    const r = s.getBoundingClientRect();
    if(ev.clientX>=r.left && ev.clientX<=r.right && ev.clientY>=r.top && ev.clientY<=r.bottom) return true;
  }
  return false;
}

function onCardDragMove(ev){
  if(!DRAG_STATE) return;
  const { ghost, offsetX, offsetY } = DRAG_STATE;
  ghost.style.left = (ev.clientX - offsetX) + 'px';
  ghost.style.top = (ev.clientY - offsetY) + 'px';

  const zone = document.getElementById('lane-p1');
  const over = isOverDropZone(ev);
  zone.classList.toggle('drop-target', over);
}

// Une créature qui vise une cible "alliée désignée" doit pouvoir se
// cibler elle-même une fois posée — mais au moment de cette vérification,
// elle n'existe pas encore visuellement sur le plateau (juste en main).
// On la compte donc comme candidate potentielle hypothétique ici, en plus
// des créatures déjà en jeu, pour savoir s'il existe VRAIMENT une raison
// de demander une cible au joueur.
function hasAnyPossibleTargetForPlay(card, tgt){
  const oppKey = MY_KEY==='p1' ? 'p2' : 'p1';
  const allowedKeys = tgt.targetOwner==='ally' ? [MY_KEY] : tgt.targetOwner==='enemy' ? [oppKey] : [MY_KEY, oppKey];
  const matchesFilters = (c)=>{
    if(tgt.subtypeFilter && !(c.subtypes||[]).some(s=>s.toLowerCase()===tgt.subtypeFilter.toLowerCase())) return false;
    if(tgt.statFilterEnabled){
      const stat = tgt.statFilterStat==='atk' ? (c.curAtk ?? c.atk) : (c.curHp ?? c.hp);
      if(tgt.statFilterMode==='atLeast' && !(stat>=tgt.statFilterValue)) return false;
      if(tgt.statFilterMode==='atMost' && !(stat<=tgt.statFilterValue)) return false;
      if(tgt.statFilterMode==='exactly' && stat!==tgt.statFilterValue) return false;
    }
    return true;
  };
  if(tgt.targetCategory==='creature' || tgt.targetCategory==='hero_creature' || tgt.targetCategory==='artifact'){
    for(const k of allowedKeys){
      const pool = tgt.targetCategory==='artifact' ? S[k].relics : S[k].board;
      if((pool||[]).some(matchesFilters)) return true;
    }
    // La carte en cours de pose elle-même, une fois en jeu — seulement si
    // "allié" est autorisé et qu'elle est bien une créature (les cibles
    // de type artefact ne peuvent jamais se référer à une créature qu'on
    // pose).
    if(card.type==='Créature' && tgt.targetCategory!=='artifact' && allowedKeys.includes(MY_KEY) && matchesFilters(card)) return true;
    if(tgt.targetCategory==='hero_creature') return true; // un héros est toujours une cible valide
  }
  return false;
}
function onCardDragEnd(ev){
  if(!DRAG_STATE) return;
  const { handIndex, ghost, sourceEl } = DRAG_STATE;
  const zone = document.getElementById('lane-p1');
  const over = isOverDropZone(ev);

  zone.classList.remove('drop-target');
  ghost.remove();
  if(sourceEl) sourceEl.style.opacity = '';
  document.removeEventListener('pointermove', onCardDragMove);
  document.removeEventListener('pointerup', onCardDragEnd);
  DRAG_STATE = null;

  if(over){
    const card = S[MY_KEY].hand[handIndex];
    // Le choix A/B (s'il y en a un) doit être résolu EN PREMIER, avant
    // toute logique de ciblage — sinon une carte qui a à la fois une
    // cible désignée ET un choix ne proposait jamais son choix, puisque
    // le sélecteur de cible prenait la main avant que uiPlayCard() (qui
    // contient cette vérification) n'ait jamais la moindre chance de
    // s'exécuter.
    const choiceAbility = card ? getUseChoiceAbility(card) : null;
    if(card && card.type==='Piège'){
      uiSetTrap(handIndex);
    } else if(choiceAbility){
      showCardChoiceModal(card, choiceAbility, (pickedKey)=>{ continueCardDragDecision(handIndex, pickedKey); });
    } else {
      continueCardDragDecision(handIndex, null);
    }
  }
}
// Suite de la décision après glisser-déposer — extrait de onCardDragEnd
// pour pouvoir être rejouée une fois un choix A/B résolu (voir ci-dessus),
// avec le choix maintenant connu (choiceKey).
function continueCardDragDecision(handIndex, choiceKey){
    const card = S[MY_KEY].hand[handIndex];
    const newTrigger = card && card.type==='Sortilège' ? null : 'onPlay'; // sortilège : n'importe quelle capacité s'applique direct
    const chosen = card ? findNewFormatChosenTarget(card, newTrigger) : null;
    if(chosen && card.type==='Créature' && !hasAnyPossibleTargetForPlay(card, chosen.target)){
      // Aucune cible possible, même en comptant la créature elle-même une
      // fois posée — contrairement à un sort ou un piège, une créature
      // doit quand même pouvoir être jouée : son effet à la pose ne fera
      // simplement rien faute de cible.
      uiPlayCard(handIndex, null, null, choiceKey);
    } else if(chosen){
      UI.pendingNewTarget = { kind:'card', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: { index: handIndex, choiceKey } };
      render();
    } else if(card && needsTargetClient(card)){
      UI.pendingCard = { index: handIndex, card, choiceKey };
      render();
    } else {
      uiPlayCard(handIndex, null, null, choiceKey);
    }
}

// Affiche un compte à rebours — interpolé localement entre deux passages du
// serveur (qui, lui, fait foi ; ceci n'est qu'un affichage). Rafraîchi
// toutes les 500ms, indépendamment des mises à jour d'état.
function renderTurnTimer(){
  const el = document.getElementById('turn-timer');
  if(!el || !S) return;
  if(S.gameOver || S.phase==='mulligan' || !S.active){ el.style.display='none'; return; }

  // minuteur de blocage (45s), prioritaire sur celui de tour
  if(S.phase==='declareBlockersMe' && S.blockClockStartedAt){
    const elapsed = (Date.now()-S.blockClockStartedAt)/1000;
    const remaining = Math.max(0, 45-elapsed);
    el.style.display='flex';
    el.className = 'timer-block' + (remaining<=10?' timer-low':'');
    const who = S.active===MY_KEY ? "L'adversaire bloque" : 'Vous bloquez';
    el.textContent = `${who} — ${Math.ceil(remaining)}s`;
    return;
  }

  const p = S[S.active];
  if(!p || p.isAI){ el.style.display='none'; return; }
  let budget = p.turnTimeBudget ?? 120;
  if(!S.turnClockPaused && S.turnClockStartedAt){
    const elapsed = (Date.now()-S.turnClockStartedAt)/1000;
    budget = Math.max(0, budget-elapsed);
  }
  el.style.display='flex';
  const mins = Math.floor(budget/60), secs = Math.floor(budget%60);
  const label = S.active===MY_KEY ? 'Votre tour' : "Tour adverse";
  el.className = (S.active===MY_KEY?'timer-mine':'') + (budget<=20?' timer-low':'') + (S.turnClockPaused?' timer-paused':'');
  el.textContent = `${label} — ${mins}:${String(secs).padStart(2,'0')}${S.turnClockPaused?' (pause)':''}`;
}

// Rappel clignotant + sonore quand le bouton d'action (combat / fin de tour /
// fin de blocage) reste cliquable trop longtemps sans que le joueur agisse.
// __phaseReminder.key identifie l'état actionnable en cours (pas le texte du
// bouton, qui peut changer sans que l'état change — ex: le nombre
// d'attaquants sélectionnés) : tant que la clé ne change pas, le minuteur
// n'est jamais réinitialisé, y compris à travers les re-rendus périodiques
// (resynchronisation, voir onStateUpdate) qui reconstruisent le bouton.
let __phaseReminder = { key:null, blinking:false, timeoutId:null, intervalId:null };
function clearPhaseReminder(){
  if(__phaseReminder.timeoutId) clearTimeout(__phaseReminder.timeoutId);
  if(__phaseReminder.intervalId) clearInterval(__phaseReminder.intervalId);
  __phaseReminder = { key:null, blinking:false, timeoutId:null, intervalId:null };
}
function startPhaseReminderBlink(phaseKey){
  if(__phaseReminder.key !== phaseKey) return; // l'état a changé entre-temps (annulé plus haut normalement)
  __phaseReminder.blinking = true;
  const btn = document.querySelector('#phase-bar .phase-btn:not(.secondary)');
  if(btn) btn.classList.add('reminder-blink');
  playSfx('phase-reminder');
  __phaseReminder.intervalId = setInterval(()=>{
    if(__phaseReminder.key !== phaseKey){ clearPhaseReminder(); return; }
    playSfx('phase-reminder');
  }, 9000);
}
function setupPhaseReminder(btn, phaseKey){
  if(!phaseKey){ clearPhaseReminder(); return; }
  if(__phaseReminder.key !== phaseKey){
    clearPhaseReminder();
    __phaseReminder.key = phaseKey;
    __phaseReminder.timeoutId = setTimeout(()=>startPhaseReminderBlink(phaseKey), 30000);
  } else if(__phaseReminder.blinking){
    // Même état déjà signalé — le bouton vient d'être recréé (re-rendu), on
    // réapplique juste le clignotement plutôt que de repartir de zéro.
    btn.classList.add('reminder-blink');
  }
}

function renderPhaseBar(){
  const bar = document.getElementById('phase-bar');
  bar.innerHTML = '';
  if(S.gameOver){ clearPhaseReminder(); return; }

  if(S.pendingSacrifice && S.pendingSacrifice.playerKey===MY_KEY){
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    btn.textContent = 'Choisis une créature à sacrifier...';
    btn.disabled = true;
    bar.appendChild(btn);
    clearPhaseReminder();
    return;
  }

  if(UI.pendingCard || UI.pendingPower || UI.pendingNewTarget){
    const btn = document.createElement('button');
    btn.className = 'phase-btn';
    if(UI.pendingNewTarget){
      const needed = newFormatTargetCount(UI.pendingNewTarget.target);
      const got = UI.pendingNewTarget.selectedInstIds.length;
      btn.textContent = needed>1 ? `Choisis une cible (${got}/${needed})...` : 'Choisis une cible...';
    } else {
      btn.textContent = 'Choisis une cible...';
    }
    btn.disabled = true;
    bar.appendChild(btn);
    const cancel = document.createElement('button');
    cancel.className = 'phase-btn secondary small';
    cancel.textContent = 'Annuler';
    cancel.onclick = UI.pendingNewTarget ? cancelPendingNewTarget : cancelPendingCard;
    bar.appendChild(cancel);
    clearPhaseReminder();
