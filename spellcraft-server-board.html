    return;
  }

  if(S.phase==='mulligan'){
    if(!S.mulliganDone[MY_KEY]){
      showMulliganOverlay();
    } else {
      const btn = document.createElement('button');
      btn.className = 'phase-btn';
      btn.textContent = "En attente de l'adversaire...";
      btn.disabled = true;
      bar.appendChild(btn);
    }
    clearPhaseReminder();
    return;
  }

  const myTurn = S.active===MY_KEY;
  const me = S[MY_KEY];
  const btn = document.createElement('button');
  btn.className = 'phase-btn';
  let phaseKey = null; // reste null tant qu'aucune action n'est vraiment attendue du joueur

  if(!myTurn){
    if(S.phase==='declareBlockersMe'){
      btn.textContent = 'Passer (fin du blocage)';
      btn.onclick = uiFinishBlocking;
      phaseKey = 'block-pass';
    } else {
      btn.textContent = 'Tour adverse';
      btn.disabled = true;
    }
  } else if(S.phase==='declareBlockersMe'){
    btn.textContent = "En attente du blocage adverse...";
    btn.disabled = true;
  } else if(UI.selectingAttackers){
    btn.textContent = UI.selectedAttackers.length ? `Valider ${UI.selectedAttackers.length} attaquant(s)` : "Passer l'attaque";
    btn.onclick = uiConfirmAttackers;
    phaseKey = 'attack-confirm';
    // Le bouton "Tout sélectionner" (et "Annuler") passe sous le bouton
    // d'attaque, dans un empilement vertical plutôt qu'à côté.
    const selectAll = document.createElement('button');
    selectAll.className = 'phase-btn secondary small';
    selectAll.textContent = 'Tout sélectionner';
    selectAll.onclick = uiSelectAllAttackers;
    const cancel = document.createElement('button');
    cancel.className = 'phase-btn secondary small';
    cancel.textContent = 'Annuler';
    cancel.onclick = ()=>{ UI.selectingAttackers = false; UI.selectedAttackers = []; render(); };
    const subRow = document.createElement('div');
    subRow.className = 'phase-bar-subrow';
    subRow.appendChild(selectAll);
    subRow.appendChild(cancel);
    const stack = document.createElement('div');
    stack.className = 'phase-bar-stack';
    stack.appendChild(btn);
    stack.appendChild(subRow);
    bar.appendChild(stack);
  } else if(S.phase==='main' && !me.attackPhaseDone){
    btn.textContent = '⚔ Passer au combat';
    btn.onclick = ()=>{ UI.selectingAttackers = true; UI.selectedAttackers = []; render(); };
    phaseKey = 'to-combat';
  } else if(S.phase==='main' && me.attackPhaseDone){
    btn.textContent = 'Fin de tour';
    btn.onclick = uiEndTurn;
    phaseKey = 'end-turn';
  }

  if(!btn.parentNode) bar.appendChild(btn);
  setupPhaseReminder(btn, phaseKey);
}

// ---------------- Aperçu du héros au survol ----------------

function showHeroPreview(hero, ev){ showCardPreviewHover(hero, ev); }
function moveHeroPreview(ev){
  __lastPreviewEvent = ev;
  const box = document.getElementById('card-preview');
  // Décalage large et volontaire — sur le plateau, les cartes (surtout les
  // artefacts) sont minuscules ; un aperçu trop proche du curseur les
  // recouvre entièrement, rendant impossible de viser le clic précis en
  // dessous (même si l'aperçu lui-même laisse passer les clics).
  // Largeur réelle de la boîte (variable : un héros avec ses cartes liées
  // est bien plus large qu'une carte seule) plutôt qu'une valeur fixe.
  const boxWidth = box.offsetWidth || 300;
  const boxHeight = box.offsetHeight || 420;
  const x = Math.min(ev.clientX + 60, window.innerWidth - boxWidth - 20);
  const y = Math.min(ev.clientY + 60, window.innerHeight - boxHeight - 20);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
// `force` : ignore l'épinglage (appui en dehors de l'aperçu). Utilisée aussi
// comme gestionnaire d'événement (le paramètre est alors l'événement : sans effet).
function hidePreview(force){
  if(__previewPinned && force!==true) return;
  __previewPinned = false;
  __previewHoverToken++;
  document.getElementById('card-preview').classList.remove('show');
}

function renderEmoteGrid(){
  const grid = document.getElementById('emote-grid');
  const hero = S && S[MY_KEY] && S[MY_KEY].hero;
  const emotes = (hero && hero.emotes) || [];
  if(emotes.length===0){

async function uiSendEmote(emote){
  const res = await gsSendEmote(emote.image, emote.label||'');
  if(res && res.error){ console.error('Émote → ' + res.error); alert("L'émote n'a pas pu être envoyée : " + res.error); }
}
// Reçue via le canal de diffusion de la partie (broadcast, event 'emote')
// — le payload transporte directement l'image, l'info-bulle et le camp de
// l'émetteur, plus besoin de passer par la base de données.
function onEmoteMessage(payload){
  if(!payload) return;
  const senderKey = payload.senderKey === 'p1' || payload.senderKey === 'p2' ? payload.senderKey : null;
  const isMine = senderKey===MY_KEY;
  const anchorId = isMine ? 'hero-frame-p1' : 'hero-frame-p2';
  const anchor = document.getElementById(anchorId);
  console.log('Émote reçue', {senderKey, MY_KEY, OPP_KEY, anchorId, anchorFound: !!anchor});
  const bubble = document.createElement('div');
  bubble.className = 'emote-bubble';
  if(anchor){
    const rect = anchor.getBoundingClientRect();
    bubble.style.left = (rect.left + rect.width/2 - 57) + 'px';
    // Notre propre cadre est en bas de l'écran : la bulle flotte au-dessus.
    // Le cadre adverse est en haut : la bulle flotte en dessous. Les deux
    // se rapprochent donc du centre du plateau, plutôt que de toujours
    // remonter (ce qui, pour le cadre adverse déjà en haut, la poussait
    // hors de l'écran ou la rendait à peine visible).
    bubble.style.top = isMine ? (rect.top - 100) + 'px' : (rect.bottom + 20) + 'px';
  } else {
    // Repli de diagnostic : si le cadre n'est pas trouvé, on affiche quand
    // même la bulle, bien visible au centre de l'écran, pour savoir si le
    // souci est la réception (rien n'apparaît jamais) ou le positionnement
    // (la bulle existe mais était invisible/mal placée).
    console.warn('Cadre de héros introuvable (' + anchorId + ') — affichage de secours au centre.');
    bubble.style.left = '50%';
    bubble.style.top = '50%';
    bubble.style.transform = 'translate(-50%,-50%)';
  }
  bubble.innerHTML = `<img src="${escapeHtmlBoard(payload.image||'')}" title="${escapeHtmlBoard(payload.label||'')}">`;
  document.body.appendChild(bubble);
  setTimeout(()=>bubble.remove(), 2700);
}
function escapeHtmlBoard(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------------- Actions ----------------
// Empêche d'envoyer une nouvelle action tant que la précédente n'a pas
// fini de se traiter — sinon plusieurs clics rapides se marchent dessus
// sur le verrou serveur (409 "session-busy") et la partie semble bloquée.
let ACTION_IN_FLIGHT = false;
// Message d'erreur visible à l'écran (le panneau de débogage est retiré :
// sans ça, une action refusée par le serveur paraissait « ne rien faire »).
const ACTION_ERROR_LABELS = {
  'pending-sacrifice-choice': 'choisis d\'abord la créature à sacrifier.',
  'cannot-block': 'cette créature ne peut pas bloquer (étourdie, gelée, Peureuse ou a déjà bloqué).',
  'attacker-not-declared': 'cet attaquant n\'est pas déclaré ce tour.',
  'attacker-gone': 'cet attaquant n\'est plus en jeu.'
};
function describeActionError(err){
  const key = String(err);
  return ACTION_ERROR_LABELS[key] || key;
}
let __actionErrorTimer = null;
function showActionError(msg){
  console.error(msg);
  let box = document.getElementById('action-error-toast');
  if(!box){
    box = document.createElement('div');
    box.id = 'action-error-toast';
    box.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100000;max-width:80vw;padding:10px 18px;border-radius:10px;background:rgba(120,25,35,.95);color:#fff;border:1.5px solid var(--gold);font-weight:700;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;';
    document.body.appendChild(box);
  }
  box.textContent = msg;
  box.style.display = 'block';
  if(__actionErrorTimer) clearTimeout(__actionErrorTimer);
  __actionErrorTimer = setTimeout(()=>{ box.style.display = 'none'; }, 5000);
}
async function runAction(label, fn){
  if(ACTION_IN_FLIGHT){ debugLog(`${label} → une action est déjà en cours, patiente un instant.`, 'log-error'); return; }
  ACTION_IN_FLIGHT = true;
  document.body.classList.add('action-busy');
  try{
    const res = await fn();
    if(res && res.error){
      debugLog(`${label} → ${res.error}`, 'log-error');
      showActionError(`${label} : ${describeActionError(res.error)}`);
    } else if(res && res.state){
      // Applique directement l'état renvoyé par l'action elle-même — ne
      // dépend plus uniquement de la diffusion temps réel (qui met à jour
      // les AUTRES clients connectés : adversaire, spectateurs). Sans ça,
      // si la diffusion ne passait pas pour une raison quelconque, l'action
      // réussissait silencieusement côté serveur sans jamais se refléter
      // à l'écran pour l'auteur de l'action lui-même.
      onStateUpdate(res.state);
    }
    return res;
  } catch(e){
    debugLog(`${label} → exception : ${e && e.message || e}`, 'log-error');
    showActionError(`${label} : ${e && e.message || e}`);
  } finally {
    ACTION_IN_FLIGHT = false;
    document.body.classList.remove('action-busy');
  }
}

let mulliganMarked = new Set(); // indices dans S[MY_KEY].hand marqués "à renvoyer"
let mulliganOverlayShown = false; // pour ne pas reconstruire (et perdre la sélection en cours) à chaque rendu
function showMulliganOverlay(){
  if(mulliganOverlayShown) return;
  mulliganOverlayShown = true;
  mulliganMarked = new Set();
  const overlay = document.getElementById('mulligan-overlay');
  const cardsEl = document.getElementById('mulligan-cards');
  cardsEl.innerHTML = '';
  S[MY_KEY].hand.forEach((card, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'mulligan-card-wrap';
    wrap.appendChild(cardEl(card, { inPlay:false, isPreview:true }));
    const tag = document.createElement('div');
    tag.className = 'mulligan-tag';
    tag.textContent = 'Garder';
    wrap.appendChild(tag);
    wrap.onclick = ()=>{
      if(mulliganMarked.has(idx)){
        mulliganMarked.delete(idx);
        wrap.classList.remove('marked');
        tag.textContent = 'Garder';
      } else {
        mulliganMarked.add(idx);
        wrap.classList.add('marked');
        tag.textContent = 'Renvoyer';
      }
    };
    cardsEl.appendChild(wrap);
  });
  overlay.classList.add('show');
}
async function confirmMulligan(){
  document.getElementById('mulligan-overlay').classList.remove('show');
  await runAction('Mulligan', ()=>gsMulligan([...mulliganMarked]));
  mulliganOverlayShown = false;
}
function getUseChoiceAbility(card){
  if(!card || !card.abilities) return null;
  return card.abilities.find(ab=>ab.kind==='triggered' && ab.useChoice && ab.choiceA && ab.choiceB) || null;
}
async function uiPlayCard(i, targetInfo, chosenTargets, choiceKey){
  const card = S[MY_KEY].hand[i];
  const choiceAbility = !choiceKey ? getUseChoiceAbility(card) : null;
  if(choiceAbility){
    showCardChoiceModal(card, choiceAbility, (pickedKey)=>{ uiPlayCard(i, targetInfo, chosenTargets, pickedKey); });
    return;
  }
  LAST_SACRIFICEABLE_ACTION = { action:'playCardSimple', handIndex:i, targetInfo, chosenTargets, choiceKey };
  await runAction('Jouer carte', ()=>gsPlayCardSimple(i, targetInfo, chosenTargets, choiceKey));
}
function showCardChoiceModal(card, ability, onPick){
  const overlay = document.createElement('div');
  overlay.id = 'card-choice-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(5,4,10,.75);z-index:99998;display:flex;align-items:center;justify-content:center;gap:34px;flex-wrap:wrap;';
  const activeLetters = ['A','B','C','D'].slice(0, ability.numChoices||2);
  activeLetters.forEach(ck=>{
    const choice = ability['choice'+ck];
    if(!choice) return;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .15s ease;';
    wrap.onmouseenter = ()=>{ wrap.style.transform='translateY(-10px) scale(1.04)'; };
    wrap.onmouseleave = ()=>{ wrap.style.transform=''; };
    const cardVisual = cardEl(card, {isPreview:true});
    wrap.appendChild(cardVisual);
    const label = document.createElement('div');
    label.style.cssText = 'font-family:\'Cinzel\',serif;font-weight:700;color:var(--gold);font-size:15px;background:rgba(23,19,37,.9);border:1.5px solid var(--gold);border-radius:8px;padding:8px 16px;max-width:280px;text-align:center;';
    label.textContent = choice.label || `Choix ${ck}`;
    wrap.appendChild(label);
    wrap.onclick = ()=>{ overlay.remove(); onPick(ck); };
    overlay.appendChild(wrap);
  });
  document.body.appendChild(overlay);
}
async function uiSetTrap(i){

async function uiEndTurn(){ playSfx('pass'); await runAction('Fin de tour', ()=>gsEndTurn()); }
function uiSelectAllAttackers(){

// Arrivée depuis spellcraft-lobby.html — la sélection de deck et la
// création/jointe de partie sont maintenant sur cette page séparée. Le
// plateau se contente de lire l'identifiant de session et le rôle transmis
// dans l'URL, puis se connecte directement.
async function initFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const sid = params.get('sid');
  const role = params.get('role');
  if(!sid || !role){
    window.location.href = 'spellcraft-lobby.html';
    return;
  }
  GS_SESSION_ID = sid;
  GS_ROLE = role;
  // Corrige un vrai bug : mettre GS_VS_AI à false sans condition faisait
  // tourner la détection de déconnexion même contre l'IA — qui n'envoie
  // jamais de présence, donc "expirait" après le délai de grâce et faisait
  // gagner le joueur humain par forfait automatique, comme si l'IA s'était
  // déconnectée.
  GS_VS_AI = params.get('vsai') === '1';
  // Signal de présence régulier, pour que "Regarder une partie" (dans le
  // lobby) sache distinguer une partie vraiment en cours d'une partie
  // abandonnée — uniquement pour les deux joueurs, pas les spectateurs
  // (c'est leur présence à eux qui détermine si la partie est "vivante").
  if((GS_ROLE==='p1' || GS_ROLE==='p2') && !GS_VS_AI){
    gsRecordPresence(GS_SESSION_ID);
    setInterval(()=>gsRecordPresence(GS_SESSION_ID), 20000);
  }
  // Musique dédiée au combat : rotation entre combat-1 à combat-4 (déjà
  // construite dans spellcraft-shared.js) pour toute la durée de la
  // partie — j'utilisais par erreur playMusic('combat',...) qui cherchait
  // un seul fichier combat.ogg inexistant.
  playCombatMusicRotation(0.35);
  // Chargé en arrière-plan (pas besoin d'attendre) — sert aux aperçus de
  // carte au survol dans le journal, ET à l'animation de révélation 3D
  // d'une carte jouée (qui relit ce tableau au moment où elle s'exécute,
  // voir plus haut — c'est pour ça qu'elle n'a pas besoin d'attendre ici).
  loadAllCardsAcrossSets().then(cards=>{
    JOURNAL_CARD_LOOKUP = {};
    cards.forEach(c=>{ JOURNAL_CARD_LOOKUP[c.id] = c; });
  });
  afterConnected(null);
}
initSpellcraftAuth().then(initFromUrl);
