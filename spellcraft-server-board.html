<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spellcraft — Plateau serveur</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-void:#0b0a12;
  --bg-panel:#171325;
  --bg-panel-2:#1f1a30;
  --parchment:#efe6c8;
  --parchment-dim:#d9cfae;
  --ink:#1c1830;
  --arcane:#7c5cff;
  --gold:#d4af37;
  --blood:#c23b3b;
  --frost:#4fb3d9;
  --green:#4a9d6b;
  --aube:#d4af37; --crepuscule:#4b0082; --prima:#228b22; --volonte:#8b0000; --arcane-c:#4682b4; --neutre:#c0c0c0;
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;}
.title-font{font-family:'Cinzel',serif;}

#app-outer{height:100vh;width:100vw;}
#app{display:flex;height:100%;width:100%;min-height:0;}

/* ---------- Board ---------- */
#board{flex:1;position:relative;display:flex;flex-direction:column;padding:12px 16px 100px;gap:6px;min-width:0;min-height:0;background:none;}
#board-scroll-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;padding-right:2px;scrollbar-width:none;}
#board-scroll-area::-webkit-scrollbar{width:0;height:0;background:transparent;}

.hero-row{display:flex;flex-direction:column;gap:6px;padding:8px 14px;background:var(--bg-panel);border-radius:14px;border:1px solid #2b2440;max-width:400px;width:fit-content;flex-shrink:0;}
.draw-anim-card{
  position:fixed;width:150px;height:204px;z-index:150;pointer-events:none;
  transform-origin:top left;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.65));
}
.hero-row.enemy{align-self:flex-end;}
.hero-row.self{align-self:flex-start;}

.hero-top{display:flex;align-items:center;gap:14px;}

.hero-portrait{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--arcane), #2a1f55);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;border:3px solid var(--gold);position:relative;}
.hp-badge{position:absolute;bottom:-6px;right:-9px;min-width:26px;height:26px;padding:0 5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e85858,#8a1f1f);border:2px solid #4a0f0f;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.65);z-index:2;}

.hero-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
.hero-name{font-family:'Cinzel',serif;font-size:17px;font-weight:600;color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.hp{background:var(--blood);}

.hpbar-wrap{width:110px;height:7px;background:#2b2440;border-radius:6px;overflow:hidden;}
.hpbar{height:100%;background:linear-gradient(90deg,var(--blood),#e06060);transition:width .3s;}

.power-btn{background:var(--bg-panel-2);border:1.5px solid var(--frost);color:var(--frost);border-radius:9px;padding:6px 12px;font-family:'Inter';font-size:11.5px;font-weight:600;cursor:pointer;white-space:normal;text-align:left;line-height:1.3;width:100%;}
.power-btn:disabled{opacity:.35;cursor:not-allowed;border-color:#444;color:#777;}
.power-btn:not(:disabled):hover{background:var(--frost);color:var(--ink);}

.region-tag{font-size:12.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.mana-bar{display:flex;align-items:center;gap:10px;}
.mana-region-thumb{width:32px;height:32px;border-radius:7px;background-size:cover;background-position:center;background-color:var(--bg-panel-2);border:2px solid var(--green);flex-shrink:0;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.mana-dots{display:flex;flex-wrap:wrap;gap:4px;align-content:center;}
.mana-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.45);flex-shrink:0;}
.mana-dot.filled{background:radial-gradient(circle at 35% 30%,#8fe0ff,#155a94);box-shadow:0 0 5px rgba(111,208,255,.7);}
.mana-dot.empty{background:#241f38;}
.mana-dot.fragile{background:radial-gradient(circle at 35% 30%,#d8f4ff,var(--frost));box-shadow:0 0 5px rgba(79,179,217,.75);}
.mana-dot.reserved{outline:2px dashed var(--gold);outline-offset:1.5px;}

.zone-badges{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:70px;border-radius:8px;background:var(--bg-panel-2);border:1px solid #3a3260;cursor:pointer;user-select:none;}
.badge-label{font-size:8px;text-transform:uppercase;letter-spacing:.3px;color:var(--parchment-dim);margin-top:1px;}
.badge:hover{border-color:var(--gold);}
.badge .badge-icon{font-size:17px;line-height:1;}
.badge .badge-count{font-size:12px;font-weight:700;color:var(--parchment);}
.badge.deck .badge-icon{color:var(--gold);}
.badge.discard .badge-icon{color:#8a7fb0;}
.badge.discard:not(.has-cards){opacity:.4;cursor:default;}

.board-divider{display:flex;align-items:center;gap:12px;margin:0 4px;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#4a4270 15%,#4a4270 85%,transparent);}

#discard-modal{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:60;}
#discard-modal.show{display:flex;}
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:9999;}
.modal-overlay.show{display:flex;}
.modal-overlay .modal-box{background:var(--bg-panel);border:1px solid #3a3260;border-radius:12px;padding:20px 24px;max-width:90vw;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:12px;}
.modal-overlay .modal-box h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-modal .modal-box{background:var(--bg-panel);border:1px solid #3a3260;border-radius:12px;padding:20px 24px;max-width:520px;max-height:70vh;display:flex;flex-direction:column;gap:12px;}
#discard-modal h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-list{overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;padding-right:4px;}
#discard-modal .close-btn{align-self:flex-end;background:var(--arcane);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;}

#card-preview{position:fixed;z-index:99999;pointer-events:none;display:none;opacity:0;transition:opacity .15s ease;}
.hero-preview-linked{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:visible;min-width:140px;background:rgba(15,12,24,.9);border:1px solid #3a3260;border-radius:8px;padding:8px 10px;}
.hero-preview-linked-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);text-align:center;margin-bottom:2px;}
.hero-preview-linked-item{font-size:12px;color:#f2ead2;text-align:center;padding:2px 4px;white-space:nowrap;}
#card-preview .ncard{box-shadow:0 16px 34px rgba(0,0,0,.65);}
#card-preview.show{display:block;opacity:1;}
#card-preview.show.hero-preview{display:flex;align-items:flex-start;gap:10px;}

#card-reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:85;opacity:0;background:rgba(5,4,10,0);transition:opacity .3s ease, background .3s ease;}
#card-reveal.show{opacity:1;background:rgba(5,4,10,.5);}
#card-reveal-inner .card{transform:scale(2.3);box-shadow:0 24px 60px rgba(0,0,0,.75), 0 0 70px rgba(124,92,255,.45);}
#card-reveal.show #card-reveal-inner{animation:card-reveal-pop .3s ease-out;}
@keyframes card-reveal-pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ---------- Lanes ---------- */
.lane{display:flex;gap:10px;justify-content:center;align-items:center;min-height:80px;padding:6px;background:radial-gradient(ellipse at center, #1c1730 0%, transparent 75%);border-radius:10px;flex-wrap:wrap;margin:0 220px;}
.lane.enemy{transform:scaleY(-1);}
.lane.enemy .card-slot{transform:scaleY(-1);}
.slot-empty{width:150px;height:204px;border:1.5px dashed #332c50;border-radius:11px;}

/* ---------- Cards ---------- */
.card{
  --cc: var(--neutre);
  width:150px;height:204px;background:#f7f2e2;color:#231d33;border-radius:11px;
  position:relative;cursor:pointer;flex-shrink:0;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  border:4px solid var(--cc);
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;overflow:hidden;
  user-select:none;
}
.card.class-Aube{--cc:var(--aube);}
.card.class-Crépuscule{--cc:var(--crepuscule);}
.card.class-Prima{--cc:var(--prima);}
.card.class-Volonté{--cc:var(--volonte);}
.card.class-Arcane{--cc:var(--arcane-c);}
.card.class-Neutre{--cc:var(--neutre);}

.card-foil-layer{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:9;}
.card-foil-layer::before{
  content:'';position:absolute;top:-60%;left:-70%;width:70%;height:220%;
  background:linear-gradient(115deg,
    transparent 0%, rgba(255,90,90,.5) 14%, rgba(255,210,80,.5) 28%,
    rgba(120,255,150,.5) 42%, rgba(80,190,255,.5) 56%, rgba(190,110,255,.5) 70%,
    rgba(255,120,200,.5) 84%, transparent 100%);
  transform:translateX(-40%) rotate(8deg);
  mix-blend-mode:color-dodge;
  opacity:.55;
}
.card.foil-play .card-foil-layer::before{animation:foil-sweep 1.05s ease-in-out;}
@keyframes foil-sweep{
  0%{transform:translateX(-160%) rotate(8deg);opacity:0;}
  15%{opacity:.9;}
  85%{opacity:.9;}
  100%{transform:translateX(160%) rotate(8deg);opacity:0;}
}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 16px rgba(0,0,0,.6);}
.card.selected{outline:3px solid var(--arcane);transform:translateY(-6px);}
.card.attacking{outline:3px solid var(--blood);}
.card.blocked-by::after{content:"🛡";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:14px;z-index:5;}
.card.self-targetable{cursor:crosshair;box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);animation:self-target-pulse 1.3s ease-in-out infinite;}
@keyframes self-target-pulse{0%,100%{box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);}50%{box-shadow:0 0 0 5px var(--gold), 0 4px 20px rgba(212,175,55,.8);}}
.card.targetable{outline:3px solid var(--blood);animation:pulse 1s infinite;}
.card.dragging{opacity:.35;}
.card.trap-pending{outline:3px dashed var(--gold);outline-offset:2px;opacity:.75;cursor:default;}
.card.trap-active{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 16px rgba(212,175,55,.6);cursor:default;animation:trap-armed-pulse 1.8s ease-in-out infinite;}
.trap-wolf-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));z-index:10;pointer-events:none;}
@keyframes trap-armed-pulse{0%,100%{box-shadow:0 0 12px rgba(212,175,55,.45);}50%{box-shadow:0 0 22px rgba(212,175,55,.85);}}
#lane-p1.drop-hover, #hero-p2.drop-hover{outline:3px dashed var(--gold);outline-offset:4px;border-radius:12px;}
.card-slot.drop-hover .card{outline:3px dashed var(--gold);}
.card.frozen{filter:hue-rotate(180deg) saturate(1.4) brightness(.9);}
.card.stunned{filter:grayscale(.7) brightness(.75);}
.card.summon-sick{transform:rotate(-4deg);}
.card.summon-sick:hover{transform:rotate(-4deg) translateY(-6px);}
.zzz{position:absolute;top:2px;right:3px;display:flex;align-items:flex-end;z-index:4;pointer-events:none;}
.zzz span{font-family:'Cinzel',serif;font-weight:700;color:#ffd76b;text-shadow:0 1px 2px rgba(0,0,0,.7);animation:zzz-float 1.8s ease-in-out infinite;display:inline-block;}
.zzz span:nth-child(1){font-size:9px;animation-delay:0s;}
.zzz span:nth-child(2){font-size:12px;animation-delay:.3s;margin-left:1px;}
.zzz span:nth-child(3){font-size:15px;animation-delay:.6s;margin-left:1px;}
@keyframes zzz-float{
  0%{opacity:0;transform:translateY(3px) scale(.6);}
  30%{opacity:1;transform:translateY(0) scale(1);}
  70%{opacity:1;transform:translateY(-3px) scale(1.12);}
  100%{opacity:0;transform:translateY(-7px) scale(.75);}
}

.card.kw-fearful{animation:fearful-tremble 5s ease-in-out infinite;}
@keyframes fearful-tremble{
  0%,92%,100%{transform:translateX(0) rotate(0);}
  93%{transform:translateX(-3px) rotate(-1.5deg);}
  94%{transform:translateX(3px) rotate(1.5deg);}
  95%{transform:translateX(-3px) rotate(-1.5deg);}
  96%{transform:translateX(3px) rotate(1.5deg);}
  97%{transform:translateX(-2px) rotate(-1deg);}
  98%{transform:translateX(0) rotate(0);}
}

.card-armor-shield{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(135deg, rgba(255,215,110,.32), rgba(255,215,110,.04) 60%);box-shadow:inset 0 0 12px rgba(255,215,110,.6);animation:armor-glow 2.2s ease-in-out infinite;}
@keyframes armor-glow{0%,100%{opacity:.65;}50%{opacity:1;}}

.status-stack-tr{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;z-index:6;pointer-events:none;max-width:80%;flex-wrap:wrap-reverse;}
.kw-icon{width:24px;height:24px;filter:invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.7));}
@keyframes protection-pulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.18);}}

/* Vol : la carte plane, ombre portée dessous via drop-shadow (respecte la découpe de la carte) */
.card.kw-flying{transform:translateY(-9px);filter:drop-shadow(0 16px 7px rgba(0,0,0,.5));}
.card.kw-flying:hover{transform:translateY(-15px);}

/* Furtif : légèrement transparente, volutes de fumée à des coins différents */
.card.kw-stealth{opacity:.78;}
.card.kw-stealth::before, .card.kw-stealth::after{
  content:'';position:absolute;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.6), transparent 70%);
  filter:blur(2px);pointer-events:none;z-index:5;
  animation:smoke-wisp 4s ease-in-out infinite;
}
.card.kw-stealth::before{top:-4px;left:-4px;animation-delay:0s;}
.card.kw-stealth::after{bottom:10px;right:-4px;animation-delay:2s;}
@keyframes smoke-wisp{
  0%{opacity:0;transform:translateY(4px) scale(.6);}
  30%{opacity:.75;transform:translateY(-2px) scale(1);}
  70%{opacity:.35;transform:translateY(-10px) scale(1.35);}
  100%{opacity:0;transform:translateY(-16px) scale(1.6);}
}

/* Perçant : petit pic acéré animé */
@keyframes pierce-jab{0%,100%{transform:translateX(0) rotate(-30deg);}50%{transform:translateX(2px) rotate(-30deg) scale(1.15);}}

/* Initiative : reflet métallique qui balaie la carte */
.card.kw-initiative::before{
  content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,.7), transparent);
  transform:skewX(-20deg);pointer-events:none;z-index:5;
  animation:initiative-shine 2.8s ease-in-out infinite;
}
@keyframes initiative-shine{0%{left:-60%;}55%{left:120%;}100%{left:120%;}}

/* Vol de vie : lueur violette-rose périodique */
.card.kw-lifesteal{animation:lifesteal-glow 6s ease-in-out infinite;}
@keyframes lifesteal-glow{
  0%,84%,100%{filter:none;}
  90%{filter:drop-shadow(0 0 7px rgba(255,90,220,.85)) brightness(1.08);}
  95%{filter:drop-shadow(0 0 12px rgba(200,80,255,.95)) brightness(1.15);}
}

/* Choisi pour attaquer : épées */
.card.attack-selecting{transform:translateY(-20px);box-shadow:0 12px 22px rgba(194,59,59,.55);}
.card.attack-selecting:hover{transform:translateY(-24px);}
.sword-icons{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;z-index:8;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));}
.sword-icons img{width:100%;height:100%;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(90%);}
.sword-icons.confirmed{font-size:28px;animation:sword-clash 1.3s ease-in-out infinite;}
@keyframes sword-clash{0%,100%{transform:translate(-50%,-50%) rotate(-5deg);}50%{transform:translate(-50%,-50%) rotate(5deg);}}
@keyframes pulse{0%,100%{outline-color:var(--blood);}50%{outline-color:#ff8a8a;}}

.card-art{position:relative;height:42%;background:linear-gradient(135deg,#c9bd93,#a89968);background-size:cover;background-position:center;flex-shrink:0;}
.card-cost{position:absolute;top:6px;left:6px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fd0ff,#155a94);border:2px solid #0c2b45;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-hero-hp{position:absolute;top:5px;right:6px;width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7de08f,#1f7a3d);border:2px solid #0c3d1a;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-divider{height:7px;flex-shrink:0;position:relative;background:var(--cc);display:flex;align-items:center;justify-content:center;}
.card-set-icon{width:15px;height:15px;background:var(--gold);border:1.5px solid #7a611c;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.card-set-icon span{transform:rotate(-45deg);font-size:6.5px;font-weight:700;color:#3a2c05;font-family:'Cinzel',serif;}
.card-set-logo-img{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background-size:cover;background-position:center;transform:rotate(-45deg);}
.card-body{flex:1;padding:3px 7px 2px;display:flex;flex-direction:column;min-height:0;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:11px;text-align:center;text-decoration:underline;text-underline-offset:2.5px;color:#1c1830;line-height:1.2;margin-bottom:3px;min-height:24px;}
.card-kw{font-size:8px;color:var(--arcane);font-weight:700;min-height:10px;text-align:center;}
.card-text{font-size:8.2px;line-height:1.2;flex:1;color:#2a2338;overflow-y:auto;white-space:pre-wrap;text-align:center;}
.card-typeline{position:absolute;left:0;top:0;bottom:0;width:11px;background:rgba(15,12,20,.6);color:#f2ead2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:flex-start;justify-content:flex-start;font-size:5px;letter-spacing:.2px;text-transform:uppercase;padding:5px 0 16px;text-align:center;z-index:1;}
.card-footer{height:27px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 7px 4px;}
.card-atk,.card-hp{width:20px;height:20px;border-radius:50%;background:#efe6c8;border:2px solid #1c1830;display:flex;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:9.5px;}
.atk-icon{width:9px;height:9px;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(85%);}
.card-atk{color:var(--blood);}
.card-hp{color:var(--green);}
.card-rarity-gem{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;border:2px solid rgba(0,0,0,.35);box-shadow:0 0 4px currentColor;}
.card-rarity-gem.rarity-Basique{background:#6b6558;color:#6b6558;}
.card-rarity-gem.rarity-Commune{background:#c7c2b3;color:#c7c2b3;}
.card-rarity-gem.rarity-Rare{background:var(--frost);color:var(--frost);}
.card-rarity-gem.rarity-Épique{background:var(--arcane);color:var(--arcane);}
.card-rarity-gem.rarity-Mythique{background:var(--gold);color:var(--gold);}
.charges{color:var(--frost);font-size:11px;font-weight:700;position:absolute;bottom:5px;right:6px;z-index:2;}

.hand-row{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:9px;justify-content:center;padding:55px 14px 6px;pointer-events:none;scrollbar-width:none;background:transparent !important;box-shadow:none;border:none;transform:translateY(136px);transition:transform .22s ease;}
.hand-row .card{pointer-events:auto;}
.hand-row::-webkit-scrollbar{height:0;width:0;background:transparent;}
.hand-card-slot{pointer-events:auto;width:150px;height:211.6px;flex-shrink:0;transform-origin:bottom center;transition:transform .15s ease;}

  .mana-box-count{flex-shrink:0;width:100%;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:10px;color:var(--gold);}
  .mana-box-fill{display:flex;flex-direction:column-reverse;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:5px 8px;max-height:233px;}
  .board-row.enemy .mana-box-fill{flex-direction:column;flex-wrap:wrap;}
  .mana-box-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center;}
  .mana-box-dot.filled{background-image:url('images/mana-plein.png');}
  .mana-box-dot:not(.filled):not(.fragile):not(.bonus){background-image:url('images/mana-vide.png');}
  .mana-box-dot.fragile{background-image:url('images/mana-fragile.png');}
  .mana-box-dot.bonus{background:radial-gradient(circle at 35% 30%,#fff3d0,var(--gold));box-shadow:0 0 6px rgba(212,175,55,.8);border-radius:50%;}

  .hero-frame{position:absolute;bottom:8px;z-index:7;}
  .hero-portrait-big{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--arcane), #2a1f55);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:40px;color:#fff;flex-shrink:0;border:4px solid var(--gold);position:relative;cursor:pointer;padding:0;}
  .hero-portrait-big:hover{border-color:#fff;}
  .hero-portrait-big.can-activate{border-color:#4a9d6b;box-shadow:0 0 14px rgba(74,157,107,.6);}
  .hero-portrait-big.targetable{border-color:var(--gold);box-shadow:0 0 16px rgba(212,175,55,.75);cursor:crosshair;}
  .card.targetable{outline:3px solid var(--gold);outline-offset:2px;cursor:crosshair;}
  .hp-badge-big{position:absolute;bottom:-10px;right:-14px;min-width:44px;height:44px;padding:0 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e85858,#8a1f1f);border:3px solid #4a0f0f;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.65);z-index:2;pointer-events:none;}

  .deck-zone{position:absolute;bottom:22px;display:flex;align-items:center;gap:12px;z-index:6;}
  .board-row.self .deck-zone{right:16px;}
  .board-row.enemy .deck-zone{left:16px;top:16px;bottom:auto;flex-direction:row-reverse;}
  .deck-back-visual{width:118px;height:165px;border-radius:12px;background:linear-gradient(135deg,#241f38,#171325);border:3px solid var(--gold);box-shadow:0 6px 16px rgba(0,0,0,.55);flex-shrink:0;}
  .deck-counts{display:flex;flex-direction:column;gap:8px;}

  .artifact-stack{position:absolute;display:flex;gap:6px;align-items:center;}
  .board-row.self .artifact-stack{right:16px;bottom:195px;flex-direction:row;}
  .board-row.enemy .artifact-stack{left:16px;top:195px;bottom:auto;flex-direction:row;}
  .artifact-stack .relic-slot{width:120px;height:120px;}
  .relic-slot-empty{border:2px dashed #4a4270;border-radius:8px;background:rgba(11,10,18,.4);}
  .relic-slot-empty.drop-target{border-color:var(--gold);background:rgba(212,175,55,.12);}
  .artifact-stack .relic-slot .card{transform:scale(.4);transform-origin:top left;}

  /* ---------- Menus repliables (journal / chat) ---------- */
  .phase-bar-wrap{position:relative;}
  .menu-toggles-row{position:absolute;bottom:100%;right:0;margin-bottom:6px;display:flex;gap:6px;}
  #emote-toggle-btn, #journal-toggle-btn, #leave-game-btn, #report-bug-btn{width:44px;height:36px;border-radius:10px;background:rgba(23,19,37,.85);border:2px solid rgba(212,175,55,.45);color:#f2ead2;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  #bug-report-panel{
    display:none;position:fixed;top:60px;right:20px;z-index:9990;width:280px;
    background:rgba(15,12,24,.97);border:1.5px solid var(--gold);border-radius:12px;padding:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #bug-report-panel.show{display:block;}
  #bug-report-panel h3{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;margin:0 0 10px;}
  #bug-report-text{
    width:100%;background:#1a1628;border:1.5px solid #3a3260;border-radius:8px;color:#f2ead2;
    font-size:12.5px;padding:8px;resize:vertical;font-family:'Inter',sans-serif;
  }
  #bug-report-status{font-size:11px;color:var(--parchment-dim);min-height:14px;margin:6px 0;}
  #bug-report-buttons{display:flex;gap:8px;}
  #bug-report-buttons button{flex:1;padding:7px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
  #bug-report-cancel{background:transparent;border:1.5px solid #3a3260;color:var(--parchment-dim);}
  #bug-report-send{background:var(--arcane,#7c5cff);border:none;color:#fff;font-weight:600;}
  #emote-toggle-btn:hover, #journal-toggle-btn:hover, #leave-game-btn:hover{border-color:#d4af37;}
  #leave-game-btn:hover{border-color:var(--blood);}
  #journal-panel{position:fixed;bottom:20px;right:20px;width:320px;max-height:45vh;background:var(--bg-panel);border:1px solid #3a3260;border-radius:12px;padding:12px;z-index:99997;display:none;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.6);}
  #journal-panel.show{display:flex;}
  #journal-panel h3{margin:0 0 8px;font-family:'Cinzel',serif;color:var(--gold);font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  #journal-panel h3 .close-journal-btn{cursor:pointer;font-size:16px;color:var(--parchment-dim);}
  #journal-panel h3 .close-journal-btn:hover{color:var(--gold);}
  #journal-panel #log{flex:1;overflow-y:auto;font-size:11.5px;max-height:40vh;}
  .journal-entry{padding:6px 0;border-bottom:1px dashed #3a3260;}
  .journal-entry:last-child{border-bottom:none;}
  .journal-entry .who{color:var(--gold);font-weight:600;}
  .journal-entry .card-name-ref{color:var(--frost);text-decoration:underline dotted;cursor:default;font-weight:600;}
  .journal-entry .card-name-ref:hover{color:#7dd3f0;}
  .journal-entry .hl-ref{text-decoration:underline dotted;cursor:default;}
  .ncard.journal-highlight{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px rgba(212,175,55,.8);z-index:50;position:relative;}
  /* Assombrit tout le plateau sauf les cibles en surbrillance — le
     survol d'un effet du journal (dégâts, soin, etc. sur une ou plusieurs
     cartes précises) active ce mode. */
  #board.journal-spotlight-active .ncard{opacity:.25;filter:grayscale(60%);transition:opacity .15s ease;}
  #board.journal-spotlight-active .ncard.journal-highlight{opacity:1;filter:none;}
  #board.journal-spotlight-active .hero-frame{opacity:.25;filter:grayscale(60%);transition:opacity .15s ease;}
  #board.journal-spotlight-active .hero-frame.journal-highlight-hero{opacity:1;filter:none;outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px rgba(212,175,55,.8);}
  /* Structure hiérarchique du journal — le nom de la carte reste visible,
     le détail des effets se déroule au survol. */
  .journal-entry-card{cursor:default;}
  /* Fige les actions des deux joueurs tant qu'une charge de combat joue
     encore dans la file (voir queueCombatAnim / processCombatAnimQueue) —
     évite qu'un clic pendant l'animation ne parte sur un plateau qui va
     encore changer sous nos yeux. */
  body.combat-anim-lock #board,
  body.combat-anim-lock #hand-p1{
    pointer-events:none;
  }
  .journal-entry-effects{max-height:0;overflow:hidden;transition:max-height .18s ease;padding-left:14px;border-left:2px solid #3a3260;margin-left:4px;}
  .journal-entry:hover .journal-entry-effects, .journal-entry-effects.force-open{max-height:200px;}
  .journal-effect-line{font-size:11px;color:var(--parchment-dim,#d9cfae);padding:2px 0;cursor:default;}
  .journal-effect-line.hl-ref{text-decoration:underline dotted;}
</style>

<script>

const KEYWORD_ICON_FILES = {
  charge:'kw-charge.png', flying:'kw-envol.png', reach:'kw-portee.png', pierce:'kw-brutalite.png',
  lifesteal:'kw-volDeVie.png', initiative:'kw-initiative.png', armor:'kw-armure.png',
  stealth:'kw-parade.png', relentless:'kw-tenace.png', fearful:'kw-peureux.png',
  protecteur:'kw-protecteur.png', toxic:'kw-toxique.png',
  discret:'kw-discret.png', imparable:'kw-imparable.png', fugace:'kw-fugace.png',
  assault:'kw-assaut.png', final:'kw-final.png'
  // "debut" est volontairement absent : pas d'icône pour ce mot-clé.
};
const KEYWORD_LABELS = {
  charge:'Charge', flying:'Envol', reach:'Portée', pierce:'Brutalité', lifesteal:'Vol de vie',
  initiative:'Initiative', armor:'Armure', stealth:'Parade', relentless:'Tenace',
  fearful:'Peureux', protecteur:'Protecteur', toxic:'Toxique',
  discret:'Discret', imparable:'Imparable', fugace:'Fugace',
  assault:'Assault', debut:'Début', final:'Final'
};
function escapeHtmlGS(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let S = null; // état de la partie reçu du serveur
let MY_KEY = null, OPP_KEY = null;
let UI = { selectingAttackers:false, selectedAttackers:[], pendingBlocker:null };

// ---------------- Signalement de problème ----------------
// Capture l'état complet de la partie au moment du clic (main, plateau,
// journal encore disponible) — pour éviter le "ça a buggé mais je ne sais
// plus exactement quand" pendant les sessions de test.
function openBugReportPanel(){
  document.getElementById('bug-report-status').textContent = '';
  document.getElementById('bug-report-text').value = '';
  document.getElementById('bug-report-panel').classList.add('show');
}
function closeBugReportPanel(){
  document.getElementById('bug-report-panel').classList.remove('show');
}
async function submitBugReport(){
  const desc = document.getElementById('bug-report-text').value.trim();
  const statusEl = document.getElementById('bug-report-status');
  if(!desc){ statusEl.textContent = 'Décris au moins brièvement ce qui se passe.'; return; }
  statusEl.textContent = 'Envoi en cours...';
  const res = await gsReportBug(desc, GS_SESSION_ID, S);
  if(res.error){ statusEl.textContent = 'Erreur : ' + res.error; return; }
  statusEl.textContent = 'Envoyé, merci !';
  setTimeout(closeBugReportPanel, 1200);
}

function debugLog(msg, cls){
  return; // panneau de débogage retiré de l'écran
  const el = document.getElementById('debug-log');
  const line = document.createElement('div');
  line.className = cls||'';
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.prepend(line);
}
// ---------------- Mise en surbrillance du journal ----------------
// Assombrit tout le plateau sauf les cibles concernées, au survol d'un
// effet du journal — uniquement pour les cibles encore présentes sur le
// plateau actuel. Si une cible a disparu depuis (morte, renvoyée en
// main...), elle est simplement ignorée : pas de reconstitution de l'état
// passé du plateau (jugée pas assez utile pour sa complexité).
function applySpotlight(highlightIds){
  const board = document.getElementById('board');
  board.classList.add('journal-spotlight-active');
  (highlightIds||[]).forEach(id=>{
    if(id==='hero-p1' || id==='hero-p2'){
      const slot = id==='hero-p1' ? 'p1' : 'p2';
      const el = document.getElementById(`hero-frame-${slot}`);
      if(el) el.classList.add('journal-highlight-hero');
    } else {
      document.querySelectorAll(`[data-instid="${id}"]`).forEach(elc=>elc.classList.add('journal-highlight'));
    }
  });
}
function clearSpotlight(){
  const board = document.getElementById('board');
  board.classList.remove('journal-spotlight-active');
  document.querySelectorAll('.journal-highlight').forEach(el=>el.classList.remove('journal-highlight'));
  document.querySelectorAll('.journal-highlight-hero').forEach(el=>el.classList.remove('journal-highlight-hero'));
}
function onJournalEffectHover(entry, highlightIds){
  applySpotlight(highlightIds);
}
function onJournalEffectLeave(){
  clearSpotlight();
}

// Reconstruit l'affichage du journal à partir de S.__gameLog — traduit
// "Vous"/"L'adversaire" selon le rôle du joueur qui regarde (la donnée
// stockée côté serveur est neutre, sans ça les deux joueurs verraient
// "Vous" pour les mêmes actions).
let SEEN_GAMELOG_COUNT = 0;
function hitSfxForDamage(n){ return n<=4 ? 'hitLight' : n<=10 ? 'hitMedium' : 'hitLarge'; }

function renderGameLog(){
  const el = document.getElementById('log');
  if(!el || !S) return;

  // Anime et sonorise les NOUVELLES entrées depuis le dernier rendu (marche
  // pour les deux joueurs, pas seulement celui qui vient d'agir, puisque
  // c'est basé sur l'état reçu et pas sur une action locale).
  const entries = S.__gameLog||[];
  entries.slice(SEEN_GAMELOG_COUNT).forEach(entry=>{
    if(entry.raw){
      if(entry.raw.includes('attaque avec')){
        playSfx('attack');
      } else if(entry.highlightIds && entry.highlightIds.length===2){
        // "bloque la créature X avec Y" : les deux se ruent l'une sur l'autre
        const [attackerInstId, blockerInstId] = entry.highlightIds;
        debugLog(`[anim] combat bloqué détecté : attaquant=${attackerInstId} bloqueur=${blockerInstId}`, 'log-ok');
        playCombatStrike(attackerInstId, blockerInstId);
        playSfx('hitMedium');
      } else if(entry.raw.includes('meurt au combat')){
        playSfx('card-death');
      } else if(entry.raw.includes('perdu') && entry.raw.includes('point')){
        // dégâts non bloqués au héros : popup + son selon l'ampleur, et
        // chaque attaquant se rue vers le héros (même animation que pour
        // un combat bloqué, la cible étant simplement le héros ici)
        const m = entry.raw.match(/(\d+) point/);
        if(m){
          const dmg = parseInt(m[1]);
          const slot = entry.ownerKey===MY_KEY ? 'p1' : 'p2';
          const heroEl = document.getElementById(`hero-frame-${slot}`);
          if(heroEl) spawnDamageNumber(heroEl, dmg);
          playSfx(hitSfxForDamage(dmg));
        }
        (entry.highlightIds||[]).forEach(attackerInstId=>{
          queueCombatAnim(()=>{
            const heroSlot = entry.ownerKey===MY_KEY ? 'p1' : 'p2';
            const attEl = document.querySelector(`[data-instid="${attackerInstId}"]`);
            const heroEl = document.getElementById(`hero-frame-${heroSlot}`);
            if(!attEl || !heroEl) return Promise.resolve();
            return lungeToward(attEl, heroEl, 480);
          });
        });
      }
    } else if(entry.cardName){
      if(entry.kind==='trap'){
        playSfx('trap');
      } else {
        const c = entry.cardId ? JOURNAL_CARD_LOOKUP[entry.cardId] : null;
        playSfx(c && c.type==='Sortilège' ? 'cast' : 'cardPlay');
      }
    }
  });
  SEEN_GAMELOG_COUNT = entries.length;

  el.innerHTML = '';
  (S.__gameLog||[]).forEach(entry=>{
    const who = entry.ownerKey===MY_KEY ? 'Vous' : "L'adversaire";
    const isMe = entry.ownerKey===MY_KEY;
    const line = document.createElement('div');
    line.className = 'journal-entry';
    if(entry.raw){
      // message de combat : {who} est remplacé, et si des créatures sont
      // listées, tout le texte devient survolable — surbrillance sur
      // place si tout est encore là, sinon voyage dans le temps.
      line.textContent = entry.raw.replace('{who}', who);
      if(entry.highlightIds && entry.highlightIds.length){
        line.classList.add('hl-ref');
        line.onmouseenter = ()=>onJournalEffectHover(entry, entry.highlightIds);
        line.onmouseleave = onJournalEffectLeave;
      }
    } else {
      const nameSpan = `<span class="card-name-ref" data-cardid="${entry.cardId||''}">"${escapeHtmlGS(entry.cardName)}"</span>`;
      // Une phrase d'en-tête distincte par catégorie — validées ensemble,
      // voir la conversation sur la refonte du journal.
      const headerPhrase = ({
        play: isMe ? `Vous jouez la carte ${nameSpan}.` : `L'adversaire joue la carte ${nameSpan}.`,
        trap: isMe ? `Votre piège ${nameSpan} se déclenche.` : `Le piège ${nameSpan} de l'adversaire se déclenche.`,
        creature_trigger: `La capacité de ${nameSpan} se déclenche.`,
        creature_activate: isMe ? `Vous activez la capacité de ${nameSpan}.` : `L'adversaire active la capacité de ${nameSpan}.`,
        hero_activate: isMe ? `Vous activez le pouvoir de votre héros ${nameSpan}.` : `L'adversaire active le pouvoir de son héros ${nameSpan}.`,
        hero_trigger: isMe ? `Le pouvoir de votre héros ${nameSpan} se déclenche.` : `Le pouvoir du héros adverse ${nameSpan} se déclenche.`,
        artifact_activate: isMe ? `Vous activez ${nameSpan}.` : `L'adversaire active ${nameSpan}.`,
        artifact_trigger: `La capacité de ${nameSpan} se déclenche.`,
        region_trigger: isMe ? `La capacité de votre région ${nameSpan} se déclenche.` : `La capacité de la région adverse ${nameSpan} se déclenche.`,
        region_activate: isMe ? `Vous activez la capacité de votre région ${nameSpan}.` : `L'adversaire active la capacité de sa région ${nameSpan}.`,
      })[entry.kind] || `${who} joue ${nameSpan}.`;
      const effects = entry.effects || [];
      const header = document.createElement('div');
      header.className = 'journal-entry-card';
      if(effects.length <= 1){
        // Un seul effet (ou aucun) : deux phrases distinctes plutôt qu'une
        // seule avec "et" — "Vous jouez X. Vous gagnez 1 mana fragile."
        const eff = effects[0];
        header.innerHTML = eff
          ? `${headerPhrase} <span class="effect-sentence">${who} ${escapeHtmlGS(eff.text)}.</span>`
          : headerPhrase;
        if(eff && eff.targetInstIds && eff.targetInstIds.length){
          const effSpan = header.querySelector('.effect-sentence');
          effSpan.classList.add('hl-ref');
          effSpan.onmouseenter = ()=>onJournalEffectHover(entry, eff.targetInstIds);
          effSpan.onmouseleave = onJournalEffectLeave;
        }
      } else {
        header.innerHTML = `${headerPhrase} <span class="effect-count">(${effects.length} effets)</span>`;
      }
      line.appendChild(header);
      if(effects.length > 1){
        const list = document.createElement('div');
        list.className = 'journal-entry-effects';
        effects.forEach(eff=>{
          const effLine = document.createElement('div');
          effLine.className = 'journal-effect-line';
          effLine.textContent = `${who} ${eff.text}.`;
          if(eff.targetInstIds && eff.targetInstIds.length){
            effLine.classList.add('hl-ref');
            effLine.onmouseenter = ()=>onJournalEffectHover(entry, eff.targetInstIds);
            effLine.onmouseleave = onJournalEffectLeave;
          }
          list.appendChild(effLine);
        });
        line.appendChild(list);
      }
      const ref = line.querySelector('.card-name-ref');
      if(ref && entry.cardId){
        ref.onmouseenter = (ev)=>{ const c = JOURNAL_CARD_LOOKUP[entry.cardId]; if(c) showCardPreviewHover(c, ev); };
        ref.onmousemove = moveHeroPreview;
        ref.onmouseleave = hidePreview;
      }
    }
    el.appendChild(line);
  });
}

// ---------------- Connexion / session ----------------

function afterConnected(code){
  document.getElementById('app-outer').classList.add('show');
  document.getElementById('ai-debug-btn').style.display = 'block';
  MY_KEY = GS_ROLE === 'p2' ? 'p2' : 'p1';
  OPP_KEY = MY_KEY === 'p1' ? 'p2' : 'p1';
  gsConnect(onStateUpdate, onEmoteMessage);
  debugLog('Connecté (rôle : ' + GS_ROLE + ')', 'log-ok');
  gsFetchState().then(res=>{
    if(res.error){ debugLog('État initial → ' + res.error, 'log-error'); return; }
    onStateUpdate(res.state);
  });

  // Filet de sécurité : la diffusion temps réel devrait suffire à elle
  // seule, mais si un message venait à être manqué (déconnexion brève,
  // souci de livraison...), l'écran resterait figé sur un état périmé —
  // menant à des refus "wrong-phase" alors que tout semble normal à
  // l'écran. Une resynchronisation silencieuse toutes les 6 secondes
  // garantit qu'on ne dérive jamais durablement de la vérité serveur.
  setInterval(()=>{
    if(ACTION_IN_FLIGHT || !S || S.gameOver) return;
    gsFetchState().then(res=>{
      if(!res || res.error || !res.state) return;
      onStateUpdate(res.state);
    });
  }, 6000);

  // Minuteur de tour retiré pour l'instant (sondage toutes les 3s trop
  // lourd pour le serveur) — la logique reste construite côté serveur,
  // simplement jamais sollicitée, pour pouvoir la réactiver facilement.
}

function onStateUpdate(state){
  if(!state || !state.p1){
    debugLog("En attente d'un adversaire pour démarrer la partie...", 'log-ok');
    return;
  }
  // vue toujours du point de vue du joueur local : si je suis p2 côté
  // serveur, j'affiche quand même "moi" en bas et "adversaire" en haut,
  // en lisant simplement S[MY_KEY]/S[OPP_KEY] partout dans le rendu.
  S = state;
  render();
  renderGameLog();

  // Diagnostic temporaire : affiche les traces envoyées par le serveur
  // (voir recalculateContinuousEffects côté serveur) pour repérer où une
  // capacité continue s'arrête de fonctionner.
  if(state.__serverLog){
    const already = window.__seenServerLogCount || 0;
    state.__serverLog.slice(already).forEach(msg => debugLog(msg, 'log-ok'));
    window.__seenServerLogCount = state.__serverLog.length;
  }

  // Si c'est le tour de l'IA (et qu'elle a fini son mulligan), on déclenche
  // son tour automatiquement — le bouton de debug reste utilisable en secours,
  // mais on ne doit plus jamais avoir besoin d'y penser pour que la partie avance.
  // IMPORTANT : uniquement en phase 'main' — pendant declareBlockersMe,
  // S.active reste l'attaquant (donc l'IA si c'est elle qui attaque) alors
  // que c'est le joueur HUMAIN qui doit agir (bloquer). Sans cette
  // restriction, le client du joueur humain tentait de faire "jouer l'IA"
  // toutes les 700ms pendant qu'il essayait lui-même de bloquer, entrant en
  // conflit avec son propre clic ("une action est déjà en cours").
  const activeIsAI = S[S.active] && S[S.active].isAI;
  if(activeIsAI && !S.gameOver && S.phase==='main' && !ACTION_IN_FLIGHT){
    setTimeout(()=>{ uiProcessAi(); }, 700);
  }
}

// ============================================================
// NOUVEAU TEMPLATE — frames illustrées (big / small), repris tel
// quel du deckbuilder/éditeur.

const NCLASS_TO_SLUG_NOACCENT = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const CARD_TYPE_TO_TEMPLATE_SLUG = {
  'Créature':'creature', 'Artefact':'artefact', 'Sortilège':'spell', 'Piège':'trap', 'Région':'region', 'Héros':'heros'
};
function ncardRealPath(size, slug, cardClass, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[cardClass] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bigframe.png`;
  }
  // Format small : nouveau schéma disponible uniquement pour Créature et
  // Artefact pour l'instant — les autres types restent sur l'ancien
  // système en attendant leurs propres illustrations.
  if(size==='small' && (cardType==='Créature' || cardType==='Artefact') && NCLASS_TO_SLUG_NOACCENT[cardClass]){
    return `images/card/small%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-smallframe.png`;
  }
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-${slug}.png`;
}
// Reprend les noms de fichiers exacts fournis (dont la coquille "creouscule"
// pour Crépuscule) — volontairement distincte de NCLASS_TO_SLUG ci-dessous,
// qui elle utilise l'orthographe correcte pour les cadres de base.
const HALF_FRAME_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté', 'Prima':'prima', 'Arcane':'arcane'
};
function ncardHalfFramePath(size, classSecondary, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[classSecondary] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[classSecondary]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bighalfframe.png`;
  }
  const slug = HALF_FRAME_SLUG[classSecondary];
  if(!slug) return null;
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-half-${slug}.png`;
}
const NCLASS_TO_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté',
  'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const NRARITY_TO_SLUG = {
  'Basique':'basique', 'Commune':'commun', 'Rare':'rare',
  'Épique':'epique', 'Mythique':'mythique'
};
function nEl(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function nImg(src, cls){ const i = document.createElement('img'); i.src = src; if(cls) i.className = cls; return i; }

function buildCurvedNameText(name, card, size){
  const wrap = nEl('div', 'nname-curved');
  wrap.style.top = (card.heroNameCurveTop ?? 4) + '%';
  const chars = (name || '').split('');
  const n = chars.length;
  const strength = (card.heroNameCurveStrength ?? 34) / 100;
  const maxAngle = Math.min(60, n * 4.2) * strength;
  const start = -maxAngle / 2;
  const step = n > 1 ? maxAngle / (n - 1) : 0;
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    const angle = start + step * i;
    span.style.transform = `rotate(${angle.toFixed(2)}deg)`;
    wrap.appendChild(span);
  });
  applyNameSizing(wrap, card, size);
  return wrap;
}

function buildNewCardEl(card, size, effectiveCostOverride, opts={}){
  const root = nEl('div', `ncard n-${size}`);
  const slug = NCLASS_TO_SLUG[card.class] || 'neutre';
  const isHero = card.type==='Héros';
  const isRegion = card.type==='Région';
  const hasMana = !isHero && !isRegion;
  const isCreature = card.type==='Créature';
  const isArtifact = card.type==='Artefact';
  if(isHero) root.classList.add('n-hero-card');
  if(isArtifact) root.classList.add('n-artifact-card');

  const posX = isHero ? (card.imagePosXHeroCard ?? 50) : size==='big' ? (card.imagePosX ?? 50) : (card.imagePosXSmall ?? 50);
  const posY = isHero ? (card.imagePosYHeroCard ?? 50) : size==='big' ? (card.imagePosY ?? 50) : (card.imagePosYSmall ?? 50);
  const zoom = isHero ? (card.imageZoomHeroCard ?? 100) : size==='big' ? (card.imageZoom ?? 100) : (card.imageZoomSmall ?? 100);
  const art = nEl('div', 'nart-layer');
  if(card.image){
    art.style.backgroundImage = `url('${card.image.replace(/'/g,'')}')`;
    art.style.backgroundPosition = `${posX}% ${posY}%`;
    art.style.backgroundSize = zoom>100 ? zoom+'%' : 'cover';
  }
  root.appendChild(art);
  root.appendChild(nImg(ncardRealPath(size, slug, card.class, card.type, opts.heroCardFrame), 'nframe-layer'));
  if(card.classSecondary){
    const halfPath = ncardHalfFramePath(size, card.classSecondary, card.type, opts.heroCardFrame);
    if(halfPath) root.appendChild(nImg(halfPath, 'nframe-half-layer'));
  }

  if(hasMana){
    const w = nEl('div','nstat-wrap n-mana');
    w.appendChild(nImg('images/card/icon/bubble/mana.png'));
    const t = nEl('div','nstat-txt'); t.textContent = effectiveCostOverride ?? (card.cost ?? 0);
    w.appendChild(t);
    root.appendChild(w);
  }
  if(isCreature){
    const wa = nEl('div','nstat-wrap n-atk');
    wa.appendChild(nImg('images/card/icon/bubble/attack.png'));
    const ta = nEl('div','nstat-txt'); ta.textContent = card.curAtk ?? card.atk ?? 0;
    wa.appendChild(ta);
    root.appendChild(wa);

    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = card.curHp ?? card.hp ?? 0;
    we.appendChild(te);
    root.appendChild(we);
  }
  if(isArtifact){
    const wf = nEl('div','nstat-wrap n-art');
    wf.appendChild(nImg('images/card/icon/bubble/artefact.png'));
    const t = nEl('div','nstat-txt'); t.textContent = (card.charges ?? 0)+'x';
    wf.appendChild(t);
    root.appendChild(wf);
  }
  if(isHero){
    const w = nEl('div','nstat-wrap n-mana');
    w.style.cssText += 'left:-6.5%;top:auto;bottom:-6.5%;';
    w.appendChild(nImg('images/card/icon/bubble/vie.png'));
    const t = nEl('div','nstat-txt'); t.textContent = card.curHp ?? card.hp ?? 0;
    w.appendChild(t);
    root.appendChild(w);
  }

  if(isHero){
    root.appendChild(buildCurvedNameText(card.name || '', card, size));
  } else {
    const nw = nEl('div','nname-wrap');
    nw.appendChild(nImg('images/card/icon/bubble/nom.png'));
    const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
    applyNameSizing(nameEl, card, size);
    nw.appendChild(nameEl);
    root.appendChild(nw);
  }

  if(size==='big' && (!isHero || opts.forceHeroText)){
    const textEl = nEl('div','ncard-text'); textEl.textContent = card.text || '';
    root.appendChild(textEl);
  }

  if(card.subtypes && card.subtypes.length && !isHero){
    const tl = nEl('div','ntypeline'); tl.textContent = card.subtypes.join(' - ');
    root.appendChild(tl);

  if(!isHero && card.rarity && NRARITY_TO_SLUG[card.rarity]){
    root.appendChild(nImg(`images/card/icon/rare/${NRARITY_TO_SLUG[card.rarity]}.png`, 'nrarity-gem'));
  }
  if(!isHero && card.isLegendary){
    root.appendChild(nImg('images/card/icon/rare/legendaire.png', 'nlegendary-gem'));
  }

  // Icônes des mots-clés "Assaut" et "Finale" (pas "Début", volontairement
  // sans icône) — uniquement sur le plateau, format small, en rangée
  // au-dessus de la gemme de rareté.
  const kw = card.keywords || [];
  if(!isHero && size==='small' && kw.includes('assault')){
    root.appendChild(nImg('images/card/icon/keyword/assaut.png', 'nkeyword-icon nkeyword-assault'));
  }
  if(!isHero && size==='small' && kw.includes('final')){
    root.appendChild(nImg('images/card/icon/keyword/final.png', 'nkeyword-icon nkeyword-final'));
  }

  return root;
}
// Applique le réglage manuel de taille de police du nom fait dans l'éditeur
// (card.nameFontSize / nameFontAuto / nameWrap) — sinon la taille auto
// (fitBoxFont, plus bas) prend le relais comme avant.
function applyNameSizing(nameEl, card, size){
  if(card.nameWrap){
    nameEl.style.whiteSpace = 'normal';
    nameEl.style.height = 'auto';
    nameEl.style.overflow = 'visible';
  }
  if(card.nameFontAuto === false){
    nameEl.dataset.auto = '0';
    // la taille choisie est calibrée sur le grand format (300px) ; on
    // l'adapte proportionnellement à la vraie taille du petit format ici (120px)
    const scale = size==='small' ? (120/300) : 1;
    nameEl.style.fontSize = ((card.nameFontSize || 14) * scale) + 'px';
  } else {
    nameEl.dataset.auto = '1';
  }
}
function fitBoxFont(el, minSize){
  if(!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  const floor = minSize || 7;
  let attempts = 0;
  while(attempts < 26 && size > floor){
    const overflowH = el.scrollHeight > el.clientHeight + 1;
    const overflowW = el.scrollWidth > el.clientWidth + 1;
    if(!overflowH && !overflowW) break;
    size -= 0.5;
    el.style.fontSize = size + 'px';
    attempts++;
  }
}
function fitNewCard(rootEl){
  if(!rootEl) return;
  const nameEl = rootEl.querySelector('.nname-text') || rootEl.querySelector('.nname-curved');
  if(nameEl && nameEl.dataset.auto !== '0'){
    fitBoxFont(nameEl, 6);
  }
  fitBoxFont(rootEl.querySelector('.ncard-text'), 7);
}

// Miroir exact de getEffectiveCost côté serveur — pour que l'affichage et
// le calcul "carte jouable ou non" tiennent compte des réductions actives.
function getEffectiveCostClient(p, card){
  let cost = card.cost || 0;
  (p.activeCostReductions||[]).forEach(r=>{
    if(r.cardType && r.cardType!==card.type) return;
    if(r.subtype && !(card.subtypes||[]).includes(r.subtype)) return;
    cost -= r.amount || 0;
  });
  return Math.max(0, cost);
}

function cardEl(card, opts={}){
  const inPlay = !!opts.inPlay;
  const size = inPlay ? 'small' : 'big';
  // le coût effectif (réductions actives) n'a de sens que pour une carte pas
  // encore jouée, appartenant au joueur local (seule main visible)
  const effectiveCost = (!inPlay && !opts.isPreview && S && S[MY_KEY]) ? getEffectiveCostClient(S[MY_KEY], card) : undefined;
  const el = buildNewCardEl(card, size, effectiveCost);
  if(card.instId) el.dataset.instid = card.instId;
  requestAnimationFrame(()=>fitNewCard(el));

  if(opts.attacking) el.classList.add('attacking');
  if(opts.targetable) el.classList.add('targetable');
  const isSick = inPlay && card.summonSick && !card.keywords?.includes('charge');
  if(inPlay && opts.attackSelecting) el.classList.add('attack-selecting');
  if(isSick) el.classList.add('summon-sick');

  const kw = card.keywords || [];
  const hasArmorShield = inPlay && kw.includes('armor') && !card.armorUsed;
  const activeKeywordIcons = inPlay ? kw.filter(k=>{
    if(!KEYWORD_ICON_FILES[k]) return false;
    if(k==='armor' && card.armorUsed) return false;
    return true;
  }) : [];

  if(isSick){
    const zzz = nEl('div','zzz');
    zzz.innerHTML = '<span>Z</span><span>Z</span><span>Z</span>';
    el.appendChild(zzz);
  }
  if(hasArmorShield){
    const shield = nEl('div','card-armor-shield');
    shield.title = 'Armure';
    el.appendChild(shield);
  }
  if(activeKeywordIcons.length){
    const stack = nEl('div','status-stack-tr');
    activeKeywordIcons.forEach(k=>{
      const img = nImg(`images/${KEYWORD_ICON_FILES[k]}`, 'kw-icon');
      img.title = KEYWORD_LABELS[k]||k;
      stack.appendChild(img);
    });
    el.appendChild(stack);
  }

  // survol : aperçu toujours en grande taille, avec le texte complet
  if(!opts.isPreview) attachHoverPreview(el, card);

  if(opts.onClick) el.onclick = opts.onClick;
  return el;
}

// Aperçu au survol (toujours n-big, même pour une créature affichée en
// n-small sur le plateau — pour pouvoir lire le texte complet). Pour un
// artefact spécifiquement : léger délai de 1,5s avant l'affichage, plutôt
// qu'immédiat comme pour les autres cartes — annulé proprement si la
// souris quitte avant que ce délai ne soit écoulé.
function attachHoverPreview(el, card){
  let pendingTimer = null;
  el.addEventListener('mouseenter', (ev)=>{
    if(card.type==='Artefact'){
      const evCopy = { clientX: ev.clientX, clientY: ev.clientY };
      pendingTimer = setTimeout(()=>{ pendingTimer = null; showCardPreviewHover(card, evCopy); }, 1500);
    } else {
      showCardPreviewHover(card, ev);
    }
  });
  el.addEventListener('mousemove', moveHeroPreview);
  el.addEventListener('mouseleave', ()=>{
    if(pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; }
    hidePreview();
  });
}
let __previewHoverToken = 0;
let __lastPreviewEvent = null;
function showCardPreviewHover(card, ev){
  const box = document.getElementById('card-preview');
  const myToken = ++__previewHoverToken;
  __lastPreviewEvent = ev;
  box.innerHTML = '';
  if(card.type==='Héros'){
    box.classList.add('hero-preview');
    const big = buildNewCardEl(card, 'big', undefined, {heroCardFrame:true, forceHeroText:true});
    box.appendChild(big);
    requestAnimationFrame(()=>fitNewCard(big));
    box.classList.add('show');
    moveHeroPreview(ev);
    // Cartes liées à ce héros — chargées à la demande (pas de catalogue
    // complet préchargé côté client) puis ajoutées à côté une fois prêtes.
    loadCardsLinkedToHero(card.name).then(linked=>{
      // La souris a peut-être déjà quitté, ou survolé autre chose entre-
      // temps : on ignore ce résultat périmé plutôt que de l'ajouter au
      // mauvais aperçu.
      if(myToken !== __previewHoverToken) return;
      if(!linked.length) return;
      const col = document.createElement('div');
      col.className = 'hero-preview-linked';
      const title = document.createElement('div');
      title.className = 'hero-preview-linked-title';
      title.textContent = 'Cartes liées';
      col.appendChild(title);
      linked.forEach(lc=>{
        const item = document.createElement('div');
        item.className = 'hero-preview-linked-item';
        item.textContent = lc.name || '';
        col.appendChild(item);
      });
      box.appendChild(col);
      // La boîte vient de s'élargir — on recalcule sa position pour ne pas
      // déborder de l'écran (le premier calcul ne connaissait pas encore
      // la largeur finale, les cartes liées arrivant après coup).
      if(__lastPreviewEvent) moveHeroPreview(__lastPreviewEvent);
    }).catch(()=>{});
  } else {
    box.classList.remove('hero-preview');
    const big = buildNewCardEl(card, 'big', undefined, {heroCardFrame:true});
    box.appendChild(big);
    requestAnimationFrame(()=>fitNewCard(big));
    box.classList.add('show');
    moveHeroPreview(ev);
  }
}

// Démarre/arrête la flèche de ciblage visuelle selon l'état actuel — appelé
// à chaque rendu, une fois le DOM reconstruit (pour pouvoir localiser
// l'élément source).
function syncTargetingArrow(){
  let sourceEl = null;
  if(UI.pendingNewTarget){
    const extra = UI.pendingNewTarget.extra || {};
    if(UI.pendingNewTarget.kind==='card' && extra.index!==undefined){
      const slots = document.querySelectorAll('.hand-card-slot');
      sourceEl = slots[extra.index] || null;
    } else if(UI.pendingNewTarget.kind==='hero'){
      sourceEl = document.getElementById('hero-frame-p1');
    } else if(UI.pendingNewTarget.kind==='permanent' && extra.permanentInstId){
      sourceEl = document.querySelector(`[data-instid="${extra.permanentInstId}"]`);
    }
  } else if(UI.pendingCard && UI.pendingCard.index!==undefined){
    const slots = document.querySelectorAll('.hand-card-slot');
    sourceEl = slots[UI.pendingCard.index] || null;
  }
  if(sourceEl) beginTargeting(sourceEl);
  else endTargeting();
}

// (keywordChoice) est en attente — même principe que discover.
function renderKeywordChoiceModal(){

    if(existing) existing.remove();

  `;

function renderDiscoverChoiceModal(){
  const existing = document.getElementById('discover-choice-modal');
  if(!S.pendingDiscover || S.pendingDiscover.playerKey!==MY_KEY){
    if(existing) existing.remove();
    return;
  }
  if(existing) return; // déjà affichée, ne pas la reconstruire à chaque rendu
  const modal = document.createElement('div');
  modal.id = 'discover-choice-modal';
  modal.className = 'modal-overlay show';
  modal.innerHTML = `
    <div class="modal-box">
      <h2>Choisis une carte</h2>
      <div id="discover-choice-list" style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;"></div>
    </div>
  `;
  document.body.appendChild(modal);
  const list = document.getElementById('discover-choice-list');
  S.pendingDiscover.options.forEach((card, i)=>{
    const wrap = document.createElement('div');
    wrap.style.cursor = 'pointer';
    wrap.appendChild(cardEl(card, {}));
    wrap.onclick = async ()=>{
      modal.remove();
      await runAction('Choix (révéler)', ()=>gsResolveDiscoverChoice(i));
    };
    list.appendChild(wrap);
  });
}

// Le plateau a une hauteur "naturelle" fixe (calculée pour être lisible),
// mais on la réduit (jamais on ne l'agrandit) pour qu'elle tienne toujours
// entièrement dans la fenêtre — jamais de barre de défilement.
function fitBoardToViewport(){
  const scrollArea = document.getElementById('board-scroll-area');
  const boardEl = document.getElementById('board');
  if(!scrollArea || !boardEl) return;
  scrollArea.style.transform = '';
  scrollArea.style.transformOrigin = 'top center';
  requestAnimationFrame(()=>{
    const available = boardEl.clientHeight;
    const needed = scrollArea.scrollHeight;
    if(needed > available && available > 0){
      const scale = Math.max(0.5, available / needed);
      scrollArea.style.transform = `scale(${scale})`;
    }
  });
}
window.addEventListener('resize', ()=>{ if(S) fitBoardToViewport(); });

function renderGameOverOverlay(){
  const overlay = document.getElementById('overlay');
  if(!S.gameOver){ overlay.classList.remove('show'); return; }
  document.getElementById('overlay-text').textContent = S.winnerKey===MY_KEY ? 'Victoire !' : 'Défaite...';

  const summaryEl = document.getElementById('overlay-summary');
  const sm = S.matchSummary;
  if(!sm){ summaryEl.innerHTML = ''; overlay.classList.add('show'); return; }

  const mine = sm[MY_KEY] || {};
  const theirs = sm[OPP_KEY] || {};
  const durationLabel = (ms)=>{
    const totalSec = Math.floor((ms||0)/1000);
    const m = Math.floor(totalSec/60), s = totalSec%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  };
  const row = (label, mineVal, theirsVal)=>`<tr><td>${label}</td><td>${mineVal}</td><td>${theirsVal}</td></tr>`;

  summaryEl.innerHTML = `
    <table>
      <thead><tr><th></th><th>Vous</th><th>Adversaire</th></tr></thead>
      <tbody>
        <tr><td colspan="3" style="text-align:center;color:var(--parchment-dim);font-size:12px;padding-bottom:8px;">Durée de la partie : ${durationLabel(sm.durationMs)}</td></tr>
        ${row('Tours joués', mine.turnsPlayed||0, theirs.turnsPlayed||0)}
        ${row('Dégâts infligés', mine.damageDealt||0, theirs.damageDealt||0)}
        <tr class="summary-sep">${row('Cartes jouées (total)', mine.cardsPlayed?.total||0, theirs.cardsPlayed?.total||0)}</tr>
        ${row('— Créatures', mine.cardsPlayed?.['Créature']||0, theirs.cardsPlayed?.['Créature']||0)}
        ${row('— Sortilèges', mine.cardsPlayed?.['Sortilège']||0, theirs.cardsPlayed?.['Sortilège']||0)}
        ${row('— Artefacts', mine.cardsPlayed?.['Artefact']||0, theirs.cardsPlayed?.['Artefact']||0)}
        ${row('— Pièges', mine.cardsPlayed?.['Piège']||0, theirs.cardsPlayed?.['Piège']||0)}
      </tbody>
    </table>
    ${sm.coinsEarned && sm.coinsEarned[MY_KEY] ? `<div class="summary-coins">🪙 ${sm.coinsEarned[MY_KEY]} pièces gagnées</div>` : ''}
  `;
  overlay.classList.add('show');
}

// key = camp réel côté serveur (p1/p2) ; slot = 'p1' (moi) ou 'p2' (adversaire)
// — boîte de mana dédiée : illustration de région en fond, empilement des
// pastilles de mana vers le haut à mesure qu'on en gagne.
function renderManaBox(key, slot){
  const p = S[key];
  const el = document.getElementById(`mana-box-${slot}`);
  const region = p.region || {};
  const regionThumbStyle = region.image ? `background-image:url('${region.image.replace(/'/g,"")}');background-position:${region.imagePosX??50}% ${region.imagePosY??50}%;background-size:${(region.imageZoom??100)>100?region.imageZoom+'%':'cover'};` : '';
  // Le compteur numérique (juste en dessous) est la vraie valeur, sans
  // limite. L'affichage en points, lui, remplit une colonne de 10 puis en
  // ouvre une nouvelle à côté (voir .mana-box-fill en CSS, flex-wrap). Le
  // mana normal est plafonné à 20 par le moteur (vraie limite du jeu, donc
  // 2 colonnes suffisent toujours) — le mana fragile, lui, peut dépasser
  // cette limite, donc pas de plafond ici : autant de colonnes que
  // nécessaire s'ouvrent au fil de l'eau.
  const DOTS_PER_COLUMN = 10;
  const MAX_VISIBLE_DOTS = DOTS_PER_COLUMN * 2;
  const normalDots = Array.from({length:Math.min(p.manaNormalMax, MAX_VISIBLE_DOTS)}, (_,i)=>{
    const filled = i<p.manaNormal;
    return `<span class="mana-box-dot ${filled?'filled':''}"></span>`;
  }).join('');
  const bonusCount = Math.max(0, Math.min(p.manaNormal, MAX_VISIBLE_DOTS) - Math.min(p.manaNormalMax, MAX_VISIBLE_DOTS));
  const bonusDots = Array.from({length:bonusCount}, ()=>`<span class="mana-box-dot bonus"></span>`).join('');
  const fragileDots = Array.from({length:p.manaFragile}, ()=>`<span class="mana-box-dot fragile"></span>`).join('');
  el.title = region.name || 'Région';
  el.innerHTML = `
    <div class="mana-box-region-thumb" style="${regionThumbStyle}"></div>
    <div class="mana-box-count">${p.manaNormal + p.manaFragile}/${p.manaNormalMax}</div>
    <div class="mana-box-fill">${normalDots}${bonusDots}${fragileDots}</div>
  `;
  if(region.name){
    const thumbEl = el.querySelector('.mana-box-region-thumb');
    thumbEl.style.cursor = 'pointer';
    attachHoverPreview(thumbEl, region);
  }
}

// Cadre du héros : le portrait lui-même sert de bouton d'activation quand
// le héros a un pouvoir activable. Survoler affiche son aperçu complet.
function renderHeroFrame(key, slot){
  const p = S[key];
  const el = document.getElementById(`hero-frame-${slot}`);
  const hero = p.hero || {};
  const heroName = hero.name || (slot==='p1' ? 'Moi' : 'Adversaire');
  const heroPortraitStyle = hero.image ? `background-image:url('${hero.image.replace(/'/g,"")}');background-position:${hero.imagePosX??50}% ${hero.imagePosY??50}%;background-size:${(hero.imageZoom??100)>100?hero.imageZoom+'%':'cover'};` : '';
  const hasNewFormatPower = !!(hero.abilities && hero.abilities.some(ab=>ab.kind==='triggered' && (ab.triggers||[]).some(te=>te.trigger==='activated')));
  const canActivate = slot==='p1' && S.active===MY_KEY && S.phase==='main' && (!!hero.activeEffect || hasNewFormatPower);
  const isPendingTarget = isValidPendingHeroTarget(key) || isValidNewFormatHeroTarget(key);
  const clickable = canActivate || isPendingTarget;

  el.innerHTML = `
    <button class="hero-portrait-big ${canActivate?'can-activate':''} ${isPendingTarget?'targetable':''}" id="hero-portrait-${slot}" style="${heroPortraitStyle}" ${clickable?'':'disabled'}>
      ${hero.image ? '' : (heroName[0]||'?')}
      <span class="hp-badge-big">${p.hp}</span>
    </button>
  `;
  const btn = el.querySelector('.hero-portrait-big');
  btn.onmouseenter = (ev)=>showHeroPreview(hero, ev);
  btn.onmousemove = moveHeroPreview;
  btn.onmouseleave = hidePreview;
  if(UI.pendingNewTarget && isValidNewFormatHeroTarget(key)){
    btn.onclick = ()=>pickNewFormatTarget(`hero:${key}`);
  } else if(isPendingTarget){
    btn.onclick = ()=>{
      confirmPendingTarget({ isHeroTarget:true, playerKey:key });
    };
  } else if(canActivate){
    btn.onclick = uiActivateHeroPower;
  }
}

async function uiActivateHeroPower(targetInfo, chosenTargets){
  if(!targetInfo && !chosenTargets){
    const hero = S[MY_KEY].hero;
    const chosen = findNewFormatChosenTarget(hero, 'activated');
    if(chosen){
      UI.pendingNewTarget = { kind:'hero', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: {} };
      render();
      return;
    }
    const eff = hero && hero.activeEffect;
    if(eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger'){
      UI.pendingPower = { kind:'hero', effect: eff };
      render();
      return;
    }
  }
  await runAction('Pouvoir de héros', ()=>gsUseHeroPower(targetInfo, chosenTargets));
}
async function uiActivatePermanent(permanentType, permanentInstId, targetInfo, chosenTargets){
  if(!targetInfo && !chosenTargets){
    let permanent = null;
    const p = S[MY_KEY];
    if(permanentType==='creature') permanent = p.board.find(c=>c.instId===permanentInstId);
    else if(permanentType==='artifact') permanent = p.relics.find(r=>r.instId===permanentInstId);
    else if(permanentType==='region') permanent = p.region;
    const chosen = permanent ? findNewFormatChosenTarget(permanent, 'activated') : null;
    if(chosen){
      UI.pendingNewTarget = { kind:'permanent', target: chosen.target, ability: chosen.ability, selectedInstIds: [], extra: { permanentType, permanentInstId } };
      render();
      return;
    }
    const eff = permanent && permanent.triggeredEffects && permanent.triggeredEffects.activated;
    if(eff && TARGETED_EFFECTS.includes(eff.type) && eff.targetOwner!=='self' && eff.targetOwner!=='trigger'){
      UI.pendingPower = { kind:'permanent', effect: eff, permanentType, permanentInstId };
      render();
      return;
    }
  }
  const res = await runAction('Capacité activée', ()=>gsActivatePermanent(permanentType, permanentInstId, targetInfo, chosenTargets));
  if(permanentType==='artifact' && res && !res.error){
    // Le nouveau rendu (qui grise l'artefact désormais utilisé) vient de
    // reconstruire l'élément — on attend une frame pour cibler le NOUVEL
    // élément avant de lancer le flash, sinon on animerait un nœud déjà
    // remplacé et donc invisible.
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-instid="${permanentInstId}"]`);
      if(el){
        el.classList.add('artifact-activate-flash');
        el.addEventListener('animationend', ()=>el.classList.remove('artifact-activate-flash'), {once:true});
      }
    });
  }
}
