<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spellcraft — Plateau serveur</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu (même
// principe que les pages de menu — le plateau suit maintenant les 5
// thèmes pour la cohérence, sans changer sa mise en page).
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');

/* Les jetons d'interface (--bg-void, --bg-panel, --parchment, --gold,
   etc.) viennent maintenant de spellcraft-ui-kit.css et suivent le
   thème actif. On ne garde ici que les couleurs propres au jeu — les
   teintes des classes de magie — qui n'ont pas à changer avec le thème
   (l'identité visuelle d'une carte reste la même quel que soit le thème
   d'interface choisi). */
:root{
  --aube:#d4af37; --crepuscule:#4b0082; --prima:#228b22; --volonte:#8b0000; --arcane-c:#4682b4; --neutre:#c0c0c0;
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;overflow:hidden;}
.title-font{font-family:'Cinzel',serif;}

#board-scale-outer{position:fixed;inset:0;background:var(--bg-void,#0b0a12);overflow:hidden;display:flex;align-items:center;justify-content:center;z-index:1;}
/* Écran qui tremble sur un gros coup — voir shakeScreen(). Sur le conteneur
   plein écran (pas #app-outer, déjà utilisé pour la mise à l'échelle du
   plateau) pour que ce soit TOUT l'écran qui vibre, pas juste le plateau. */
@keyframes screen-shake-medium{
  0%,100%{transform:translate(0,0);}
  20%{transform:translate(-6px,3px);}
  40%{transform:translate(5px,-4px);}
  60%{transform:translate(-4px,4px);}
  80%{transform:translate(3px,-2px);}
}
@keyframes screen-shake-large{
  0%,100%{transform:translate(0,0);}
  15%{transform:translate(-13px,6px);}
  30%{transform:translate(11px,-9px);}
  45%{transform:translate(-9px,8px);}
  60%{transform:translate(8px,-6px);}
  75%{transform:translate(-5px,4px);}
  90%{transform:translate(3px,-2px);}
}
#board-scale-outer.shake-medium{animation:screen-shake-medium .36s ease-in-out;}
#board-scale-outer.shake-large{animation:screen-shake-large .46s ease-in-out;}
#app-outer{width:1920px;height:1080px;transform-origin:center center;flex-shrink:0;display:flex;flex-direction:column;}
#app{display:flex;flex:1;width:100%;min-height:0;}

/* ---------- Barre du haut ---------- */
/* Même style que la barre partagée #app-topbar (spellcraft-shared.js,
   utilisée sur le hub/lobby/boutique/etc.) — mêmes classes, mêmes
   couleurs, même bouton "☰ Menu". La différence avec les autres pages :
   ici elle est injectée directement dans le HTML du plateau (au lieu
   d'être ajoutée par injectAppTopbar()) et réserve un vrai espace de
   56px (padding-top de #board) au lieu de flotter en position:fixed —
   #board-scale-outer occupe tout l'écran en position:fixed, la barre
   partagée flottante passerait donc SOUS lui et resterait invisible,
   ou par-dessus et recouvrirait la zone adverse (c'est justement pour
   ça qu'elle était désactivée ici via APP_TOPBAR_DISABLED). */
#board-topbar{width:1920px;height:56px;box-sizing:border-box;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--bg-panel, rgba(15,12,20,.92));border-bottom:1.5px solid var(--line, rgba(212,175,55,.4));font-family:'Inter',sans-serif;}
#board-topbar-title{font-family:'Cinzel',serif;font-weight:700;color:var(--gold, #d4af37);font-size:16px;letter-spacing:.5px;flex:1;}
#board-topbar-right{display:flex;align-items:center;gap:14px;}
#board-back-btn{font-family:'Cinzel',serif;font-weight:700;font-size:12.5px;color:var(--parchment, #f2ead2);background:none;text-decoration:none;border:1.5px solid var(--line, #3a3260);border-radius:8px;padding:7px 14px;white-space:nowrap;cursor:pointer;}
#board-back-btn:hover{border-color:var(--gold, #d4af37);color:var(--gold, #d4af37);}
/* #sc-options-slot : quand présent, spellcraft-shared.js y ancre
   automatiquement l'engrenage en version compacte (38px, statique) au
   lieu de la grosse pastille flottante 80px par défaut — exactement
   comme sur les autres pages. */

/* ---------- Board ---------- */
#board{flex:1;position:relative;display:flex;flex-direction:column;padding:12px 16px 100px;gap:6px;min-width:0;min-height:0;background:none;}
#board-scroll-area{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;gap:4px;overflow-y:auto;overflow-x:hidden;padding-right:2px;scrollbar-width:none;}
#board-scroll-area::-webkit-scrollbar{width:0;height:0;background:transparent;}

.hero-row{display:flex;flex-direction:column;gap:6px;padding:8px 14px;background:var(--bg-panel);border-radius:14px;border:1px solid #2b2440;max-width:400px;width:fit-content;flex-shrink:0;}
.draw-anim-card{
  position:fixed;width:150px;height:204px;z-index:150;pointer-events:none;
  transform-origin:top left;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.65));
}
.hero-row.enemy{align-self:flex-end;}
.hero-row.self{align-self:flex-start;}

.hero-top{display:flex;align-items:center;gap:14px;}

.hero-portrait{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--arcane), #2a1f55);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;color:#fff;flex-shrink:0;border:3px solid var(--gold);position:relative;}
.hp-badge{position:absolute;bottom:-6px;right:-9px;min-width:26px;height:26px;padding:0 5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e85858,#8a1f1f);border:2px solid #4a0f0f;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.65);z-index:2;}

.hero-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;}
.hero-name{font-family:'Cinzel',serif;font-size:17px;font-weight:600;color:var(--parchment);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.dot.hp{background:var(--blood);}

.hpbar-wrap{width:110px;height:7px;background:#2b2440;border-radius:6px;overflow:hidden;}
.hpbar{height:100%;background:linear-gradient(90deg,var(--blood),#e06060);transition:width .3s;}

.power-btn{background:var(--bg-panel-2);border:1.5px solid var(--frost);color:var(--frost);border-radius:9px;padding:6px 12px;font-family:'Inter';font-size:11.5px;font-weight:600;cursor:pointer;white-space:normal;text-align:left;line-height:1.3;width:100%;}
.power-btn:disabled{opacity:.35;cursor:not-allowed;border-color:#444;color:#777;}
.power-btn:not(:disabled):hover{background:var(--frost);color:var(--ink);}

.region-tag{font-size:12.5px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.mana-bar{display:flex;align-items:center;gap:10px;}
.mana-region-thumb{width:32px;height:32px;border-radius:7px;background-size:cover;background-position:center;background-color:var(--bg-panel-2);border:2px solid var(--green);flex-shrink:0;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.mana-dots{display:flex;flex-wrap:wrap;gap:4px;align-content:center;}
.mana-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.45);flex-shrink:0;}
.mana-dot.filled{background:radial-gradient(circle at 35% 30%,#8fe0ff,#155a94);box-shadow:0 0 5px rgba(111,208,255,.7);}
.mana-dot.empty{background:var(--bg-panel-3, #241f38);}
.mana-dot.fragile{background:radial-gradient(circle at 35% 30%,#d8f4ff,var(--frost));box-shadow:0 0 5px rgba(79,179,217,.75);}
.mana-dot.reserved{outline:2px dashed var(--gold);outline-offset:1.5px;}

.zone-badges{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
.badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:86px;border-radius:8px;background:var(--bg-panel-2);border:1px solid var(--line, #3a3260);cursor:pointer;user-select:none;}
.badge-label{font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--parchment-dim);margin-top:1px;}
.badge:hover{border-color:var(--gold);}
.badge .badge-icon{font-size:20px;line-height:1;}
.badge .badge-count{font-size:14px;font-weight:700;color:var(--parchment);}
.badge.deck .badge-icon{color:var(--gold);}
.badge.discard .badge-icon{color:#8a7fb0;}
.badge.discard:not(.has-cards){opacity:.4;cursor:default;}

.board-divider{display:flex;align-items:center;gap:12px;margin:0 4px;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#4a4270 15%,#4a4270 85%,transparent);}

#discard-modal{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:60;}
#discard-modal.show{display:flex;}
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;z-index:9999;}
.modal-overlay.show{display:flex;}
.modal-overlay .modal-box{background:var(--bg-panel);border:1px solid var(--line, #3a3260);border-radius:12px;padding:20px 24px;max-width:90vw;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:12px;}
.modal-overlay .modal-box h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-modal .modal-box{background:var(--bg-panel);border:1px solid var(--line, #3a3260);border-radius:12px;padding:20px 24px;max-width:520px;max-height:70vh;display:flex;flex-direction:column;gap:12px;}
#discard-modal h2{font-family:'Cinzel',serif;font-size:17px;color:var(--gold);margin:0;}
#discard-list{overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;padding-right:4px;}
#discard-modal .close-btn{align-self:flex-end;background:var(--arcane);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;}

#card-preview{position:fixed;z-index:99999;pointer-events:none;display:none;opacity:0;transition:opacity .15s ease;}
.hero-preview-linked{display:flex;flex-direction:column;gap:2px;max-height:420px;overflow:visible;min-width:140px;background:rgba(15,12,24,.9);border:1px solid var(--line, #3a3260);border-radius:8px;padding:8px 10px;}
.hero-preview-linked-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);text-align:center;margin-bottom:2px;}
.hero-preview-linked-item{font-size:12px;color:#f2ead2;text-align:center;padding:2px 4px;white-space:nowrap;}
#card-preview .ncard{box-shadow:0 16px 34px rgba(0,0,0,.65);}
#card-preview.show{display:flex;align-items:flex-start;gap:10px;opacity:1;}
.kw-tooltip-col{display:flex;flex-direction:column;gap:6px;max-width:220px;}
.kw-tooltip-item{display:flex;align-items:flex-start;gap:8px;background:rgba(15,12,24,.92);border:1px solid var(--line, #3a3260);border-radius:8px;padding:7px 10px;box-shadow:0 6px 14px rgba(0,0,0,.5);}
.kw-tooltip-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
.kw-tooltip-txt{font-size:11.5px;line-height:1.4;color:#f2ead2;}
.kw-tooltip-txt strong{color:var(--gold);font-family:'Cinzel',serif;font-size:11.5px;}
/* Aperçu d'une créature en jeu : écarts avec la carte de base */
.kw-tooltip-item.kw-added{border-color:#58c27d;}
.kw-tooltip-item.kw-added .kw-tooltip-txt strong{color:#8df0b0;}
.kw-tooltip-item.kw-lost{border-color:#d86a6a;}
.kw-tooltip-item.kw-lost .kw-tooltip-txt strong{color:#ffa3a3;text-decoration:line-through;}
.kw-tooltip-item.kw-lost .kw-tooltip-icon{opacity:.55;}
.kw-tooltip-tag{font-size:10px;font-weight:700;color:#f2ead2;}
.kw-added .kw-tooltip-tag{color:#8df0b0;}
.kw-lost .kw-tooltip-tag{color:#ffa3a3;}
.preview-card-col{display:flex;flex-direction:column;align-items:flex-start;gap:6px;}
.preview-mods{width:300px;box-sizing:border-box;background:rgba(15,12,24,.92);border:1px solid var(--line, #3a3260);border-radius:8px;padding:7px 10px;font-size:11.5px;line-height:1.4;color:#f2ead2;}
.preview-mods-title{font-family:'Cinzel',serif;font-size:11.5px;color:var(--gold);margin-bottom:2px;}
.preview-mods .pm-added{color:#8df0b0;}
.preview-mods .pm-lost{color:#ffa3a3;}
.preview-mods .pm-note{font-size:10.5px;color:#b9b0d4;margin-top:2px;}
.preview-base-tag{width:300px;box-sizing:border-box;text-align:center;font-family:'Cinzel',serif;font-size:11.5px;color:var(--gold);background:rgba(15,12,24,.92);border:1px solid var(--line, #3a3260);border-radius:8px;padding:4px 8px;}
.preview-base-hint{width:300px;box-sizing:border-box;font-size:10.5px;color:#b9b0d4;text-align:center;}
.preview-base-btn{display:none;pointer-events:auto;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;color:#f2ead2;background:var(--arcane);border:none;border-radius:8px;padding:8px 16px;}
@media (hover: none){
  .preview-base-hint .pbh-key{display:none;}
  .preview-base-btn{display:inline-block;}
}
/* Capacités perdues (silence) : texte du catalogue atténué + estampille */
.ncard.n-text-lost .ncard-text{opacity:.35;}
.ncard.n-big .n-text-lost-stamp{position:absolute;left:16%;top:65.79%;width:68%;height:27.5%;z-index:9;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.ncard .n-text-lost-stamp span{transform:rotate(-8deg);font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.5px;text-transform:uppercase;color:#ffa3a3;border:2px solid #ffa3a3;border-radius:6px;padding:2px 8px;background:rgba(11,10,18,.78);text-shadow:0 0 2px #000;}

#card-reveal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:85;opacity:0;background:rgba(5,4,10,0);transition:opacity .3s ease, background .3s ease;}
#card-reveal.show{opacity:1;background:rgba(5,4,10,.5);}
#card-reveal-inner .card{transform:scale(2.3);box-shadow:0 24px 60px rgba(0,0,0,.75), 0 0 70px rgba(124,92,255,.45);}
#card-reveal.show #card-reveal-inner{animation:card-reveal-pop .3s ease-out;}
@keyframes card-reveal-pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ---------- Lanes ---------- */
/* Hauteur de la ZONE fixée à 216px (comme sur la maquette) — plus petite
   que la carte (265px) : les cartes débordent volontairement au-dessus
   et en dessous du bandeau de la lane (effet de "bleed"), sans agrandir
   la lane elle-même. C'est un height fixe (pas min-height) : la lane ne
   grandit donc plus avec la taille des cartes, ce qui évite qu'elle ne
   pousse le reste du plateau hors de l'écran. */
.lane{display:flex;gap:10px;justify-content:center;align-items:center;height:200px;overflow:visible;padding:6px;background:radial-gradient(ellipse at center, #1c1730 0%, transparent 75%);border-radius:10px;flex-wrap:wrap;margin:0 130px;flex-shrink:0;}
.lane.enemy{transform:scaleY(-1);}
.lane.enemy .card-slot{transform:scaleY(-1);}
.slot-empty{width:170px;height:170px;border:1.5px dashed #332c50;border-radius:11px;}
/* Cartes posées sur le plateau agrandies (195×265 au lieu de 150×204) —
   scopé aux lanes uniquement : la main (.hand-row), les reliques
   (.relic-slot) et les previews gardent la taille de base de .card,
   donc rien d'autre n'est affecté par ce changement. */
.lane .card{width:240px;height:326px;}

/* ---------- Cards ---------- */
.card{
  --cc: var(--neutre);
  width:150px;height:204px;background:#f7f2e2;color:#231d33;border-radius:11px;
  position:relative;cursor:pointer;flex-shrink:0;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  border:4px solid var(--cc);
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;overflow:hidden;
  user-select:none;
}
.card.class-Aube{--cc:var(--aube);}
.card.class-Crépuscule{--cc:var(--crepuscule);}
.card.class-Prima{--cc:var(--prima);}
.card.class-Volonté{--cc:var(--volonte);}
.card.class-Arcane{--cc:var(--arcane-c);}
.card.class-Neutre{--cc:var(--neutre);}

.card-foil-layer{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:9;}
.card-foil-layer::before{
  content:'';position:absolute;top:-60%;left:-70%;width:70%;height:220%;
  background:linear-gradient(115deg,
    transparent 0%, rgba(255,90,90,.5) 14%, rgba(255,210,80,.5) 28%,
    rgba(120,255,150,.5) 42%, rgba(80,190,255,.5) 56%, rgba(190,110,255,.5) 70%,
    rgba(255,120,200,.5) 84%, transparent 100%);
  transform:translateX(-40%) rotate(8deg);
  mix-blend-mode:color-dodge;
  opacity:.55;
}
.card.foil-play .card-foil-layer::before{animation:foil-sweep 1.05s ease-in-out;}
@keyframes foil-sweep{
  0%{transform:translateX(-160%) rotate(8deg);opacity:0;}
  15%{opacity:.9;}
  85%{opacity:.9;}
  100%{transform:translateX(160%) rotate(8deg);opacity:0;}
}
.card:hover{transform:translateY(-6px);box-shadow:0 8px 16px rgba(0,0,0,.6);}
.card.selected{outline:3px solid var(--arcane);transform:translateY(-6px);}
.card.attacking{outline:3px solid var(--blood);}
.card.blocked-by::after{content:"🛡";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:14px;z-index:5;}
.card.self-targetable{cursor:crosshair;box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);animation:self-target-pulse 1.3s ease-in-out infinite;}
@keyframes self-target-pulse{0%,100%{box-shadow:0 0 0 3px var(--gold), 0 4px 14px rgba(212,175,55,.5);}50%{box-shadow:0 0 0 5px var(--gold), 0 4px 20px rgba(212,175,55,.8);}}
.card.targetable{outline:3px solid var(--blood);animation:pulse 1s infinite;}
.card.dragging{opacity:.35;}
.card.trap-pending{outline:3px dashed var(--gold);outline-offset:2px;opacity:.75;cursor:default;}
.card.trap-active{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 16px rgba(212,175,55,.6);cursor:default;animation:trap-armed-pulse 1.8s ease-in-out infinite;}
.trap-wolf-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));z-index:10;pointer-events:none;}
@keyframes trap-armed-pulse{0%,100%{box-shadow:0 0 12px rgba(212,175,55,.45);}50%{box-shadow:0 0 22px rgba(212,175,55,.85);}}
#lane-p1.drop-hover, #hero-p2.drop-hover{outline:3px dashed var(--gold);outline-offset:4px;border-radius:12px;}
.card-slot.drop-hover .card{outline:3px dashed var(--gold);}
.card.frozen{filter:hue-rotate(180deg) saturate(1.4) brightness(.9);}
.card.stunned{filter:grayscale(.7) brightness(.75);}
.card.summon-sick{transform:rotate(-4deg);}
.card.summon-sick:hover{transform:rotate(-4deg) translateY(-6px);}
.ncard.is-stunned{filter:grayscale(.7) brightness(.75);}
.ncard.is-frozen{filter:hue-rotate(180deg) saturate(1.4) brightness(.9);}
.ncard .nstat-txt.n-up{color:#8df0b0;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px rgba(0,0,0,.9);}
.ncard .nstat-txt.n-down{color:#ffa3a3;text-shadow:0 0 2px #000,0 1px 3px #000,0 0 6px rgba(0,0,0,.9);}
.ncard.is-unavailable{opacity:.55;outline:2px dashed rgba(220,220,220,.55);outline-offset:-2px;}
/* Posture de combat (voir « Posture de combat » dans le script). Retrait : décalage
   vers l'arrière de la ligne via la propriété `translate` (indépendante de
   `transform`) ; la valeur signée --withdraw-y est posée en ligne par le script
   d'après WITHDRAW_OFFSET_PX (bas pour ma ligne, haut pour l'adverse : la carte
   est dans un .card-slot déjà retourné sur la ligne adverse, son « bas » est
   donc celui de l'écran). La transition n'est posée en ligne que si le retrait
   change (durée via cms(), aucune en Instantané). */
.ncard.is-withdrawn{translate:0 var(--withdraw-y,16px);}
/* Flèche rouge clignotante sur un attaquant déclaré non bloqué : au-dessus (ma
   créature) ou en dessous (créature adverse), sans capter les clics. */
.ncard .attacker-arrow{position:absolute;left:50%;width:26px;height:30px;margin-left:-13px;z-index:12;pointer-events:none;
  animation:attacker-arrow-blink-kf .9s ease-in-out infinite;filter:drop-shadow(0 0 5px var(--blood)) drop-shadow(0 1px 2px rgba(0,0,0,.9));}
.ncard .attacker-arrow svg{display:block;fill:var(--blood);stroke:#ffd0d0;stroke-width:2;}
.ncard .attacker-arrow.is-above{bottom:100%;margin-bottom:-6px;}
.ncard .attacker-arrow.is-below{top:100%;margin-top:-6px;transform:rotate(180deg);}
.ncard .attacker-arrow.is-static{animation:none;opacity:1;}
@keyframes attacker-arrow-blink-kf{0%,100%{opacity:1;}50%{opacity:.2;}}
@media (prefers-reduced-motion: reduce){
  .ncard .attacker-arrow{animation:none;opacity:1;}
  .ncard.is-withdrawn{transition:none !important;}
}
.card-unavailable-badge{position:absolute;bottom:2px;left:2px;z-index:11;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;background:rgba(23,19,37,.9);border:1.5px solid #bbb;box-shadow:0 1px 4px rgba(0,0,0,.7);cursor:help;}
.card-status-badge{position:absolute;bottom:2px;right:2px;z-index:11;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;background:rgba(23,19,37,.9);border:1.5px solid var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.7);cursor:help;}
.zzz{position:absolute;top:2px;right:3px;display:flex;align-items:flex-end;z-index:4;pointer-events:none;}
.zzz span{font-family:'Cinzel',serif;font-weight:700;color:#ffd76b;text-shadow:0 1px 2px rgba(0,0,0,.7);animation:zzz-float 1.8s ease-in-out infinite;display:inline-block;}
.zzz span:nth-child(1){font-size:9px;animation-delay:0s;}
.zzz span:nth-child(2){font-size:12px;animation-delay:.3s;margin-left:1px;}
.zzz span:nth-child(3){font-size:15px;animation-delay:.6s;margin-left:1px;}
@keyframes zzz-float{
  0%{opacity:0;transform:translateY(3px) scale(.6);}
  30%{opacity:1;transform:translateY(0) scale(1);}
  70%{opacity:1;transform:translateY(-3px) scale(1.12);}
  100%{opacity:0;transform:translateY(-7px) scale(.75);}
}

.card.kw-fearful{animation:fearful-tremble 5s ease-in-out infinite;}
@keyframes fearful-tremble{
  0%,92%,100%{transform:translateX(0) rotate(0);}
  93%{transform:translateX(-3px) rotate(-1.5deg);}
  94%{transform:translateX(3px) rotate(1.5deg);}
  95%{transform:translateX(-3px) rotate(-1.5deg);}
  96%{transform:translateX(3px) rotate(1.5deg);}
  97%{transform:translateX(-2px) rotate(-1deg);}
  98%{transform:translateX(0) rotate(0);}
}

.card-armor-shield{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(135deg, rgba(255,215,110,.32), rgba(255,215,110,.04) 60%);box-shadow:inset 0 0 12px rgba(255,215,110,.6);animation:armor-glow 2.2s ease-in-out infinite;}
@keyframes armor-glow{0%,100%{opacity:.65;}50%{opacity:1;}}

.status-stack-tr{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;z-index:6;pointer-events:none;max-width:80%;flex-wrap:wrap-reverse;}
.kw-icon{width:24px;height:24px;filter:invert(1) drop-shadow(0 1px 2px rgba(0,0,0,.7));}
@keyframes protection-pulse{0%,100%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.18);}}

/* Vol : la carte plane, ombre portée dessous via drop-shadow (respecte la découpe de la carte) */
.card.kw-flying{transform:translateY(-9px);filter:drop-shadow(0 16px 7px rgba(0,0,0,.5));}
.card.kw-flying:hover{transform:translateY(-15px);}

/* Furtif : légèrement transparente, volutes de fumée à des coins différents */
.card.kw-stealth{opacity:.78;}
.card.kw-stealth::before, .card.kw-stealth::after{
  content:'';position:absolute;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.6), transparent 70%);
  filter:blur(2px);pointer-events:none;z-index:5;
  animation:smoke-wisp 4s ease-in-out infinite;
}
.card.kw-stealth::before{top:-4px;left:-4px;animation-delay:0s;}
.card.kw-stealth::after{bottom:10px;right:-4px;animation-delay:2s;}
@keyframes smoke-wisp{
  0%{opacity:0;transform:translateY(4px) scale(.6);}
  30%{opacity:.75;transform:translateY(-2px) scale(1);}
  70%{opacity:.35;transform:translateY(-10px) scale(1.35);}
  100%{opacity:0;transform:translateY(-16px) scale(1.6);}
}

/* Perçant : petit pic acéré animé */
@keyframes pierce-jab{0%,100%{transform:translateX(0) rotate(-30deg);}50%{transform:translateX(2px) rotate(-30deg) scale(1.15);}}

/* Initiative : reflet métallique qui balaie la carte */
.card.kw-initiative::before{
  content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;
  background:linear-gradient(115deg, transparent, rgba(255,255,255,.7), transparent);
  transform:skewX(-20deg);pointer-events:none;z-index:5;
  animation:initiative-shine 2.8s ease-in-out infinite;
}
@keyframes initiative-shine{0%{left:-60%;}55%{left:120%;}100%{left:120%;}}

/* Vol de vie : lueur violette-rose périodique */
.card.kw-lifesteal{animation:lifesteal-glow 6s ease-in-out infinite;}
@keyframes lifesteal-glow{
  0%,84%,100%{filter:none;}
  90%{filter:drop-shadow(0 0 7px rgba(255,90,220,.85)) brightness(1.08);}
  95%{filter:drop-shadow(0 0 12px rgba(200,80,255,.95)) brightness(1.15);}
}

/* Choisi pour attaquer : épées */
.card.attack-selecting{transform:translateY(-20px);box-shadow:0 12px 22px rgba(194,59,59,.55);}
.card.attack-selecting:hover{transform:translateY(-24px);}
.sword-icons{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;z-index:8;pointer-events:none;filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));}
.sword-icons img{width:100%;height:100%;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(90%);}
.sword-icons.confirmed{font-size:28px;animation:sword-clash 1.3s ease-in-out infinite;}
@keyframes sword-clash{0%,100%{transform:translate(-50%,-50%) rotate(-5deg);}50%{transform:translate(-50%,-50%) rotate(5deg);}}
@keyframes pulse{0%,100%{outline-color:var(--blood);}50%{outline-color:#ff8a8a;}}

.card-art{position:relative;height:42%;background:linear-gradient(135deg,#c9bd93,#a89968);background-size:cover;background-position:center;flex-shrink:0;}
.card-cost{position:absolute;top:6px;left:6px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fd0ff,#155a94);border:2px solid #0c2b45;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-hero-hp{position:absolute;top:5px;right:6px;width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7de08f,#1f7a3d);border:2px solid #0c3d1a;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-divider{height:7px;flex-shrink:0;position:relative;background:var(--cc);display:flex;align-items:center;justify-content:center;}
.card-set-icon{width:15px;height:15px;background:var(--gold);border:1.5px solid #7a611c;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.card-set-icon span{transform:rotate(-45deg);font-size:6.5px;font-weight:700;color:#3a2c05;font-family:'Cinzel',serif;}
.card-set-logo-img{position:absolute;width:200%;height:200%;top:-50%;left:-50%;background-size:cover;background-position:center;transform:rotate(-45deg);}
.card-body{flex:1;padding:3px 7px 2px;display:flex;flex-direction:column;min-height:0;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:11px;text-align:center;text-decoration:underline;text-underline-offset:2.5px;color:#1c1830;line-height:1.2;margin-bottom:3px;min-height:24px;}
.card-kw{font-size:8px;color:var(--arcane);font-weight:700;min-height:10px;text-align:center;}
.card-text{font-size:8.2px;line-height:1.2;flex:1;color:#2a2338;overflow-y:auto;white-space:pre-wrap;text-align:center;}
.card-typeline{position:absolute;left:0;top:0;bottom:0;width:11px;background:rgba(15,12,20,.6);color:#f2ead2;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:flex-start;justify-content:flex-start;font-size:5px;letter-spacing:.2px;text-transform:uppercase;padding:5px 0 16px;text-align:center;z-index:1;}
.card-footer{height:27px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 7px 4px;}
.card-atk,.card-hp{width:20px;height:20px;border-radius:50%;background:#efe6c8;border:2px solid #1c1830;display:flex;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:9.5px;}
.atk-icon{width:9px;height:9px;filter:invert(21%) sepia(85%) saturate(2500%) hue-rotate(340deg) brightness(85%);}
.card-atk{color:var(--blood);}
.card-hp{color:var(--green);}
.card-rarity-gem{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) rotate(45deg);width:10px;height:10px;border:2px solid rgba(0,0,0,.35);box-shadow:0 0 4px currentColor;}
.card-rarity-gem.rarity-Basique{background:#6b6558;color:#6b6558;}
.card-rarity-gem.rarity-Commune{background:#c7c2b3;color:#c7c2b3;}
.card-rarity-gem.rarity-Rare{background:var(--frost);color:var(--frost);}
.card-rarity-gem.rarity-Épique{background:var(--arcane);color:var(--arcane);}
.card-rarity-gem.rarity-Mythique{background:var(--gold);color:var(--gold);}
.charges{color:var(--frost);font-size:11px;font-weight:700;position:absolute;bottom:5px;right:6px;z-index:2;}

.hand-row{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:9px;justify-content:center;padding:55px 14px 6px;pointer-events:none;scrollbar-width:none;background:transparent !important;box-shadow:none;border:none;transform:translateY(136px);transition:transform .22s ease;}
.hand-row .card{pointer-events:auto;}
.hand-row::-webkit-scrollbar{height:0;width:0;background:transparent;}
.hand-card-slot{pointer-events:auto;width:177px;height:250px;flex-shrink:0;transform-origin:bottom center;transition:transform .15s ease;}
.hand-card-slot:hover{transform:translateY(-8px) scale(1.05);z-index:5;position:relative;}
.hand-card-slot .ncard.hand-card{transform:scale(0.59);transform-origin:top left;}

.enemy-hand-row{position:fixed;top:56px;left:0;right:0;z-index:39;display:flex;flex-wrap:nowrap;overflow:visible;gap:6px;justify-content:center;padding:6px 14px 30px;pointer-events:none;}
.enemy-hand-card{width:92px;height:130px;border-radius:8px;background-size:cover;background-position:center;background-color:#2a2440;border:2px solid var(--line, #3a3260);box-shadow:0 4px 10px rgba(0,0,0,.5);transform:rotate(180deg);flex-shrink:0;}
.enemy-hand-card-revealed{flex-shrink:0;transform:scale(.72);transform-origin:top center;margin:0 -18px;}

.side-zone{position:absolute;display:flex;flex-direction:column;gap:8px;z-index:6;}
.side-zone.self{right:16px;top:calc(50% + 100px);}
.side-zone.enemy{right:16px;top:50%;transform:translateY(-50%);}
.relic-slot{width:78px;height:106px;position:relative;overflow:hidden;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.5);cursor:default;}
.artifact-used-this-turn{filter:grayscale(85%) brightness(.55);transition:filter .2s ease;}
@keyframes artifactActivateFlash{
  0%{box-shadow:0 0 0 0 rgba(212,175,55,0);filter:brightness(1);}
  35%{box-shadow:0 0 22px 6px rgba(212,175,55,.9);filter:brightness(1.5);}
  100%{box-shadow:0 0 0 0 rgba(212,175,55,0);filter:brightness(1);}
}
.artifact-activate-flash{animation:artifactActivateFlash .75s ease-out;}
.relic-slot .card{transform:scale(.52);transform-origin:top left;}
.relic-charges-badge{position:absolute;bottom:3px;right:3px;background:rgba(15,12,20,.8);border:1px solid var(--gold);color:var(--gold);font-size:9.5px;font-weight:700;border-radius:9px;padding:1px 6px;z-index:2;}
.mini-tag{width:52px;height:44px;border-radius:6px;background:var(--bg-panel-2);border:1px solid var(--frost);display:flex;align-items:center;justify-content:center;font-size:8px;text-align:center;padding:2px;position:relative;}
.mini-tag.relic{border-color:var(--gold);}

.phase-bar{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-shrink:0;}
.phase-bar-stack{display:flex;flex-direction:column;align-items:stretch;gap:8px;}
.phase-bar-subrow{display:flex;gap:8px;justify-content:flex-end;}
.phase-btn{background:linear-gradient(180deg,var(--arcane),#5537c2);color:#fff;border:none;border-radius:10px;padding:10px 22px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 12px rgba(124,92,255,.4);letter-spacing:.4px;white-space:nowrap;}
/* Rappel clignotant — quand le bouton d'action (combat/fin de tour/fin de
   blocage) reste cliquable sans que le joueur agisse, voir setupPhaseReminder. */
@keyframes phase-btn-reminder{
  0%,100%{transform:scale(1);box-shadow:0 4px 12px rgba(124,92,255,.4);}
  50%{transform:scale(1.08);box-shadow:0 4px 12px rgba(124,92,255,.4), 0 0 26px 8px rgba(212,175,55,.9);}
}
.phase-btn.reminder-blink{animation:phase-btn-reminder 1s ease-in-out infinite;}
.phase-btn.small{padding:6px 14px;font-size:11px;box-shadow:none;}
.phase-btn:hover{filter:brightness(1.15);}
.phase-btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
.phase-btn.secondary{background:var(--bg-panel-2);border:1px solid var(--line, #3a3260);box-shadow:none;}
.phase-label{font-family:'Cinzel',serif;font-size:12px;color:var(--parchment-dim);}

/* ---------- Log panel ---------- */
#log-panel{width:230px;background:var(--bg-panel);border-left:1px solid #2b2440;padding:14px 14px 40px;display:flex;flex-direction:column;min-height:0;}

#log-panel h3{font-family:'Cinzel',serif;font-size:13px;margin:0 0 10px;color:var(--gold);letter-spacing:1px;}
#log{flex:1;overflow-y:auto;font-size:11px;line-height:1.5;color:var(--parchment-dim);display:flex;flex-direction:column-reverse;}
#log div{padding:3px 0;border-bottom:1px solid var(--bg-panel-3, #241f38);}

#overlay{position:fixed;inset:0;background:rgba(5,4,10,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50;}
#turn-timer{display:none;position:absolute;left:50%;top:-38px;transform:translateX(-50%);align-items:center;gap:6px;padding:5px 14px;border-radius:20px;background:rgba(23,19,37,.9);border:1.5px solid var(--line, #3a3260);font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--parchment);z-index:30;white-space:nowrap;}
#turn-timer.timer-mine{border-color:var(--gold);}
#turn-timer.timer-low{border-color:var(--blood);color:#ff8080;animation:timer-pulse 1s infinite;}
#turn-timer.timer-block{border-color:var(--frost);}
@keyframes timer-pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
#overlay-summary{background:rgba(23,19,37,.9);border:1.5px solid var(--gold);border-radius:14px;padding:20px 26px;min-width:340px;max-width:92vw;}
#overlay-summary table{border-collapse:collapse;width:100%;font-family:'Inter',sans-serif;color:var(--parchment);}
#overlay-summary th, #overlay-summary td{padding:6px 14px;text-align:center;font-size:13px;}
#overlay-summary th{font-family:'Cinzel',serif;color:var(--gold);font-weight:700;border-bottom:1.5px solid var(--gold);}
#overlay-summary td:first-child, #overlay-summary th:first-child{text-align:left;color:var(--parchment-dim);}
#overlay-summary tr.summary-sep td{padding-top:10px;}
#overlay-summary .summary-coins{margin-top:14px;text-align:center;font-family:'Cinzel',serif;color:var(--gold);font-size:15px;}
#overlay.show{display:flex;}
#overlay h1{font-family:'Cinzel',serif;font-size:36px;color:var(--gold);}
#overlay button{background:var(--arcane);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:14px;}

#mulligan-overlay{position:fixed;inset:0;background:rgba(5,4,10,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:55;}
#mulligan-overlay.show{display:flex;}
#mulligan-overlay h2{font-family:'Cinzel',serif;font-size:26px;color:var(--gold);margin:0;}
#mulligan-overlay .mulligan-sub{font-size:13px;color:var(--parchment-dim);margin:0 0 6px;max-width:420px;text-align:center;}
#mulligan-cards{display:flex;gap:16px;}
.mulligan-card-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;}
.mulligan-card-wrap:hover{transform:translateY(-6px);}
.mulligan-card-wrap.marked .card{opacity:.4;filter:grayscale(70%);}
.mulligan-tag{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:var(--green);padding:4px 12px;border-radius:14px;border:1px solid var(--green);}
.mulligan-card-wrap.marked .mulligan-tag{color:var(--blood);border-color:var(--blood);}
.mulligan-confirm-btn{background:var(--arcane);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:14px;margin-top:8px;}

/* ===== Écran d'annonce de match (joueur vs adversaire) ===== */
#match-announce-overlay{position:fixed;inset:0;background:#0b0905;display:none;z-index:70;opacity:0;transition:opacity .45s ease;overflow:hidden;}
#match-announce-overlay.show{display:block;}
#match-announce-overlay.visible{opacity:1;}
.ma-side{position:absolute;inset:0;}
.ma-side-left{clip-path:polygon(0 0, 33.333% 0, 66.667% 100%, 0 100%);}
.ma-side-right{clip-path:polygon(33.333% 0, 100% 0, 100% 100%, 66.667% 100%);}
/* Couche interne portant l'image de fond : la découpe diagonale reste sur .ma-side-left/right
   (ci-dessus), le miroir éventuel (côté droit) ne s'applique qu'à cette couche, jamais à la découpe. */
.ma-side-bg{position:absolute;inset:0;}
.ma-vignette-left{clip-path:polygon(0 0, 33.333% 0, 66.667% 100%, 0 100%);background:radial-gradient(ellipse 46vw 70vh at 22% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 60%, rgba(0,0,0,.08) 100%);}
.ma-vignette-right{clip-path:polygon(33.333% 0, 100% 0, 100% 100%, 66.667% 100%);background:radial-gradient(ellipse 46vw 70vh at 78% 50%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 60%, rgba(0,0,0,.08) 100%);}
/* Ligne dorée = un fin ruban taillé avec le MÊME clip-path (33.333%/66.667%)
   que les deux zones d'illustration ci-dessus, au lieu d'un <svg> séparé
   avec son propre système de coordonnées (viewBox 1280x720 étiré) — ce
   dernier pouvait très légèrement diverger du découpage CSS réel selon le
   navigateur. En réutilisant exactement les mêmes pourcentages (juste
   élargis de ±0.3 point), la ligne est géométriquement garantie de tomber
   pile sur la séparation des deux images, sans possibilité de décalage. */
.ma-divider-glow{background:#D4AF37;clip-path:polygon(33.033% 0, 33.633% 0, 66.967% 100%, 66.367% 100%);filter:drop-shadow(0 0 7px #D4AF37);z-index:4;pointer-events:none;}
.ma-vs-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#120d08;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 0 0 6px rgba(11,9,5,.9),0 0 22px rgba(0,0,0,.6);}
.ma-vs-badge span{font-family:'Cinzel',serif;font-size:20px;font-weight:700;letter-spacing:1px;}
/* Toutes les tailles ci-dessous sont en vw (relatif à la largeur de la
   fenêtre, calées sur une référence de 1280px), comme la découpe diagonale
   (clip-path en %) et la ligne dorée (SVG en viewBox 1280x720) — ainsi le
   cadre de joueur reste TOUJOURS correctement aligné avec la ligne, quelle
   que soit la taille d'écran réelle (avant : tailles fixes en px, qui
   pouvaient déborder de la découpe sur certaines résolutions). */
.ma-block{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1vw,15px);width:clamp(230px,29.7vw,420px);z-index:3;}
.ma-block-left{left:22%;}
.ma-block-right{left:78%;}
.ma-cardback{width:clamp(74px,9.5vw,135px);height:clamp(103px,13.3vw,188px);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;}
.ma-name{font-family:'Cinzel',serif;color:#f1e6c8;font-size:clamp(19px,2.5vw,35px);font-weight:700;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.7);text-align:center;}
.ma-deckname{font-style:italic;color:rgba(241,230,200,.65);font-size:clamp(10px,1.25vw,17px);text-align:center;}
.ma-avatar{width:clamp(65px,8.4vw,120px);height:clamp(65px,8.4vw,120px);border-radius:50%;margin-top:5px;box-shadow:0 5px 15px rgba(0,0,0,.6);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;}
.ma-title{font-family:'Cinzel',serif;font-size:clamp(9px,1.17vw,16px);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px;}
.ma-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,0.7vw,10px);margin-top:4px;min-height:clamp(70px,8.9vw,128px);}

#target-arrow{fill:var(--arcane);filter:drop-shadow(0 0 10px var(--arcane)) drop-shadow(0 0 20px var(--arcane));}
@keyframes target-dash{to{stroke-dashoffset:-18;}}
body.targeting *{cursor:crosshair !important;}

.block-arrow-head{fill:var(--blood);filter:drop-shadow(0 0 10px var(--blood)) drop-shadow(0 0 20px var(--blood));}

/* Chiffres de dégâts : taille/couleur selon l'ampleur (voir damagePopupSpec).

/* ============================================================
   RÉVÉLATION 3D — carte jouée / piège déclenché (voir renderGameLog
   et playCardFlipReveal). Grand plan centré, façon ouverture de
   booster : la carte se retourne pour montrer ce qui vient de se
   passer, puis s'efface.
   ============================================================ */
.ability-reveal-overlay{position:fixed;inset:0;z-index:9990;display:flex;align-items:center;justify-content:center;
  background:rgba(5,4,10,0);opacity:0;pointer-events:none;transition:opacity .28s ease, background .28s ease;}
.ability-reveal-overlay.show{opacity:1;background:rgba(5,4,10,.58);pointer-events:auto;cursor:pointer;}
.ability-reveal-overlay.closing{opacity:0;background:rgba(5,4,10,0);}
.ability-reveal-flip{width:260px;height:366px;perspective:1400px;transform:scale(.72);transition:transform .3s cubic-bezier(.34,1.4,.64,1);}
.ability-reveal-overlay.show .ability-reveal-flip{transform:scale(1);}
.ability-reveal-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d;}
.ability-reveal-inner.flipped{transform:rotateY(180deg);}
.ability-reveal-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-shadow:0 26px 60px rgba(0,0,0,.7), 0 0 70px rgba(124,92,255,.4);}
.ability-reveal-back{background:linear-gradient(145deg,#241d3d,#100c1e);border:2px solid var(--gold);font-size:64px;}
.ability-reveal-back .trap-reveal-icon{filter:drop-shadow(0 3px 8px rgba(0,0,0,.8));}
.ability-reveal-back .trap-reveal-icon-corner{position:absolute;bottom:10px;right:10px;font-size:26px;
  background:rgba(10,8,18,.65);border:1px solid var(--gold);border-radius:50%;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;}
.ability-reveal-front{transform:rotateY(180deg);}
.ability-reveal-front .ncard{transform:scale(0.8667);}

/* ============================================================
   FLÈCHE DE CAPACITÉ — un "projectile" lumineux part de la carte qui
   porte la capacité et fonce vers chaque cible touchée (voir
   fireAbilityArrow). Distinct des flèches de blocage (rouge) et de la
   ligne de visée du joueur (déjà en var(--arcane)) : même teinte,
   usage différent (résultat d'un effet, pas une sélection en cours).
   ============================================================ */
.ability-bolt{position:fixed;z-index:9994;width:58px;height:14px;pointer-events:none;
  background:linear-gradient(90deg, rgba(124,92,255,0) 0%, rgba(124,92,255,.65) 30%, var(--arcane) 100%);
  border-radius:8px;filter:drop-shadow(0 0 10px var(--arcane)) drop-shadow(0 0 22px var(--arcane));}
.ability-bolt::after{content:'';position:absolute;right:-5px;top:50%;width:18px;height:18px;transform:translateY(-50%);
  background:var(--arcane);border-radius:50%;box-shadow:0 0 22px 8px var(--arcane);}
.ability-impact-ring{position:fixed;z-index:9994;left:0;top:0;width:96px;height:96px;margin:-48px;border-radius:50%;
  border:5px solid var(--arcane);pointer-events:none;box-shadow:0 0 28px var(--arcane);
  animation:ability-impact-pop .55s ease-out forwards;}
@keyframes ability-impact-pop{
  0%{opacity:.9;transform:scale(.2);}
  100%{opacity:0;transform:scale(1.6);}
}
.ability-hit-flash{animation:ability-hit-flash-kf .5s ease-out;}
@keyframes ability-hit-flash-kf{
  0%{filter:brightness(1) drop-shadow(0 0 0 rgba(124,92,255,0));}
  35%{filter:brightness(1.5) drop-shadow(0 0 18px var(--arcane));}
  100%{filter:brightness(1) drop-shadow(0 0 0 rgba(124,92,255,0));}
}

/* ============================================================
   DÉCLENCHEMENT SUR SOI-MÊME — quand la cible d'une capacité EST sa
   propre source, pas de flèche (rien à relier) : un éclat doré qui
   CONVERGE sur la carte, nettement distinct visuellement de la teinte
   arcane utilisée pour une flèche vers une autre carte.
   ============================================================ */
.ability-self-burst{position:fixed;z-index:9994;left:0;top:0;width:120px;height:120px;margin:-60px;border-radius:50%;
  pointer-events:none;border:3px solid var(--gold);box-shadow:0 0 20px var(--gold);
  animation:ability-self-burst-kf .65s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes ability-self-burst-kf{
  0%{opacity:0;transform:scale(2.2);}
  55%{opacity:1;}
  100%{opacity:0;transform:scale(.35);}
}
.ability-self-trigger{animation:ability-self-trigger-kf .9s ease-out;}
@keyframes ability-self-trigger-kf{
  0%,100%{box-shadow:none;}
  30%{box-shadow:0 0 0 4px var(--gold), 0 0 26px var(--gold);}
}

  .ncard.journal-highlight{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px rgba(212,175,55,.8);z-index:50;position:relative;}
  /* Assombrit tout le plateau sauf les cibles en surbrillance — le

    padding:7px 18px;font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.4px;color:var(--parchment,#f0e6c8);
    background:rgba(15,12,20,.72);border:1.5px solid rgba(212,175,55,.55);border-radius:18px;cursor:pointer;opacity:.8;}
  #combat-skip-btn:hover{opacity:1;background:rgba(15,12,20,.92);}

<script>

const KEYWORD_ICON_FILES = {
  charge:'kw-charge.png', flying:'kw-envol.png', reach:'kw-portee.png', pierce:'kw-brutalite.png',
  lifesteal:'kw-volDeVie.png', initiative:'kw-initiative.png', armor:'kw-armure.png',
  stealth:'kw-parade.png', relentless:'kw-tenace.png', fearful:'kw-peureux.png',
  protecteur:'kw-protecteur.png', toxic:'kw-toxique.png',
  discret:'kw-discret.png', imparable:'kw-imparable.png', fugace:'kw-fugace.png',
  assault:'kw-assaut.png', final:'kw-final.png'
  // "debut" est volontairement absent : pas d'icône pour ce mot-clé.
};
const KEYWORD_LABELS = {
  charge:'Charge', flying:'Envol', reach:'Portée', pierce:'Brutalité', lifesteal:'Vol de vie',
  initiative:'Initiative', armor:'Armure', stealth:'Parade', relentless:'Tenace',
  fearful:'Peureux', protecteur:'Protecteur', toxic:'Toxique',
  discret:'Discret', imparable:'Imparable', fugace:'Fugace',
  assault:'Assault', debut:'Début', final:'Final'
};
// Texte complet de chaque mot-clé — utilisé par les bulles contextuelles
// affichées à côté de l'aperçu agrandi d'une créature (survol en partie).
const KEYWORD_DESCRIPTIONS = {
  charge: "Peut attaquer dès le tour où elle arrive en jeu, sans attendre le tour suivant.",
  flying: "Ne peut être bloquée que par des créatures qui ont elles-mêmes le Vol ou la Portée.",
  reach: "Peut bloquer une créature avec Envol, sans avoir elle-même ce mot-clé.",
  pierce: "Les dégâts en excès par rapport aux PV restants du bloqueur sont infligés au héros adverse.",
  lifesteal: "Chaque point de dégât qu'elle inflige soigne d'autant votre héros.",
  initiative: "Frappe la première lors d'un combat. Si ce premier coup suffit à tuer sa cible, elle ne subit aucun dégât en retour.",
  armor: "Absorbe le premier dégât subi (combat ou effet), une seule fois.",
  stealth: "Ne peut pas être ciblée par l'adversaire jusqu'au début du prochain tour de son propriétaire.",
  relentless: "À sa mort, revient automatiquement en jeu une fois — sans le mot-clé Tenace la seconde fois.",
  fearful: "Ne peut jamais bloquer une créature adverse.",
  protecteur: "Ne peut jamais attaquer.",
  toxic: "Toute créature à qui elle inflige des dégâts au combat meurt, peu importe ses PV restants.",
  discret: "Ne peut jamais être bloquée.",
  imparable: "Ne peut pas être ciblée par un piège.",
  fugace: "Meurt automatiquement à la fin du tour où elle est en jeu.",
  assault: "Étiquette pour les cartes liées au thème de l'attaque/l'agression (sans effet de jeu).",
  debut: "Étiquette pour les cartes liées au tout début d'une partie ou d'un tour (sans effet de jeu).",
  final: "Étiquette pour les cartes liées à la fin d'une partie ou d'un tour (sans effet de jeu)."
};
// Un mot-clé peut être présent sur une carte sans que son effet ne soit
// actif en ce moment précis (ex. Parade ne protège que jusqu'au début du
// prochain tour du propriétaire). Cette fonction dit si l'icône/la bulle doit
// être affichée MAINTENANT pour une créature en jeu ; hors plateau (main,
// aperçu générique), on montre tout — il n'y a pas encore d'état "actif".
function isKeywordActiveNow(k, card, inPlay){
  if(!inPlay) return true;
  if(k==='armor') return !card.armorUsed;
  if(k==='stealth') return !!card.summonSick;
  return true;
}
// ---------------- Couleur des stats d'une créature en jeu ----------------
// Compare les stats actuelles à celles du catalogue (carte d'origine).
// Fonction pure : `base` = carte du catalogue ({atk,hp}) ou undefined si le
// catalogue n'est pas (encore) chargé ; `turn` = tour global courant (sert à
// dire quand un bonus temporaire expire).
// Champs lus sur l'instance (voir serveur) : curAtk/curHp = valeurs courantes,
// atk/hp = maximum courant (avec bonus), _tempModifiers = bonus temporaires.
// Renvoie { atk:{cls,title}, hp:{cls,title} } ; cls = 'n-up' (bonus, vert),
// 'n-down' (malus ou dégâts, rouge) ou '' (inchangé).
// <stat-colors>
function creatureStatInfo(card, base, turn){
  const signed = (n)=> (n>0?'+':'') + n;
  const mods = card._tempModifiers || [];
  // Détaille l'écart à la base : part temporaire (par échéance) + part permanente.
  const describeDiff = (diff, field)=>{
    const parts = [];
    let temp = 0;
    mods.forEach(m=>{
      const v = m[field] || 0;
      if(!v) return;
      temp += v;
      parts.push(`${signed(v)} ${m.expiresAtGlobalTurn <= turn ? "jusqu'à la fin du tour" : "jusqu'à la fin du prochain tour"}`);
    });
    const perm = diff - temp;
    if(perm) parts.unshift(`${signed(perm)} permanent`);
    return parts.join(', ');
  };
  const hasBase = !!base && typeof base.atk==='number' && typeof base.hp==='number';

  // --- Force ---
  const curAtk = card.curAtk ?? card.atk ?? 0;
  const atk = { cls:'', title:'' };
  if(hasBase && curAtk !== base.atk){
    atk.cls = curAtk > base.atk ? 'n-up' : 'n-down';
    atk.title = `Force ${curAtk} (base ${base.atk}, ${describeDiff(curAtk - base.atk, 'atk')})`;
  }

  // --- Points de vie ---
  const curHp = card.curHp ?? card.hp ?? 0;
  const maxHp = card.hp ?? curHp;
  const wounded = curHp < maxHp;
  const hp = { cls:'', title:'' };
  if(wounded) hp.cls = 'n-down';                       // dégâts subis : toujours le plus parlant
  else if(hasBase && maxHp > base.hp) hp.cls = 'n-up';
  else if(hasBase && maxHp < base.hp) hp.cls = 'n-down';
  if(wounded || hp.cls){
    let t = `PV ${curHp}/${maxHp}`;
    if(hasBase && maxHp !== base.hp) t += ` (base ${base.hp}, ${describeDiff(maxHp - base.hp, 'hp')})`;
    hp.title = t;
  }
  return { atk, hp };
}
// </stat-colors>

// ---------------- Badges de mots-clés : quels badges, et leurs changements ----------------
// Fonctions pures (aucune lecture de l'état global ni du DOM) : le rendu
// (cardEl) et la détection de changements (animations de gain/perte) partent
// de la MÊME liste, sinon une animation pourrait viser un badge absent.
// <keyword-diff>
// Mots-clés dont l'icône est déjà dessinée par le cadre de la carte
// (buildNewCardEl : nkeyword-assault / nkeyword-final, au-dessus de la gemme
// de rareté). Ils figuraient AUSSI dans la pile de badges (KEYWORD_ICON_FILES) :
// la même information sortait deux fois. On les retire de la pile.
//
// Images réellement présentes dans le dépôt : images/kw-assaut.png et
// images/kw-final.png (les mêmes fichiers que KEYWORD_ICON_FILES). Le dossier
// images/card/icon/keyword/ n'a jamais existé : l'ancien chemin donnait un
// 404 et l'icône n'apparaissait donc nulle part. (attack.png, lui, est la
// bulle de force « épées croisées » des créatures, pas l'icône du mot-clé.)
const CARD_FRAME_KEYWORD_ICONS = {
  assault: `images/${KEYWORD_ICON_FILES.assault}`,
  final:   `images/${KEYWORD_ICON_FILES.final}`
};
const KEYWORDS_DRAWN_BY_CARD_FRAME = Object.keys(CARD_FRAME_KEYWORD_ICONS);

// Mots-clés dont un badge est affiché MAINTENANT dans la pile d'une créature
// en jeu (sans doublon, ordre de la carte conservé).
function activeBadgeKeywords(card){
  const out = [];
  (card.keywords || []).forEach(k=>{
    if(out.includes(k)) return;
    if(!KEYWORD_ICON_FILES[k]) return;
    if(KEYWORDS_DRAWN_BY_CARD_FRAME.includes(k)) return;
    // Parade/Armure ne restent affichées que tant que leur protection l'est
    if(!isKeywordActiveNow(k, card, true)) return;
    out.push(k);
  });
  return out;
}
// Comparaison de deux listes de mots-clés (ensembles : l'ordre ne compte pas,
// un réordonnancement n'est donc jamais un changement).
function diffKeywordLists(before, after){
  const b = new Set(before || []), a = new Set(after || []);
  return {
    gained: [...a].filter(k=>!b.has(k)),
    lost: [...b].filter(k=>!a.has(k))
  };
}
// Instantané des badges de toutes les créatures en jeu :
// { instId: { active:[badges affichés], raw:[mots-clés bruts de la carte] } }.
// `raw` sert à distinguer une vraie perte (le mot-clé a quitté la carte) d'un
// badge qui s'éteint tout seul (Parade après le 1er tour, Armure consommée :
// le mot-clé est toujours sur la carte, c'est seulement sa protection qui est
// épuisée) — voir keywordBadgeChanges.
function snapshotKeywordBadges(state, playerKeys){
  const snap = {};
  if(!state) return snap;
  (playerKeys || []).forEach(key=>{
    const p = state[key];
    ((p && p.board) || []).forEach(c=>{
      if(!c || !c.instId) return;
      snap[c.instId] = { active: activeBadgeKeywords(c), raw: [...(c.keywords || [])] };
    });
  });
  return snap;
}
// Changements de badges d'UNE créature entre deux instantanés.
//  - gagné : badge affiché maintenant, absent avant ET pas déjà sur la carte
//    avant (sinon c'est une protection qui se « réarme », pas un gain) ;
//  - perdu : badge affiché avant, absent maintenant ET plus sur la carte
//    (Parade/Armure qui s'éteignent mais restent sur la carte : pas une perte).
// Un mot-clé temporaire qui expire, une aura retirée, Tenace consommé ou un
// silence SONT des pertes (le mot-clé quitte la carte).
function keywordBadgeChanges(prevEntry, nextEntry){
  const d = diffKeywordLists(prevEntry.active, nextEntry.active);
  return {
    gained: d.gained.filter(k=>!prevEntry.raw.includes(k)),
    lost: d.lost.filter(k=>!nextEntry.raw.includes(k))
  };
}
// Changements pour tout le plateau. Renvoie [{instId, gained, lost}] (seulement
// les créatures qui changent). Rien si l'un des instantanés est nul (premier
// rendu) ; une créature absente d'un des deux côtés (qui arrive ou qui part)
// est ignorée : son apparition/disparition a sa propre animation.
function diffKeywordBadgeSnapshots(prevSnap, nextSnap){
  if(!prevSnap || !nextSnap) return [];
  const out = [];
  Object.keys(nextSnap).forEach(id=>{
    const prev = prevSnap[id];
    if(!prev) return;
    const ch = keywordBadgeChanges(prev, nextSnap[id]);
    if(ch.gained.length || ch.lost.length) out.push({ instId:id, gained:ch.gained, lost:ch.lost });
  });
  return out;
}
// </keyword-diff>

// ---------------- Aperçu d'une créature en jeu : écarts avec la carte de base ----------------
// Fonctions pures. `base` = carte du catalogue (JOURNAL_CARD_LOOKUP) ou
// undefined si le catalogue n'est pas chargé / carte absente (token généré) :
// sans base, on ne compare rien (aucun faux « ajouté »).
// <preview-mods>
const KEYWORD_SOURCE_LABELS = { temp:'temporaire', aura:'aura', permanent:'permanent' };

// Classe chaque mot-clé : 'base' (d'origine), 'added' (+ source : temp / aura /
// permanent, selon _tempKeywords / _auraKeywords) ou 'lost' (d'origine mais
// plus sur la carte). Renvoie null si la comparaison est impossible.
function classifyKeywordsVsBase(card, base){
  if(!base || !Array.isArray(base.keywords)) return null;
  const cur = [...new Set(card.keywords || [])];
  const baseKw = [...new Set(base.keywords)];
  const temp = card._tempKeywords || [], aura = card._auraKeywords || [];
  const rows = cur.map(key=>{
    if(baseKw.includes(key)) return { key, status:'base', source:null };
    return { key, status:'added', source: temp.includes(key) ? 'temp' : aura.includes(key) ? 'aura' : 'permanent' };
  });
  baseKw.forEach(key=>{ if(!cur.includes(key)) rows.push({ key, status:'lost', source:null }); });
  return rows;
}
// Capacités de la base disparues ? Le serveur n'a PAS de marqueur « silenced » :
// l'effet silence (mode abilities/both) met keywords=[], abilities=[],
// triggeredEffects={} et onPlayEffect=null. On ne conclut donc que sur ces
// valeurs EXACTES (tableau/objet vide, null) alors que la base en a ; une
// instance sans champ (undefined) n'a jamais eu ces capacités : pas de conclusion.
function hasLostAbilities(card, base){
  if(!base) return false;
  if(Array.isArray(base.abilities) && base.abilities.length > 0
     && Array.isArray(card.abilities) && card.abilities.length === 0) return true;
  const baseLegacy = !!base.onPlayEffect
    || (!!base.triggeredEffects && typeof base.triggeredEffects==='object' && Object.keys(base.triggeredEffects).length > 0);
  if(baseLegacy && card.onPlayEffect === null
     && !!card.triggeredEffects && typeof card.triggeredEffects==='object' && Object.keys(card.triggeredEffects).length === 0) return true;
  return false;
}
// Résumé des écarts : { rows (ou null), added, lost, silenced, statLines, hasChanges }.
function describeCreatureModifications(card, base, turn){
  const rows = classifyKeywordsVsBase(card, base);
  const added = rows ? rows.filter(r=>r.status==='added') : [];
  const lost = rows ? rows.filter(r=>r.status==='lost') : [];
  const silenced = hasLostAbilities(card, base);
  const statLines = [];
  if(base && typeof base.atk==='number' && typeof base.hp==='number'){
    const info = creatureStatInfo(card, base, turn);
    const curAtk = card.curAtk ?? card.atk ?? 0;
    const maxHp = card.hp ?? card.curHp ?? 0;
    if(curAtk !== base.atk && info.atk.title) statLines.push(info.atk.title);
    // seuls les PV MAX comptent comme modification (une blessure n'en est pas une)
    if(maxHp !== base.hp && info.hp.title) statLines.push(info.hp.title);
  }
  return { rows, added, lost, silenced, statLines,
           hasChanges: !!(added.length || lost.length || silenced || statLines.length) };
}

// ---------------- Règles d'attaque / de blocage (miroir du serveur) ----------------
// Ces fonctions reproduisent EXACTEMENT les règles du serveur, pour griser
// et expliquer côté client ce que le serveur refuserait de toute façon.
// Source : doDeclareAttackers (liste eligibleIds) et doAssignBlock (suite de
// refus) du serveur. Si le serveur change, ces règles doivent suivre.
// Fonctions pures : aucune lecture de l'état global (testables seules).
// <combat-rules>
function hasKw(c, k){ return (c.keywords||[]).includes(k); }

// Serveur : eligibleIds = !frozen && !stunned && !hasAttacked
//           && !protecteur && (!summonSick || charge)
// Renvoie la raison (courte) du refus, ou null si la créature peut attaquer.
function reasonCannotAttack(c){
  if(c.stunned) return 'étourdie, elle ne peut pas attaquer';
  if(c.frozen) return 'gelée, elle ne peut pas attaquer';
  if(c.hasAttacked) return 'a déjà attaqué ce tour';
  if(hasKw(c, 'protecteur')) return 'Protecteur : ne peut jamais attaquer';
  if(c.summonSick && !hasKw(c, 'charge')) return "malade d'invocation, elle ne peut pas attaquer ce tour (sauf Charge)";
  return null;
}
function canAttackClient(c){ return reasonCannotAttack(c) === null; }

// Parade (serveur : isStealthProtected) : la créature n'est protégée que contre
// l'ADVERSAIRE de son propriétaire, tant qu'elle est « summonSick » (jusqu'au
// début du prochain tour de son propriétaire). Mes propres créatures Parade
// restent donc ciblables par mes sorts. `ownerKey` = camp de la créature,
// `viewerKey` = camp de celui qui cible (moi).
function isStealthProtectedClient(c, ownerKey, viewerKey){
  return !!c && hasKw(c, 'stealth') && !!c.summonSick && ownerKey !== viewerKey;
}

// Étourdissement / gel : la créature « perd son prochain tour complet ». Le
// serveur garde `stunned`/`frozen` vrais pendant tout ce tour (ce sont des
// booléens : les règles ci-dessus n'ont pas besoin d'autre chose).
const STATUS_DURATION_TEXT = "perd son prochain tour complet : ne peut pas attaquer ni bloquer jusqu'à la fin du prochain tour de son propriétaire";
// Précision optionnelle, UNIQUEMENT si le serveur fournit `_stunUntilTurn`
// (numéro de tour global, comparé à `state.turn`) : on ne dit que ce qui est
// sûr — l'effet se termine à la fin du tour en cours quand ce tour est celui
// du propriétaire et que `_stunUntilTurn` est atteint. Sinon : chaîne vide.
function statusDurationNote(c, ownerKey, state){
  if(!c || !state || !isCombatNumberLike(c._stunUntilTurn) || !isCombatNumberLike(state.turn)) return '';
  if(state.active === ownerKey && c._stunUntilTurn === state.turn) return "Se termine à la fin de ce tour.";
  return '';
}
function isCombatNumberLike(x){ return typeof x==='number' && isFinite(x); }

// Serveur (doAssignBlock), dans cet ordre : déjà bloqué -> étourdie/gelée ->
// Peureux -> attaquant Discret -> attaquant Envol (bloqueur sans Envol ni Portée).
// Sans `attacker` : seules les raisons propres au bloqueur sont testées
// (« ne peut bloquer aucun attaquant »). Avec `attacker` : on ajoute les
// restrictions liées à l'attaquant. (Imparable ne concerne que les pièges,
// pas le blocage : volontairement absent ici.)
function reasonCannotBlock(c, attacker){
  if(c.hasBlockedThisTurn) return 'a déjà bloqué ce tour';
  if(c.stunned) return 'étourdie, elle ne peut pas bloquer';
  if(c.frozen) return 'gelée, elle ne peut pas bloquer';
  if(hasKw(c, 'fearful')) return 'Peureux : ne peut jamais bloquer';
  if(attacker){
    if(hasKw(attacker, 'discret')) return 'cet attaquant est Discret : on ne peut pas le bloquer';
    if(hasKw(attacker, 'flying') && !hasKw(c, 'flying') && !hasKw(c, 'reach'))
      return 'cet attaquant a Envol : seules les créatures Envol ou Portée peuvent le bloquer';
  }
  return null;
}
function canBlockClient(c, attacker){ return reasonCannotBlock(c, attacker) === null; }

// Pendant la phase de blocage : la créature peut-elle bloquer AU MOINS un des
// attaquants adverses ? Renvoie la raison si elle n'en peut bloquer aucun.
function reasonCannotBlockAny(c, attackers){
  const own = reasonCannotBlock(c);
  if(own) return own;
  if(!attackers || !attackers.length) return null;
  if(attackers.some(a=>canBlockClient(c, a))) return null;
  return 'ne peut bloquer aucun des attaquants (Discret ou Envol)';
}
// </combat-rules>

// Tout le plateau est construit pour une résolution de référence fixe
