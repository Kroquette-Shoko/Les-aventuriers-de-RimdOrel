<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spellcraft — Boutique</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-void:#0b0a12;
  --bg-panel:#171325;
  --bg-panel-2:#1f1a30;
  --bg-panel-3:#241f38;
  --parchment:#efe6c8;
  --parchment-dim:#d9cfae;
  --ink:#1c1830;
  --arcane:#7c5cff;
  --gold:#d4af37;
  --blood:#c23b3b;
  --frost:#4fb3d9;
  --green:#4a9d6b;
  --wood:#3b2a1e;
  --wood-2:#4d3826;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;}

#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 20px 60px;}

header{width:100%;max-width:1200px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
header a.back-link{font-size:11.5px;color:var(--parchment-dim);text-decoration:none;border:1px solid #3a3260;border-radius:8px;padding:6px 12px;}
header a.back-link:hover{border-color:var(--gold);color:var(--parchment);}
header h1{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);margin:0;letter-spacing:1px;}
header .spacer{flex:1;}

/* ---------- barre de monnaie ---------- */
#currency-bar{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid #3a3260;border-radius:12px;padding:8px 14px;flex-wrap:wrap;}
.currency-chip{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:18px;background:var(--bg-panel-2);}
.currency-chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.currency-chip .gem-icon{width:30px;height:30px;flex-shrink:0;background-size:contain;background-repeat:no-repeat;background-position:center;}
.currency-chip.gold .dot{background:var(--gold);}
.currency-chip.aube .gem-icon{background-color:#d4af37;-webkit-mask-image:url('images/gem-aub.png');mask-image:url('images/gem-aub.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.currency-chip.crepuscule .gem-icon{background-color:#8a5cf0;-webkit-mask-image:url('images/gem-crep.png');mask-image:url('images/gem-crep.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.currency-chip.volonte .gem-icon{background-color:#c23b3b;-webkit-mask-image:url('images/gem-vol.png');mask-image:url('images/gem-vol.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.currency-chip.prima .gem-icon{background-color:#3fae5c;-webkit-mask-image:url('images/gem-prim.png');mask-image:url('images/gem-prim.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.currency-chip.arcane .gem-icon{background-color:#5b9bd5;-webkit-mask-image:url('images/gem-arc.png');mask-image:url('images/gem-arc.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
.currency-chip.opale .gem-icon{background-image:url('images/gem-multi.png');background-size:contain;background-repeat:no-repeat;background-position:center;}
.money-icon{width:30px;height:30px;display:inline-block;vertical-align:-8px;background-color:#f2c94c;-webkit-mask-image:url('images/money.png');mask-image:url('images/money.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
.frag-toast-icon{width:30px;height:30px;vertical-align:-8px;margin-right:5px;}
.frag-summary-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:opacity .3s,transform .3s;background:rgba(15,12,20,.94);border:1px solid var(--gold);border-radius:12px;padding:12px 20px;z-index:200;display:flex;flex-direction:column;gap:5px;box-shadow:0 10px 30px rgba(0,0,0,.6);}
.frag-summary-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.frag-toast-title{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;margin-bottom:2px;}
.frag-toast-row{font-size:12.5px;display:flex;align-items:center;}

/* ---------- comptoir du vendeur ---------- */
#vendor-area{
  width:100%;max-width:900px;margin:22px 0 8px;
  background:linear-gradient(160deg,var(--wood-2),var(--wood));
  border:3px solid #241a12;border-radius:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.4);
  padding:26px;display:flex;align-items:center;gap:22px;min-height:160px;
}
#vendor-portrait{
  width:120px;height:140px;flex-shrink:0;border-radius:10px;
  background:rgba(0,0,0,.3);border:2px solid var(--gold);
}
#vendor-speech{
  flex:1;font-family:'Cinzel',serif;font-size:14px;color:var(--parchment);
  background:rgba(0,0,0,.25);border-radius:10px;padding:14px 18px;line-height:1.5;
}

/* ---------- étagères ---------- */
#shelves{width:100%;max-width:1160px;display:flex;flex-direction:column;gap:26px;margin-top:20px;}
.shelf{background:var(--bg-panel);border:1px solid #2b2440;border-radius:14px;padding:18px 22px;}
.shelf h2{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);margin:0 0 14px;letter-spacing:.5px;}
.shelf-items{display:flex;gap:16px;flex-wrap:wrap;}

.shop-item{
  width:240px;background:var(--bg-panel-2);border:1px solid #3a3260;border-radius:10px;
  padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
  transition:transform .15s ease, border-color .15s ease;
}
.shop-item:hover{transform:translateY(-4px);border-color:var(--gold);}
.shop-item-art{width:100%;height:150px;border-radius:8px;background:linear-gradient(135deg,#2a2440,#191529);display:flex;align-items:center;justify-content:center;font-size:32px;background-size:contain !important;background-repeat:no-repeat;background-position:center;}
.shop-item-name{font-family:'Cinzel',serif;font-size:12.5px;font-weight:700;}
.shop-item-desc{font-size:10.5px;color:var(--parchment-dim);line-height:1.4;}
.shop-item-price{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--gold);}
.booster-qty-row{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:700;}
.booster-qty-row .qty-btn{width:26px;height:26px;border-radius:6px;background:var(--bg-panel-3);border:1px solid #3a3260;color:var(--parchment);cursor:pointer;font-size:15px;line-height:1;}
.booster-qty-row .qty-btn:hover{border-color:var(--gold);}
#my-boosters-btn{margin-top:10px;background:var(--bg-panel-3);border:1.5px solid var(--gold);color:var(--parchment);
  border-radius:9px;padding:8px 14px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:8px;}
#my-boosters-btn:hover{filter:brightness(1.1);}
#my-boosters-badge{background:var(--gold);color:#1c1830;border-radius:10px;padding:1px 8px;font-size:12px;}
.my-booster-row{display:flex;align-items:center;gap:12px;background:var(--bg-panel-2);border-radius:10px;padding:10px;margin-bottom:8px;}
.my-booster-row .mb-art{width:48px;height:48px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--bg-panel-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.my-booster-row .mb-name{flex:1;font-family:'Cinzel',serif;font-weight:700;font-size:13px;}
.my-booster-row .mb-qty{font-size:11.5px;color:var(--parchment-dim);}
.buy-btn{width:100%;background:linear-gradient(180deg,var(--arcane),#5537c2);border:none;color:#fff;border-radius:8px;padding:7px;font-family:'Inter';font-weight:700;font-size:12px;cursor:pointer;}
.buy-btn:hover{filter:brightness(1.12);}
.buy-btn:disabled{background:#3a3260;cursor:not-allowed;filter:none;opacity:.6;}
.buy-btn.owned{background:var(--green);}

.empty-shelf{color:var(--parchment-dim);font-size:12.5px;font-style:italic;padding:10px 0;}

/* ---------- rendu de carte (repris du classeur) ---------- */
.card{
  --class-color: var(--grey, #8a7f6a);
  width:130px;height:182px;background:#f7f2e2;color:#231d33;border-radius:10px;
  position:relative;flex-shrink:0;border:3.5px solid var(--class-color);
  box-shadow:0 4px 10px rgba(0,0,0,.5);display:flex;flex-direction:column;user-select:none;
}
.card.class-Aube{--class-color:#d4af37;}
.card.class-Crépuscule{--class-color:#4b0082;}
.card.class-Prima{--class-color:#228b22;}
.card.class-Volonté{--class-color:#8b0000;}
.card.class-Arcane{--class-color:#4682b4;}
#card-preview{position:fixed;z-index:9999;display:none;pointer-events:none;}
#card-preview.show{display:block;}
#card-preview .ncard{transform:scale(1.1);transform-origin:top left;box-shadow:0 16px 34px rgba(0,0,0,.65);}

/* ---------- NOUVEAU TEMPLATE (frames illustrées) ---------- */
.ncard{position:relative;flex-shrink:0;user-select:none;}
.ncard img.nframe-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.ncard img.nframe-half-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;}
.ncard .nart-layer{position:absolute;background-size:cover;background-repeat:no-repeat;background-color:#3a3450;z-index:1;overflow:hidden;}
.ncard .nstat-wrap{position:absolute;aspect-ratio:1/1;z-index:6;}
.ncard .nstat-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.ncard .nstat-wrap .nstat-txt{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none;}
.ncard .nname-wrap{position:absolute;z-index:7;display:flex;align-items:center;justify-content:center;}
.ncard .nname-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.ncard .nname-wrap .nname-text{position:relative;z-index:1;left:auto;right:auto;top:auto;transform:none;width:84%;max-width:84%;}
.ncard .nname-text{position:absolute;z-index:8;text-align:center;font-family:'Cinzel',serif;font-weight:700;color:#2a1f10;text-shadow:0 1px 0 rgba(255,255,255,.25);pointer-events:none;overflow:hidden;white-space:nowrap;}
.ncard .ncard-text{position:absolute;z-index:8;color:#2a2338;text-align:center;overflow:hidden;pointer-events:none;white-space:pre-wrap;}
.ncard .nrarity-gem{position:absolute;z-index:8;aspect-ratio:231/297;}
.ncard .ntypeline{position:absolute;left:50%;transform:translateX(-50%);z-index:9;text-align:center;color:#3a2f1f;font-style:italic;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ncard .nlegendary-gem{position:absolute;z-index:8;aspect-ratio:231/297;}

.ncard.n-big{width:300px;height:423.2px;}
.ncard.n-big .nart-layer{left:11.1%;top:7.87%;width:79.31%;height:52.36%;}
.ncard.n-big .nstat-wrap.n-mana{left:-6.5%;top:-6.5%;width:25.5%;}
.ncard.n-big .nstat-wrap.n-mana .nstat-txt{font-size:26px;}
.ncard.n-big .nname-wrap{left:50%;top:45.3%;width:92%;aspect-ratio:663/202;transform:translateX(-50%);}
.ncard.n-big .nname-wrap .nname-text{font-size:17px;transform:translateY(-13px);}
.ncard.n-big .ncard-text{left:16%;top:65.79%;width:68%;height:27.5%;font-size:13.5px;line-height:1.32;padding-top:4px;}
.ncard.n-big .nrarity-gem{left:50%;bottom:0.89%;width:12%;transform:translateX(-50%);}
.ncard.n-big .ntypeline{bottom:11.63%;width:72%;font-size:10.5px;}
.ncard.n-big .nlegendary-gem{left:50%;top:-3%;width:12%;transform:translateX(-50%);}
.ncard.n-big .nstat-wrap.n-atk{left:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-atk .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-end{right:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-end .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-art{right:6%;bottom:5%;width:15%;}
.ncard.n-big .nstat-wrap.n-art .nstat-txt{font-size:15px;}

.ncard.n-small{width:240px;height:240px;}
.ncard.n-small .nart-layer{left:20.47%;top:16.28%;width:58.05%;height:44.63%;}
.ncard.n-small .nstat-wrap.n-mana{left:-1%;top:-3.5%;width:22%;}
.ncard.n-small .nstat-wrap.n-mana .nstat-txt{font-size:16px;}
.ncard.n-small .nname-wrap{left:50%;top:62%;width:92%;height:20px;transform:translateX(-50%);}
.ncard.n-small .nname-wrap .nname-text{font-size:14px;}
.ncard.n-small .ncard-text{display:none;}
.ncard.n-small .nrarity-gem{left:50%;bottom:-0.5%;width:11%;transform:translateX(-50%);}
.ncard.n-small .ntypeline{bottom:15%;width:64%;font-size:8.5px;}
.ncard.n-small .nlegendary-gem{left:50%;top:-1%;width:11%;transform:translateX(-50%);}
.ncard.n-small .nstat-wrap.n-atk{left:6%;bottom:5%;width:22%;}
.ncard.n-small .nstat-wrap.n-atk .nstat-txt{font-size:19.5px;}
.ncard.n-small .nstat-wrap.n-end{right:6%;bottom:5%;width:22%;}

.card.class-Neutre{--class-color:#c0c0c0;}
.card-art{position:relative;height:42%;background:linear-gradient(135deg,#c9bd93,#a89968);background-size:cover;background-position:center;flex-shrink:0;overflow:hidden;border-radius:7px 7px 0 0;}
.card-mana{position:absolute;top:-8px;left:-8px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6fd0ff,#155a94);border:2px solid #0c2b45;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.55);z-index:3;}
.card-hero-hp{position:absolute;top:3px;right:4px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7de08f,#1f7a3d);border:2px solid #0c3d1a;color:#fff;font-family:'Cinzel',serif;font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2;}
.card-divider{height:5px;flex-shrink:0;background:var(--class-color);}
.card-body{flex:1;padding:3px 6px 2px;display:flex;flex-direction:column;min-height:0;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:8.6px;text-align:center;text-decoration:underline;text-underline-offset:2px;color:#1c1830;line-height:1.15;margin-bottom:3px;min-height:20px;}
.card-text{font-size:6.3px;line-height:1.2;flex:1;color:#2a2338;overflow:hidden;white-space:pre-wrap;text-align:center;}
.card-footer{height:24px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 6px 3px;}
.card-atk,.card-hp{width:20px;height:20px;border-radius:50%;background:#efe6c8;border:2px solid #1c1830;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:9.5px;}
.card-atk{color:var(--blood);}
.card-hp{color:var(--green);}
.card-rarity-gem{position:absolute;left:50%;bottom:4px;transform:translateX(-50%) rotate(45deg);width:8px;height:8px;border:1.5px solid rgba(0,0,0,.35);box-shadow:0 0 4px currentColor;}
.card-rarity-gem.rarity-Basique{background:#6b6558;color:#6b6558;}
.card-rarity-gem.rarity-Commune{background:#c7c2b3;color:#c7c2b3;}
.card-rarity-gem.rarity-Rare{background:#4fb3d9;color:#4fb3d9;}
.card-rarity-gem.rarity-Épique{background:#7c5cff;color:#7c5cff;}
.card-rarity-gem.rarity-Mythique{background:var(--gold);color:var(--gold);}
.card-foil-layer{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:9;}
.card-foil-layer::before{
  content:'';position:absolute;top:-60%;left:-70%;width:70%;height:220%;
  background:linear-gradient(115deg,transparent 0%, rgba(255,90,90,.5) 14%, rgba(255,210,80,.5) 28%,
    rgba(120,255,150,.5) 42%, rgba(80,190,255,.5) 56%, rgba(190,110,255,.5) 70%, rgba(255,120,200,.5) 84%, transparent 100%);
  transform:translateX(-40%) rotate(8deg);mix-blend-mode:color-dodge;opacity:.55;
}

/* ---------- ouverture de booster ---------- */
#booster-open-overlay{position:fixed;inset:0;background:rgba(3,2,8,.94);display:none;align-items:center;justify-content:center;z-index:90;flex-direction:column;gap:26px;}
#booster-open-overlay.show{display:flex;}
#pack-stage{cursor:pointer;transition:transform .25s ease;}
#pack-stage:hover{transform:scale(1.04);}
#pack-stage img{width:160px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.7));}
#pack-stage.no-art{width:160px;height:220px;border-radius:12px;background:linear-gradient(160deg,var(--arcane),#3a2a70);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 14px 30px rgba(0,0,0,.7);}
#pack-hint{color:var(--parchment-dim);font-family:'Cinzel',serif;font-size:13px;letter-spacing:.5px;}
#pack-burst{position:absolute;inset:0;pointer-events:none;}

#cards-stage{display:none;gap:16px;flex-wrap:wrap;justify-content:center;max-width:900px;max-height:78vh;overflow-y:auto;padding:8px;}
#cards-stage.show{display:flex;}
.flip-card{width:260px;height:366px;perspective:1200px;cursor:pointer;opacity:0;transform:translateY(30px) scale(.7);transition:opacity .4s ease, transform .4s ease;position:relative;}
.flip-card.dealt{opacity:1;transform:translateY(0) scale(1);}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d;}
.flip-card.flipped .flip-inner{transform:rotateY(180deg);}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;}
.flip-back{background-size:cover;background-position:center;border:3px solid var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.6);
  background-image:linear-gradient(160deg,#241f38,#171325);display:flex;align-items:center;justify-content:center;}
.flip-back .default-sigil{font-size:38px;filter:drop-shadow(0 0 10px rgba(212,175,55,.5));}
.flip-front{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;position:relative;width:100%;height:100%;}
.flip-front .ncard{transform:scale(0.8667);}
.flip-front .ncard{width:100% !important;height:100% !important;}
.fragments-banner{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);z-index:20;
  background:var(--blood);color:#fff;font-family:'Cinzel',serif;font-size:10px;font-weight:700;text-align:center;
  padding:5px 10px;border-radius:6px;box-shadow:0 4px 10px rgba(0,0,0,.6);line-height:1.3;white-space:nowrap;
  pointer-events:none;
}

#booster-open-actions{display:none;gap:10px;}
#booster-open-actions.show{display:flex;}
.btn{background:var(--bg-panel-2);border:1px solid #3a3260;color:var(--parchment);border-radius:8px;padding:9px 20px;font-family:'Inter';font-weight:600;font-size:13px;cursor:pointer;}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:linear-gradient(180deg,var(--arcane),#5537c2);border:none;color:#fff;}
.btn.primary:hover{filter:brightness(1.12);}

/* ---------- modales ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(5,4,10,.9);display:none;align-items:center;justify-content:center;z-index:80;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg-panel);border:1px solid #3a3260;border-radius:16px;padding:26px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-box h2{font-family:'Cinzel',serif;color:var(--gold);margin:0 0 16px;text-align:center;}
.reveal-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:18px;}
.reveal-card{width:110px;background:#f7f2e2;color:#231d33;border-radius:8px;padding:8px;text-align:center;box-shadow:0 8px 18px rgba(0,0,0,.5);position:relative;}
.reveal-card.fragments{background:var(--bg-panel-3);color:var(--parchment);}
.reveal-card .rcard-name{font-family:'Cinzel',serif;font-weight:700;font-size:10.5px;margin-top:4px;}
.reveal-card .rcard-rarity{font-size:9px;opacity:.7;}
.reveal-card .rcard-badge{position:absolute;top:4px;right:4px;font-size:14px;}
.modal-actions{display:flex;justify-content:center;gap:10px;margin-top:10px;}
.modal-actions button{background:var(--bg-panel-2);border:1px solid #3a3260;color:var(--parchment);border-radius:8px;padding:9px 18px;font-family:'Inter';font-weight:600;cursor:pointer;}
.modal-actions button:hover{border-color:var(--gold);}
.shop-msg{text-align:center;font-size:13px;color:var(--parchment-dim);padding:20px;}
</style>
</head>
<body>

<div id="app">


  <div id="currency-bar">

let brunoThanksTimeout = null;
function renderBrunoLine(){
  document.getElementById('vendor-speech').innerHTML = BRUNO_LINES[Math.floor(Math.random()*BRUNO_LINES.length)];
}
function showBrunoThanks(){
  if(brunoThanksTimeout) clearTimeout(brunoThanksTimeout);
  document.getElementById('vendor-speech').innerHTML = BRUNO_THANKS_LINES[Math.floor(Math.random()*BRUNO_THANKS_LINES.length)];
  brunoThanksTimeout = setTimeout(()=>{ renderBrunoLine(); brunoThanksTimeout = null; }, 6000);

async function refreshCurrency(){
  const profile = await loadUserProfile();
  if(!profile){
    document.getElementById('cur-gold').textContent = '—';
    return;
  }
  document.getElementById('cur-gold').textContent = profile.currency ?? 0;
  document.getElementById('cur-aube').textContent = profile.fragments_aube ?? 0;
  document.getElementById('cur-crepuscule').textContent = profile.fragments_crepuscule ?? 0;
  document.getElementById('cur-volonte').textContent = profile.fragments_volonte ?? 0;
  document.getElementById('cur-prima').textContent = profile.fragments_prima ?? 0;
  document.getElementById('cur-arcane').textContent = profile.fragments_arcane ?? 0;
  const curOpale = document.getElementById('cur-opale');
  if(curOpale) curOpale.textContent = profile.fragments_opale ?? 0;
}

async function renderBoosterShelf(){
  const el = document.getElementById('shelf-boosters');
  const { data, error } = await sb.from('boosters').select('*').order('price');
  if(error || !data || data.length===0){
    el.innerHTML = `<div class="empty-shelf">Aucun booster disponible pour l'instant — reviens plus tard !</div>`;
    return;
  }
  el.innerHTML = data.map(b=>`
    <div class="shop-item">
      <div class="shop-item-art" style="${b.image_url?`background-image:url('${b.image_url}');background-size:cover;`:''}">${b.image_url?'':'📦'}</div>
      <div class="shop-item-name">${escapeHtmlShop(b.name)}</div>
      <div class="shop-item-desc">6 cartes du set correspondant. Rejoint ton inventaire — s'ouvre séparément.</div>
      <div class="shop-item-price"><span class="money-icon"></span> ${b.price} <span style="font-size:10px;color:var(--parchment-dim);">/ unité</span></div>
      <div class="booster-qty-row">
        <button class="qty-btn" onclick="adjustBoosterQty('${b.id}', -1)">−</button>
        <span id="qty-${b.id}">1</span>
        <button class="qty-btn" onclick="adjustBoosterQty('${b.id}', 1)">+</button>
      </div>
      <button class="buy-btn" onclick="buyBooster('${b.id}')">Acheter</button>
    </div>
  `).join('');
}
function adjustBoosterQty(boosterId, delta){
  const el = document.getElementById('qty-'+boosterId);
  const next = Math.max(1, Math.min(99, (parseInt(el.textContent)||1) + delta));
  el.textContent = next;
}

async function renderSingleShelf(){
  const el = document.getElementById('shelf-singles');
  el.innerHTML = `<div class="empty-shelf">Chargement des cartes du jour...</div>`;
  const user = await scGetCurrentUser();
  if(!user){
    el.innerHTML = `<div class="empty-shelf">Connecte-toi pour voir les cartes du jour.</div>`;
    return;
  }
  const { data, error } = await sb.rpc('get_daily_shop_offers');
  if(error || data.error || !data.choices || data.choices.length===0){
    el.innerHTML = `<div class="empty-shelf">Aucune carte disponible pour l'instant (hors set de base).</div>`;
    return;
  }
  const fullCards = await fetchFullCards(data.choices.map(c=>c.id));
  const boughtToday = await fetchTodaysSinglePurchases(user.id);
  el.innerHTML = '';
  data.choices.forEach(c=>{
    const full = fullCards[c.id] || { name: c.name, rarity: c.rarity, class: c.class };
    const alreadyBought = boughtToday.has(c.id);
    const wrap = document.createElement('div');
    wrap.className = 'shop-item';
    wrap.style.width = '240px';
    const cardHolder = document.createElement('div');
    cardHolder.style.cssText = 'position:relative;width:210px;height:296px;overflow:hidden;';
    try {
      const cardEl = buildBoosterCardEl(full);
      cardEl.style.transform = 'scale(0.7)';
      cardEl.style.transformOrigin = 'top left';
      attachShopHoverPreview(cardEl, full);
      cardHolder.appendChild(cardEl);
    } catch(e) {
      console.error('Erreur buildCardEl (cartes à l’unité) :', e, full);
      cardHolder.innerHTML = `<div style="color:#e88;font-size:11px;padding:8px;border:1px dashed #e88;">Erreur carte : ${e.message}</div>`;
    }
    wrap.appendChild(cardHolder);
    const label = document.createElement('div');
    label.className = 'shop-item-desc';
    label.textContent = c.is_global ? 'Carte du jour (tout le monde)' : 'Ton offre personnelle';
    wrap.appendChild(label);
    const price = document.createElement('div');
    price.className = 'shop-item-price';
    price.innerHTML = `<span class="money-icon"></span> ${SINGLE_CARD_PRICES[c.rarity] ?? 50}`;
    wrap.appendChild(price);
    const btn = document.createElement('button');
    if(alreadyBought){
      btn.className = 'buy-btn owned';
      btn.textContent = 'Déjà acheté';
      btn.disabled = true;
    } else {
      btn.className = 'buy-btn';
      btn.textContent = 'Acheter';
      btn.onclick = () => confirmSingleChoice(c.id);
    }
    wrap.appendChild(btn);
    el.appendChild(wrap);
  });
}

// Renvoie l'ensemble des card_id déjà achetés aujourd'hui (achats "single") par ce joueur
async function fetchTodaysSinglePurchases(userId){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  const { data, error } = await sb.from('shop_purchases')
    .select('detail')
    .eq('user_id', userId)
    .eq('purchase_type', 'single')
    .gte('created_at', startOfDay.toISOString());
  if(error){ console.error(error); return new Set(); }
  return new Set((data||[]).map(row => row.detail && row.detail.card_id).filter(Boolean));
}

async function renderCardBackShelf(){
  const el = document.getElementById('shelf-backs');
  const { data, error } = await sb.from('card_backs').select('*').order('price');
  if(error || !data || data.length===0){
    el.innerHTML = `<div class="empty-shelf">Aucun dos de carte disponible pour l'instant — reviens plus tard !</div>`;
    return;
  }
  const user = await scGetCurrentUser();
  let owned = new Set();
  let equippedId = null;
  if(user){
    const { data: ownedRows } = await sb.from('user_card_backs').select('card_back_id').eq('user_id', user.id);
    owned = new Set((ownedRows||[]).map(r=>r.card_back_id));
    const profile = await loadUserProfile();
    equippedId = profile ? profile.equipped_card_back_id : null;
  }
  el.innerHTML = data.map(cb=>{
    const isOwned = owned.has(cb.id);
    const isEquipped = equippedId === cb.id;
    let btnHtml;
    if(isEquipped){
      btnHtml = `<button class="buy-btn owned" disabled>Équipé ✓</button>`;
    } else if(isOwned){
      btnHtml = `<button class="buy-btn" onclick="equipCardBack('${cb.id}')">Équiper</button>`;
    } else {
      btnHtml = `<button class="buy-btn" onclick="buyCardBack('${cb.id}')">Acheter</button>`;
    }
    return `
      <div class="shop-item">
        <div class="shop-item-art" style="${cb.image_url?`background-image:url('${cb.image_url}');background-size:cover;`:''}">${cb.image_url?'':'🎴'}</div>
        <div class="shop-item-name">${escapeHtmlShop(cb.name)}</div>
        <div class="shop-item-price"><span class="money-icon"></span> ${cb.price}</div>
        ${btnHtml}
      </div>
    `;
  }).join('');
}

async function equipCardBack(id){
  const { data, error } = await sb.rpc('equip_card_back', { p_card_back_id: id });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(data.error==='not-owned' ? "Tu ne possèdes pas ce dos de carte." : data.error); return; }
  renderCardBackShelf();
}

function escapeHtmlShop(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================================================
   NOUVEAU TEMPLATE — frames illustrées (big / small)
   ============================================================ */
// Chemins réels (utilisés lors du passage en fichiers, à la fin des itérations) :
// images/card/big frame/big-{classe}.png · images/card/small frame/small-{classe}.png
// images/card/icon/bubble/{mana|vie|attack|endurance|artefact|nom}.png
// images/card/icon/rare/{basique|commun|rare|epique|mythique|legendaire}.png
const NCLASS_TO_SLUG_NOACCENT = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const CARD_TYPE_TO_TEMPLATE_SLUG = {
  'Créature':'creature', 'Artefact':'artefact', 'Sortilège':'spell', 'Piège':'trap', 'Région':'region', 'Héros':'hero'
};
function ncardRealPath(size, slug, cardClass, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[cardClass] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bigframe.png`;
  }
  // Format small : nouveau schéma disponible uniquement pour Créature et
  // Artefact pour l'instant — les autres types restent sur l'ancien
  // système en attendant leurs propres illustrations.
  if(size==='small' && (cardType==='Créature' || cardType==='Artefact') && NCLASS_TO_SLUG_NOACCENT[cardClass]){
    return `images/card/small%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-smallframe.png`;
  }
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-${slug}.png`;
}
const NCLASS_TO_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté',
  'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const NRARITY_TO_SLUG = {
  'Basique':'basique', 'Commune':'commun', 'Rare':'rare',
  'Épique':'epique', 'Mythique':'mythique'
};
const HALF_FRAME_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté', 'Prima':'prima', 'Arcane':'arcane'
};
function ncardHalfFramePath(size, classSecondary, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[classSecondary] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[classSecondary]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bighalfframe.png`;
  }
  const slug = HALF_FRAME_SLUG[classSecondary];
  if(!slug) return null;
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-half-${slug}.png`;
}

function nEl(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function nImg(src, cls){ const i = document.createElement('img'); i.src = src; if(cls) i.className = cls; return i; }

function buildNewCardEl(card, size, opts={}){
  const root = nEl('div', `ncard n-${size}`);
  const slug = NCLASS_TO_SLUG[card.class] || 'neutre';
  const isHero = card.type==='Héros';
  const isRegion = card.type==='Région';
  const hasMana = !isHero && !isRegion;
  const isCreature = card.type==='Créature';
  const isArtifact = card.type==='Artefact';

  // Illustration (calibrage indépendant big/small)
  const posX = size==='big' ? (card.imagePosX ?? 50) : (card.imagePosXSmall ?? 50);
  const posY = size==='big' ? (card.imagePosY ?? 50) : (card.imagePosYSmall ?? 50);
  const zoom = size==='big' ? (card.imageZoom ?? 100) : (card.imageZoomSmall ?? 100);
  const art = nEl('div', 'nart-layer');
  if(card.image){
    art.style.backgroundImage = `url('${card.image.replace(/'/g,'')}')`;
    art.style.backgroundPosition = `${posX}% ${posY}%`;
    art.style.backgroundSize = zoom>100 ? zoom+'%' : 'cover';
  }
  root.appendChild(art);

  // Frame (par-dessus l'illustration, fenêtre transparente)
  root.appendChild(nImg(ncardRealPath(size, slug, card.class, card.type, opts.heroCardFrame), 'nframe-layer'));
  if(card.classSecondary){
    const halfPath = ncardHalfFramePath(size, card.classSecondary, card.type, opts.heroCardFrame);
    if(halfPath) root.appendChild(nImg(halfPath, 'nframe-half-layer'));
  }

  // Mana
  if(hasMana){
    const w = nEl('div','nstat-wrap n-mana');
    w.appendChild(nImg('images/card/icon/bubble/mana.png'));
    const t = nEl('div','nstat-txt'); t.textContent = card.cost ?? 0;
    w.appendChild(t);
    root.appendChild(w);
  }
  // Force / endurance (créatures)
  if(isCreature){
    const wa = nEl('div','nstat-wrap n-atk');
    wa.appendChild(nImg('images/card/icon/bubble/attack.png'));
    const ta = nEl('div','nstat-txt'); ta.textContent = card.atk ?? 0;
    wa.appendChild(ta);
    root.appendChild(wa);

    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = card.hp ?? 0;
    we.appendChild(te);
    root.appendChild(we);
  }
  // Charges (artefacts)
  if(isArtifact){
    const wf = nEl('div','nstat-wrap n-art');
    wf.appendChild(nImg('images/card/icon/bubble/artefact.png'));
    const t = nEl('div','nstat-txt'); t.textContent = (card.charges ?? 0)+'x';
    wf.appendChild(t);
    root.appendChild(wf);
  }

  // Bandeau de nom — ruban à part, wrapper pour un centrage vertical fiable
  // (même traitement en big et en small désormais)
  const nw = nEl('div','nname-wrap');
  nw.appendChild(nImg('images/card/icon/bubble/nom.png'));
  const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
  applyNameSizing(nameEl, card, size);
  nw.appendChild(nameEl);
  root.appendChild(nw);

  // Texte (big uniquement)
  if(size==='big'){
    const textEl = nEl('div','ncard-text'); textEl.textContent = card.text || '';
    root.appendChild(textEl);
  }

  // Type / sous-types (juste au-dessus de la gemme de rareté)
  if(card.subtypes && card.subtypes.length){
    const tl = nEl('div','ntypeline'); tl.textContent = card.subtypes.join(' - ');
    root.appendChild(tl);
  }

  // Rareté + super-type Légendaire
  if(card.rarity && NRARITY_TO_SLUG[card.rarity]){
    root.appendChild(nImg(`images/card/icon/rare/${NRARITY_TO_SLUG[card.rarity]}.png`, 'nrarity-gem'));
  }
  if(card.isLegendary){
    root.appendChild(nImg('images/card/icon/rare/legendaire.png', 'nlegendary-gem'));
  }

  return root;
}

function applyNameSizing(nameEl, card, size){
  if(card.nameWrap){
    nameEl.style.whiteSpace = 'normal';
    nameEl.style.height = 'auto';
    nameEl.style.overflow = 'visible';
  }
  if(card.nameFontAuto === false){
    nameEl.dataset.auto = '0';
    // La taille choisie est calibrée sur le grand format (300px) ; on l'adapte
    // proportionnellement au petit format (240px) pour un rendu cohérent.
    const scale = size==='small' ? (240/300) : 1;
    nameEl.style.fontSize = ((card.nameFontSize || 14) * scale) + 'px';
  } else {
    nameEl.dataset.auto = '1';
  }
}
function fitBoxFont(el, minSize){
  if(!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  const floor = minSize || 7;
  let attempts = 0;
  while(attempts < 26 && size > floor){
    const overflowH = el.scrollHeight > el.clientHeight + 1;
    const overflowW = el.scrollWidth > el.clientWidth + 1;
    if(!overflowH && !overflowW) break;
    size -= 0.5;
    el.style.fontSize = size + 'px';
    attempts++;
  }
}
function fitNewCard(rootEl){
  if(!rootEl) return;
  const nameEl = rootEl.querySelector('.nname-text');
  if(nameEl && nameEl.dataset.auto !== '0'){
    fitBoxFont(nameEl, 6);
  }
  fitBoxFont(rootEl.querySelector('.ncard-text'), 7);
}


function buildCardEl(card){
  const el = buildNewCardEl(card, 'big');
  requestAnimationFrame(()=>fitNewCard(el));
  return el;
}
// Utilisé spécifiquement à l'ouverture d'un booster et pour les offres de
// la boutique — seuls contextes où le nouveau cadre de héros doit
// s'appliquer (ailleurs, un héros garde son ancien visuel).
function buildBoosterCardEl(card){
  const el = buildNewCardEl(card, 'big', {heroCardFrame:true});
  requestAnimationFrame(()=>fitNewCard(el));
  return el;
}

// ---------------- Aperçu au survol ----------------
function showCardPreview(card, x, y){
  const box = document.getElementById('card-preview');
  box.innerHTML = '';
  const el = buildNewCardEl(card, 'big', {heroCardFrame:true});
  box.appendChild(el);
  requestAnimationFrame(()=>fitNewCard(el));

  const w = 300*1.1, h = 423.2*1.1;
  let left = x + 24, top = y - h/2;
  if(left + w > window.innerWidth - 12) left = x - 24 - w;
  top = Math.max(12, Math.min(top, window.innerHeight - h - 12));
  box.style.left = left+'px'; box.style.top = top+'px';
  box.classList.add('show');
}
function hideCardPreview(){
  document.getElementById('card-preview').classList.remove('show');
}
function attachShopHoverPreview(el, card){
  el.addEventListener('mouseenter', (ev)=>showCardPreview(card, ev.clientX, ev.clientY));
  el.addEventListener('mouseleave', hideCardPreview);
}

// Récupère les données complètes (image, texte, coût...) pour une liste d'ids de cartes
async function fetchFullCards(ids){
  if(!ids || ids.length===0) return {};
  const { data, error } = await sb.from('cards').select('id, data').in('id', ids);
  if(error){ console.error(error); return {}; }
  const map = {};
  (data||[]).forEach(row => { map[row.id] = { id: row.id, ...row.data }; });
  return map;
}

async function buyBooster(boosterId){
  const user = await scGetCurrentUser();
  if(!user){ alert('Connecte-toi pour acheter dans la boutique.'); return; }
  const qtyEl = document.getElementById('qty-'+boosterId);
  const quantity = qtyEl ? (parseInt(qtyEl.textContent)||1) : 1;
  const { data, error } = await sb.rpc('buy_booster', { p_booster_id: boosterId, p_quantity: quantity });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(shopErrorMessage(data.error)); return; }
  playSfx('coin');
  showBrunoThanks();
  refreshCurrency();
  if(qtyEl) qtyEl.textContent = '1';
  flashBoosterInventoryBadge();
}

async function flashBoosterInventoryBadge(){
  const user = await scGetCurrentUser();
  const badge = document.getElementById('my-boosters-badge');
  if(!user || !badge) return;
  const { data } = await sb.rpc('get_user_boosters');
  const total = (data && data.boosters) ? data.boosters.reduce((sum,b)=>sum+b.quantity, 0) : 0;
  badge.textContent = total;
}

async function showMyBoostersModal(){
  const user = await scGetCurrentUser();
  const list = document.getElementById('my-boosters-list');
  if(!user){ list.innerHTML = `<div class="empty-shelf">Connecte-toi pour voir tes boosters.</div>`; openModal('my-boosters-modal'); return; }
  list.innerHTML = `<div class="empty-shelf">Chargement...</div>`;
  openModal('my-boosters-modal');
  flashBoosterInventoryBadge();
  const { data, error } = await sb.rpc('get_user_boosters');
  if(error || data.error || !data.boosters || data.boosters.length===0){
    list.innerHTML = `<div class="empty-shelf">Tu n'as aucun booster en réserve — achète-en un dans la boutique !</div>`;
    return;
  }
  list.innerHTML = '';
  data.boosters.forEach(b=>{
    const row = document.createElement('div');
    row.className = 'my-booster-row';
    row.innerHTML = `
      <div class="mb-art" style="${b.image_url?`background-image:url('${b.image_url}');`:''}">${b.image_url?'':'📦'}</div>
      <div class="mb-name">${escapeHtmlShop(b.name)}</div>
      <div class="mb-qty">x${b.quantity}</div>
      <button class="buy-btn" onclick="openBoosterFromInventory('${b.booster_id}', ${b.image_url?`'${b.image_url}'`:'null'})">Ouvrir</button>
      ${b.quantity>1 ? `
        <div class="booster-qty-row">
          <button class="qty-btn" onclick="adjustBulkQty('${b.booster_id}', -1, ${b.quantity})">−</button>
          <span id="bulkqty-${b.booster_id}">${Math.min(5,b.quantity)}</span>
          <button class="qty-btn" onclick="adjustBulkQty('${b.booster_id}', 1, ${b.quantity})">+</button>
        </div>
        <button class="buy-btn" onclick="openBoostersBulk('${b.booster_id}', ${b.image_url?`'${b.image_url}'`:'null'})">Ouvrir en groupe</button>
      ` : ''}
    `;
    list.appendChild(row);
  });
}
function adjustBulkQty(boosterId, delta, max){
  const el = document.getElementById('bulkqty-'+boosterId);
  const next = Math.max(2, Math.min(max, (parseInt(el.textContent)||2) + delta));
  el.textContent = next;
}
async function openBoostersBulk(boosterId, boosterImageUrl){
  const qtyEl = document.getElementById('bulkqty-'+boosterId);
  const quantity = qtyEl ? (parseInt(qtyEl.textContent)||2) : 2;
  const { data, error } = await sb.rpc('open_boosters_bulk', { p_booster_id: boosterId, p_quantity: quantity });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(shopErrorMessage(data.error)); return; }
  if(typeof progressQuest==='function'){
    for(let i=0;i<quantity;i++){ progressQuest('open_boosters'); progressQuest('open_boosters_total'); }
  }
  closeModal('my-boosters-modal');
  await openBoosterAnimation(boosterImageUrl, data.cards);
  flashBoosterInventoryBadge();
}

async function openBoosterFromInventory(boosterId, boosterImageUrl){
  const { data, error } = await sb.rpc('open_booster', { p_booster_id: boosterId });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(shopErrorMessage(data.error)); return; }
  if(typeof progressQuest==='function'){ progressQuest('open_boosters'); progressQuest('open_boosters_total'); }
  closeModal('my-boosters-modal');
  await openBoosterAnimation(boosterImageUrl, data.cards);
  flashBoosterInventoryBadge();
}

async function getEquippedCardBackUrl(){
  const profile = await loadUserProfile();
  if(!profile || !profile.equipped_card_back_id) return null;
  const { data } = await sb.from('card_backs').select('image_url').eq('id', profile.equipped_card_back_id).single();
  return data ? data.image_url : null;
}

let lastBoosterResult = null;

async function openBoosterAnimation(boosterImageUrl, cardsResult){
  lastBoosterResult = cardsResult;
  const overlay = document.getElementById('booster-open-overlay');
  const packStage = document.getElementById('pack-stage');
  const cardsStage = document.getElementById('cards-stage');
  const hint = document.getElementById('pack-hint');
  const actions = document.getElementById('booster-open-actions');

  cardsStage.classList.remove('show');
  cardsStage.innerHTML = '';
  actions.classList.remove('show');
  hint.style.display = 'block';
  hint.textContent = 'Clique sur le booster pour l\'ouvrir';

  if(boosterImageUrl){
    packStage.className = '';
    packStage.innerHTML = `<img src="${boosterImageUrl}" alt="Booster">`;
  } else {
    packStage.className = 'no-art';
    packStage.innerHTML = '📦';
  }
  packStage.style.display = 'flex';
  overlay.classList.add('show');

  const backUrl = await getEquippedCardBackUrl();
  const idsToFetch = cardsResult.map(c=>c.card_id).filter(Boolean);
  const fullCards = await fetchFullCards(idsToFetch);

  packStage.onclick = () => {
    packStage.style.display = 'none';
    hint.style.display = 'none';
    packStage.onclick = null;
    dealBoosterCards(cardsStage, cardsResult, fullCards, backUrl, actions);
  };
}

function dealBoosterCards(cardsStage, cardsResult, fullCards, backUrl, actions){
  cardsStage.innerHTML = '';
  cardsStage.classList.add('show');
  let flippedCount = 0;

  cardsResult.forEach((res, i)=>{
    const flip = document.createElement('div');
    flip.className = 'flip-card';
    const inner = document.createElement('div');
    inner.className = 'flip-inner';

    const back = document.createElement('div');
    back.className = 'flip-face flip-back';
    if(backUrl){ back.style.backgroundImage = `url('${backUrl}')`; }
    else { back.innerHTML = `<span class="default-sigil">🃏</span>`; }

    const front = document.createElement('div');
    front.className = 'flip-face flip-front';
    const full = fullCards[res.card_id] || { name: res.name, rarity: res.rarity };
    const frontCardEl = buildBoosterCardEl(full);
    attachShopHoverPreview(frontCardEl, full);
    front.appendChild(frontCardEl);
    let banner = null;
    if(res.result==='fragments'){
      banner = document.createElement('div');
      banner.className = 'fragments-banner';
      banner.style.display = 'none';
      const gemLabel = (res.fragment_classes||[]).map(c => {
        const icon = GEM_ICON_FILES[c] ? `<img src="images/${GEM_ICON_FILES[c]}" class="frag-toast-icon">` : '';
        return `${icon}${GEM_NAMES[c] || c}`;
      }).join(' + ');
      banner.innerHTML = `Déjà au max<br>+${res.fragment_amount ?? '?'} ${gemLabel||'fragments'}`;
      flip.appendChild(banner);
    }

    inner.appendChild(back); inner.appendChild(front);
    flip.appendChild(inner);
    cardsStage.appendChild(flip);

    setTimeout(()=>{ flip.classList.add('dealt'); }, 80*i);

    flip.onclick = () => {
      if(flip.classList.contains('flipped')) return;
      flip.classList.add('flipped');
      if(banner) banner.style.display = 'block';
      if(full.rarity==='Épique') playSfx('epic-drop');
      else if(full.rarity==='Mythique') playSfx('mythic-drop');
      flippedCount++;
      if(flippedCount===cardsResult.length){
        actions.classList.add('show');
      }
    };
  });
}

function closeBoosterOpening(){
  document.getElementById('booster-open-overlay').classList.remove('show');
  showFragmentSummaryToast(lastBoosterResult);
  lastBoosterResult = null;
  sb.rpc('progress_collection_achievements').catch(()=>{});
  showMyBoostersModal();
}

// Résumé persistant (par classe) des fragments obtenus dans ce booster, affiché
// une fois de retour à la liste — pour éviter de perdre l'info après l'animation.
function showFragmentSummaryToast(cardsResult){
  if(!cardsResult) return;
  const totals = {};
  cardsResult.forEach(res=>{
    if(res.result!=='fragments') return;
    (res.fragment_classes||[]).forEach(cls=>{
      totals[cls] = (totals[cls]||0) + (res.fragment_amount || 1);
    });
  });
  const classes = Object.keys(totals);
  if(classes.length===0) return;
  classes.forEach(cls=>{
    sb.rpc('progress_achievement', { p_condition_type: `fragment_earned_${cls}`, p_amount: totals[cls] }).catch(()=>{});
  });
  const rows = classes.map(cls=>{
    const iconFile = GEM_ICON_FILES[cls];
    const iconHtml = iconFile ? `<img src="images/${iconFile}" class="frag-toast-icon">` : '';
    return `<span class="frag-toast-row">${iconHtml}+${totals[cls]} ${GEM_NAMES[cls]||cls} (${cls})</span>`;
  }).join('');
  const toast = document.createElement('div');
  toast.className = 'frag-summary-toast';
  toast.innerHTML = `<div class="frag-toast-title">Fragments obtenus</div>${rows}`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.classList.add('show'), 10);
  setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(), 400); }, 5000);
}

async function confirmSingleChoice(cardId){
  const { data, error } = await sb.rpc('buy_single_card', { p_card_id: cardId });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(shopErrorMessage(data.error)); return; }
  playSfx('coin');
  showBrunoThanks();
  showRevealModal('Carte obtenue !', [{ name: data.name, foil: data.foil, rarity: '', card_id: data.card_id }]);
  refreshCurrency();
  renderSingleShelf();
  sb.rpc('progress_achievement', { p_condition_type: 'cards_crafted_total', p_amount: 1 }).catch(()=>{});
  sb.rpc('progress_collection_achievements').catch(()=>{});
}

async function buyCardBack(id){
  const user = await scGetCurrentUser();
  if(!user){ alert('Connecte-toi pour acheter dans la boutique.'); return; }
  const { data, error } = await sb.rpc('buy_card_back', { p_card_back_id: id });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(shopErrorMessage(data.error)); return; }
  playSfx('coin');
  showBrunoThanks();
  refreshCurrency();
  renderCardBackShelf();
}

function shopErrorMessage(code){
  return {
    'not-logged-in': "Connecte-toi pour acheter dans la boutique.",
    'not-enough-gold': "Pas assez d'or pour cet achat.",
    'already-owned': "Tu possèdes déjà ce dos de carte.",
    'unknown-card-back': "Ce dos de carte n'existe plus.",
    'no-card-available': "Toutes les cartes disponibles sont déjà au maximum dans ta collection !",
    'already-maxed': "Tu as déjà le maximum de cette carte, choisis-en une autre.",
    'unknown-booster': "Ce booster n'existe plus.",
    'no-booster-owned': "Tu n'as plus ce booster en réserve.",
    'invalid-quantity': "Quantité invalide."
  }[code] || ('Erreur : ' + code);
}

async function showRevealModal(title, items){
  document.getElementById('reveal-title').textContent = title;
  const grid = document.getElementById('reveal-grid');
  grid.innerHTML = `<div class="empty-shelf">Chargement...</div>`;
  openModal('reveal-modal');

  const idsToFetch = items.filter(it=>!it.fragments && it.card_id).map(it=>it.card_id);
  const fullCards = await fetchFullCards(idsToFetch);

  grid.innerHTML = '';
  items.forEach(it=>{
    const slot = document.createElement('div');
    if(it.fragments){
      slot.className = 'reveal-card fragments';
      const fragDetail = it.fragment_amount ? `+${it.fragment_amount} ${(it.fragment_classes||[]).map(c=>GEM_NAMES[c]||c).join(' + ')}` : '';
      slot.innerHTML = `
        <div style="font-size:26px;">✨</div>
        <div class="rcard-name">${escapeHtmlShop(it.name)}</div>
        <div class="rcard-rarity">Déjà au maximum — fragments obtenus</div>
        ${fragDetail ? `<div class="rcard-rarity">${fragDetail}</div>` : ''}
      `;
    } else {
      const full = fullCards[it.card_id] || { name: it.name, rarity: it.rarity };
      full.foil = !!it.foil;
      slot.className = 'reveal-card';
      slot.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;';
      const revealHolder = document.createElement('div');
      revealHolder.style.cssText = 'position:relative;width:110px;height:155px;overflow:hidden;';
      const revealCardEl = buildBoosterCardEl(full);
      revealCardEl.style.transform = 'scale(0.3667)';
      revealCardEl.style.transformOrigin = 'top left';
      revealHolder.appendChild(revealCardEl);
      slot.appendChild(revealHolder);
      if(it.foil){
        const badge = document.createElement('div');
        badge.textContent = '✨ Foil';
        badge.style.cssText = 'font-size:11px;color:var(--gold);font-weight:700;';
        slot.appendChild(badge);
      }
    }
    grid.appendChild(slot);
  });
}

function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

  renderBrunoLine();
  playMusic('bruno-shop', {loop:true, volume:0.3});
  await renderBoosterShelf();
  await renderSingleShelf();
  await renderCardBackShelf();
  await refreshCurrency();

}
initSpellcraftAuth();
initShop();
sb.auth.onAuthStateChange(()=>{ refreshCurrency(); renderCardBackShelf(); renderSingleShelf(); flashBoosterInventoryBadge(); });
