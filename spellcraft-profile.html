<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimd'Orël — Profil</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu.
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
/* Le reste des jetons de couleur (--bg-void, --gold, --arcane, etc.)
   vient de spellcraft-ui-kit.css et suit le thème actif.
   On ne garde ici que ce qui est propre à cette page. */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px;}
#app > .sc-topbar{margin:0 -20px 20px;width:calc(100% + 40px);}

#profile-wrap{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:10px;}

/* ---------- En-tête : avatar + nom + succès mis en avant ---------- */
#profile-header{
  display:flex;align-items:center;gap:20px;
}
#avatar-circle{
  width:90px;height:90px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, var(--arcane), var(--arcane-dim));
  background-size:cover;background-position:center;
  border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
#profile-username{font-family:'Cinzel',serif;font-weight:700;color:var(--parchment);font-size:18px;margin:0 0 4px;}
#profile-title{font-family:'Cinzel',serif;font-size:12.5px;color:var(--gold);letter-spacing:.3px;margin:0 0 4px;}
#profile-title:empty{display:none;}
#profile-since{font-size:11.5px;color:var(--parchment-dim);}

#featured-row{display:flex;gap:10px;margin-left:auto;}
.featured-badge{
  width:52px;height:52px;border-radius:50%;background:var(--bg-panel-2);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;cursor:default;position:relative;
}
.featured-badge.empty{border-style:dashed;border-color:var(--line);opacity:.4;}
.featured-badge .tooltip{
  display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
  background:var(--bg-void);border:1px solid var(--gold);border-radius:8px;padding:8px 10px;
  width:180px;font-size:11px;color:var(--parchment-dim);z-index:20;text-align:left;
}
.featured-badge .tooltip strong{display:block;color:var(--gold);font-family:'Cinzel',serif;font-size:11.5px;margin-bottom:3px;}
.featured-badge:hover .tooltip{display:block;}

/* ---------- Mise en page : menu à gauche + contenu ---------- */
#pf-layout{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:start;}
#pf-menu{display:flex;flex-direction:column;gap:6px;position:sticky;top:10px;}
.pf-mi{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;cursor:pointer;
  border:1.5px solid transparent;background:var(--bg-panel);color:var(--parchment);font-size:13px;font-family:inherit;text-align:left;}
.pf-mi:hover{border-color:var(--line);}
.pf-mi.on{border-color:var(--gold);background:rgba(212,175,55,.12);color:var(--gold-bright);}
#pf-pane{display:flex;flex-direction:column;gap:14px;min-width:0;}
.pf-card{background:var(--bg-panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;}
.pf-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;}
.pf-h b{font-family:'Cinzel',serif;color:var(--gold);font-size:16px;}
.pf-h span{font-size:11.5px;color:var(--parchment-dim);}
.pf-empty{font-size:12.5px;color:var(--parchment-dim);padding:8px 2px;}
#pf-league{text-align:center;min-width:110px;margin-left:12px;}
#pf-league .lg-ic{font-size:30px;line-height:1.1;}
#pf-league .lg-tx{font-family:'Cinzel',serif;font-size:12.5px;color:var(--gold);font-weight:700;}
.pf-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.pf-stat{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.pf-stat .l{font-size:11px;color:var(--parchment-dim);}
.pf-stat .v{font-weight:700;color:var(--gold);font-size:13.5px;margin-top:2px;}
.pf-rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.pf-rec .r{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.pf-rec .r .i{font-size:20px;} .pf-rec .r .l{font-size:11px;color:var(--parchment-dim);margin:2px 0;} .pf-rec .r .v{font-weight:700;color:var(--gold);font-size:13.5px;}
.pf-vit{display:flex;gap:16px;align-items:center;}
.pf-vit .cardbox{width:96px;height:134px;border-radius:10px;border:2px solid var(--gold-bright);background:var(--bg-panel-2) center/cover;flex:none;
  box-shadow:0 0 16px rgba(242,207,90,.3);display:flex;align-items:flex-end;justify-content:center;font-size:10px;text-align:center;padding:4px;}
.pf-vit .cardbox.empty{border-style:dashed;border-color:var(--line);box-shadow:none;align-items:center;color:var(--parchment-dim);}
.pf-vit .k{font-size:10.5px;letter-spacing:2px;color:var(--parchment-dim);text-transform:uppercase;}
.pf-vit .back{width:34px;height:48px;border-radius:5px;border:1px solid var(--gold);background:var(--bg-panel-2) center/cover;margin-top:4px;}
.dk-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:13px;border:1px solid var(--line);background:var(--bg-panel-2);}
.dk-row + .dk-row{margin-top:7px;}
.dk-av{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:var(--bg-panel) center/cover;flex:none;}
.dk-nm{font-family:'Cinzel',serif;font-weight:700;font-size:13.5px;color:var(--parchment);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dk-sub{font-size:11px;color:var(--parchment-dim);}
.dk-info{flex:1;min-width:0;}
.dk-actions{display:flex;gap:6px;}
.dk-actions .sc-btn{padding:6px 12px;font-size:12px;}
.ring{position:relative;width:44px;height:44px;flex:none;}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
.ring i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-style:normal;}
.mt-row{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:10px;border:1px solid var(--line-soft);background:var(--bg-panel-2);font-size:12.5px;}
.mt-row + .mt-row{margin-top:5px;}
.mt-res{width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-size:11px;font-weight:700;flex:none;}
.mt-res.v{background:rgba(74,157,107,.3);color:#7fd6a0;} .mt-res.d{background:rgba(224,88,79,.3);color:#f0908a;}
.mt-opp{width:90px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mt-deck{flex:1;min-width:0;color:var(--parchment-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mt-meta{color:var(--parchment-dim);font-size:11.5px;white-space:nowrap;}
.mt-d{width:38px;text-align:right;font-weight:700;color:var(--parchment-dim);}
.mt-d.p{color:#7fd6a0;} .mt-d.m{color:#f0908a;}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;}
.bar i{display:block;height:100%;}
.co-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;}
.co-line{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
.h2h-top{display:flex;align-items:center;gap:20px;padding:12px 18px;border-radius:14px;border:1px solid var(--line);background:var(--bg-panel-2);}
.h2h-top .n{font-family:'Cinzel',serif;font-size:34px;font-weight:700;text-align:center;line-height:1;}
.h2h-top .t{font-size:11px;color:var(--parchment-dim);text-align:center;margin-bottom:4px;}
.h2h-dots{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;}
.set-lbl{font-size:11px;letter-spacing:2px;color:var(--parchment-dim);text-transform:uppercase;margin:0 0 6px;}
.vit-pick{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow-y:auto;margin-top:8px;}
.vit-pick .vp{width:58px;height:80px;border-radius:7px;border:2px solid var(--line);background:var(--bg-panel-2) center/cover;cursor:pointer;}
.vit-pick .vp.on{border-color:var(--gold-bright);box-shadow:0 0 0 2px rgba(242,207,90,.35);}

/* ---------- Panneau d'édition ---------- */
#edit-panel h2{font-family:'Cinzel',serif;color:var(--gold);font-size:16px;margin:0 0 14px;}
#edit-panel h3{font-family:'Cinzel',serif;color:var(--parchment-dim);font-size:12px;margin:16px 0 8px;text-transform:uppercase;}
#avatar-choices{display:flex;flex-wrap:wrap;gap:10px;}
.avatar-choice{
  width:60px;height:60px;border-radius:50%;cursor:pointer;background-size:cover;background-position:center;
  border:2px solid var(--line);background-color:var(--bg-panel-2);
}
.avatar-choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4);}
#achievement-choices{display:flex;flex-wrap:wrap;gap:10px;max-height:220px;overflow-y:auto;}
.achievement-choice{
  width:56px;height:56px;border-radius:10px;cursor:pointer;background-size:cover;background-position:center;
  border:2px solid var(--line);background-color:var(--bg-panel-2);position:relative;
}
.achievement-choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4);}
.achievement-choice.disabled{opacity:.3;cursor:not-allowed;}

#title-choices{display:flex;flex-wrap:wrap;gap:8px;max-height:180px;overflow-y:auto;}
.title-choice{
  padding:7px 14px;border-radius:20px;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;
  border:1.5px solid var(--line);background:var(--bg-panel-2);color:var(--parchment-dim);
}
.title-choice.selected{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.25);}
#edit-status{font-size:11.5px;color:var(--parchment-dim);min-height:14px;margin:12px 0;}
#edit-buttons{display:flex;gap:10px;margin-top:6px;}
#edit-buttons .sc-btn{flex:1;}

@media (max-width:640px){
  #profile-header{flex-wrap:wrap;}
  #featured-row{margin-left:0;}
  #pf-layout{grid-template-columns:1fr;}
  #pf-menu{flex-direction:row;flex-wrap:wrap;position:static;}
  .pf-stats{grid-template-columns:1fr 1fr;}
  .pf-rec{grid-template-columns:1fr 1fr;}
  .co-grid{grid-template-columns:1fr;}
  .mt-meta{display:none;}
}
</style>
</head>
<body>

<div id="app">
  <div class="sc-topbar">
    <a href="spellcraft-hub.html" class="sc-topbar-back" title="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Menu principal
    </a>
    <div class="sc-topbar-right">
      <div id="sc-auth-slot"></div>
      <div id="sc-options-slot"></div>
    </div>
  </div>

  <div id="profile-wrap">
    <div id="profile-header" class="sc-panel">
      <div id="avatar-circle" onclick="openEditPanel()">👤</div>
      <div>
        <div id="profile-username">...</div>
        <div id="profile-title"></div>
        <div id="profile-since"></div>
      </div>
      <div id="featured-row"></div>
      <div id="pf-league"></div>

    <div id="pf-layout">
      <div id="pf-menu"></div>

  <div id="edit-panel" class="sc-modal">
    <h2>Personnaliser mon profil</h2>

    <h3>Photo de profil (héros possédés)</h3>
    <div id="avatar-choices"></div>

    <h3>5 succès mis en avant</h3>
    <div id="achievement-choices"></div>

    <h3>Titre affiché</h3>

    <div id="edit-buttons">
      <button id="btn-cancel-profile" class="sc-btn sc-btn-ghost" onclick="closeEditPanel()">Annuler</button>
      <button id="btn-save-profile" class="sc-btn sc-btn-primary" onclick="saveProfileCustomization()">Enregistrer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_DISABLED = true;</script>
<script src="spellcraft-shared.js?v=20261112h"></script>
<script src="spellcraft-catalog.js?v=20261112g"></script>
<script src="spellcraft-server-client.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
let MY_USER_ID = null;
let VIEWED_USER_ID = null;
let OWNED_HEROES = [];
let ALL_ACHIEVEMENTS = [];
let UNLOCKED_ACHIEVEMENT_IDS = [];
let SELECTED_AVATAR = null;
let LAST_PROFILE = null; // dernière réponse de gsGetProfile, réutilisée par openEditPanel
let SELECTED_ACHIEVEMENTS = [];
let SELECTED_TITLE_VARIANT = null; // 'm' | 'f' | null (titres genrés uniquement)
let SELECTED_TITLE = null; // id du succès dont le nom sert de titre équipé (ou null = aucun)

function escapeHtmlProfile(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function initProfile(){
  const { data: { user } } = await sb.auth.getUser();
  MY_USER_ID = user?.id;
  const params = new URLSearchParams(window.location.search);
  VIEWED_USER_ID = params.get('uid') || MY_USER_ID;
  document.getElementById('avatar-circle').style.cursor = (VIEWED_USER_ID===MY_USER_ID) ? 'pointer' : 'default';
  document.getElementById('avatar-circle').onclick = (VIEWED_USER_ID===MY_USER_ID) ? openEditPanel : null;
  await loadAndRenderProfile();
}

async function loadAndRenderProfile(){
  const res = await gsGetProfile(VIEWED_USER_ID);
  if(res.error){ document.getElementById('profile-username').textContent = 'Erreur : ' + res.error; return; }
  LAST_PROFILE = res;

  document.getElementById('profile-username').textContent = res.username;
  document.getElementById('profile-title').textContent = res.equippedTitle ? `« ${res.equippedTitle} »` : '';
  document.getElementById('profile-since').textContent =
    `Membre depuis le ${new Date(res.createdAt).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}`;

  const avatarEl = document.getElementById('avatar-circle');
  avatarEl.style.backgroundImage = '';
  avatarEl.textContent = '👤';
  if(res.avatarHeroName){
    const collection = await loadAllCardsAcrossSets();
    const hero = collection.find(c=>c.name===res.avatarHeroName && c.type==='Héros');
    if(hero && hero.image){ avatarEl.style.backgroundImage = `url('${hero.image.replace(/'/g,"")}')`; avatarEl.textContent=''; }
  }
  // Pas de héros choisi (ou héros introuvable) : avatar Discord par défaut,
  // s'il existe (voir spellcraft-auth.js → scSyncDiscordAvatarIfNeeded).
  if(!avatarEl.style.backgroundImage && res.discordAvatarUrl){
    avatarEl.style.backgroundImage = `url('${res.discordAvatarUrl.replace(/'/g,"")}')`;
    avatarEl.textContent = '';
  }

  const featuredRow = document.getElementById('featured-row');
  featuredRow.innerHTML = '';
  const featured = res.featuredAchievements || [];
  for(let i=0;i<5;i++){
    const a = featured[i];
    const badge = document.createElement('div');
    badge.className = 'featured-badge' + (a ? '' : ' empty');
    if(a){
      badge.style.backgroundImage = a.imageUrl ? `url('${a.imageUrl.replace(/'/g,"")}')` : '';
      badge.innerHTML = `<div class="tooltip"><strong>${escapeHtmlProfile(a.name)}</strong>${escapeHtmlProfile(a.description||'')}</div>`;
    }
    featuredRow.appendChild(badge);
  }

  // Données complémentaires (parties, courbe, records, face à face, carte vedette)
  let rk = null;
  try{ const r = await sb.rpc('get_ranked_profile', { p_user_id: VIEWED_USER_ID }); if(r.data && r.data.ok) rk = r.data; }catch(e){}
  let ex = null;
  try{ const r = await sb.rpc('get_profile_extras', { p_user_id: VIEWED_USER_ID }); if(r.data && r.data.ok) ex = r.data; }catch(e){}
  PF = { res, rk, ex, self: VIEWED_USER_ID===MY_USER_ID, decks:null, cards:null, owned:null, sets:null, mine:null };
  const LG = { 'Non classé':'⚪', 'Bronze':'🥉', 'Argent':'🥈', 'Or':'🥇', 'Platine':'💠', 'Diamant':'💎', 'Maître':'👑' };
  document.getElementById('pf-league').innerHTML = rk && rk.games>0
    ? `<div class="lg-ic">${LG[rk.league]||''}</div><div class="lg-tx">${escapeHtmlProfile(rk.league)} · ${rk.rating} pts</div>`
    : `<div class="lg-ic">⚪</div><div class="lg-tx">Non classé</div>`;
  renderPfMenu();
  await renderPfSection();
}

/* ============================================================
   SECTIONS DU PROFIL (menu à gauche)
   ============================================================ */
let PF = null;
let PF_TAB = 'ap';
const PF_MENU_SELF  = [['ap','🏠','Aperçu'],['dk','🃏','Mes decks'],['pt','📜','Dernières parties'],['sa','📈','Ma saison'],['co','📚','Collection'],['rc','🏆','Records'],['rg','⚙️','Réglages']];
const PF_MENU_OTHER = [['ap','🏠','Aperçu'],['hh','⚔️','Face à face'],['sa','📈','Saison'],['rc','🏆','Records']];
const PF_COLORS = { 'Aube':'#d4af37','Crépuscule':'#8a5cf0','Prima':'#3fae5c','Volonté':'#c23b3b','Arcane':'#5b9bd5','Neutre':'#9aa0a8' };
const PF_LEAGUES = [[50,'Bronze','#c8814a'],[150,'Argent','#c9d2dc'],[300,'Or','#f2cf5a'],[500,'Platine','#6fe0e8'],[800,'Diamant','#9ad0ff'],[1000,'Maître','#ff8bd0']];

function renderPfMenu(){
  const M = PF.self ? PF_MENU_SELF : PF_MENU_OTHER;
  if(!M.some(m=>m[0]===PF_TAB)) PF_TAB = 'ap';
  const el = document.getElementById('pf-menu');
  el.innerHTML = M.map(m=>`<button class="pf-mi${m[0]===PF_TAB?' on':''}" data-k="${m[0]}"><span>${m[1]}</span>${m[2]}</button>`).join('');
  el.querySelectorAll('.pf-mi').forEach(b=>b.onclick=async()=>{ PF_TAB=b.dataset.k; renderPfMenu(); await renderPfSection(); });
}
async function renderPfSection(){
  const pane = document.getElementById('pf-pane');
  const F = { ap:secApercu, dk:secDecks, pt:secParties, sa:secSaison, co:secCollection, rc:secRecords, rg:secReglages, hh:secFace }[PF_TAB];
  pane.innerHTML = '<div class="pf-card pf-empty">Chargement…</div>';
  try{ pane.innerHTML = await F(); }catch(e){ console.error(e); pane.innerHTML = `<div class="pf-card pf-empty">Impossible d'afficher cette section.</div>`; }
  if(PF_TAB==='rg') bindReglages();
  if(PF_TAB==='dk') bindDecks();
}
const pfHead = (t,sub)=>`<div class="pf-h"><b>${t}</b>${sub?`<span>${sub}</span>`:''}</div>`;
const fmtDur = ms => ms ? `${Math.max(1,Math.round(ms/60000))} min` : '—';

async function pfCards(){
  if(!PF.cards){
    PF.cards = await loadAllCardsAcrossSets();
    try{ const r = await sb.from('card_sets').select('id, name'); PF.sets = {}; (r.data||[]).forEach(x=>PF.sets[x.id]=x.name); }catch(e){ PF.sets = {}; }
  }
  return PF.cards;
}

async function featuredCardHtml(){
  const id = PF.ex && PF.ex.featuredCardId;
  let card = null;
  if(id){ const cs = await pfCards(); card = cs.find(c=>c.id===id); }
  let back = '';
  if(PF.self){
    try{
      const prof = await loadUserProfile();
      if(prof && prof.equipped_card_back_id && prof.equipped_card_back_id!=='base'){
        const r = await sb.from('card_backs').select('image_url, name').eq('id', prof.equipped_card_back_id).maybeSingle();
        if(r.data) back = `<div class="k" style="margin-top:10px">Dos équipé</div><div class="back" title="${escapeHtmlProfile(r.data.name||'')}" style="${r.data.image_url?`background-image:url('${r.data.image_url.replace(/['"]/g,'')}')`:''}"></div>`;
      }
    }catch(e){}
  }
  const box = card
    ? `<div class="cardbox" style="${card.image?`background-image:url('${card.image.replace(/['"]/g,'')}')`:''}" title="${escapeHtmlProfile(card.name)}">${card.image?'':escapeHtmlProfile(card.name)}</div>`
    : `<div class="cardbox empty">${PF.self?'Aucune':'—'}</div>`;
  return `<div class="pf-vit">${box}<div><div class="k">Carte vedette</div><div style="font-size:13px;margin-top:3px">${card?escapeHtmlProfile(card.name):(PF.self?'Choisis-la dans Réglages':'Pas de carte vedette')}</div>${back}</div></div>`;
}

function statTiles(){
  const r = PF.res, rk = PF.rk;
  const losses = Math.max(0, r.totalGamesPlayed - r.totalWins);
  const wr = r.totalGamesPlayed>0 ? Math.round(r.totalWins/r.totalGamesPlayed*100) : 0;
  const T = [
    ['Parties jouées', r.totalGamesPlayed],
    ['Victoires / défaites', `${r.totalWins}V · ${losses}D (${wr} %)`],
    ['Classement', rk && rk.games>0 ? `${rk.league} · ${rk.rating} pts${rk.rank?` (#${rk.rank})`:''}` : 'Non classé'],
    ['Source favorite', r.favoriteClass || '—'],
    ['Héros favori', r.favoriteHero || '—'],
    ['Decks construits', r.deckCount],
    ['Deck favori', r.favoriteDeckName || '—'],
  ];
  return `<div class="pf-stats">${T.map(t=>`<div class="pf-stat"><div class="l">${t[0]}</div><div class="v">${escapeHtmlProfile(String(t[1]))}</div></div>`).join('')}</div>`;
}
function recordsHtml(){
  const R = PF.ex && PF.ex.records;
  if(!R) return `<div class="pf-empty">Records indisponibles.</div>`;
  const rows = [
    ['🔥','Série de victoires', R.bestStreak>0 ? `${R.bestStreak} d'affilée` : '—'],
    ['⚡','Victoire la plus rapide', R.fastestMs ? `${R.fastestTurns||'?'} tours · ${fmtDur(R.fastestMs)}` : '—'],
    ['💥','Plus de dégâts en une partie', R.maxDamage ?? '—'],
    ['🃏','Plus de cartes jouées', R.maxCards ? `${R.maxCards} en une partie` : '—'],
    ['📈','Meilleur classement', R.peakRating ? `${R.peakRating} pts` : '—'],
    ['⚔️','Héros favori', PF.res.favoriteHero || '—'],
  ];
  return `<div class="pf-rec">${rows.map(x=>`<div class="r"><div class="i">${x[0]}</div><div class="l">${x[1]}</div><div class="v">${escapeHtmlProfile(String(x[2]))}</div></div>`).join('')}</div>`;
}

async function secApercu(){
  return `<div class="pf-card">${await featuredCardHtml()}</div>
    ${statTiles()}
    <div class="pf-card">${pfHead('Records personnels')}${recordsHtml()}</div>`;
}
async function secRecords(){ return `<div class="pf-card">${pfHead('Records personnels','calculés sur toutes les parties terminées')}${recordsHtml()}</div>`; }

async function secSaison(){
  const rk = PF.rk, curve = (PF.ex && PF.ex.curve) || [];
  if(!rk || !curve.length) return `<div class="pf-card">${pfHead('Saison')}<div class="pf-empty">Aucune partie classée cette saison pour l'instant.</div></div>`;
  const W=700,H=200,mx=Math.max(60,...curve,rk.nextLeagueAt||0)*1.08,x=i=>10+(curve.length>1?i*(W-20)/(curve.length-1):(W-20)/2),y=v=>H-12-v/mx*(H-24);
  const lines = PF_LEAGUES.filter(l=>l[0]<=mx).map(l=>`<line x1="0" x2="${W}" y1="${y(l[0])}" y2="${y(l[0])}" stroke="${l[2]}" stroke-opacity=".4" stroke-dasharray="4 4"/><text x="${W-6}" y="${y(l[0])-3}" fill="${l[2]}" font-size="10" text-anchor="end">${l[1]}</text>`).join('');
  const pts = curve.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const left = rk.nextLeagueAt ? Math.max(0, rk.nextLeagueAt - rk.rating) : null;
  const nextName = rk.nextLeagueAt ? (PF_LEAGUES.find(l=>l[0]===rk.nextLeagueAt)||[])[1] : null;
  return `<div class="pf-card">${pfHead('Ma saison','points après chaque partie classée')}
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;background:var(--bg-panel-2);border-radius:12px">${lines}<polyline fill="none" stroke="var(--gold-bright)" stroke-width="2.5" points="${pts}"/>${curve.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===curve.length-1?5:2.5}" fill="var(--gold-bright)"/>`).join('')}</svg>
    <div style="display:flex;gap:16px;margin-top:10px;font-size:12.5px;color:var(--parchment-dim);flex-wrap:wrap">
      <span><b style="color:var(--gold-bright)">${escapeHtmlProfile(rk.league)}</b> · ${rk.rating} pts${rk.rank?` · #${rk.rank}`:''}</span>
      ${left!==null?`<span>${left} pts avant ${escapeHtmlProfile(nextName)}</span>`:'<span>Ligue maximale atteinte</span>'}
      <span>Meilleur : ${rk.peak} pts</span><span>${rk.wins}V ${rk.losses}D cette saison</span></div></div>`;
}

async function secParties(){
  const L = (PF.ex && PF.ex.recent) || [];
  if(!L.length) return `<div class="pf-card">${pfHead('Dernières parties')}<div class="pf-empty">Aucune partie terminée pour l'instant.</div></div>`;
  const rows = L.map(m=>{
    const d = m.delta; const dtxt = d==null?'':(d>0?'+'+d:(d<0?'−'+Math.abs(d):'0'));
    return `<div class="mt-row"><b class="mt-res ${m.won?'v':'d'}">${m.won?'V':'D'}</b><span class="mt-opp">${escapeHtmlProfile(m.opp||'?')}</span><span class="mt-deck">${escapeHtmlProfile(m.deck||'—')}</span><span class="mt-meta">${fmtDur(m.durMs)}${m.turns?` · ${m.turns} tours`:''}</span><b class="mt-d ${d>0?'p':d<0?'m':''}">${dtxt}</b></div>`;
  }).join('');
  return `<div class="pf-card">${pfHead('Dernières parties',`les ${L.length} plus récentes`)}${rows}<div style="text-align:center;margin-top:10px"><a href="spellcraft-match-history.html" style="font-size:12.5px;color:var(--gold-bright)">Voir tout l'historique →</a></div></div>`;
}

async function secDecks(){
  const cards = await pfCards();
  PF.decks = (await loadUserDecks()).filter(d=>!d.portail);
  const stat = {}; ((PF.ex && PF.ex.decks) || []).forEach(d=>{ stat[d.deck] = d; });
  if(!PF.decks.length) return `<div class="pf-card">${pfHead('Mes decks')}<div class="pf-empty">Tu n'as pas encore construit de deck.</div></div>`;
  const rows = PF.decks.map((d,i)=>{
    const hero = cards.find(c=>c.id===d.heroId);
    const st = stat[d.name]; const g = st?st.games:0, w = st?st.wins:0;
    const pc = g? Math.round(w/g*100) : null;
    const col = (hero && PF_COLORS[hero.class]) || '#d4af37';
    const R=18,C=2*Math.PI*R;
    const ring = pc===null ? `<div class="ring"><i style="color:var(--parchment-dim)">—</i></div>`
      : `<div class="ring"><svg width="44" height="44"><circle cx="22" cy="22" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="4"/><circle cx="22" cy="22" r="${R}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}"/></svg><i>${pc}%</i></div>`;
    return `<div class="dk-row"><div class="dk-av" style="border-color:${col};${hero&&hero.image?`background-image:url('${hero.image.replace(/['"]/g,'')}')`:''}"></div>
      <div class="dk-info"><div class="dk-nm">${d.taverne?'🍺 ':''}${escapeHtmlProfile(d.name)}</div><div class="dk-sub">${hero?escapeHtmlProfile(hero.name)+' · ':''}${g?`${g} parties · ${w}V ${g-w}D`:'Pas encore joué'}</div></div>
      ${ring}<div class="dk-actions"><button class="sc-btn sc-btn-gold" data-play="${i}">Jouer</button><button class="sc-btn sc-btn-ghost" data-edit="${i}">Modifier</button></div></div>`;
  }).join('');
  return `<div class="pf-card">${pfHead('Mes decks','taux de victoire par deck (selon le nom du deck)')}${rows}</div>`;
}
function bindDecks(){
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{
    const d = PF.decks[+b.dataset.play];
    try{ localStorage.setItem(d.taverne?'spellcraft-last-used-tavern-deck-id':'spellcraft-last-used-deck-id', d.id); }catch(e){}
    location.href = d.taverne ? 'spellcraft-lobby.html?mode=taverne' : 'spellcraft-lobby.html';
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const d = PF.decks[+b.dataset.edit];
    location.href = d.taverne ? 'spellcraft-deckbuilder.html?mode=taverne' : 'spellcraft-deckbuilder.html';
  });
}

async function secCollection(){
  const cards = (await pfCards()).filter(c=>c.type!=='Région' || true);
  if(!PF.owned) PF.owned = await loadUserCollection();
  const own = c => (PF.owned[c.id]||0) > 0;
  const tot = cards.length, got = cards.filter(own).length;
  const bar = (label,n,t,color)=>{ const pc = t? Math.round(n/t*100):0; return `<div><div class="co-line"><span>${escapeHtmlProfile(label)}</span><b>${pc} %</b></div><div class="bar"><i style="width:${pc}%;background:${color}"></i></div></div>`; };
  const byClass = Object.keys(PF_COLORS).map(k=>{ const L = cards.filter(c=>c.class===k); return L.length? bar(k, L.filter(own).length, L.length, PF_COLORS[k]) : ''; }).join('');
  const setNames = [...new Set(cards.map(c=>c.set).filter(Boolean))];
  const bySet = setNames.map(sn=>{ const L = cards.filter(c=>c.set===sn); return bar((PF.sets&&PF.sets[sn])||sn, L.filter(own).length, L.length, 'linear-gradient(90deg,#6a4cff,#9ad0ff)'); }).join('');
  let prof = null; try{ prof = await loadUserProfile(); }catch(e){}
  const frag = prof ? [['aube','Aube'],['crepuscule','Crépuscule'],['prima','Prima'],['volonte','Volonté'],['arcane','Arcane']].map(f=>`<span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${PF_COLORS[f[1]]}"></i> ${prof['fragments_'+f[0]]||0}</span>`).join('') : '';
  return `<div class="pf-card">${pfHead('Ma collection',`${tot?Math.round(got/tot*100):0} % des cartes possédées (${got}/${tot})`)}
    <div class="co-grid">${byClass}</div>
    <div class="set-lbl" style="margin-top:14px">Par extension</div><div class="co-grid">${bySet}</div>
    ${prof?`<div style="display:flex;gap:16px;margin-top:14px;font-size:12.5px;flex-wrap:wrap"><span>💰 <b style="color:var(--gold-bright)">${prof.currency||0}</b> or</span><span style="color:var(--parchment-dim)">Fragments :</span>${frag}</div>`:''}</div>`;
}

  if(!h || (h.wins+h.losses)===0) return `<div class="pf-card">${pfHead('Face à face avec '+name)}<div class="pf-empty">Vous ne vous êtes pas encore affrontés.</div>${challengeBtn()}</div>`;
  const tot = h.wins + h.losses, pc = Math.round(h.wins/tot*100);
  return `<div class="pf-card">${pfHead('Face à face avec '+name,'tes parties contre lui')}
    <div class="h2h-top"><div><div class="t">Toi</div><div class="n" style="color:#7fd6a0">${h.wins}</div></div>
      <div style="flex:1"><div class="bar" style="height:10px;background:rgba(224,88,79,.55)"><i style="width:${pc}%;background:#4a9d6b"></i></div><div style="text-align:center;font-size:11.5px;color:var(--parchment-dim);margin-top:4px">${tot} parties jouées ensemble</div></div>
      <div><div class="t">${name}</div><div class="n" style="color:#f0908a">${h.losses}</div></div></div>
    <div class="h2h-dots">${(h.last||[]).map(w=>`<b class="mt-res ${w?'v':'d'}">${w?'V':'D'}</b>`).join('')}</div>${challengeBtn()}</div>`;
}
function challengeBtn(){ return `<div style="text-align:center;margin-top:8px"><a class="sc-btn sc-btn-gold" href="spellcraft-lobby.html" style="padding:11px 30px;text-decoration:none">⚔️ Défier en partie privée</a><div class="pf-empty" style="margin-top:6px">Crée une partie privée dans la taverne puis envoie-lui le code.</div></div>`; }

async function secReglages(){
  return `<div class="pf-card">${pfHead('Réglages du profil')}
      <div class="set-lbl">Avatar, titre et badges</div>
      <button id="btn-edit-profile" class="sc-btn sc-btn-ghost" onclick="openEditPanel()">✎ Modifier avatar, titre & 5 badges</button>
      <div class="pf-empty">La musique et le compte (déconnexion) sont en haut à droite de la page.</div></div>
    <div class="pf-card">${pfHead('Carte vedette','affichée sur ton profil')}
      <div id="vit-cur">${await featuredCardHtml()}</div>
      <button id="btn-vit" class="sc-btn sc-btn-ghost" style="margin-top:10px">Choisir une carte…</button>
      <div id="vit-wrap"></div></div>`;
}
function bindReglages(){
  const btn = document.getElementById('btn-vit'); if(!btn) return;
  btn.onclick = async ()=>{
    const wrap = document.getElementById('vit-wrap');
    if(wrap.innerHTML){ wrap.innerHTML=''; return; }
    wrap.innerHTML = '<div class="pf-empty">Chargement…</div>';
    const cards = await pfCards(); if(!PF.owned) PF.owned = await loadUserCollection();
    const mine = cards.filter(c=>c.type!=='Région' && (PF.owned[c.id]||0)>0 && c.image).sort((a,b)=>String(b.rarity).localeCompare(String(a.rarity)) || a.name.localeCompare(b.name));
    const cur = PF.ex && PF.ex.featuredCardId;
    wrap.innerHTML = `<div class="vit-pick"><div class="vp" data-id="" title="Aucune" style="display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--parchment-dim)">Aucune</div>${mine.map(c=>`<div class="vp${c.id===cur?' on':''}" data-id="${escapeHtmlProfile(c.id)}" title="${escapeHtmlProfile(c.name)}" style="background-image:url('${c.image.replace(/['"]/g,'')}')"></div>`).join('')}</div>`;
    wrap.querySelectorAll('.vp').forEach(el=>el.onclick=async()=>{
      const r = await sb.rpc('set_featured_card', { p_card_id: el.dataset.id });
      if(r.error || (r.data && r.data.error)){ (window.scAlert||alert)('Erreur : '+(r.error?.message||r.data.error)); return; }
      PF.ex.featuredCardId = el.dataset.id || null;
      wrap.querySelectorAll('.vp').forEach(e=>e.classList.toggle('on', e===el && !!el.dataset.id));
      document.getElementById('vit-cur').innerHTML = await featuredCardHtml();
    });
  };
}

async function openEditPanel(){
  document.getElementById('edit-status').textContent = 'Chargement...';
  document.getElementById('edit-overlay').classList.add('show');

  const collection = await loadAllCardsAcrossSets();
  const owned = await loadUserCollection();
  OWNED_HEROES = collection.filter(c=>c.type==='Héros' && owned[c.id]);

  const avatarWrap = document.getElementById('avatar-choices');
  // On initialise sur le choix ACTUEL (et non null) : si le joueur ouvre ce
  // panneau juste pour changer ses succès mis en avant et enregistre sans
  // toucher à l'avatar, on ne veut pas écraser silencieusement son avatar
  // existant avec "aucun".
  const currentAvatarHero = LAST_PROFILE && LAST_PROFILE.avatarHeroName || null;
  SELECTED_AVATAR = currentAvatarHero;

  let avatarTilesHtml = '';
  if(LAST_PROFILE && LAST_PROFILE.discordAvatarUrl){
    avatarTilesHtml += `
      <div class="avatar-choice${currentAvatarHero ? '' : ' selected'}" data-hero=""
           style="background-image:url('${LAST_PROFILE.discordAvatarUrl.replace(/'/g,"")}')"
           title="Avatar Discord (par défaut)"></div>`;
  }
  avatarTilesHtml += OWNED_HEROES.map(h=>`
    <div class="avatar-choice${h.name===currentAvatarHero ? ' selected' : ''}" data-hero="${escapeHtmlProfile(h.name)}"
         style="${h.image?`background-image:url('${h.image.replace(/'/g,"")}')`:''}"
         title="${escapeHtmlProfile(h.name)}"></div>
  `).join('');
  avatarWrap.innerHTML = avatarTilesHtml || "<p style=\"font-size:12px;color:var(--parchment-dim);\">Aucun héros possédé pour l'instant.</p>";
  avatarWrap.querySelectorAll('.avatar-choice').forEach(el=>{
    el.onclick = ()=>{
      SELECTED_AVATAR = el.dataset.hero || null;
      avatarWrap.querySelectorAll('.avatar-choice').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  const { data: achievements } = await sb.from('achievement_definitions').select('id, name, description, image_url, grants_title, title_masculine, title_feminine').order('order_index');
  const { data: unlocked } = await sb.from('user_achievements').select('achievement_id').eq('user_id', MY_USER_ID).eq('completed', true);
  ALL_ACHIEVEMENTS = achievements || [];
  UNLOCKED_ACHIEVEMENT_IDS = (unlocked||[]).map(u=>u.achievement_id);
  // On repart des badges ACTUELLEMENT mis en avant (et non d'une liste vide) :
  // sinon, enregistrer le panneau sans toucher aux badges (ex. pour changer
  // seulement l'avatar ou le titre) envoyait « aucun badge » au serveur et
  // effaçait ceux déjà enregistrés. Seuls les badges encore débloqués sont gardés.
  SELECTED_ACHIEVEMENTS = ((LAST_PROFILE && LAST_PROFILE.featuredAchievements) || [])
    .map(f => f && f.id).filter(id => id && UNLOCKED_ACHIEVEMENT_IDS.includes(id)).slice(0,5);
  SELECTED_TITLE = (LAST_PROFILE && LAST_PROFILE.equippedTitleAchievementId) || null;
  SELECTED_TITLE_VARIANT = (LAST_PROFILE && LAST_PROFILE.equippedTitleVariant) || null;

  const achWrap = document.getElementById('achievement-choices');
  achWrap.innerHTML = ALL_ACHIEVEMENTS.map(a=>{
    const isUnlocked = UNLOCKED_ACHIEVEMENT_IDS.includes(a.id);
    return `
      <div class="achievement-choice${isUnlocked?'':' disabled'}${SELECTED_ACHIEVEMENTS.includes(a.id)?' selected':''}" data-id="${escapeHtmlProfile(a.id)}"
           style="${a.image_url?`background-image:url('${a.image_url.replace(/'/g,"")}')`:''}"
           title="${escapeHtmlProfile(a.name)}${isUnlocked?'':' (non débloqué)'}"></div>
    `;
  }).join('') || '<p style="font-size:12px;color:var(--parchment-dim);">Aucun succès disponible.</p>';
  achWrap.querySelectorAll('.achievement-choice:not(.disabled)').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      const idx = SELECTED_ACHIEVEMENTS.indexOf(id);
      if(idx>=0){ SELECTED_ACHIEVEMENTS.splice(idx,1); el.classList.remove('selected'); }
      else {
        if(SELECTED_ACHIEVEMENTS.length>=5){ document.getElementById('edit-status').textContent = 'Maximum 5 succès mis en avant.'; return; }
        SELECTED_ACHIEVEMENTS.push(id); el.classList.add('selected');
      }
    };
  });

  // Titres : uniquement les succès marqués "donne un titre" ET débloqués par
  // le joueur. "Aucun titre" est toujours proposé pour pouvoir le retirer.
  const unlockedTitleAchievements = ALL_ACHIEVEMENTS.filter(a => a.grants_title && UNLOCKED_ACHIEVEMENT_IDS.includes(a.id));
  const titleWrap = document.getElementById('title-choices');
  let titleTilesHtml = `<div class="title-choice${SELECTED_TITLE ? '' : ' selected'}" data-title-id="" data-variant="">Aucun titre</div>`;
  // Un titre genré donne DEUX choix distincts (ex. « Prestidigitateur » et « Prestidigitatrice »).
  // Si les deux formes sont identiques (ex. « L'enfant »), un seul choix est proposé.
  // Un titre sans forme genrée reste un choix unique, sans variante.
  const titleTiles = [];
  unlockedTitleAchievements.forEach(a => {
    if(a.title_masculine){
      titleTiles.push({ id:a.id, variant:'m', label:a.title_masculine });
      if(a.title_feminine && a.title_feminine !== a.title_masculine) titleTiles.push({ id:a.id, variant:'f', label:a.title_feminine });
    } else {
      titleTiles.push({ id:a.id, variant:'', label:a.name });
    }
  });
  titleTilesHtml += titleTiles.map(t => {
    const isSel = t.id === SELECTED_TITLE && (t.variant === '' || t.variant === (SELECTED_TITLE_VARIANT || 'm') || (t.variant === 'm' && SELECTED_TITLE_VARIANT === 'f' && !titleTiles.some(x => x.id === t.id && x.variant === 'f')));
    return `<div class="title-choice${isSel ? ' selected' : ''}" data-title-id="${escapeHtmlProfile(t.id)}" data-variant="${t.variant}">${escapeHtmlProfile(t.label)}</div>`;
  }).join('');
  titleWrap.innerHTML = titleTilesHtml;
  if(unlockedTitleAchievements.length === 0){
    titleWrap.innerHTML += '<p style="font-size:12px;color:var(--parchment-dim);width:100%;">Aucun titre débloqué pour l\'instant — certains succès en donnent un en plus du badge.</p>';
  }
  titleWrap.querySelectorAll('.title-choice').forEach(el=>{
    el.onclick = ()=>{
      SELECTED_TITLE = el.dataset.titleId || null;
      SELECTED_TITLE_VARIANT = el.dataset.variant || null;
      titleWrap.querySelectorAll('.title-choice').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  document.getElementById('edit-status').textContent = '';
}

function closeEditPanel(){
  document.getElementById('edit-overlay').classList.remove('show');
}

async function saveProfileCustomization(){
  const statusEl = document.getElementById('edit-status');
  statusEl.textContent = 'Enregistrement...';
  const res = await gsUpdateProfileCustomization(SELECTED_AVATAR, SELECTED_ACHIEVEMENTS, SELECTED_TITLE,
    SELECTED_TITLE_VARIANT);
  if(res.error){ statusEl.textContent = 'Erreur : ' + res.error; return; }
  statusEl.textContent = 'Enregistré !';
  await loadAndRenderProfile();
  setTimeout(closeEditPanel, 700);
}

playMenuMusicRotation(0.35);
