<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rimd'Orël — Profil</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu.
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
/* Le reste des jetons de couleur (--bg-void, --gold, --arcane, etc.)
   vient de spellcraft-ui-kit.css et suit le thème actif.
   On ne garde ici que ce qui est propre à cette page. */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px;}
#app > .sc-topbar{margin:0 -20px 20px;width:calc(100% + 40px);}

#profile-wrap{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:10px;}

/* ---------- En-tête : avatar + nom + succès mis en avant ---------- */
#profile-header{
  display:flex;align-items:center;gap:20px;
}
#avatar-circle{
  width:90px;height:90px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:radial-gradient(circle at 35% 30%, var(--arcane), var(--arcane-dim));
  background-size:cover;background-position:center;
  border:3px solid var(--gold);box-shadow:0 4px 14px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;font-size:26px;
}
#profile-username{font-family:'Cinzel',serif;font-weight:700;color:var(--parchment);font-size:18px;margin:0 0 4px;}
#profile-title{font-family:'Cinzel',serif;font-size:12.5px;color:var(--gold);letter-spacing:.3px;margin:0 0 4px;}
#profile-title:empty{display:none;}
#profile-since{font-size:11.5px;color:var(--parchment-dim);}

#featured-row{display:flex;gap:10px;margin-left:auto;}
.featured-badge{
  width:52px;height:52px;border-radius:50%;background:var(--bg-panel-2);
  border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;cursor:default;position:relative;
}
.featured-badge.empty{border-style:dashed;border-color:var(--line);opacity:.4;}
.featured-badge .tooltip{
  display:none;position:absolute;bottom:120%;left:50%;transform:translateX(-50%);
  background:var(--bg-void);border:1px solid var(--gold);border-radius:8px;padding:8px 10px;
  width:180px;font-size:11px;color:var(--parchment-dim);z-index:20;text-align:left;
}
.featured-badge .tooltip strong{display:block;color:var(--gold);font-family:'Cinzel',serif;font-size:11.5px;margin-bottom:3px;}
.featured-badge:hover .tooltip{display:block;}

/* ---------- Statistiques ---------- */
#stats-grid{
  display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;
}
.stat-tile{
  background:var(--bg-panel);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;text-align:center;
}
.stat-tile .stat-label{font-size:11px;color:var(--parchment-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.stat-tile .stat-value{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:17px;}
.stat-tile .stat-value.small{font-size:14px;color:var(--parchment);}

/* ---------- Panneau d'édition ---------- */
#edit-panel h2{font-family:'Cinzel',serif;color:var(--gold);font-size:16px;margin:0 0 14px;}
#edit-panel h3{font-family:'Cinzel',serif;color:var(--parchment-dim);font-size:12px;margin:16px 0 8px;text-transform:uppercase;}
#avatar-choices{display:flex;flex-wrap:wrap;gap:10px;}
.avatar-choice{
  width:60px;height:60px;border-radius:50%;cursor:pointer;background-size:cover;background-position:center;
  border:2px solid var(--line);background-color:var(--bg-panel-2);
}
.avatar-choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4);}
#achievement-choices{display:flex;flex-wrap:wrap;gap:10px;max-height:220px;overflow-y:auto;}
.achievement-choice{
  width:56px;height:56px;border-radius:10px;cursor:pointer;background-size:cover;background-position:center;
  border:2px solid var(--line);background-color:var(--bg-panel-2);position:relative;
}
.achievement-choice.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.4);}
.achievement-choice.disabled{opacity:.3;cursor:not-allowed;}

#title-choices{display:flex;flex-wrap:wrap;gap:8px;max-height:180px;overflow-y:auto;}
.title-choice{
  padding:7px 14px;border-radius:20px;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;
  border:1.5px solid var(--line);background:var(--bg-panel-2);color:var(--parchment-dim);
}
.title-choice.selected{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.25);}
#edit-status{font-size:11.5px;color:var(--parchment-dim);min-height:14px;margin:12px 0;}
#edit-buttons{display:flex;gap:10px;margin-top:6px;}
#edit-buttons .sc-btn{flex:1;}

@media (max-width:640px){
  #profile-header{flex-wrap:wrap;}
  #featured-row{margin-left:0;}
  #stats-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div id="app">
  <div class="sc-topbar">
    <a href="spellcraft-hub.html" class="sc-topbar-back" title="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Menu principal
    </a>
    <span class="sc-topbar-title">👤 Profil</span>
    <div class="sc-topbar-right">
      <div id="sc-auth-slot"></div>
      <div id="sc-options-slot"></div>
    </div>
  </div>

  <div id="profile-wrap">
    <div id="profile-header" class="sc-panel">
      <div id="avatar-circle" onclick="openEditPanel()">👤</div>
      <div>
        <div id="profile-username">...</div>
        <div id="profile-title"></div>
        <div id="profile-since"></div>
      </div>
      <div id="featured-row"></div>
    </div>

    <button id="btn-edit-profile" class="sc-btn sc-btn-ghost" style="align-self:flex-start;" onclick="openEditPanel()">✎ Modifier photo & succès mis en avant</button>

    <div id="stats-grid"></div>
  </div>
</div>

<div id="edit-overlay" class="sc-overlay">
  <div id="edit-panel" class="sc-modal">
    <h2>Personnaliser mon profil</h2>

    <h3>Photo de profil (héros possédés)</h3>
    <div id="avatar-choices"></div>

    <h3>5 succès mis en avant</h3>
    <div id="achievement-choices"></div>

    <h3>Titre affiché</h3>
    <div id="title-choices"></div>

    <div id="edit-status"></div>
    <div id="edit-buttons">
      <button id="btn-cancel-profile" class="sc-btn sc-btn-ghost" onclick="closeEditPanel()">Annuler</button>
      <button id="btn-save-profile" class="sc-btn sc-btn-primary" onclick="saveProfileCustomization()">Enregistrer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_DISABLED = true;</script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-catalog.js"></script>
<script src="spellcraft-server-client.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
let MY_USER_ID = null;
let VIEWED_USER_ID = null;
let OWNED_HEROES = [];
let ALL_ACHIEVEMENTS = [];
let UNLOCKED_ACHIEVEMENT_IDS = [];
let SELECTED_AVATAR = null;
let LAST_PROFILE = null; // dernière réponse de gsGetProfile, réutilisée par openEditPanel
let SELECTED_ACHIEVEMENTS = [];
let SELECTED_TITLE_VARIANT = null; // 'm' | 'f' | null (titres genrés uniquement)
let SELECTED_TITLE = null; // id du succès dont le nom sert de titre équipé (ou null = aucun)

function escapeHtmlProfile(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function initProfile(){
  const { data: { user } } = await sb.auth.getUser();
  MY_USER_ID = user?.id;
  const params = new URLSearchParams(window.location.search);
  VIEWED_USER_ID = params.get('uid') || MY_USER_ID;
  document.getElementById('btn-edit-profile').style.display = (VIEWED_USER_ID===MY_USER_ID) ? '' : 'none';
  document.getElementById('avatar-circle').style.cursor = (VIEWED_USER_ID===MY_USER_ID) ? 'pointer' : 'default';
  document.getElementById('avatar-circle').onclick = (VIEWED_USER_ID===MY_USER_ID) ? openEditPanel : null;
  await loadAndRenderProfile();
}

async function loadAndRenderProfile(){
  const res = await gsGetProfile(VIEWED_USER_ID);
  if(res.error){ document.getElementById('profile-username').textContent = 'Erreur : ' + res.error; return; }
  LAST_PROFILE = res;

  document.getElementById('profile-username').textContent = res.username;
  document.getElementById('profile-title').textContent = res.equippedTitle ? `« ${res.equippedTitle} »` : '';
  document.getElementById('profile-since').textContent =
    `Membre depuis le ${new Date(res.createdAt).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'})}`;

  const avatarEl = document.getElementById('avatar-circle');
  avatarEl.style.backgroundImage = '';
  avatarEl.textContent = '👤';
  if(res.avatarHeroName){
    const collection = await loadAllCardsAcrossSets();
    const hero = collection.find(c=>c.name===res.avatarHeroName && c.type==='Héros');
    if(hero && hero.image){ avatarEl.style.backgroundImage = `url('${hero.image.replace(/'/g,"")}')`; avatarEl.textContent=''; }
  }
  // Pas de héros choisi (ou héros introuvable) : avatar Discord par défaut,
  // s'il existe (voir spellcraft-auth.js → scSyncDiscordAvatarIfNeeded).
  if(!avatarEl.style.backgroundImage && res.discordAvatarUrl){
    avatarEl.style.backgroundImage = `url('${res.discordAvatarUrl.replace(/'/g,"")}')`;
    avatarEl.textContent = '';
  }

  const featuredRow = document.getElementById('featured-row');
  featuredRow.innerHTML = '';
  const featured = res.featuredAchievements || [];
  for(let i=0;i<5;i++){
    const a = featured[i];
    const badge = document.createElement('div');
    badge.className = 'featured-badge' + (a ? '' : ' empty');
    if(a){
      badge.style.backgroundImage = a.imageUrl ? `url('${a.imageUrl.replace(/'/g,"")}')` : '';
      badge.innerHTML = `<div class="tooltip"><strong>${escapeHtmlProfile(a.name)}</strong>${escapeHtmlProfile(a.description||'')}</div>`;
    }
    featuredRow.appendChild(badge);
  }

  // Classement de la saison en cours (ligue + points). Absent ou en erreur : la ligne est simplement omise.
  let rankedLine = null;
  try{
    const { data: rk } = await sb.rpc('get_ranked_profile', { p_user_id: VIEWED_USER_ID });
    if(rk && rk.ok){
      rankedLine = rk.games>0
        ? `${rk.league} — ${rk.rating} pts${rk.rank ? ` (#${rk.rank})` : ''}`
        : 'Non classé cette saison';
    }
  }catch(e){ /* le profil reste affichable sans classement */ }
  const winRate = res.totalGamesPlayed>0 ? Math.round((res.totalWins/res.totalGamesPlayed)*100) : 0;
  const losses = Math.max(0, res.totalGamesPlayed - res.totalWins);
  const stats = [
    { label:'Parties jouées', value: res.totalGamesPlayed, small:true },
    ...(rankedLine ? [{ label:'Classement de la saison', value: rankedLine, small:true }] : []),
    { label:'Ratio victoire / défaite', value: `${res.totalWins}V — ${losses}D (${winRate}%)` },
    { label:'Source de magie favorite', value: res.favoriteClass || '—' },
    { label:'Héros favori', value: res.favoriteHero || '—' },
    { label:'Decks construits', value: res.deckCount },
    { label:'Deck favori', value: res.favoriteDeckName || '—', small:true },
  ];
  const grid = document.getElementById('stats-grid');
  grid.innerHTML = stats.map(s=>`
    <div class="stat-tile">
      <div class="stat-label">${escapeHtmlProfile(s.label)}</div>
      <div class="stat-value${s.small?' small':''}">${escapeHtmlProfile(String(s.value))}</div>
    </div>
  `).join('');
}

async function openEditPanel(){
  document.getElementById('edit-status').textContent = 'Chargement...';
  document.getElementById('edit-overlay').classList.add('show');

  const collection = await loadAllCardsAcrossSets();
  const owned = await loadUserCollection();
  OWNED_HEROES = collection.filter(c=>c.type==='Héros' && owned[c.id]);

  const avatarWrap = document.getElementById('avatar-choices');
  // On initialise sur le choix ACTUEL (et non null) : si le joueur ouvre ce
  // panneau juste pour changer ses succès mis en avant et enregistre sans
  // toucher à l'avatar, on ne veut pas écraser silencieusement son avatar
  // existant avec "aucun".
  const currentAvatarHero = LAST_PROFILE && LAST_PROFILE.avatarHeroName || null;
  SELECTED_AVATAR = currentAvatarHero;

  let avatarTilesHtml = '';
  if(LAST_PROFILE && LAST_PROFILE.discordAvatarUrl){
    avatarTilesHtml += `
      <div class="avatar-choice${currentAvatarHero ? '' : ' selected'}" data-hero=""
           style="background-image:url('${LAST_PROFILE.discordAvatarUrl.replace(/'/g,"")}')"
           title="Avatar Discord (par défaut)"></div>`;
  }
  avatarTilesHtml += OWNED_HEROES.map(h=>`
    <div class="avatar-choice${h.name===currentAvatarHero ? ' selected' : ''}" data-hero="${escapeHtmlProfile(h.name)}"
         style="${h.image?`background-image:url('${h.image.replace(/'/g,"")}')`:''}"
         title="${escapeHtmlProfile(h.name)}"></div>
  `).join('');
  avatarWrap.innerHTML = avatarTilesHtml || "<p style=\"font-size:12px;color:var(--parchment-dim);\">Aucun héros possédé pour l'instant.</p>";
  avatarWrap.querySelectorAll('.avatar-choice').forEach(el=>{
    el.onclick = ()=>{
      SELECTED_AVATAR = el.dataset.hero || null;
      avatarWrap.querySelectorAll('.avatar-choice').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  const { data: achievements } = await sb.from('achievement_definitions').select('id, name, description, image_url, grants_title, title_masculine, title_feminine').order('order_index');
  const { data: unlocked } = await sb.from('user_achievements').select('achievement_id').eq('user_id', MY_USER_ID).eq('completed', true);
  ALL_ACHIEVEMENTS = achievements || [];
  UNLOCKED_ACHIEVEMENT_IDS = (unlocked||[]).map(u=>u.achievement_id);
  // On repart des badges ACTUELLEMENT mis en avant (et non d'une liste vide) :
  // sinon, enregistrer le panneau sans toucher aux badges (ex. pour changer
  // seulement l'avatar ou le titre) envoyait « aucun badge » au serveur et
  // effaçait ceux déjà enregistrés. Seuls les badges encore débloqués sont gardés.
  SELECTED_ACHIEVEMENTS = ((LAST_PROFILE && LAST_PROFILE.featuredAchievements) || [])
    .map(f => f && f.id).filter(id => id && UNLOCKED_ACHIEVEMENT_IDS.includes(id)).slice(0,5);
  SELECTED_TITLE = (LAST_PROFILE && LAST_PROFILE.equippedTitleAchievementId) || null;
  SELECTED_TITLE_VARIANT = (LAST_PROFILE && LAST_PROFILE.equippedTitleVariant) || null;

  const achWrap = document.getElementById('achievement-choices');
  achWrap.innerHTML = ALL_ACHIEVEMENTS.map(a=>{
    const isUnlocked = UNLOCKED_ACHIEVEMENT_IDS.includes(a.id);
    return `
      <div class="achievement-choice${isUnlocked?'':' disabled'}${SELECTED_ACHIEVEMENTS.includes(a.id)?' selected':''}" data-id="${escapeHtmlProfile(a.id)}"
           style="${a.image_url?`background-image:url('${a.image_url.replace(/'/g,"")}')`:''}"
           title="${escapeHtmlProfile(a.name)}${isUnlocked?'':' (non débloqué)'}"></div>
    `;
  }).join('') || '<p style="font-size:12px;color:var(--parchment-dim);">Aucun succès disponible.</p>';
  achWrap.querySelectorAll('.achievement-choice:not(.disabled)').forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.id;
      const idx = SELECTED_ACHIEVEMENTS.indexOf(id);
      if(idx>=0){ SELECTED_ACHIEVEMENTS.splice(idx,1); el.classList.remove('selected'); }
      else {
        if(SELECTED_ACHIEVEMENTS.length>=5){ document.getElementById('edit-status').textContent = 'Maximum 5 succès mis en avant.'; return; }
        SELECTED_ACHIEVEMENTS.push(id); el.classList.add('selected');
      }
    };
  });

  // Titres : uniquement les succès marqués "donne un titre" ET débloqués par
  // le joueur. "Aucun titre" est toujours proposé pour pouvoir le retirer.
  const unlockedTitleAchievements = ALL_ACHIEVEMENTS.filter(a => a.grants_title && UNLOCKED_ACHIEVEMENT_IDS.includes(a.id));
  const titleWrap = document.getElementById('title-choices');
  let titleTilesHtml = `<div class="title-choice${SELECTED_TITLE ? '' : ' selected'}" data-title-id="" data-variant="">Aucun titre</div>`;
  // Un titre genré donne DEUX choix distincts (ex. « Prestidigitateur » et « Prestidigitatrice »).
  // Si les deux formes sont identiques (ex. « L'enfant »), un seul choix est proposé.
  // Un titre sans forme genrée reste un choix unique, sans variante.
  const titleTiles = [];
  unlockedTitleAchievements.forEach(a => {
    if(a.title_masculine){
      titleTiles.push({ id:a.id, variant:'m', label:a.title_masculine });
      if(a.title_feminine && a.title_feminine !== a.title_masculine) titleTiles.push({ id:a.id, variant:'f', label:a.title_feminine });
    } else {
      titleTiles.push({ id:a.id, variant:'', label:a.name });
    }
  });
  titleTilesHtml += titleTiles.map(t => {
    const isSel = t.id === SELECTED_TITLE && (t.variant === '' || t.variant === (SELECTED_TITLE_VARIANT || 'm') || (t.variant === 'm' && SELECTED_TITLE_VARIANT === 'f' && !titleTiles.some(x => x.id === t.id && x.variant === 'f')));
    return `<div class="title-choice${isSel ? ' selected' : ''}" data-title-id="${escapeHtmlProfile(t.id)}" data-variant="${t.variant}">${escapeHtmlProfile(t.label)}</div>`;
  }).join('');
  titleWrap.innerHTML = titleTilesHtml;
  if(unlockedTitleAchievements.length === 0){
    titleWrap.innerHTML += '<p style="font-size:12px;color:var(--parchment-dim);width:100%;">Aucun titre débloqué pour l\'instant — certains succès en donnent un en plus du badge.</p>';
  }
  titleWrap.querySelectorAll('.title-choice').forEach(el=>{
    el.onclick = ()=>{
      SELECTED_TITLE = el.dataset.titleId || null;
      SELECTED_TITLE_VARIANT = el.dataset.variant || null;
      titleWrap.querySelectorAll('.title-choice').forEach(e=>e.classList.remove('selected'));
      el.classList.add('selected');
    };
  });

  document.getElementById('edit-status').textContent = '';
}

function closeEditPanel(){
  document.getElementById('edit-overlay').classList.remove('show');
}

async function saveProfileCustomization(){
  const statusEl = document.getElementById('edit-status');
  statusEl.textContent = 'Enregistrement...';
  const res = await gsUpdateProfileCustomization(SELECTED_AVATAR, SELECTED_ACHIEVEMENTS, SELECTED_TITLE,
    SELECTED_TITLE_VARIANT);
  if(res.error){ statusEl.textContent = 'Erreur : ' + res.error; return; }
  statusEl.textContent = 'Enregistré !';
  await loadAndRenderProfile();
  setTimeout(closeEditPanel, 700);
}

initSpellcraftAuth().then(initProfile);
playMenuMusicRotation(0.35);
</script>
</body>
</html>
