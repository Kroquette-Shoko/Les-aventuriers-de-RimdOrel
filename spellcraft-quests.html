<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rimd'Orël — Quêtes</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu.
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
/* Le reste des jetons de couleur (--bg-void, --gold, --arcane, etc.)
   vient de spellcraft-ui-kit.css et suit le thème actif.
   On ne garde ici que ce qui est propre à cette page. */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px;}
#app > .sc-topbar{margin:0 -20px 20px;width:calc(100% + 40px);}

#quests-layout{width:100%;max-width:1260px;display:flex;gap:22px;align-items:flex-start;}
#quests-side{width:230px;flex-shrink:0;position:sticky;top:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:16px 12px;}
#quests-side .side-title{font-family:'Cinzel',serif;font-weight:700;font-size:26px;color:var(--gold);letter-spacing:1px;margin:0 4px;}
#quests-side #gold-chip{align-self:flex-start;margin:0 4px 8px;}
.quest-tab{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid transparent;background:none;color:var(--parchment);font-family:'Inter',sans-serif;font-size:14px;text-align:left;cursor:pointer;position:relative;transition:background .15s,border-color .15s;}
.quest-tab:hover{background:rgba(212,175,55,.08);}
.quest-tab.active{background:rgba(212,175,55,.14);border-color:var(--gold);color:var(--gold-bright,var(--gold));}
#quests-summary:empty{display:none;}
#quests-summary{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(0,0,0,.2);}
#quests-summary .qs-lbl{font-size:11px;letter-spacing:2px;color:var(--parchment-dim);text-transform:uppercase;}
#quests-summary .qs-val{font-size:26px;font-weight:700;color:var(--gold-bright,var(--gold));margin:2px 0 6px;}
#quests-summary .qs-sub{font-size:11.5px;color:var(--parchment-dim);margin-top:6px;}
#quests-content{flex:1;min-width:0;max-width:100%;}
#quests-layout{min-width:0;}
#progression-road{max-width:100%;}
.quest-section{display:none;min-width:0;}
.quest-section.active{display:block;animation:qIn .25s ease;}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#coffres-view{display:none;width:100%;}
#coffres-view iframe{width:100%;border:0;display:block;min-height:600px;background:transparent;}
.money-icon{width:22px;height:22px;display:inline-block;vertical-align:-6px;background-color:#f2c94c;-webkit-mask-image:url('images/money.png');mask-image:url('images/money.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
#gold-chip{font-size:13.5px;padding:7px 16px;}

main{width:100%;min-width:0;display:flex;flex-direction:column;gap:22px;}
.quest-section h2{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);margin:0 0 14px;letter-spacing:.5px;border-bottom:1px solid var(--line);padding-bottom:10px;}
.quest-list{display:flex;flex-direction:column;gap:10px;}
.quest-card{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:20px;transition:border-color .15s ease;}
.quest-ring{flex:none;width:76px;height:76px;}
.quest-ring svg{display:block;width:100%;height:100%;}
.quest-card.completed:not(.claimed){animation:qGlow 2s infinite;}
@keyframes qGlow{50%{box-shadow:0 0 20px rgba(80,220,130,.45)}}
.quest-claim-btn:not(:disabled){animation:qPulse 1.6s infinite;}
@keyframes qPulse{50%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.quest-card.completed:not(.claimed),.quest-claim-btn:not(:disabled),.quest-section.active{animation:none;}}
@media (max-width:640px){.quest-card{flex-wrap:wrap;gap:12px;}.quest-info{flex-basis:calc(100% - 100px);}.quest-card .quest-reward{flex-basis:100%;order:3;white-space:normal;}}
.quest-card.completed{border-color:var(--green);}
.quest-card.claimed{opacity:.5;}
.quest-info{flex:1;min-width:0;}
.quest-title{font-family:'Cinzel',serif;font-weight:700;font-size:18px;margin-bottom:2px;}
.quest-desc{font-size:13px;color:var(--parchment-dim);}
.quest-bar-track{width:100%;height:8px;border-radius:5px;background:var(--bg-panel-3);overflow:hidden;}
.quest-bar-fill{height:100%;background:linear-gradient(90deg,var(--arcane),var(--gold));transition:width .3s;}
.quest-progress-text{font-size:10.5px;color:var(--parchment-dim);margin-top:4px;}
.quest-reward{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--gold);white-space:nowrap;}
.quest-claim-btn{background:var(--arcane);color:#fff;border:none;border-radius:999px;padding:11px 22px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;}
.quest-claim-btn:disabled{background:var(--bg-panel-3);color:var(--parchment-dim);cursor:not-allowed;opacity:.6;}
.quest-claim-btn.claimed-label{background:none;color:var(--green);border:1px solid var(--green);}
.empty-note{font-size:12.5px;color:var(--parchment-dim);font-style:italic;}

.reward-card-thumb{width:34px;height:48px;border-radius:5px;background-size:cover;background-position:center;border:2px solid var(--gold);cursor:pointer;flex-shrink:0;}
#reward-card-preview{position:fixed;z-index:200;pointer-events:none;display:none;opacity:0;transition:opacity .12s ease;}
#reward-card-preview.show{display:block;opacity:1;}


/* ---------- chemin de progression ---------- */
#progression-road{margin:0 0 14px;}
.road-wrap{overflow-x:auto;padding-bottom:6px;}
.road{position:relative;min-width:760px;aspect-ratio:1000/250;}
.road svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.road-node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:3px solid var(--line);background:var(--bg-panel-3);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--parchment);padding:0;font-family:inherit;transition:transform .15s;}
.road-node:hover{transform:translate(-50%,-50%) scale(1.1);}
.road-node.done{background:var(--green);border-color:var(--green);color:#fff;}
.road-node.current{width:68px;height:68px;font-size:26px;background:radial-gradient(circle,var(--gold-bright,#f2cf5a),var(--gold));border-color:var(--gold-bright,#f2cf5a);color:#2a1c05;box-shadow:0 0 28px rgba(242,207,90,.75);animation:rdPulse 1.8s infinite;}
.road-node.locked{opacity:.65;}
.road-node.sel{outline:2px solid var(--gold);outline-offset:4px;}
@keyframes rdPulse{50%{box-shadow:0 0 38px rgba(242,207,90,1)}}
.road-lbl{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:12.5px;color:var(--parchment);pointer-events:none;}
.road-node.locked .road-lbl{color:var(--parchment-dim);}
.road-path-done{animation:rdDash 2s linear infinite;}
@keyframes rdDash{to{stroke-dashoffset:-26}}
@media (prefers-reduced-motion:reduce){.road-node.current,.road-path-done{animation:none;}}
#road-info{margin:0 0 14px;}
#road-info:empty{display:none;}
.road-info-card{border:1px solid var(--gold);border-radius:14px;padding:14px 18px;background:rgba(0,0,0,.22);display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.road-info-card .ri-t{font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--gold);}
.road-info-card .ri-d{font-size:13px;color:var(--parchment-dim);}
.road-info-card .ri-s{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--parchment-dim);}
@media (max-width:860px){
  #quests-layout{flex-direction:column;}
  #quests-side{width:100%;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px;}
  #quests-side .side-title{font-size:20px;}
  #quests-side #gold-chip{margin:0 0 0 auto;}
  .quest-tab{padding:8px 12px;font-size:13px;}
  #quests-summary{width:100%;margin-top:4px;}
}

/* ---------- Rendu de carte (identique à la boutique) ---------- */
.ncard{position:relative;flex-shrink:0;user-select:none;}
.ncard .nart-layer{position:absolute;background-size:cover;background-repeat:no-repeat;background-color:hsl(calc(var(--th, 252) + 0.9) calc(var(--ts-n, 1) * 21.2%) 25.9%);z-index:1;overflow:hidden;}
.ncard .nstat-wrap{position:absolute;aspect-ratio:1/1;z-index:8;}
.ncard .nstat-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.ncard .nstat-wrap .nstat-txt{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none;}
.ncard .nname-wrap{position:absolute;z-index:7;display:flex;align-items:center;justify-content:center;}
.ncard .nname-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.ncard .nname-wrap .nname-text{position:relative;z-index:1;left:auto;right:auto;top:auto;transform:none;width:84%;max-width:84%;}
.ncard .nname-text{position:absolute;z-index:8;text-align:center;font-family:'Cinzel',serif;font-weight:700;color:#2a1f10;text-shadow:0 1px 0 rgba(255,255,255,.25);pointer-events:none;overflow:hidden;white-space:nowrap;}
.ncard .nname-curved{position:absolute;z-index:8;left:50%;top:4%;width:80%;transform:translateX(-50%);
  display:flex;justify-content:center;align-items:flex-end;font-family:'Cinzel',serif;font-weight:700;
  color:#f2ead2;text-shadow:0 1px 3px rgba(0,0,0,.8), 0 0 2px rgba(0,0,0,.6);pointer-events:none;}
.ncard .nname-curved span{display:inline-block;transform-origin:center 180px;line-height:1;}
.ncard.n-big .nname-curved{font-size:19px;}
.ncard .ncard-text{position:absolute;z-index:8;color:hsl(calc(var(--th, 252) + 8) calc(var(--ts-n, 1) * 23.1%) 17.8%);text-align:center;overflow:hidden;pointer-events:none;white-space:pre-wrap;}
.ncard .nrarity-gem{position:absolute;z-index:8;aspect-ratio:231/297;object-fit:contain;}
.ncard.n-big .nrarity-gem.gem-custom{width:13.5%;aspect-ratio:679/834;}
.ncard.n-small .nrarity-gem.gem-custom{width:12.2%;aspect-ratio:679/834;}
.ncard .ntypeline{position:absolute;left:50%;transform:translateX(-50%);z-index:9;text-align:center;color:#3a2f1f;font-style:italic;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ncard .nlegendary-gem{position:absolute;z-index:8;aspect-ratio:231/297;object-fit:contain;}

.ncard.n-big{width:300px;height:423.2px;}
.ncard.n-big .nart-layer{left:11.1%;top:7.87%;width:79.31%;height:52.36%;}
.ncard.n-big.n-hero-card .nart-layer{height:83%;}
.ncard.n-big .nstat-wrap.n-mana{left:-6.5%;top:-6.5%;width:25.5%;}
.ncard.n-big .nstat-wrap.n-mana .nstat-txt{font-size:26px;}
.ncard.n-big .nname-wrap{left:50%;top:45.3%;width:92%;aspect-ratio:663/202;transform:translateX(-50%);}
.ncard.n-big .nname-wrap .nname-text{font-size:17px;transform:translateY(-13px);}
.ncard.n-big .ncard-text{left:16%;top:65.79%;width:68%;height:27.5%;font-size:13.5px;line-height:1.32;padding-top:4px;}
.ncard.n-big .nrarity-gem{left:50%;bottom:0.89%;width:12%;transform:translateX(-50%);}
.ncard.n-big .ntypeline{bottom:11.63%;width:72%;font-size:10.5px;}
.ncard.n-big .nlegendary-gem{left:50%;top:-3%;width:12%;transform:translateX(-50%);}
.ncard.n-big .nstat-wrap.n-atk{left:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-atk .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-end{right:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-end .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-art{right:6%;bottom:5%;width:15%;}
.ncard.n-big .nstat-wrap.n-art .nstat-txt{font-size:15px;}

.ncard.n-small{width:240px;height:240px;}
.ncard.n-small .nart-layer{left:20.47%;top:16.28%;width:58.05%;height:44.63%;}
.ncard.n-small .nstat-wrap.n-mana{left:-1%;top:-3.5%;width:22%;}
.ncard.n-small .nstat-wrap.n-mana .nstat-txt{font-size:16px;}
.ncard.n-small .nname-wrap{left:50%;top:57%;width:92%;aspect-ratio:663/202;transform:translateX(-50%);}
.ncard.n-small .nname-wrap .nname-text{font-size:14px;text-align:center;transform:translateY(-10px);}
.ncard.n-small .ncard-text{display:none;}
.ncard.n-small .nrarity-gem{left:50%;bottom:-0.5%;width:11%;transform:translateX(-50%);}
.ncard.n-small .ntypeline{bottom:15%;width:64%;font-size:8.5px;}
.ncard.n-small .nlegendary-gem{left:50%;top:-1%;width:11%;transform:translateX(-50%);}
.ncard.n-small .nstat-wrap.n-atk{left:6%;bottom:5%;width:22%;}
.ncard.n-small .nstat-wrap.n-atk .nstat-txt{font-size:19.5px;}
.ncard.n-small .nstat-wrap.n-end{right:6%;bottom:5%;width:22%;}

.reward-card-mini{width:44px;height:61.6px;overflow:visible;position:relative;cursor:pointer;flex-shrink:0;border-radius:6px;}
.reward-card-mini .ncard{position:absolute;top:0;left:0;transform:scale(0.1467);transform-origin:top left;}
#reward-card-preview .ncard{transform:scale(1.1);transform-origin:top left;box-shadow:0 16px 34px rgba(0,0,0,.65);}

/* ---------- Carte gagnée : elle se retourne (même animation que sur le plateau) ----------
   Elle reste affichée jusqu'à un clic n'importe où sur l'écran. */
.rw-reveal-overlay{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:rgba(5,4,10,0);opacity:0;cursor:pointer;transition:opacity .28s ease, background .28s ease;}
.rw-reveal-overlay.show{opacity:1;background:rgba(5,4,10,.7);}
.rw-reveal-overlay.closing{opacity:0;background:rgba(5,4,10,0);}
.rw-reveal-flip{width:260px;height:366px;perspective:1400px;transform:scale(.72);transition:transform .3s cubic-bezier(.34,1.4,.64,1);}
.rw-reveal-overlay.show .rw-reveal-flip{transform:scale(1);}
.rw-reveal-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d;}
.rw-reveal-inner.flipped{transform:rotateY(180deg);}
.rw-reveal-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-shadow:0 26px 60px rgba(0,0,0,.7), 0 0 70px hsl(calc(var(--th, 252) - 0.2) calc(var(--ts-a, 1) * 100%) calc(68% + var(--tl-a, 0%)) / .4);}
.rw-reveal-back{background:linear-gradient(145deg,hsl(calc(var(--th, 252) + 1.1) calc(var(--ts-n, 1) * 35.6%) 17.6%),hsl(calc(var(--th, 252) + 1.3) calc(var(--ts-n, 1) * 42.9%) 8.2%));border:2px solid var(--gold);font-size:64px;background-size:cover;background-position:center;}
.rw-reveal-front{transform:rotateY(180deg);overflow:visible;}
.rw-reveal-front .ncard{transform:scale(0.8667);}
#coffres-recap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99990;padding:20px;}
#coffres-recap.show{display:flex;}
#coffres-recap .box{background:var(--bg-panel-2);border:1px solid var(--gold);border-radius:14px;padding:20px 22px;max-width:460px;width:100%;max-height:80vh;overflow:auto;}
#coffres-recap h3{font-family:'Cinzel',serif;color:var(--gold);margin:0 0 12px;}
#coffres-recap ul{margin:0 0 14px;padding-left:18px;font-size:13px;line-height:1.6;}
.rw-reveal-hint{font-size:13px;color:var(--parchment-dim);letter-spacing:.04em;text-align:center;min-height:18px;opacity:0;transition:opacity .3s ease .7s;}
.rw-reveal-overlay.show .rw-reveal-hint{opacity:1;}
@media (max-width:640px), (max-height:560px){ .rw-reveal-flip{zoom:.75;} }
/* Velkrin : visible seulement quand l'onglet des coffres est ouvert */
#velkrin-float{position:fixed;left:14px;bottom:0;z-index:90;width:170px;height:177px;pointer-events:none;display:none;}
#velkrin-float.on{display:block;}
#velkrin-float #velkrin-portrait{position:absolute;inset:0;background:url('images/velkrin_base.png') bottom center/contain no-repeat;filter:drop-shadow(0 12px 20px rgba(0,0,0,.55));}
#velkrin-bubble{position:absolute;z-index:2;left:30px;bottom:calc(100% + 6px);width:max-content;max-width:min(380px,calc(100vw - 40px));font-family:'Cinzel',serif;font-size:13.5px;line-height:1.5;color:var(--parchment);background:var(--bg-panel-3);border:1px solid var(--gold,#d4af37);border-radius:14px;padding:12px 16px;box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;transform:translateY(10px) scale(.96);transform-origin:bottom left;transition:opacity .25s ease,transform .25s ease;pointer-events:none;}
#velkrin-bubble.show{opacity:1;transform:translateY(0) scale(1);}
#velkrin-bubble .bb-name{display:block;font-weight:700;font-size:11.5px;color:var(--gold);letter-spacing:.5px;margin-bottom:3px;}
#velkrin-bubble::after{content:'';position:absolute;left:30px;bottom:-9px;width:16px;height:16px;background:var(--bg-panel-3);border-right:1px solid var(--gold,#d4af37);border-bottom:1px solid var(--gold,#d4af37);transform:rotate(45deg);border-radius:0 0 4px 0;}
@media (max-width:760px){#velkrin-float{width:150px;height:156px;left:6px;}#velkrin-bubble{left:10px;font-size:12px;max-width:calc(100vw - 24px);}#velkrin-bubble::after{left:60px;}}
@media (prefers-reduced-motion:reduce){#velkrin-bubble{transition:opacity .01s;transform:none;}}
</style>

<script>

function escapeHtmlQuests(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const NCLASS_TO_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté',
  'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const NRARITY_TO_SLUG = {
  'Basique':'basique', 'Commune':'commun', 'Rare':'rare',
  'Épique':'epique', 'Mythique':'mythique'
};

function nEl(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function nImg(src, cls){ const i = document.createElement('img'); i.src = src; if(cls) i.className = cls; return i; }

function buildCurvedNameText(name, card, size){
  const wrap = nEl('div', 'nname-curved');
  wrap.style.top = (card.heroNameCurveTop ?? 4) + '%';
  const chars = (name || '').split('');
  const n = chars.length;
  const strength = (card.heroNameCurveStrength ?? 34) / 100;
  const maxAngle = Math.min(60, n * 4.2) * strength;
  const start = -maxAngle / 2;
  const step = n > 1 ? maxAngle / (n - 1) : 0;
  chars.forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    const angle = start + step * i;
    span.style.transform = `rotate(${angle.toFixed(2)}deg)`;
    wrap.appendChild(span);
  });
  applyNameSizing(wrap, card, size);
  return wrap;
}

function buildNewCardEl(card, size, opts={}){
  const root = nEl('div', `ncard n-${size}`);
  const slug = NCLASS_TO_SLUG[card.class] || 'neutre';
  const isHero = card.type==='Héros';
  const isRegion = card.type==='Région';
  const hasMana = !isHero && !isRegion;
  const isCreature = card.type==='Créature';
  const isArtifact = card.type==='Artefact';
  if(isHero) root.classList.add('n-hero-card');

  const posX = isHero ? (card.imagePosXHeroCard ?? 50) : size==='big' ? (card.imagePosX ?? 50) : (card.imagePosXSmall ?? 50);
  const posY = isHero ? (card.imagePosYHeroCard ?? 50) : size==='big' ? (card.imagePosY ?? 50) : (card.imagePosYSmall ?? 50);
  const zoom = isHero ? (card.imageZoomHeroCard ?? 100) : size==='big' ? (card.imageZoom ?? 100) : (card.imageZoomSmall ?? 100);
  const art = nEl('div', 'nart-layer');
  if(card.image && !(typeof applyNCardArtFree==='function' && applyNCardArtFree(art, card, isHero ? 'HeroCard' : size==='big' ? '' : 'Small'))){
    art.style.backgroundImage = `url('${card.image.replace(/'/g,'')}')`;
    art.style.backgroundPosition = `${posX}% ${posY}%`;
    art.style.backgroundSize = zoom>100 ? zoom+'%' : 'cover';
  }
  root.appendChild(art);


  if(hasMana){
    const w = nEl('div','nstat-wrap n-mana');
    w.appendChild(nImg('images/card/icon/bubble/mana.png'));
    const t = nEl('div','nstat-txt'); t.textContent = card.cost ?? 0;
    w.appendChild(t);
    root.appendChild(w);
  }
  if(isCreature){
    const wa = nEl('div','nstat-wrap n-atk');
    wa.appendChild(nImg('images/card/icon/bubble/attack.png'));
    const ta = nEl('div','nstat-txt'); ta.textContent = card.atk ?? 0;
    wa.appendChild(ta);
    root.appendChild(wa);

    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = card.hp ?? 0;
    we.appendChild(te);
    root.appendChild(we);
  }
  const isEdiCard = isArtifact && (card.subtypes||[]).some(s=>String(s).trim().toLowerCase()==='\u00e9difice');
  if(isEdiCard){ // Édifice : Endurance à la place des charges
    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = (card.hp ?? 0);
    we.appendChild(te);
    we.title = "Endurance de l'Édifice";
    root.appendChild(we);
  }
  if(isArtifact && !isEdiCard){
    const wf = nEl('div','nstat-wrap n-art');
    wf.appendChild(nImg('images/card/icon/bubble/artefact.png'));
    const t = nEl('div','nstat-txt'); t.textContent = (card.charges ?? 0)+'x';
    wf.appendChild(t);
    root.appendChild(wf);
  }

  if(isHero){
    root.appendChild(buildCurvedNameText(card.name || '', card, size));
  } else {
    const nw = nEl('div','nname-wrap');
    nw.appendChild(nImg('images/card/icon/bubble/nom.png'));
    const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
    applyNameSizing(nameEl, card, size);
    nw.appendChild(nameEl);
    root.appendChild(nw);
  }

  if(size==='big' && !isHero){
    const textEl = nEl('div','ncard-text'); textEl.textContent = card.text || '';
    root.appendChild(textEl);
  }

  if(card.subtypes && card.subtypes.length && !isHero){
    const tl = nEl('div','ntypeline'); tl.textContent = card.subtypes.join(' - ');
    root.appendChild(tl);
  }

  if(!isHero && (card.isLegendary || (card.rarity && NRARITY_TO_SLUG[card.rarity]))){ const __gs = card.isLegendary ? 'legendaire' : NRARITY_TO_SLUG[card.rarity];
    root.appendChild(typeof rarityGemImg==='function' ? rarityGemImg(card, __gs, 'nrarity-gem', nImg) : nImg(`images/card/icon/rare/${__gs}.png`, 'nrarity-gem'));
  }

  if(window.SCCardRender) SCCardRender.decorate(root, card, size, opts);
  return root;
}

function applyNameSizing(nameEl, card, size){
  if(card.nameWrap){
    nameEl.style.whiteSpace = 'normal';
    nameEl.style.height = 'auto';
    nameEl.style.overflow = 'visible';
  }
  if(card.nameFontAuto === false){
    nameEl.dataset.auto = '0';
    const scale = size==='small' ? (240/300) : 1;
    nameEl.style.fontSize = ((card.nameFontSize || 14) * scale) + 'px';
  } else {
    nameEl.dataset.auto = '1';
  }
}
function fitBoxFont(el, minSize){
  if(!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  const floor = minSize || 7;
  let attempts = 0;
  while(attempts < 26 && size > floor){
    const overflowH = el.scrollHeight > el.clientHeight + 1;
    const overflowW = el.scrollWidth > el.clientWidth + 1;
    if(!overflowH && !overflowW) break;
    size -= 0.5;
    el.style.fontSize = size + 'px';
    attempts++;
  }
}
function fitNewCard(rootEl){
  if(!rootEl) return;
  const nameEl = rootEl.querySelector('.nname-text') || rootEl.querySelector('.nname-curved');
  if(nameEl && nameEl.dataset.auto !== '0'){
    fitBoxFont(nameEl, 6);
  }
  fitBoxFont(rootEl.querySelector('.ncard-text'), 7);
}
function buildCardEl(card){
  const el = buildNewCardEl(card, 'big', {heroCardFrame:true});
  requestAnimationFrame(()=>fitNewCard(el));
  return el;
}

let allCardsCache = null;
async function ensureCardsCache(){
  if(!allCardsCache) allCardsCache = await loadAllCardsAcrossSets();
  return allCardsCache;
}

function showRewardCardPreview(card, ev){
  const box = document.getElementById('reward-card-preview');
  box.innerHTML = '';
  box.appendChild(buildCardEl(card));
  box.classList.add('show');
  moveRewardCardPreview(ev);
}
function moveRewardCardPreview(ev){
  const box = document.getElementById('reward-card-preview');
  const x = Math.min(ev.clientX + 20, window.innerWidth - 240);
  const y = Math.min(ev.clientY + 20, window.innerHeight - 320);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
function hideRewardCardPreview(){
  document.getElementById('reward-card-preview').classList.remove('show');
}

// Dos de carte équipé par le joueur (affiché avant que la carte ne se retourne).
async function getEquippedCardBackUrl(){
  try{
    const user = await scGetCurrentUser();
    if(!user) return 'images/card/back/dos-de-carte-base.png';
    const { data: prof } = await sb.from('profiles').select('equipped_card_back_id').eq('id', user.id).maybeSingle();
    if(!prof || !prof.equipped_card_back_id) return 'images/card/back/dos-de-carte-base.png';
    const { data } = await sb.from('card_backs').select('image_url').eq('id', prof.equipped_card_back_id).maybeSingle();
    return data ? data.image_url : 'images/card/back/dos-de-carte-base.png';
  }catch(e){ return 'images/card/back/dos-de-carte-base.png'; }
}

// Montre UNE carte gagnée : dos, puis elle se retourne ; reste à l'écran jusqu'à un clic n'importe où.
function revealOneRewardCard(card, backUrl, index, total){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'rw-reveal-overlay';
    const flip = document.createElement('div');
    flip.className = 'rw-reveal-flip';
    const inner = document.createElement('div');
    inner.className = 'rw-reveal-inner';
    const back = document.createElement('div');
    back.className = 'rw-reveal-face rw-reveal-back';
    if(backUrl) back.style.backgroundImage = `url('${String(backUrl).replace(/'/g,'')}')`;
    else back.textContent = '🃏';
    const front = document.createElement('div');
    front.className = 'rw-reveal-face rw-reveal-front';
    try{ front.appendChild(buildCardEl(card)); }catch(e){ console.error('Erreur affichage carte gagnée :', e, card); }
    inner.appendChild(back); inner.appendChild(front);
    flip.appendChild(inner);
    const hint = document.createElement('div');
    hint.className = 'rw-reveal-hint';
    hint.textContent = (total > 1 ? `Carte ${index + 1} / ${total} — ` : '') + 'Clique n\'importe où pour continuer';
    overlay.appendChild(flip);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);

    const openedAt = Date.now();
    let done = false;
    const finish = ()=>{
      if(done) return;
      if(Date.now() - openedAt < 350) return; // évite de fermer par un double-clic involontaire
      done = true;
      overlay.classList.remove('show');
      overlay.classList.add('closing');
      setTimeout(()=>{ overlay.remove(); resolve(); }, 300);
    };
    overlay.addEventListener('click', finish);
    requestAnimationFrame(()=>{
      overlay.classList.add('show');
      setTimeout(()=>{ inner.classList.add('flipped'); try{ fitNewCard(front.querySelector('.ncard')); }catch(e){} }, 220);
    });
  });
}

// Montre les cartes gagnées l'une après l'autre. `list` = [{ id, foil }].
let rewardRevealRunning = Promise.resolve();
function revealRewardCards(list){
  rewardRevealRunning = rewardRevealRunning.then(async ()=>{
    hideRewardCardPreview();
    await ensureCardsCache();
    const cards = [];
    (list || []).forEach(it=>{
      const base = allCardsCache && allCardsCache.find(c=>c.id===it.id);
      if(base) cards.push((it.foil || it.premium) ? { ...base, foil: !!it.foil, premium: !!it.premium } : base);
    });
    if(!cards.length) return;
    const backUrl = await getEquippedCardBackUrl();
    for(let i=0;i<cards.length;i++){
      await revealOneRewardCard(cards[i], backUrl, i, cards.length);
    }
  }).catch(e=>console.error('Erreur révélation des cartes :', e));
  return rewardRevealRunning;
}

function buildRewardEl(q){
  const rewards = q.rewards || [];
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;';
  rewards.forEach(r=>{
    if(r.type==='gold'){
      const el = document.createElement('span');
      el.innerHTML = `<span class="money-icon"></span> ${r.amount}`;
      wrap.appendChild(el);
    } else if(r.type==='card'){
      (r.card_ids||[]).forEach(cardId=>{
        const cardData = allCardsCache && allCardsCache.find(c=>c.id===cardId);
        if(cardData){
          const mini = document.createElement('div');
          mini.className = 'reward-card-mini';
          mini.appendChild(buildCardEl(cardData));
          mini.title = `${cardData.name} (${r.rarity}${r.premium&&r.foil?' Premium Foil':r.premium?' Premium':r.foil?' Foil':''})`;
          mini.onmouseenter = (ev)=>showRewardCardPreview(cardData, ev);
          mini.onmousemove = moveRewardCardPreview;
          mini.onmouseleave = hideRewardCardPreview;
          wrap.appendChild(mini);
        } else {
          const el = document.createElement('span');
          el.textContent = `🃏 ${r.rarity}${r.premium&&r.foil?' 💠✨':r.premium?' 💠':r.foil?' ✨':''}`;
          wrap.appendChild(el);
        }
      });
    } else if(r.type==='booster'){
      const el = document.createElement('span');
      el.textContent = `📦 ${r.count>1?r.count+'x ':''}Booster ${r.set==='base'?'(set de base)':'(dernier set)'}`;
      wrap.appendChild(el);
    }
  });
  return wrap;
}

function buildQuestCard(q){
  const pct = Math.min(100, Math.round((q.progress_count / q.target_count) * 100));
  const card = document.createElement('div');
  card.className = 'quest-card' + (q.completed ? ' completed' : '') + (q.claimed ? ' claimed' : '');
  const desc = q.assigned_class ? `${escapeHtml(q.description)} <strong style="color:var(--gold);">(${escapeHtml(q.assigned_class)})</strong>` : escapeHtml(q.description);
  const R=33, C=2*Math.PI*R, done = q.completed || q.claimed;
  card.innerHTML = `
    <div class="quest-ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${R}" fill="none" stroke="var(--bg-panel-3)" stroke-width="6"/><circle cx="38" cy="38" r="${R}" fill="none" stroke="${done?'var(--green)':'var(--gold)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 38 38)"/><text x="38" y="39" text-anchor="middle" dominant-baseline="middle" fill="var(--parchment)" font-size="15" font-weight="700" font-family="Inter,sans-serif">${q.progress_count}/${q.target_count}</text></svg></div>
    <div class="quest-info">
      <div class="quest-title">${escapeHtml(q.title)}</div>
      <div class="quest-desc">${desc}</div>
    </div>
  `;
  const rewardWrap = document.createElement('div');
  rewardWrap.className = 'quest-reward';
  rewardWrap.appendChild(buildRewardEl(q));
  card.appendChild(rewardWrap);
  const btn = document.createElement('button');
  if(q.claimed){
    btn.className = 'quest-claim-btn claimed-label';
    btn.textContent = '✓ Récupérée';
    btn.disabled = true;
  } else if(q.completed){
    btn.className = 'quest-claim-btn';
    btn.textContent = 'Récupérer';
    btn.onclick = ()=>claimQuest(q.instance_id, card);
  } else {
    btn.className = 'quest-claim-btn';
    btn.textContent = 'En cours';
    btn.disabled = true;
  }
  card.appendChild(btn);
  return card;
}

async function claimQuest(instanceId, cardEl){
  const { data, error } = await sb.rpc('claim_quest_reward', { p_instance_id: instanceId });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(data.error); return; }
  playSfx('quest-loot');
  hideRewardCardPreview();
  refreshGold();
  loadQuests();
  sb.rpc('progress_achievement', { p_condition_type: 'quests_completed_total', p_amount: 1 }).catch(()=>{});
  sb.rpc('progress_collection_achievements').catch(()=>{});
  // Cartes gagnées : elles se retournent à l'écran, un clic pour continuer.
  const won = [];
  (data.granted || []).forEach(g=>{
    if(g.type==='card') (g.card_ids || []).forEach(id=>won.push({ id, foil: !!g.foil, premium: !!g.premium }));
  });
  if(won.length) revealRewardCards(won);
  // Boosters gagnés : ils sont mis de côté (à ouvrir depuis la boutique), pas ouverts tout de suite.
  const boosters = (data.granted || []).filter(g=>g.type==='booster' && g.stocked);
  if(boosters.length){
    const lines = boosters.map(b=>`<li>📦 <b>${b.count > 1 ? b.count + ' boosters' : '1 booster'}${b.name ? ' « ' + escapeHtml(b.name) + ' »' : ''}</b> ajouté${b.count > 1 ? 's' : ''} à tes boosters — à ouvrir depuis la boutique</li>`).join('');
    // Si des cartes se retournent d'abord, le message attend derrière (il est sous l'animation).
    document.getElementById('coffres-recap-content').innerHTML = `<h3>Quête récupérée</h3><ul>${lines}</ul>`;
    document.getElementById('coffres-recap').classList.add('show');
  }
}

async function refreshGold(){
  const amount = await loadCurrency();
  document.getElementById('gold-amount').textContent = amount;
}

async function loadQuests(){
  const user = await scGetCurrentUser();
  if(!user){
    document.getElementById('daily-list').innerHTML = '<p class="empty-note">Connecte-toi pour voir tes quêtes.</p>';
    document.getElementById('weekly-list').innerHTML = '';
    document.getElementById('progression-list').innerHTML = '';
    return;
  }
  await ensureCardsCache();
  const { data, error } = await sb.rpc('get_active_quests');
  if(error || data.error){
    document.getElementById('daily-list').innerHTML = '<p class="empty-note">Impossible de charger les quêtes pour le moment.</p>';
    return;
  }
  const quests = data.quests || [];
  const daily = quests.filter(q=>q.category==='daily');
  const weekly = quests.filter(q=>q.category==='weekly');
  const progression = quests.filter(q=>q.category==='progression');

  const dailyEl = document.getElementById('daily-list');
  dailyEl.innerHTML = '';
  if(daily.length===0) dailyEl.innerHTML = '<p class="empty-note">Aucune quête journalière disponible pour l\'instant.</p>';
  daily.forEach(q=>dailyEl.appendChild(buildQuestCard(q)));

  const weeklyEl = document.getElementById('weekly-list');
  weeklyEl.innerHTML = '';
  if(weekly.length===0) weeklyEl.innerHTML = '<p class="empty-note">Aucune quête hebdomadaire disponible pour l\'instant.</p>';
  weekly.forEach(q=>weeklyEl.appendChild(buildQuestCard(q)));

  const progEl = document.getElementById('progression-list');
  progEl.innerHTML = '';
  if(progression.length===0) progEl.innerHTML = '<p class="empty-note">Toutes les quêtes de progression sont terminées pour l\'instant — reviens plus tard !</p>';
  progression.forEach(q=>progEl.appendChild(buildQuestCard(q)));

  // Pastilles « ! » : une quête terminée attend d'être récupérée dans cette catégorie.
  try{
    const claimable = (list)=>list.some(q=>q.completed && !q.claimed);
    [['daily',daily],['weekly',weekly],['progression',progression]].forEach(([tab,list])=>{
      const b = document.querySelector('.quest-tab[data-tab="'+tab+'"]');
      if(b) scNotif.mark(b, claimable(list), 'inline');
    });
  }catch(e){}
  // Résumé du jour dans le menu latéral
  try{
    const sum = document.getElementById('quests-summary');
    const dn = daily.filter(q=>q.completed || q.claimed).length;
    sum.innerHTML = daily.length ? `<div class="qs-lbl">Aujourd'hui</div><div class="qs-val">${dn} / ${daily.length}</div><div class="quest-bar-track"><div class="quest-bar-fill" style="width:${Math.round(dn/daily.length*100)}%;"></div></div><div class="qs-sub">quêtes journalières terminées</div>` : '';
  }catch(e){}
  loadProgressionRoad();
  refreshCoffresNotif();
}


// Chemin de progression : toutes les étapes (Débutant → Divinité), celles déjà faites, la quête en cours, celles à venir.
let __roadSel = null;
async function loadProgressionRoad(){
  const box = document.getElementById('progression-road');
  const info = document.getElementById('road-info');
  let res; try{ res = await sb.rpc('get_progression_path'); }catch(e){ res = null; }
  if(!res || res.error || !res.data || res.data.error || !Array.isArray(res.data.steps) || !res.data.steps.length){ box.innerHTML=''; info.innerHTML=''; return; }
  const steps = res.data.steps, n = steps.length;
  const pts = steps.map((st,i)=>({ x: 60 + i*(880/Math.max(1,n-1)), y: 112 + 52*Math.sin(i*1.15+0.6) }));
  const path = (upto)=>{ let d = 'M'+pts[0].x+' '+pts[0].y; for(let i=1;i<=upto;i++){ const mx=(pts[i-1].x+pts[i].x)/2; d += ` C${mx} ${pts[i-1].y} ${mx} ${pts[i].y} ${pts[i].x} ${pts[i].y}`; } return d; };
  let cur = steps.findIndex(st=>st.status==='current');
  if(cur < 0){ const lastDone = steps.map(st=>st.status).lastIndexOf('done'); cur = lastDone; }
  const nodes = steps.map((st,i)=>`<button class="road-node ${st.status}${__roadSel===st.id?' sel':''}" data-id="${st.id}" style="left:${pts[i].x/10}%;top:${pts[i].y/2.5}%;" title="${escapeHtmlQuests(st.title)}">${st.status==='done'?'✓':st.status==='current'?'⚔':'🔒'}<span class="road-lbl">${escapeHtmlQuests(st.title)}</span></button>`).join('');
  box.innerHTML = `<div class="road-wrap"><div class="road">
    <svg viewBox="0 0 1000 250" preserveAspectRatio="none"><path d="${path(n-1)}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${cur>0?`<path class="road-path-done" d="${path(cur)}" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="14 12" vector-effect="non-scaling-stroke"/>`:''}</svg>${nodes}</div></div>`;
  const stepById = {}; steps.forEach(st=>{ stepById[st.id]=st; });
  const showInfo = (id)=>{
    __roadSel = id;
    box.querySelectorAll('.road-node').forEach(b=>b.classList.toggle('sel', b.dataset.id===id));
    const st = stepById[id]; if(!st){ info.innerHTML=''; return; }
    const label = st.status==='done' ? 'Terminée' : st.status==='current' ? 'En cours' : 'À débloquer';
    info.innerHTML = '';
    const card = document.createElement('div'); card.className = 'road-info-card';
    card.innerHTML = `<div style="flex:1;min-width:200px;"><div class="ri-s">${label}</div><div class="ri-t">${escapeHtmlQuests(st.title)}</div><div class="ri-d">${escapeHtmlQuests(st.description||'')}</div></div>`;
    const rw = document.createElement('div'); rw.className = 'quest-reward'; rw.appendChild(buildRewardEl({rewards: st.rewards||[]}));
    card.appendChild(rw); info.appendChild(card);
  };
  box.querySelectorAll('.road-node').forEach(b=>b.addEventListener('click', ()=>showInfo(b.dataset.id)));
  if(__roadSel && stepById[__roadSel]) showInfo(__roadSel); else info.innerHTML = '';
}

// Pastille « ! » sur l'onglet « Les coffres de Velkrin » : une ouverture est possible dans la grille.
async function refreshCoffresNotif(){
  try{
    const tab = document.querySelector('.quest-tab[data-tab="coffres"]');
    if(tab) scNotif.mark(tab, await scNotif.hasCalendarTicket(), 'out');
  }catch(e){}
}

// Onglet « Les coffres de Velkrin » : visible seulement quand l'interrupteur serveur l'ouvre à tous.
// (L'administrateur ne le voit pas non plus avant ; il passe par la page d'administration.)
function showTab(name){
  const coffres = name === 'coffres';
  document.querySelectorAll('.quest-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.quest-section').forEach(sec => sec.classList.toggle('active', sec.dataset.pane === name));
  document.getElementById('quests-main').style.display = coffres ? 'none' : '';
  const view = document.getElementById('coffres-view');
  view.style.display = coffres ? 'block' : 'none';
  const vf = document.getElementById('velkrin-float'); if(vf) vf.classList.toggle('on', coffres);
  if(!coffres){ const vb = document.getElementById('velkrin-bubble'); if(vb) vb.classList.remove('show'); }
  if(coffres && !view.firstChild){
    view.innerHTML = '<iframe src="spellcraft-calendar.html?embed=1" title="Les coffres de Velkrin"></iframe>';
  }
  try{ history.replaceState(null, '', coffres ? '#coffres' : location.pathname + location.search); }catch(e){}
}
document.addEventListener('click', e => { const b = e.target.closest('.quest-tab'); if(b) showTab(b.dataset.tab); });
document.getElementById('coffres-recap-close').onclick = () => document.getElementById('coffres-recap').classList.remove('show');
window.addEventListener('message', e => {
  if(e.origin === location.origin && e.data && e.data.type === 'velkrin-say' && typeof e.data.text === 'string'){
    const vb = document.getElementById('velkrin-bubble'), vf = document.getElementById('velkrin-float');
    if(vb && vf && vf.classList.contains('on')){
      document.getElementById('velkrin-speech').textContent = e.data.text;
      vb.classList.add('show');
      clearTimeout(window.__vkT); window.__vkT = setTimeout(() => vb.classList.remove('show'), Math.min(15000, +e.data.ms || 7000));
    }
    return;
  }
  // La grille (iframe) demande à montrer les cartes gagnées dans la page entière, pas dans son petit cadre.
  // Récapitulatif d'une case (or, boosters ajoutés…) venant de la grille intégrée.
  if(e.origin === location.origin && e.data && e.data.type === 'coffres-recap' && typeof e.data.html === 'string'){
    refreshCoffresNotif();
    document.getElementById('coffres-recap-content').innerHTML = e.data.html;
    document.getElementById('coffres-recap').classList.add('show');
    return;
  }
  if(e.origin === location.origin && e.data && e.data.type === 'reveal-cards' && Array.isArray(e.data.cards)){
    revealRewardCards(e.data.cards.filter(c => c && typeof c.id === 'string'));
    return;
  }
  if(e.data && e.data.type === 'coffres-height'){
    const f = document.querySelector('#coffres-view iframe');
    if(f) f.style.height = Math.max(600, Math.ceil(e.data.h) + 20) + 'px';
  }
});
(async function initCoffresTab(){
  try{
    const { data } = await sb.from('app_flags').select('value').eq('key','calendar_enabled').maybeSingle();
    if(data && data.value === true){
      const cb = document.querySelector('.quest-tab[data-tab="coffres"]'); if(cb) cb.style.display = '';
      if(location.hash === '#coffres') showTab('coffres');
    }
  }catch(e){}
})();

initSpellcraftAuth();
playMenuMusicRotation(0.35);
refreshGold();
loadQuests();
sb.auth.onAuthStateChange(()=>{ refreshGold(); loadQuests(); });
</script>
</body>
</html>
