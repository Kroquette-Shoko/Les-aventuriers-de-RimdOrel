<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Spellcraft — Quêtes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-void:#0b0a12;
  --bg-panel:#171325;
  --bg-panel-2:#1f1a30;
  --bg-panel-3:#241f38;
  --parchment:#efe6c8;
  --parchment-dim:#d9cfae;
  --ink:#1c1830;
  --arcane:#7c5cff;
  --gold:#d4af37;
  --blood:#c23b3b;
  --green:#4a9d6b;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;}

#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 20px 60px;}

header{width:100%;max-width:1000px;display:flex;align-items:center;gap:14px;margin-bottom:18px;}
header a.back-link{font-size:11.5px;color:var(--parchment-dim);text-decoration:none;border:1px solid #3a3260;border-radius:8px;padding:6px 12px;}
header a.back-link:hover{border-color:var(--gold);color:var(--parchment);}
header h1{font-family:'Cinzel',serif;font-size:22px;color:var(--gold);margin:0;letter-spacing:1px;}
header .spacer{flex:1;}
.money-icon{width:22px;height:22px;display:inline-block;vertical-align:-6px;background-color:#f2c94c;-webkit-mask-image:url('images/money.png');mask-image:url('images/money.png');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;}
#gold-chip{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 14px;border-radius:18px;background:var(--bg-panel-2);border:1px solid #3a3260;margin-bottom:14px;}

main{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:26px;}
.quest-section h2{font-family:'Cinzel',serif;font-size:16px;color:var(--gold);margin:0 0 10px;letter-spacing:.5px;border-bottom:1px solid #3a3260;padding-bottom:6px;}
.quest-list{display:flex;flex-direction:column;gap:10px;}
.quest-card{background:var(--bg-panel);border:1px solid #3a3260;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:16px;}
.quest-card.completed{border-color:var(--green);}
.quest-card.claimed{opacity:.5;}
.quest-info{flex:1;min-width:0;}
.quest-title{font-weight:700;font-size:14px;margin-bottom:2px;}
.quest-desc{font-size:12px;color:var(--parchment-dim);margin-bottom:8px;}
.quest-bar-track{width:100%;height:8px;border-radius:5px;background:var(--bg-panel-3);overflow:hidden;}
.quest-bar-fill{height:100%;background:linear-gradient(90deg,var(--arcane),var(--gold));transition:width .3s;}
.quest-progress-text{font-size:10.5px;color:var(--parchment-dim);margin-top:4px;}
.quest-reward{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--gold);white-space:nowrap;}
.quest-claim-btn{background:var(--arcane);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-family:'Cinzel',serif;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;}
.quest-claim-btn:disabled{background:#3a3260;cursor:not-allowed;opacity:.6;}
.quest-claim-btn.claimed-label{background:none;color:var(--green);border:1px solid var(--green);}
.empty-note{font-size:12.5px;color:var(--parchment-dim);font-style:italic;}

.reward-card-thumb{width:34px;height:48px;border-radius:5px;background-size:cover;background-position:center;border:2px solid var(--gold);cursor:pointer;flex-shrink:0;}
#reward-card-preview{position:fixed;z-index:200;pointer-events:none;display:none;opacity:0;transition:opacity .12s ease;}
#reward-card-preview.show{display:block;opacity:1;}

/* ---------- Rendu de carte (identique à la boutique) ---------- */
.ncard{position:relative;flex-shrink:0;user-select:none;}
.ncard img.nframe-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.ncard img.nframe-half-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;}
.ncard .nart-layer{position:absolute;background-size:cover;background-repeat:no-repeat;background-color:#3a3450;z-index:1;overflow:hidden;}
.ncard .nstat-wrap{position:absolute;aspect-ratio:1/1;z-index:6;}
.ncard .nstat-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.ncard .nstat-wrap .nstat-txt{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);pointer-events:none;}
.ncard .nname-wrap{position:absolute;z-index:7;display:flex;align-items:center;justify-content:center;}
.ncard .nname-wrap img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.ncard .nname-wrap .nname-text{position:relative;z-index:1;left:auto;right:auto;top:auto;transform:none;width:84%;max-width:84%;}
.ncard .nname-text{position:absolute;z-index:8;text-align:center;font-family:'Cinzel',serif;font-weight:700;color:#2a1f10;text-shadow:0 1px 0 rgba(255,255,255,.25);pointer-events:none;overflow:hidden;white-space:nowrap;}
.ncard .ncard-text{position:absolute;z-index:8;color:#2a2338;text-align:center;overflow:hidden;pointer-events:none;white-space:pre-wrap;}
.ncard .nrarity-gem{position:absolute;z-index:8;aspect-ratio:231/297;}
.ncard .ntypeline{position:absolute;left:50%;transform:translateX(-50%);z-index:9;text-align:center;color:#3a2f1f;font-style:italic;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ncard .nlegendary-gem{position:absolute;z-index:8;aspect-ratio:231/297;}

.ncard.n-big{width:300px;height:423.2px;}
.ncard.n-big .nart-layer{left:11.1%;top:7.87%;width:79.31%;height:52.36%;}
.ncard.n-big .nstat-wrap.n-mana{left:-6.5%;top:-6.5%;width:25.5%;}
.ncard.n-big .nstat-wrap.n-mana .nstat-txt{font-size:26px;}
.ncard.n-big .nname-wrap{left:50%;top:45.3%;width:92%;aspect-ratio:663/202;transform:translateX(-50%);}
.ncard.n-big .nname-wrap .nname-text{font-size:17px;transform:translateY(-13px);}
.ncard.n-big .ncard-text{left:16%;top:65.79%;width:68%;height:27.5%;font-size:13.5px;line-height:1.32;padding-top:4px;}
.ncard.n-big .nrarity-gem{left:50%;bottom:0.89%;width:12%;transform:translateX(-50%);}
.ncard.n-big .ntypeline{bottom:11.63%;width:72%;font-size:10.5px;}
.ncard.n-big .nlegendary-gem{left:50%;top:-3%;width:12%;transform:translateX(-50%);}
.ncard.n-big .nstat-wrap.n-atk{left:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-atk .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-end{right:3%;bottom:1%;width:26%;}
.ncard.n-big .nstat-wrap.n-end .nstat-txt{font-size:27px;}
.ncard.n-big .nstat-wrap.n-art{right:6%;bottom:5%;width:15%;}
.ncard.n-big .nstat-wrap.n-art .nstat-txt{font-size:15px;}

.ncard.n-small{width:240px;height:240px;}
.ncard.n-small .nart-layer{left:20.47%;top:16.28%;width:58.05%;height:44.63%;}
.ncard.n-small .nstat-wrap.n-mana{left:-1%;top:-3.5%;width:22%;}
.ncard.n-small .nstat-wrap.n-mana .nstat-txt{font-size:16px;}
.ncard.n-small .nname-text{left:50%;top:62%;width:76%;transform:translateX(-50%);font-size:14px;height:20px;}
.ncard.n-small .ncard-text{display:none;}
.ncard.n-small .nrarity-gem{left:50%;bottom:-0.5%;width:11%;transform:translateX(-50%);}
.ncard.n-small .ntypeline{bottom:15%;width:64%;font-size:8.5px;}
.ncard.n-small .nlegendary-gem{left:50%;top:-1%;width:11%;transform:translateX(-50%);}
.ncard.n-small .nstat-wrap.n-atk{left:6%;bottom:5%;width:22%;}
.ncard.n-small .nstat-wrap.n-atk .nstat-txt{font-size:19.5px;}
.ncard.n-small .nstat-wrap.n-end{right:6%;bottom:5%;width:22%;}

.reward-card-mini{width:44px;height:61.6px;overflow:hidden;position:relative;cursor:pointer;flex-shrink:0;border-radius:6px;}
.reward-card-mini .ncard{position:absolute;top:0;left:0;transform:scale(0.1467);transform-origin:top left;}
#reward-card-preview .ncard{transform:scale(1.1);transform-origin:top left;box-shadow:0 16px 34px rgba(0,0,0,.65);}
</style>
</head>
<body>

<div id="app">
  <div id="gold-chip"><span class="money-icon"></span><span id="gold-amount">–</span></div>

  <main>
    <div class="quest-section">
      <h2>Quêtes journalières</h2>
      <div class="quest-list" id="daily-list"><p class="empty-note">Chargement…</p></div>
    </div>
    <div class="quest-section">
      <h2>Quête hebdomadaire</h2>
      <div class="quest-list" id="weekly-list"></div>
    </div>
    <div class="quest-section">
      <h2>Quête de progression</h2>
      <div class="quest-list" id="progression-list"></div>
    </div>
  </main>
</div>

<div id="reward-card-preview"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_TITLE = '📜 Quêtes';</script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-auth.js"></script>
<script src="spellcraft-catalog.js"></script>
<script src="spellcraft-economy.js"></script>
<script>

function escapeHtmlQuests(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const NCLASS_TO_SLUG_NOACCENT = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const CARD_TYPE_TO_TEMPLATE_SLUG = {
  'Créature':'creature', 'Artefact':'artefact', 'Sortilège':'spell', 'Piège':'trap', 'Région':'region', 'Héros':'hero'
};
function ncardRealPath(size, slug, cardClass, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[cardClass] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bigframe.png`;
  }
  // Format small : nouveau schéma disponible uniquement pour Créature et
  // Artefact pour l'instant — les autres types restent sur l'ancien
  // système en attendant leurs propres illustrations.
  if(size==='small' && (cardType==='Créature' || cardType==='Artefact') && NCLASS_TO_SLUG_NOACCENT[cardClass]){
    return `images/card/small%20frame/${NCLASS_TO_SLUG_NOACCENT[cardClass]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-smallframe.png`;
  }
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-${slug}.png`;
}
const NCLASS_TO_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté',
  'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'
};
const NRARITY_TO_SLUG = {
  'Basique':'basique', 'Commune':'commun', 'Rare':'rare',
  'Épique':'epique', 'Mythique':'mythique'
};
const HALF_FRAME_SLUG = {
  'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonté', 'Prima':'prima', 'Arcane':'arcane'
};
function ncardHalfFramePath(size, classSecondary, cardType, useHeroFrame){
  if(size==='big' && CARD_TYPE_TO_TEMPLATE_SLUG[cardType] && NCLASS_TO_SLUG_NOACCENT[classSecondary] && (cardType!=='Héros' || useHeroFrame)){
    return `images/card/big%20frame/${NCLASS_TO_SLUG_NOACCENT[classSecondary]}-${CARD_TYPE_TO_TEMPLATE_SLUG[cardType]}-bighalfframe.png`;
  }
  const slug = HALF_FRAME_SLUG[classSecondary];
  if(!slug) return null;
  const folder = size==='big' ? 'big%20frame' : 'small%20frame';
  return `images/card/${folder}/${size}-half-${slug}.png`;
}

function nEl(tag, cls){ const e = document.createElement(tag); if(cls) e.className = cls; return e; }
function nImg(src, cls){ const i = document.createElement('img'); i.src = src; if(cls) i.className = cls; return i; }

function buildNewCardEl(card, size, opts={}){
  const root = nEl('div', `ncard n-${size}`);
  const slug = NCLASS_TO_SLUG[card.class] || 'neutre';
  const isHero = card.type==='Héros';
  const isRegion = card.type==='Région';
  const hasMana = !isHero && !isRegion;
  const isCreature = card.type==='Créature';
  const isArtifact = card.type==='Artefact';

  const posX = size==='big' ? (card.imagePosX ?? 50) : (card.imagePosXSmall ?? 50);
  const posY = size==='big' ? (card.imagePosY ?? 50) : (card.imagePosYSmall ?? 50);
  const zoom = size==='big' ? (card.imageZoom ?? 100) : (card.imageZoomSmall ?? 100);
  const art = nEl('div', 'nart-layer');
  if(card.image){
    art.style.backgroundImage = `url('${card.image.replace(/'/g,'')}')`;
    art.style.backgroundPosition = `${posX}% ${posY}%`;
    art.style.backgroundSize = zoom>100 ? zoom+'%' : 'cover';
  }
  root.appendChild(art);

  root.appendChild(nImg(ncardRealPath(size, slug, card.class, card.type, opts.heroCardFrame), 'nframe-layer'));
  if(card.classSecondary){
    const halfPath = ncardHalfFramePath(size, card.classSecondary, card.type, opts.heroCardFrame);
    if(halfPath) root.appendChild(nImg(halfPath, 'nframe-half-layer'));
  }

  if(hasMana){
    const w = nEl('div','nstat-wrap n-mana');
    w.appendChild(nImg('images/card/icon/bubble/mana.png'));
    const t = nEl('div','nstat-txt'); t.textContent = card.cost ?? 0;
    w.appendChild(t);
    root.appendChild(w);
  }
  if(isCreature){
    const wa = nEl('div','nstat-wrap n-atk');
    wa.appendChild(nImg('images/card/icon/bubble/attack.png'));
    const ta = nEl('div','nstat-txt'); ta.textContent = card.atk ?? 0;
    wa.appendChild(ta);
    root.appendChild(wa);

    const we = nEl('div','nstat-wrap n-end');
    we.appendChild(nImg('images/card/icon/bubble/endurance.png'));
    const te = nEl('div','nstat-txt'); te.textContent = card.hp ?? 0;
    we.appendChild(te);
    root.appendChild(we);
  }
  if(isArtifact){
    const wf = nEl('div','nstat-wrap n-art');
    wf.appendChild(nImg('images/card/icon/bubble/artefact.png'));
    const t = nEl('div','nstat-txt'); t.textContent = (card.charges ?? 0)+'x';
    wf.appendChild(t);
    root.appendChild(wf);
  }

  if(size==='big'){
    const nw = nEl('div','nname-wrap');
    nw.appendChild(nImg('images/card/icon/bubble/nom.png'));
    const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
    applyNameSizing(nameEl, card, size);
    nw.appendChild(nameEl);
    root.appendChild(nw);
  } else {
    const nameEl = nEl('div','nname-text'); nameEl.textContent = card.name || '';
    applyNameSizing(nameEl, card, size);
    root.appendChild(nameEl);
  }

  if(size==='big'){
    const textEl = nEl('div','ncard-text'); textEl.textContent = card.text || '';
    root.appendChild(textEl);
  }

  if(card.subtypes && card.subtypes.length){
    const tl = nEl('div','ntypeline'); tl.textContent = card.subtypes.join(' - ');
    root.appendChild(tl);
  }

  if(card.rarity && NRARITY_TO_SLUG[card.rarity]){
    root.appendChild(nImg(`images/card/icon/rare/${NRARITY_TO_SLUG[card.rarity]}.png`, 'nrarity-gem'));
  }
  if(card.isLegendary){
    root.appendChild(nImg('images/card/icon/rare/legendaire.png', 'nlegendary-gem'));
  }

  return root;
}

function applyNameSizing(nameEl, card, size){
  if(card.nameWrap){
    nameEl.style.whiteSpace = 'normal';
    nameEl.style.height = 'auto';
    nameEl.style.overflow = 'visible';
  }
  if(card.nameFontAuto === false){
    nameEl.dataset.auto = '0';
    const scale = size==='small' ? (240/300) : 1;
    nameEl.style.fontSize = ((card.nameFontSize || 14) * scale) + 'px';
  } else {
    nameEl.dataset.auto = '1';
  }
}
function fitBoxFont(el, minSize){
  if(!el) return;
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize);
  const floor = minSize || 7;
  let attempts = 0;
  while(attempts < 26 && size > floor){
    const overflowH = el.scrollHeight > el.clientHeight + 1;
    const overflowW = el.scrollWidth > el.clientWidth + 1;
    if(!overflowH && !overflowW) break;
    size -= 0.5;
    el.style.fontSize = size + 'px';
    attempts++;
  }
}
function fitNewCard(rootEl){
  if(!rootEl) return;
  const nameEl = rootEl.querySelector('.nname-text');
  if(nameEl && nameEl.dataset.auto !== '0'){
    fitBoxFont(nameEl, 6);
  }
  fitBoxFont(rootEl.querySelector('.ncard-text'), 7);
}
function buildCardEl(card){
  const el = buildNewCardEl(card, 'big');
  requestAnimationFrame(()=>fitNewCard(el));
  return el;
}

let allCardsCache = null;
async function ensureCardsCache(){
  if(!allCardsCache) allCardsCache = await loadAllCardsAcrossSets();
  return allCardsCache;
}

function showRewardCardPreview(card, ev){
  const box = document.getElementById('reward-card-preview');
  box.innerHTML = '';
  box.appendChild(buildCardEl(card));
  box.classList.add('show');
  moveRewardCardPreview(ev);
}
function moveRewardCardPreview(ev){
  const box = document.getElementById('reward-card-preview');
  const x = Math.min(ev.clientX + 20, window.innerWidth - 240);
  const y = Math.min(ev.clientY + 20, window.innerHeight - 320);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
}
function hideRewardCardPreview(){
  document.getElementById('reward-card-preview').classList.remove('show');
}

function buildRewardEl(q){
  const rewards = q.rewards || [];
  const wrap = document.createElement('span');
  wrap.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;';
  rewards.forEach(r=>{
    if(r.type==='gold'){
      const el = document.createElement('span');
      el.innerHTML = `<span class="money-icon"></span> ${r.amount}`;
      wrap.appendChild(el);
    } else if(r.type==='card'){
      (r.card_ids||[]).forEach(cardId=>{
        const cardData = allCardsCache && allCardsCache.find(c=>c.id===cardId);
        if(cardData){
          const mini = document.createElement('div');
          mini.className = 'reward-card-mini';
          mini.appendChild(buildCardEl(cardData));
          mini.title = `${cardData.name} (${r.rarity}${r.foil?' Foil':''})`;
          mini.onmouseenter = (ev)=>showRewardCardPreview(cardData, ev);
          mini.onmousemove = moveRewardCardPreview;
          mini.onmouseleave = hideRewardCardPreview;
          wrap.appendChild(mini);
        } else {
          const el = document.createElement('span');
          el.textContent = `🃏 ${r.rarity}${r.foil?' ✨':''}`;
          wrap.appendChild(el);
        }
      });
    } else if(r.type==='booster'){
      const el = document.createElement('span');
      el.textContent = `📦 ${r.count>1?r.count+'x ':''}Booster ${r.set==='base'?'(set de base)':'(dernier set)'}`;
      wrap.appendChild(el);
    }
  });
  return wrap;
}

function buildQuestCard(q){
  const pct = Math.min(100, Math.round((q.progress_count / q.target_count) * 100));
  const card = document.createElement('div');
  card.className = 'quest-card' + (q.completed ? ' completed' : '') + (q.claimed ? ' claimed' : '');
  const desc = q.assigned_class ? `${escapeHtml(q.description)} <strong style="color:var(--gold);">(${escapeHtml(q.assigned_class)})</strong>` : escapeHtml(q.description);
  card.innerHTML = `
    <div class="quest-info">
      <div class="quest-title">${escapeHtml(q.title)}</div>
      <div class="quest-desc">${desc}</div>
      <div class="quest-bar-track"><div class="quest-bar-fill" style="width:${pct}%;"></div></div>
      <div class="quest-progress-text">${q.progress_count} / ${q.target_count}</div>
    </div>
  `;
  const rewardWrap = document.createElement('div');
  rewardWrap.className = 'quest-reward';
  rewardWrap.appendChild(buildRewardEl(q));
  card.appendChild(rewardWrap);
  const btn = document.createElement('button');
  if(q.claimed){
    btn.className = 'quest-claim-btn claimed-label';
    btn.textContent = '✓ Récupérée';
    btn.disabled = true;
  } else if(q.completed){
    btn.className = 'quest-claim-btn';
    btn.textContent = 'Récupérer';
    btn.onclick = ()=>claimQuest(q.instance_id, card);
  } else {
    btn.className = 'quest-claim-btn';
    btn.textContent = 'En cours';
    btn.disabled = true;
  }
  card.appendChild(btn);
  return card;
}

async function claimQuest(instanceId, cardEl){
  const { data, error } = await sb.rpc('claim_quest_reward', { p_instance_id: instanceId });
  if(error){ alert('Erreur : ' + error.message); return; }
  if(data.error){ alert(data.error); return; }
  playSfx('quest-loot');
  refreshGold();
  loadQuests();
  sb.rpc('progress_achievement', { p_condition_type: 'quests_completed_total', p_amount: 1 }).catch(()=>{});
  sb.rpc('progress_collection_achievements').catch(()=>{});
}

async function refreshGold(){
  const amount = await loadCurrency();
  document.getElementById('gold-amount').textContent = amount;
}

async function loadQuests(){
  const user = await scGetCurrentUser();
  if(!user){
    document.getElementById('daily-list').innerHTML = '<p class="empty-note">Connecte-toi pour voir tes quêtes.</p>';
    document.getElementById('weekly-list').innerHTML = '';
    document.getElementById('progression-list').innerHTML = '';
    return;
  }
  await ensureCardsCache();
  const { data, error } = await sb.rpc('get_active_quests');
  if(error || data.error){
    document.getElementById('daily-list').innerHTML = '<p class="empty-note">Impossible de charger les quêtes pour le moment.</p>';
    return;
  }
  const quests = data.quests || [];
  const daily = quests.filter(q=>q.category==='daily');
  const weekly = quests.filter(q=>q.category==='weekly');
  const progression = quests.filter(q=>q.category==='progression');

  const dailyEl = document.getElementById('daily-list');
  dailyEl.innerHTML = '';
  if(daily.length===0) dailyEl.innerHTML = '<p class="empty-note">Aucune quête journalière disponible pour l\'instant.</p>';
  daily.forEach(q=>dailyEl.appendChild(buildQuestCard(q)));

  const weeklyEl = document.getElementById('weekly-list');
  weeklyEl.innerHTML = '';
  if(weekly.length===0) weeklyEl.innerHTML = '<p class="empty-note">Aucune quête hebdomadaire disponible pour l\'instant.</p>';
  weekly.forEach(q=>weeklyEl.appendChild(buildQuestCard(q)));

  const progEl = document.getElementById('progression-list');
  progEl.innerHTML = '';
  if(progression.length===0) progEl.innerHTML = '<p class="empty-note">Toutes les quêtes de progression sont terminées pour l\'instant — reviens plus tard !</p>';
  progression.forEach(q=>progEl.appendChild(buildQuestCard(q)));
}

initSpellcraftAuth();
playMusic('menu', {loop:true, volume:0.35});
refreshGold();
loadQuests();
sb.auth.onAuthStateChange(()=>{ refreshGold(); loadQuests(); });
</script>
</body>
</html>
