<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>Spellcraft — Succès</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg-void:#0b0a12; --bg-panel:#171325; --bg-panel-2:#1f1a30; --bg-panel-3:#241f38;
  --parchment:#efe6c8; --parchment-dim:#d9cfae; --ink:#1c1830;
  --arcane:#7c5cff; --gold:#d4af37; --blood:#c23b3b; --frost:#4fb3d9; --green:#4a9d6b; --grey:#8a7f6a;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;min-height:100vh;}
h1,h2,h3{font-family:'Cinzel',serif;color:var(--gold);margin:0;}
a{color:var(--frost);}

.wrap{max-width:1000px;margin:0 auto;padding:28px 20px;}
.summary{text-align:center;margin-bottom:28px;color:var(--parchment-dim);font-size:14px;}
.summary b{color:var(--gold);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.card{background:var(--bg-panel);border:1.5px solid #3a3260;border-radius:14px;padding:16px;display:flex;gap:14px;
  position:relative;overflow:hidden;transition:border-color .15s ease;}
.card.completed{border-color:var(--gold);}
.card.locked{opacity:.55;}
.badge-img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg-panel-2);
  border:2.5px solid #3a3260;}
.card.completed .badge-img{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.5);}
.badge-placeholder{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:var(--bg-panel-2);
  border:2.5px solid #3a3260;display:flex;align-items:center;justify-content:center;font-size:24px;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:14.5px;color:var(--parchment);}
.card-desc{font-size:11.5px;color:var(--parchment-dim);margin:4px 0 8px;line-height:1.4;}
.progress-bar-wrap{height:8px;background:var(--bg-panel-2);border-radius:5px;overflow:hidden;margin-bottom:4px;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--frost),var(--arcane));border-radius:5px;transition:width .3s ease;}
.card.completed .progress-bar-fill{background:var(--gold);}
.progress-text{font-size:10.5px;color:var(--parchment-dim);}
.claim-btn{margin-top:8px;background:var(--gold);color:var(--ink);border:none;border-radius:7px;padding:6px 12px;
  font-family:'Cinzel',serif;font-weight:700;font-size:11.5px;cursor:pointer;align-self:flex-start;}
.claim-btn:hover{filter:brightness(1.1);}
.claimed-tag{margin-top:6px;font-size:11px;color:var(--green);font-family:'Cinzel',serif;font-weight:700;}
.empty-state{text-align:center;padding:60px 20px;color:var(--parchment-dim);}
.btn{background:var(--bg-panel-3);border:1.5px solid #3a3260;color:var(--parchment);border-radius:8px;
  padding:8px 16px;font-family:'Cinzel',serif;font-size:12.5px;font-weight:700;cursor:pointer;}
.btn:hover{border-color:var(--gold);}
.btn.small{padding:6px 14px;font-size:11.5px;}
#leaderboard-wrap{max-width:520px;margin:0 auto;}
.lb-row{display:flex;align-items:center;gap:14px;background:var(--bg-panel);border:1.5px solid #3a3260;border-radius:10px;
  padding:10px 16px;margin-bottom:8px;}
.lb-row .lb-rank{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:15px;width:32px;text-align:center;flex-shrink:0;}
.lb-row .lb-class-icon{width:24px;height:24px;flex-shrink:0;object-fit:contain;}
.lb-row .lb-name{flex:1;font-weight:600;}
.lb-row .lb-wins{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);}
.lb-row.lb-top1{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.3);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel-3);
  border:1.5px solid var(--gold);border-radius:10px;padding:14px 20px;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:99;text-align:center;font-family:'Cinzel',serif;font-size:13px;
  max-width:min(90vw,420px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="wrap">
  <div id="view-toggle-row" style="text-align:center;margin-bottom:16px;">
    <button class="btn small" id="view-toggle-btn" onclick="toggleLeaderboardView()">🏆 Voir le classement</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="ach-grid"></div>
  <div id="leaderboard-wrap" style="display:none;"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_TITLE = '🏆 Haut fait';</script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
let achievements = [];

async function loadAchievements(){
  const { data, error } = await sb.rpc('get_achievements');
  if(error || data.error){
    document.getElementById('ach-grid').innerHTML = `<div class="empty-state">Connecte-toi pour voir tes succès.</div>`;
    return;
  }
  achievements = data.achievements || [];
  renderSummary();
  renderGrid();
}

function renderSummary(){
  const done = achievements.filter(a=>a.completed).length;
  document.getElementById('summary').innerHTML = achievements.length
    ? `<b>${done}</b> / ${achievements.length} succès débloqués`
    : '';
}

function renderGrid(){
  const grid = document.getElementById('ach-grid');
  if(achievements.length===0){
    grid.innerHTML = `<div class="empty-state">Aucun succès disponible pour l'instant.</div>`;
    return;
  }
  grid.innerHTML = achievements.map(a=>{
    const pct = Math.min(100, Math.round((a.progress_count / a.target_count) * 100));
    const stateClass = a.completed ? 'completed' : (a.progress_count>0 ? '' : 'locked');
    const badge = a.image_url
      ? `<img class="badge-img" src="${a.image_url}">`
      : `<div class="badge-placeholder">${a.completed ? '🏆' : '❔'}</div>`;
    let actionHtml = '';
    if(a.completed && !a.claimed){
      actionHtml = `<button class="claim-btn" onclick="claimAchievement('${a.user_achievement_id}')">🎁 Réclamer</button>`;
    } else if(a.claimed){
      actionHtml = `<div class="claimed-tag">✓ Récompense obtenue</div>`;
    }
    return `
      <div class="card ${stateClass}">
        ${badge}
        <div class="card-body">
          <div class="card-name">${escapeHtml(a.name)}</div>
          <div class="card-desc">${escapeHtml(a.description || '')}</div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
          <div class="progress-text">${a.progress_count} / ${a.target_count}</div>
          ${actionHtml}
        </div>
      </div>
    `;
  }).join('');
}

let showingLeaderboard = false;
async function toggleLeaderboardView(){
  showingLeaderboard = !showingLeaderboard;
  document.getElementById('summary').style.display = showingLeaderboard ? 'none' : 'block';
  document.getElementById('ach-grid').style.display = showingLeaderboard ? 'none' : 'grid';
  document.getElementById('leaderboard-wrap').style.display = showingLeaderboard ? 'block' : 'none';
  document.getElementById('view-toggle-btn').textContent = showingLeaderboard ? '🏅 Voir mes succès' : '🏆 Voir le classement';
  if(showingLeaderboard) await loadLeaderboard();
}
const CLASS_SLUG_NOACCENT = {'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'};

async function loadLeaderboard(){
  const wrap = document.getElementById('leaderboard-wrap');
  wrap.innerHTML = `<div class="empty-state">Chargement...</div>`;
  const { data, error } = await sb.rpc('get_leaderboard');
  if(error || data.error || !data.leaderboard || data.leaderboard.length===0){
    wrap.innerHTML = `<div class="empty-state">Aucune victoire enregistrée pour l'instant.</div>`;
    return;
  }
  wrap.innerHTML = data.leaderboard.map((p,i)=>{
    const slug = CLASS_SLUG_NOACCENT[p.favorite_class];
    const classIcon = slug ? `<img src="images/${slug}.png" class="lb-class-icon" title="${escapeHtml(p.favorite_class)}" alt="${escapeHtml(p.favorite_class)}">` : '';
    return `
    <div class="lb-row ${i===0?'lb-top1':''}">
      <div class="lb-rank">${i+1}</div>
      ${classIcon}
      <div class="lb-name">${escapeHtml(p.username)}</div>
      <div class="lb-wins">${p.total_wins} victoire${p.total_wins>1?'s':''}</div>
    </div>
  `;
  }).join('');
}

const GEM_NAMES = {Volonté:'Rubis', Aube:'Diamant', 'Crépuscule':'Obsidienne', Arcane:'Saphir', Prima:'Émeraude', Opale:'Opale'};

async function describeGrantedRewards(granted){
  const parts = [];
  for(const g of granted){
    if(g.type==='gold') parts.push(`+${g.amount} pièces d'or`);
    else if(g.type==='fragment') parts.push(`+${g.amount} fragments ${GEM_NAMES[g.class]||g.class}`);
    else if(g.type==='booster') parts.push(`${g.count} booster${g.count>1?'s':''}`);
    else if(g.type==='card'){
      let name = 'une carte';
      try{
        const { data } = await sb.from('cards').select('data').eq('id', g.card_id).single();
        if(data && data.data && data.data.name) name = `« ${data.data.name} »`;
      }catch(e){}
      parts.push(name);
    }
  }
  return parts.length ? parts.join(', ') : 'aucune récompense';
}

async function claimAchievement(id){
  const { data, error } = await sb.rpc('claim_achievement_reward', { p_user_achievement_id: id });
  if(error || data.error){ showToast('Impossible de réclamer cette récompense.'); return; }
  const detail = await describeGrantedRewards(data.granted || []);
  showToast(`Récompense obtenue : ${detail}`);
  await loadAchievements();
  sb.rpc('progress_collection_achievements').catch(()=>{});
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2600);
}

initSpellcraftAuth().then(loadAchievements);
</script>
</body>
</html>
