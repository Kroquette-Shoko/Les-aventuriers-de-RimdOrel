<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>Rimd'Orël — Succès</title>
<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu.
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
/* Le reste des jetons de couleur (--bg-void, --gold, --arcane, etc.)
   vient de spellcraft-ui-kit.css et suit le thème actif.
   On ne garde ici que ce qui est propre à cette page. */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px;}
#app > .sc-topbar{margin:0 -20px 20px;width:calc(100% + 40px);}

.wrap{width:100%;max-width:1000px;margin:0 auto;padding:10px 0 0;}
#view-toggle-row{text-align:center;margin-bottom:16px;}
.summary{text-align:center;margin-bottom:28px;color:var(--parchment-dim);font-size:14px;}
.summary b{color:var(--gold);}
.summary-bar-wrap{max-width:420px;margin:10px auto 0;height:16px;border-radius:8px;background:var(--bg-panel-2, #241d3a);border:1px solid var(--line, #3a3260);overflow:hidden;}
.summary-bar-fill{height:100%;border-radius:8px 0 0 8px;background:linear-gradient(90deg, #a8842f, var(--gold));transition:width .4s ease;}
#category-tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;}
.cat-tab{background:var(--bg-panel);border:1.5px solid var(--line);border-radius:20px;padding:7px 16px;
  font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:var(--parchment-dim);cursor:pointer;
  white-space:nowrap;transition:border-color .15s ease,color .15s ease;}
.cat-tab:hover{border-color:var(--gold);color:var(--parchment);}
.cat-tab.active{border-color:var(--gold);color:var(--gold);background:var(--bg-panel-3);}
.cat-tab .cat-count{opacity:.7;font-weight:400;font-size:10.5px;margin-left:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;align-items:start;}
.card{background:var(--bg-panel);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;
  position:relative;transition:border-color .15s ease;}
.card.completed{border-color:var(--gold);}
.card.locked{opacity:.55;}
.badge-img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--bg-panel-2);
  border:2.5px solid var(--line);}
.card.completed .badge-img{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.5);}
.badge-placeholder{width:64px;height:64px;border-radius:50%;flex-shrink:0;background:var(--bg-panel-2);
  border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:14.5px;color:var(--parchment);}
.card-desc{font-size:11.5px;color:var(--parchment-dim);margin:4px 0 8px;line-height:1.4;}
.card-reward{font-size:11px;color:var(--gold);margin:0 0 10px;line-height:1.4;}
.progress-bar-wrap{height:8px;background:var(--bg-panel-2);border-radius:5px;overflow:hidden;margin-bottom:4px;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--frost),var(--arcane));border-radius:5px;transition:width .3s ease;}
.card.completed .progress-bar-fill{background:var(--gold);}
.progress-text{font-size:10.5px;color:var(--parchment-dim);}
.claim-btn{margin-top:8px;background:var(--gold);color:var(--ink);border:none;border-radius:7px;padding:6px 12px;
  font-family:'Cinzel',serif;font-weight:700;font-size:11.5px;cursor:pointer;align-self:flex-start;}
.claim-btn:hover{filter:brightness(1.1);}
.claimed-tag{margin-top:6px;font-size:11px;color:var(--green);font-family:'Cinzel',serif;font-weight:700;}
.empty-state{text-align:center;padding:60px 20px;color:var(--parchment-dim);}
#leaderboard-wrap{max-width:520px;margin:0 auto;}
.lb-row{display:flex;align-items:center;gap:14px;background:var(--bg-panel);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 16px;margin-bottom:8px;}
.lb-row .lb-rank{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:15px;width:32px;text-align:center;flex-shrink:0;}
.lb-row .lb-class-icon{width:24px;height:24px;flex-shrink:0;object-fit:contain;}
.lb-row .lb-name{flex:1;font-weight:600;}
.lb-row .lb-wins{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);}
.lb-row.lb-top1{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.3);}
.lb-row .lb-league{font-family:'Cinzel',serif;font-size:11px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--parchment-dim);white-space:nowrap;}
.lb-row .lb-rating{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);min-width:64px;text-align:right;}
.lb-row .lb-record{font-size:11px;color:var(--parchment-dim);min-width:58px;text-align:right;}
.lb-row.lb-me{border-color:#4aa3ff;}
#lb-season-head{text-align:center;font-family:'Cinzel',serif;color:var(--gold);margin:0 0 10px;font-size:15px;}
#lb-me-card{background:var(--bg-panel);border:1.5px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
#lb-me-card .lb-me-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
#lb-me-card .lb-me-league{font-family:'Cinzel',serif;font-weight:700;font-size:18px;color:var(--gold);}
#lb-me-card .lb-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);margin:8px 0 4px;overflow:hidden;}
#lb-me-card .lb-bar > span{display:block;height:100%;background:var(--gold);}
#lb-me-card .lb-sub{font-size:11.5px;color:var(--parchment-dim);}
#lb-me-card .lb-recent{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
#lb-me-card .lb-chip{font-size:11px;padding:1px 7px;border-radius:7px;font-weight:700;}
#lb-me-card .lb-chip.up{background:rgba(74,157,107,.25);color:#7fd6a0;}
#lb-me-card .lb-chip.down{background:rgba(224,88,79,.25);color:#f0908a;}
#lb-reward{background:rgba(212,175,55,.12);border:1.5px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#lb-rules{font-size:11.5px;color:var(--parchment-dim);margin-top:14px;line-height:1.5;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel-3);
  border:1.5px solid var(--gold);border-radius:10px;padding:14px 20px;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:99;text-align:center;font-family:'Cinzel',serif;font-size:13px;
  max-width:min(90vw,420px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app">
  <div class="sc-topbar">
    <a href="spellcraft-hub.html" class="sc-topbar-back" title="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Menu principal
    </a>
    <span class="sc-topbar-title">🏆 Hauts faits</span>
    <div class="sc-topbar-right">
      <div id="sc-auth-slot"></div>
      <div id="sc-options-slot"></div>
    </div>
  </div>

  <div class="wrap">
    <h1 class="sc-h1" style="text-align:center;margin-bottom:18px;">Hauts faits</h1>
    <div id="view-toggle-row">
      <button class="sc-btn sc-btn-ghost sc-btn-sm" id="view-toggle-btn" onclick="toggleLeaderboardView()">🏆 Voir le classement</button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="category-tabs"></div>
    <div class="grid" id="ach-grid"></div>
    <div id="leaderboard-wrap" style="display:none;"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_DISABLED = true;</script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
let achievements = [];

// Catégories affichées en sous-onglets, dans cet ordre. Un succès sans
// catégorie reconnue (ancien succès jamais reclassé) tombe dans "Autre".
const CATEGORY_ORDER = ['wins','cards_class','boosters','crafting','card_types','damage','hp','turn_cards','quests','secret'];
const CATEGORY_LABELS = {
  wins: '🏆 Partie gagnée',
  cards_class: '🔮 Carte jouée (par source)',
  boosters: '🎁 Ouverture de booster',
  crafting: '🔨 Fabrication',
  card_types: '📜 Type de carte jouée',
  damage: '⚔️ Dégâts',
  hp: '❤️ Score de PV atteint',
  turn_cards: '📚 Cartes jouées en un tour',
  quests: '📜 Quêtes terminées',
  secret: '❔ Secret'
};
let activeCategory = null;
let CARD_BACK_NAMES = {}; // id -> nom, chargé une fois pour afficher les récompenses "dos de carte"

async function loadAchievements(){
  const { data, error } = await sb.rpc('get_achievements');
  if(error || !data || data.error){
    document.getElementById('ach-grid').innerHTML = `<div class="empty-state">Connecte-toi pour voir tes succès.</div>`;
    return;
  }
  achievements = data.achievements || [];
  if(!activeCategory){
    const firstWithItems = CATEGORY_ORDER.find(c=>achievements.some(a=>(a.category||'autre')===c));
    activeCategory = firstWithItems || 'autre';
  }
  // Noms des dos de carte utilisés en récompense — chargés une seule fois
  // pour pouvoir afficher "dos de carte « X »" sans requête par carte.
  if(Object.keys(CARD_BACK_NAMES).length===0){
    const backIds = [...new Set(achievements.flatMap(a=>(a.rewards||[]).filter(r=>r.type==='card_back').map(r=>r.card_back_id)))];
    if(backIds.length>0){
      const { data: backs } = await sb.from('card_backs').select('id, name').in('id', backIds);
      (backs||[]).forEach(b=>{ CARD_BACK_NAMES[b.id] = b.name; });
    }
  }
  renderSummary();
  renderCategoryTabs();
  renderGrid();
}

function renderSummary(){
  const done = achievements.filter(a=>a.completed).length;
  const total = achievements.length;
  if(!total){ document.getElementById('summary').innerHTML = ''; return; }
  const pct = Math.round((done/total)*100);
  document.getElementById('summary').innerHTML = `
    <div><b>${done}</b> / ${total} succès débloqués (${pct}%)</div>
    <div class="summary-bar-wrap"><div class="summary-bar-fill" style="width:${pct}%;"></div></div>
  `;
}

function renderCategoryTabs(){
  const wrap = document.getElementById('category-tabs');
  const present = CATEGORY_ORDER.filter(c=>achievements.some(a=>(a.category||'autre')===c));
  if(achievements.some(a=>!a.category)) present.push('autre');
  if(present.length<=1){ wrap.innerHTML=''; return; }
  wrap.innerHTML = present.map(c=>{
    const list = achievements.filter(a=>(a.category||'autre')===c);
    const done = list.filter(a=>a.completed).length;
    const label = CATEGORY_LABELS[c] || 'Autre';
    return `<button class="cat-tab ${c===activeCategory?'active':''}" onclick="switchCategory('${c}')">${label}<span class="cat-count">${done}/${list.length}</span></button>`;
  }).join('');
}

function switchCategory(c){
  activeCategory = c;
  renderCategoryTabs();
  renderGrid();
}

const REWARD_BOOSTER_SET_LABEL = {base:'Édition de base', latest:'dernier set sorti', 'set-classique':'Set classique'};
// Aperçu synchrone des récompenses (affiché sur chaque carte) — pour une
// carte précise par id, on ne connaît pas encore son nom sans requête
// réseau, donc on reste générique ("une carte précise") : le nom exact est
// révélé dans le toast au moment de la réclamer.
function describeRewardsPreview(rewards){
  if(!rewards || rewards.length===0) return 'Juste le badge';
  return rewards.map(r=>{
    if(r.type==='gold') return `+${r.amount} pièces d'or`;
    if(r.type==='fragment') return `+${r.amount} fragments ${GEM_NAMES[r.class]||r.class}`;
    if(r.type==='booster') return `${r.count} booster${r.count>1?'s':''} (${REWARD_BOOSTER_SET_LABEL[r.set]||r.set})`;
    if(r.type==='card') return r.card_id ? 'une carte précise' : `une carte ${r.rarity||''}${r.foil?' brillante':''}`.trim();
    if(r.type==='card_back') return `dos de carte « ${CARD_BACK_NAMES[r.card_back_id] || '?'} »`;
    return null;
  }).filter(Boolean).join(', ') || 'Juste le badge';
}

function renderGrid(){
  const grid = document.getElementById('ach-grid');
  if(achievements.length===0){
    grid.innerHTML = `<div class="empty-state">Aucun succès disponible pour l'instant.</div>`;
    return;
  }
  const visible = achievements.filter(a=>(a.category||'autre')===activeCategory);
  if(visible.length===0){
    grid.innerHTML = `<div class="empty-state">Aucun succès dans cette catégorie pour l'instant.</div>`;
    return;
  }
  grid.innerHTML = visible.map(a=>{
    const pct = Math.min(100, Math.round((a.progress_count / a.target_count) * 100));
    const stateClass = a.completed ? 'completed' : (a.progress_count>0 ? '' : 'locked');
    const badge = a.image_url
      ? `<img class="badge-img" src="${a.image_url}">`
      : `<div class="badge-placeholder">${a.completed ? '🏆' : '❔'}</div>`;
    let actionHtml = '';
    if(a.completed && !a.claimed){
      actionHtml = `<button class="claim-btn" onclick="claimAchievement('${a.user_achievement_id}')">🎁 Réclamer</button>`;
    } else if(a.claimed){
      actionHtml = `<div class="claimed-tag">✓ Récompense obtenue</div>`;
    }
    return `
      <div class="card ${stateClass}">
        ${badge}
        <div class="card-body">
          <div class="card-name">${escapeHtml(a.name)}</div>
          <div class="card-desc">${escapeHtml(a.description || '')}</div>
          <div class="card-reward">🎁 ${escapeHtml(describeRewardsPreview(a.rewards))}</div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
          <div class="progress-text">${a.progress_count} / ${a.target_count}</div>
          ${actionHtml}
        </div>
      </div>
    `;
  }).join('');
}

let showingLeaderboard = false;
async function toggleLeaderboardView(){
  showingLeaderboard = !showingLeaderboard;
  document.getElementById('summary').style.display = showingLeaderboard ? 'none' : 'block';
  document.getElementById('category-tabs').style.display = showingLeaderboard ? 'none' : 'flex';
  document.getElementById('ach-grid').style.display = showingLeaderboard ? 'none' : 'grid';
  document.getElementById('leaderboard-wrap').style.display = showingLeaderboard ? 'block' : 'none';
  document.getElementById('view-toggle-btn').textContent = showingLeaderboard ? '🏅 Voir mes succès' : '🏆 Voir le classement';
  if(showingLeaderboard) await loadLeaderboard();
}
const CLASS_SLUG_NOACCENT = {'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'};

// Classement par saison (mensuelle) : points type Elo, ligues, récompenses de fin de saison.
const LEAGUE_ICONS = { 'Bronze':'🥉', 'Argent':'🥈', 'Or':'🥇', 'Platine':'💠', 'Diamant':'💎', 'Maître':'👑' };
const LEAGUE_FLOORS = { 'Bronze':0, 'Argent':1100, 'Or':1300, 'Platine':1500, 'Diamant':1700, 'Maître':1900 };
function seasonLabel(key){
  const m = /^(\d{4})-(\d{2})$/.exec(key||'');
  if(!m) return key||'';
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${mois[parseInt(m[2],10)-1]||m[2]} ${m[1]}`;
}
async function claimSeasonRewardsUi(){
  const { data, error } = await sb.rpc('claim_season_rewards');
  if(error || !data || data.error){ showToast('Impossible de réclamer les récompenses.'); return; }
  showToast(data.gold>0 ? `Récompenses de saison : +${data.gold} pièces d'or` : 'Aucune récompense à réclamer.');
  await loadLeaderboard();
}
async function loadLeaderboard(){
  const wrap = document.getElementById('leaderboard-wrap');
  wrap.innerHTML = `<div class="empty-state">Chargement...</div>`;
  const [lbRes, meRes] = await Promise.all([ sb.rpc('get_ranked_leaderboard', { p_limit: 100 }), sb.rpc('get_ranked_profile') ]);
  const lb = lbRes.data, me = meRes.data;
  let myId = null;
  try{ const { data: au } = await sb.auth.getUser(); myId = au && au.user && au.user.id; }catch(e){}
  if(lbRes.error || !lb || lb.error){
    wrap.innerHTML = `<div class="empty-state">Le classement n'est pas disponible pour l'instant.</div>`;
    return;
  }
  let html = `<div id="lb-season-head">Saison de ${escapeHtml(seasonLabel(lb.season))}</div>`;
  if(me && me.ok){
    if(me.pendingRewards && me.pendingRewards.length){
      const total = me.pendingRewards.reduce((s,r)=>s+r.gold,0);
      const detail = me.pendingRewards.map(r=>`${escapeHtml(seasonLabel(r.season))} : ${LEAGUE_ICONS[r.league]||''} ${escapeHtml(r.league)}`).join(' · ');
      html += `<div id="lb-reward"><div><strong>Récompenses de saison à réclamer : +${total} or</strong><div class="lb-sub" style="font-size:11.5px;color:var(--parchment-dim);">${detail}</div></div>
        <button class="claim-btn" style="margin-top:0;" onclick="claimSeasonRewardsUi()">Réclamer</button></div>`;
    }
    const floor = LEAGUE_FLOORS[me.league] || 0;
    const pct = me.nextLeagueAt ? Math.max(0, Math.min(100, Math.round(((me.rating-floor)/(me.nextLeagueAt-floor))*100))) : 100;
    const chips = (me.recent||[]).map(c=>`<span class="lb-chip ${c.delta>=0?'up':'down'}" title="${c.won?'Victoire':'Défaite'}">${c.delta>=0?'+':''}${c.delta}</span>`).join('');
    html += `<div id="lb-me-card">
      <div class="lb-me-top"><span class="lb-me-league">${LEAGUE_ICONS[me.league]||''} ${escapeHtml(me.league)}</span>
        <span><strong>${me.rating} pts</strong>${me.rank?` · #${me.rank}`:''}</span></div>
      <div class="lb-bar"><span style="width:${pct}%"></span></div>
      <div class="lb-sub">${me.nextLeagueAt ? `${me.nextLeagueAt-me.rating} pts avant la ligue suivante` : 'Ligue maximale atteinte'} · ${me.wins}V ${me.losses}D · meilleur : ${me.peak}</div>
      ${chips?`<div class="lb-recent">${chips}</div>`:''}
      ${me.games<5?`<div class="lb-sub" style="margin-top:6px;">Encore ${5-me.games} partie${5-me.games>1?'s':''} classée${5-me.games>1?'s':''} pour avoir droit à la récompense de fin de saison.</div>`:''}
    </div>`;
  }
  if(!lb.leaderboard || lb.leaderboard.length===0){
    html += `<div class="empty-state" style="padding:30px 20px;">Aucune partie classée cette saison pour l'instant.</div>`;
  } else {
    html += lb.leaderboard.map(p=>`
    <div class="lb-row ${p.rank===1?'lb-top1':''} ${me && me.ok && p.id===myId ? 'lb-me':''}">
      <div class="lb-rank">${p.rank}</div>
      <a class="lb-name" href="spellcraft-profile.html?uid=${encodeURIComponent(p.id)}" style="text-decoration:none;color:inherit;">${escapeHtml(p.username)}</a>
      <span class="lb-league">${LEAGUE_ICONS[p.league]||''} ${escapeHtml(p.league)}</span>
      <div class="lb-record">${p.wins}V ${p.losses}D</div>
      <div class="lb-rating">${p.rating}</div>
    </div>`).join('');
  }
  html += `<div id="lb-rules"><strong>Comment ça marche.</strong> Seules les parties contre un autre joueur comptent (pas l'IA). Chaque partie gagnée ou perdue fait gagner ou perdre des points selon le niveau de l'adversaire. Ligues : Bronze, Argent (1100), Or (1300), Platine (1500), Diamant (1700), Maître (1900). La saison dure un mois ; à la suivante, vos points reviennent à mi-chemin de 1000. Récompense d'or selon votre ligue en fin de saison, à partir de 5 parties classées. Au-delà de 3 parties contre le même adversaire en 24 h, les suivantes ne rapportent rien.</div>`;
  wrap.innerHTML = html;
}

const GEM_NAMES = {Volonté:'Rubis', Aube:'Diamant', 'Crépuscule':'Obsidienne', Arcane:'Saphir', Prima:'Émeraude', Opale:'Opale'};

async function describeGrantedRewards(granted){
  const parts = [];
  for(const g of granted){
    if(g.type==='gold') parts.push(`+${g.amount} pièces d'or`);
    else if(g.type==='fragment') parts.push(`+${g.amount} fragments ${GEM_NAMES[g.class]||g.class}`);
    else if(g.type==='booster') parts.push(`${g.count} booster${g.count>1?'s':''}`);
    else if(g.type==='card'){
      let name = 'une carte';
      try{
        const { data } = await sb.from('cards').select('data').eq('id', g.card_id).single();
        if(data && data.data && data.data.name) name = `« ${data.data.name} »`;
      }catch(e){}
      parts.push(name);
    }
    else if(g.type==='card_back') parts.push(`dos de carte « ${g.card_back_name||'?'} »`);
  }
  return parts.length ? parts.join(', ') : 'aucune récompense';
}

async function claimAchievement(id){
  const { data, error } = await sb.rpc('claim_achievement_reward', { p_user_achievement_id: id });
  if(error || !data || data.error){ showToast('Impossible de réclamer cette récompense.'); return; }
  const detail = await describeGrantedRewards(data.granted || []);
  showToast(`Récompense obtenue : ${detail}`);
  await loadAchievements();
  sb.rpc('progress_collection_achievements').catch(()=>{});
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2600);
}

initSpellcraftAuth().then(loadAchievements);
playMenuMusicRotation(0.35);
