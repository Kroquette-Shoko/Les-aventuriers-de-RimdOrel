<script>
// Anti-flash : applique le thème choisi AVANT le premier rendu.
(function(){
  try{
    var t = localStorage.getItem('sc-theme') || 'actuel';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();

<link rel="stylesheet" href="spellcraft-ui-kit.css">
<style>
/* Le reste des jetons de couleur (--bg-void, --gold, --arcane, etc.)
   vient de spellcraft-ui-kit.css et suit le thème actif.
   On ne garde ici que ce qui est propre à cette page. */
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:0 20px 60px;}
#app > .sc-topbar{margin:0 -20px 20px;width:calc(100% + 40px);}

.wrap{width:100%;max-width:1260px;margin:0 auto;padding:10px 0 0;min-width:0;}
#ach-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
#ach-head .sc-h1{margin:0;text-align:left;}
#ach-layout{display:flex;gap:18px;align-items:flex-start;min-width:0;}
#ach-side{width:236px;flex:none;display:flex;flex-direction:column;gap:8px;position:sticky;top:12px;max-height:calc(100vh - 24px);}
#category-tabs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;scrollbar-width:thin;}
.cat-row{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.2);border:1px solid transparent;border-radius:11px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--parchment);font:inherit;font-size:13px;transition:border-color .15s,background .15s;}
.cat-row:hover{border-color:var(--line);}
.cat-row.active{border-color:var(--gold);background:rgba(212,175,55,.14);color:var(--gold);}
.cat-ico{font-size:17px;}
.cat-name{flex:1;line-height:1.2;}
.cat-count{font-size:11px;opacity:.7;}
#lb-entry{margin-top:4px;border-color:rgba(212,175,55,.3);}
#summary:empty{display:none;}
#summary{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(0,0,0,.2);}
#summary .qs-lbl{font-size:11px;letter-spacing:2px;color:var(--parchment-dim);text-transform:uppercase;}
#summary .qs-val{font-size:22px;font-weight:700;color:var(--gold);margin:2px 0 6px;}
#summary .qs-bar{height:7px;border-radius:5px;background:var(--bg-panel-3);overflow:hidden;}
#summary .qs-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--arcane),var(--gold));}
.medal{position:relative;flex:none;border-radius:50%;}
.medal svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.medal .m-in{position:absolute;inset:13%;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 35% 30%,var(--bg-panel-3),var(--bg-panel-2));}
.medal .m-in img{width:100%;height:100%;object-fit:cover;}
.medal .m-in span{line-height:1;}
.medal.done{filter:drop-shadow(0 0 8px rgba(212,175,55,.55));}
.medal.done .m-in{background:radial-gradient(circle at 35% 30%,#fff2b0,#d4af37 60%,#7a5a12);}
.medal.lock .m-in{filter:grayscale(1);opacity:.65;}
.medal circle.bg{stroke:var(--line);}
.medal circle.fg{stroke:var(--arcane);transition:stroke-dasharray .4s;}
.medal.done circle.fg{stroke:var(--gold);}
#ach-main{flex:1;min-width:0;}
#ach-grid{min-width:0;display:flex;flex-direction:column;gap:9px;}
.pane-head{display:flex;align-items:center;gap:12px;margin:0 0 4px;}
.pane-title{flex:1;font-family:'Cinzel',serif;font-weight:700;font-size:22px;color:var(--gold);}
.card{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:15px;padding:11px 16px;display:flex;align-items:center;gap:14px;transition:border-color .15s;}
.card.completed{border-color:rgba(212,175,55,.55);}
.card.claimable{border-color:var(--gold);animation:achGlow 2s infinite;}
@keyframes achGlow{50%{box-shadow:0 0 18px rgba(212,175,55,.4)}}
.card-body{flex:1;min-width:0;}
.card-name{font-family:'Cinzel',serif;font-weight:700;font-size:15.5px;color:var(--parchment);}
.card-desc{font-size:12.5px;color:var(--parchment-dim);margin:1px 0 7px;line-height:1.4;}
.progress-bar-wrap{height:7px;background:var(--bg-panel-3);border-radius:5px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--frost),var(--arcane));border-radius:5px;transition:width .3s ease;}
.card.completed .progress-bar-fill{background:var(--gold);}
.card-foot{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:12px;flex-wrap:wrap;}
.progress-text{color:var(--parchment-dim);}
.card-reward{color:var(--gold);font-weight:600;}
.card-act{min-width:104px;text-align:center;}
.claim-btn{background:var(--gold);color:var(--ink);border:none;border-radius:999px;padding:9px 16px;
  font-family:'Cinzel',serif;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;}
.claim-btn:hover{filter:brightness(1.1);}
.card-act .claim-btn{animation:achPulse 1.6s infinite;}
@keyframes achPulse{50%{transform:scale(1.05)}}
.claimed-tag{font-size:12px;color:var(--green);font-family:'Cinzel',serif;font-weight:700;}
.ach-burst{position:fixed;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none;z-index:300;transition:transform .9s ease-out,opacity .9s;}
@media (prefers-reduced-motion:reduce){.card.claimable,.card-act .claim-btn{animation:none;}}
@media (max-width:860px){
  #ach-layout{flex-direction:column;}
  #ach-side{width:100%;position:static;max-height:none;}
  #category-tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:6px;}
  .cat-row{flex:none;width:200px;}
  #ach-grid{width:100%;}
  .card{flex-wrap:wrap;}
  .card-body{flex-basis:calc(100% - 80px);}
  .card-act{flex-basis:100%;text-align:right;}
}
.empty-state{text-align:center;padding:60px 20px;color:var(--parchment-dim);}
#leaderboard-wrap{min-width:0;}
.lb-top{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
#lb-players-body{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:900px){#lb-players-body{grid-template-columns:minmax(0,1fr);}}
#lb-search{width:100%;box-sizing:border-box;margin:0 0 10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-panel);color:inherit;font-size:14px;}
#lb-players-body .empty-state{grid-column:1/-1;}
.lb-main{min-width:0;}
.lb-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:16px 22px;border-radius:16px;border:1px solid var(--gold);background:linear-gradient(100deg,var(--bg-panel-3),var(--bg-panel));}
.lb-ring{position:relative;width:104px;height:104px;flex:none;}
.lb-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.lb-ring .lb-ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.lb-ring .lb-ring-ico{font-size:30px;line-height:1;}
.lb-ring .lb-ring-pts{font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--gold);margin-top:3px;}
.lb-hero-mid{flex:1;min-width:220px;}
.lb-hero-lbl{font-size:11px;letter-spacing:2px;color:var(--parchment-dim);text-transform:uppercase;}
.lb-hero-league{font-family:'Cinzel',serif;font-weight:700;font-size:24px;color:var(--gold);}
.lb-hero-end{text-align:right;max-width:260px;margin-left:auto;}
.lb-hero-end .lb-reward-val{color:var(--gold);font-weight:600;margin:3px 0;}
.lb-details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg-panel);padding:10px 14px;}
.lb-details summary{cursor:pointer;font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:13px;}
.lb-details .lb-grades{margin:10px 0;}
.lb-who{flex:1;min-width:0;}
.lb-who .lb-name{display:block;text-decoration:none;color:inherit;}
.lb-who .lb-name:hover{color:var(--gold);}
.lb-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);}
.lb-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;}
.lb-badge{width:22px;height:22px;border-radius:5px;background-size:cover;background-position:center;border:1px solid var(--line);}
.lb-pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;}
.lb-pager .claim-btn{margin-top:0;}
.lb-pager .claim-btn:disabled{opacity:.4;cursor:default;}
.lb-grades{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;background:var(--bg-panel);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;}
.lb-grades th,.lb-grades td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);}
.lb-grades th{font-family:'Cinzel',serif;color:var(--gold);font-size:11px;}
.lb-grades tr.lb-cur td{background:rgba(212,175,55,.15);font-weight:700;}
.lb-sub{font-size:11.5px;color:var(--parchment-dim);}
.lb-rules-mini{line-height:1.5;}
.lb-row .lb-league{display:none;}
@media(min-width:520px){.lb-row .lb-league{display:inline-block;}}
.lb-row{display:flex;align-items:center;gap:14px;background:var(--bg-panel);border:1.5px solid var(--line);border-radius:10px;
  padding:10px 16px;margin-bottom:8px;}
.lb-row .lb-rank{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:15px;width:32px;text-align:center;flex-shrink:0;}
.lb-row .lb-class-icon{width:24px;height:24px;flex-shrink:0;object-fit:contain;}
.lb-row .lb-name{flex:1;font-weight:600;}
.lb-row .lb-wins{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);}
.lb-row.lb-top1{border-color:var(--gold);box-shadow:0 0 14px rgba(212,175,55,.3);}
.lb-row .lb-league{font-family:'Cinzel',serif;font-size:11px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--parchment-dim);white-space:nowrap;}
.lb-row .lb-rating{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);min-width:64px;text-align:right;}
.lb-row .lb-record{font-size:11px;color:var(--parchment-dim);min-width:58px;text-align:right;}
.lb-row.lb-me{border-color:#4aa3ff;}
#lb-me-card .lb-recent{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
#lb-me-card .lb-chip{font-size:11px;padding:1px 7px;border-radius:7px;font-weight:700;}
#lb-me-card .lb-chip.up{background:rgba(74,157,107,.25);color:#7fd6a0;}
#lb-me-card .lb-chip.down{background:rgba(224,88,79,.25);color:#f0908a;}
#lb-reward{background:rgba(212,175,55,.12);border:1.5px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
#lb-rules{font-size:11.5px;color:var(--parchment-dim);margin-top:14px;line-height:1.5;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg-panel-3);
  border:1.5px solid var(--gold);border-radius:10px;padding:14px 20px;opacity:0;pointer-events:none;
  transition:all .3s ease;z-index:99;text-align:center;font-family:'Cinzel',serif;font-size:13px;
  max-width:min(90vw,420px);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<div id="app">
  <div class="sc-topbar">
    <a href="spellcraft-hub.html" class="sc-topbar-back" title="Retour à l'accueil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Menu principal
    </a>
    <div class="sc-topbar-right">
      <div id="sc-auth-slot"></div>
      <div id="sc-options-slot"></div>
    </div>
  </div>

  <div class="wrap">
    <div id="ach-head">
      <h1 class="sc-h1">Hauts faits</h1>
    </div>
    <div id="ach-layout">
      <div id="ach-side">
        <div id="category-tabs"></div>
        <button class="cat-row" id="lb-entry" onclick="toggleLeaderboardView()"><span class="cat-ico">🏅</span><span class="cat-name">Classement</span></button>
        <div id="summary"></div>
      </div>
      <div id="ach-main">
        <div id="ach-grid"></div>
        <div id="leaderboard-wrap" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.APP_TOPBAR_DISABLED = true;</script>
<script src="spellcraft-shared.js?v=20261112a"></script>
<script src="spellcraft-notifs.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
let achievements = [];

// Catégories affichées en sous-onglets, dans cet ordre. Un succès sans
// catégorie reconnue (ancien succès jamais reclassé) tombe dans "Autre".
const CATEGORY_ORDER = ['wins','cards_class','boosters','crafting','card_types','damage','hp','turn_cards','quests','secret'];
const CATEGORY_LABELS = {
  wins: '🏆 Partie gagnée',
  cards_class: '🔮 Carte jouée (par source)',
  boosters: '🎁 Ouverture de booster',
  crafting: '🔨 Fabrication',
  card_types: '📜 Type de carte jouée',
  damage: '⚔️ Dégâts',
  hp: '❤️ Score de PV atteint',
  turn_cards: '📚 Cartes jouées en un tour',
  quests: '📜 Quêtes terminées',
  secret: '❔ Secret'
};
let activeCategory = null;
let CARD_BACK_NAMES = {}; // id -> nom, chargé une fois pour afficher les récompenses "dos de carte"

async function loadAchievements(){
  const { data, error } = await sb.rpc('get_achievements');
  if(error || !data || data.error){
    document.getElementById('ach-grid').innerHTML = `<div class="empty-state">Connecte-toi pour voir tes succès.</div>`;
    return;
  }
  achievements = data.achievements || [];
  if(!activeCategory){
    const firstWithItems = CATEGORY_ORDER.find(c=>achievements.some(a=>(a.category||'autre')===c));
    activeCategory = firstWithItems || 'autre';
  }
  // Noms des dos de carte utilisés en récompense — chargés une seule fois
  // pour pouvoir afficher "dos de carte « X »" sans requête par carte.
  if(Object.keys(CARD_BACK_NAMES).length===0){
    const backIds = [...new Set(achievements.flatMap(a=>(a.rewards||[]).filter(r=>r.type==='card_back').map(r=>r.card_back_id)))];
    if(backIds.length>0){
      const { data: backs } = await sb.from('card_backs').select('id, name').in('id', backIds);
      (backs||[]).forEach(b=>{ CARD_BACK_NAMES[b.id] = b.name; });
    }
  }
  renderSummary();
  renderCategoryTabs();
  renderGrid();
}

function renderSummary(){
  const done = achievements.filter(a=>a.completed).length;
  const total = achievements.length;
  if(!total){ document.getElementById('summary').innerHTML = ''; return; }
  const pct = Math.round((done/total)*100);
  document.getElementById('summary').innerHTML = `<div class="qs-lbl">Progression</div><div class="qs-val">${done} / ${total}</div><div class="qs-bar"><i style="width:${pct}%"></i></div>`;
}

function achList(c){
  return achievements.filter(a=>(a.category||'autre')===c).sort((x,y)=>x.target_count-y.target_count);
}
// Médaille ronde : anneau de progression + image du badge (ou emoji de la catégorie)
function medalHtml(a, size, icon){
  const done = !!a.completed;
  const pc = Math.max(0, Math.min(1, a.progress_count / (a.target_count||1)));
  const lock = !done && !(a.progress_count>0);
  const r = size/2 - 4, C = 2*Math.PI*r;
  const inner = a.image_url ? `<img src="${escapeHtml(a.image_url)}" alt="">` : `<span style="font-size:${Math.round(size*.36)}px">${icon}</span>`;
  return `<div class="medal ${done?'done':''} ${lock?'lock':''}" style="width:${size}px;height:${size}px">
    <svg viewBox="0 0 ${size} ${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="4"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}"/></svg>
    <div class="m-in">${inner}</div></div>`;
}
function catIcon(c){ const l = CATEGORY_LABELS[c] || '🏆'; return l.split(' ')[0]; }
function catName(c){ const l = CATEGORY_LABELS[c] || 'Autre'; return l.substring(l.indexOf(' ')+1); }

// Menu de gauche : une ligne par catégorie (compteur + « ! » si récompense à réclamer)
function renderCategoryTabs(){
  const wrap = document.getElementById('category-tabs');
  const present = CATEGORY_ORDER.filter(c=>achievements.some(a=>(a.category||'autre')===c));
  if(achievements.some(a=>!a.category)) present.push('autre');
  if(!present.length){ wrap.innerHTML=''; return; }
  wrap.innerHTML = present.map(c=>{
    const list = achList(c);
    const done = list.filter(a=>a.completed).length;
    const claimable = list.some(a=>a.completed && !a.claimed);
    const ico = c==='autre' ? '🏆' : catIcon(c);
    return `<button class="cat-row ${(!showingLeaderboard && c===activeCategory)?'active':''}" onclick="switchCategory('${c}')"><span class="cat-ico">${ico}</span><span class="cat-name">${c==='autre'?'Autre':catName(c)}</span><span class="cat-count">${done}/${list.length}</span>${claimable?'<span class="sc-notif sc-notif-inline" aria-label="Récompense à réclamer">!</span>':''}</button>`;
  }).join('');
}

function switchCategory(c){
  activeCategory = c;
  if(showingLeaderboard){ toggleLeaderboardView(); return; }
  renderCategoryTabs();
  renderGrid();
}

const REWARD_BOOSTER_SET_LABEL = {base:'Édition de base', latest:'dernier set sorti', 'set-classique':'Set classique'};
// Aperçu synchrone des récompenses (affiché sur chaque carte) — pour une
// carte précise par id, on ne connaît pas encore son nom sans requête
// réseau, donc on reste générique ("une carte précise") : le nom exact est
// révélé dans le toast au moment de la réclamer.
function describeRewardsPreview(rewards){
  if(!rewards || rewards.length===0) return 'Juste le badge';
  return rewards.map(r=>{
    if(r.type==='gold') return `+${r.amount} pièces d'or`;
    if(r.type==='fragment') return `+${r.amount} fragments ${GEM_NAMES[r.class]||r.class}`;
    if(r.type==='booster') return `${r.count} booster${r.count>1?'s':''} (${REWARD_BOOSTER_SET_LABEL[r.set]||r.set})`;
    if(r.type==='card') return r.card_id ? 'une carte précise' : `une carte ${r.rarity||''}${r.foil?' brillante':''}`.trim();
    if(r.type==='card_back') return `dos de carte « ${CARD_BACK_NAMES[r.card_back_id] || '?'} »`;
    return null;
  }).filter(Boolean).join(', ') || 'Juste le badge';
}

function renderGrid(){
  const grid = document.getElementById('ach-grid');
  if(achievements.length===0){
    grid.innerHTML = `<div class="empty-state">Aucun succès disponible pour l'instant.</div>`;
    return;
  }
  const visible = achList(activeCategory);
  if(visible.length===0){
    grid.innerHTML = `<div class="empty-state">Aucun succès dans cette catégorie pour l'instant.</div>`;
    return;
  }
  const ico = activeCategory==='autre' ? '🏆' : catIcon(activeCategory);
  const head = `<div class="pane-head"><span class="pane-title">${ico} ${activeCategory==='autre'?'Autre':escapeHtml(catName(activeCategory))}</span></div>`;
  grid.innerHTML = head + visible.map(a=>{
    const pct = Math.min(100, Math.round((a.progress_count / a.target_count) * 100));
    const canClaim = a.completed && !a.claimed;
    let actionHtml = '';
    if(canClaim){
      actionHtml = `<button class="claim-btn" onclick="claimAchievement('${a.user_achievement_id}', this)">🎁 Réclamer</button>`;
    } else if(a.claimed){
      actionHtml = `<div class="claimed-tag">✓ Obtenue</div>`;
    }
    return `
      <div class="card ${a.completed?'completed':''} ${canClaim?'claimable':''}">
        ${medalHtml(a, 58, ico)}
        <div class="card-body">
          <div class="card-name">${escapeHtml(a.name)}</div>
          <div class="card-desc">${escapeHtml(a.description || '')}</div>
          <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;"></div></div>
          <div class="card-foot"><span class="progress-text">${Math.min(a.progress_count,a.target_count)} / ${a.target_count}</span><span class="card-reward">🎁 ${escapeHtml(describeRewardsPreview(a.rewards))}</span></div>
        </div>
        <div class="card-act">${actionHtml}</div>
      </div>
    `;
  }).join('');
}

let showingLeaderboard = false;
async function toggleLeaderboardView(){
  showingLeaderboard = !showingLeaderboard;
  document.getElementById('ach-grid').style.display = showingLeaderboard ? 'none' : '';
  document.getElementById('leaderboard-wrap').style.display = showingLeaderboard ? 'block' : 'none';
  document.getElementById('lb-entry').classList.toggle('active', showingLeaderboard);
  renderCategoryTabs();
  if(showingLeaderboard) await loadLeaderboard(); else renderGrid();
}
const CLASS_SLUG_NOACCENT = {'Aube':'aube', 'Crépuscule':'crepuscule', 'Volonté':'volonte', 'Prima':'prima', 'Arcane':'arcane', 'Neutre':'neutre'};

// Classement par saison (mensuelle) : points type Elo, ligues, récompenses de fin de saison.
const LEAGUE_ICONS = { 'Non classé':'⚪', 'Bronze':'🥉', 'Argent':'🥈', 'Or':'🥇', 'Platine':'💠', 'Diamant':'💎', 'Maître':'👑' };
const LEAGUE_FLOORS = { 'Non classé':0, 'Bronze':50, 'Argent':150, 'Or':300, 'Platine':500, 'Diamant':800, 'Maître':1000 };
function rewardText(gold, boosters){ const b = boosters>0 ? ` et ${boosters} booster${boosters>1?'s':''}` : ''; return `${gold} or${b}`; }
function seasonLabel(key){
  const m = /^(\d{4})-(\d{2})$/.exec(key||'');
  if(!m) return key||'';
  const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  return `${mois[parseInt(m[2],10)-1]||m[2]} ${m[1]}`;
}
async function claimSeasonRewardsUi(){
  const { data, error } = await sb.rpc('claim_season_rewards');
  if(error || !data || data.error){ showToast('Impossible de réclamer les récompenses.'); return; }
  showToast((data.gold>0 || data.boosters>0) ? `Récompenses de saison : +${data.gold} pièces d'or${data.boosters>0?` et ${data.boosters} booster${data.boosters>1?'s':''}`:''}` : 'Aucune récompense à réclamer.');
  await loadLeaderboard();
}
const LEAGUE_REWARDS = { 'Non classé':[0,0], 'Bronze':[200,1], 'Argent':[400,1], 'Or':[600,2], 'Platine':[1000,2], 'Diamant':[2000,3], 'Maître':[3000,5] };
const LEAGUE_ORDER = ['Non classé','Bronze','Argent','Or','Platine','Diamant','Maître'];
const LB_PAGE_SIZE = 10;
let LB_STATE = { page:0, search:'', myId:null, total:0, timer:null };

function lbBadgesHtml(badges){
  return (badges||[]).map(b=>`<span class="lb-badge" title="${escapeHtml(b.name||'')}${b.description?' — '+escapeHtml(b.description):''}" style="background-image:url('${escapeHtml(b.imageUrl||'')}')"></span>`).join('');
}
async function loadLeaderboardRows(){
  const body = document.getElementById('lb-players-body');
  if(!body) return;
  body.innerHTML = `<div class="empty-state" style="padding:24px;">Chargement...</div>`;
  const { data, error } = await sb.rpc('get_ranked_board', { p_search: LB_STATE.search || null, p_limit: LB_PAGE_SIZE, p_offset: LB_STATE.page*LB_PAGE_SIZE });
  if(error || !data || data.error){ body.innerHTML = `<div class="empty-state" style="padding:24px;">Le tableau n'est pas disponible pour l'instant.</div>`; return; }
  LB_STATE.total = data.total;
  if(!LB_STATE.search){ const t = document.getElementById('lb-total'); if(t) t.textContent = data.total; }
  const pages = Math.max(1, Math.ceil(data.total/LB_PAGE_SIZE));
  if(!data.players.length){
    body.innerHTML = `<div class="empty-state" style="padding:24px;">${LB_STATE.search ? 'Aucun joueur ne correspond à cette recherche.' : 'Aucun joueur pour l\'instant.'}</div>`;
  } else {
    body.innerHTML = data.players.map(p=>`
    <div class="lb-row ${p.rank===1?'lb-top1':''} ${p.id===LB_STATE.myId?'lb-me':''}">
      <div class="lb-rank">${p.rank}</div>
      <div class="lb-who">
        <a class="lb-name" href="spellcraft-profile.html?uid=${encodeURIComponent(p.id)}">${escapeHtml(p.username)}</a>
        ${p.title?`<div class="lb-title">« ${escapeHtml(p.title)} »</div>`:''}
        ${(p.badges&&p.badges.length)?`<div class="lb-badges">${lbBadgesHtml(p.badges)}</div>`:''}
      </div>
      <span class="lb-league">${LEAGUE_ICONS[p.league]||''} ${escapeHtml(p.league)}</span>
      <div class="lb-record">${p.wins}V ${p.losses}D</div>
      <div class="lb-rating">${p.rating}</div>
    </div>`).join('');
  }
  document.getElementById('lb-page-info').textContent = `Page ${LB_STATE.page+1} / ${pages} · ${data.total} joueur${data.total>1?'s':''}`;
  document.getElementById('lb-prev').disabled = LB_STATE.page<=0;
  document.getElementById('lb-next').disabled = LB_STATE.page>=pages-1;
}
function lbSearchInput(v){
  clearTimeout(LB_STATE.timer);
  LB_STATE.timer = setTimeout(()=>{ LB_STATE.search = v.trim(); LB_STATE.page = 0; loadLeaderboardRows(); }, 300);
}
function lbGoPage(d){ LB_STATE.page = Math.max(0, LB_STATE.page + d); loadLeaderboardRows(); }

async function loadLeaderboard(){
  const wrap = document.getElementById('leaderboard-wrap');
  wrap.innerHTML = `<div class="empty-state">Chargement...</div>`;
  const meRes = await sb.rpc('get_ranked_profile');
  const me = meRes.data;
  try{ const { data: au } = await sb.auth.getUser(); LB_STATE.myId = au && au.user && au.user.id; }catch(e){}
  LB_STATE.page = 0; LB_STATE.search = '';
  const season = (me && me.ok && me.season) ? me.season : null;
  let top = '';
  if(me && me.ok && me.pendingRewards && me.pendingRewards.length){
    const total = me.pendingRewards.reduce((s,r)=>s+r.gold,0), totalB = me.pendingRewards.reduce((s,r)=>s+(r.boosters||0),0);
    const detail = me.pendingRewards.map(r=>`${escapeHtml(seasonLabel(r.season))} : ${LEAGUE_ICONS[r.league]||''} ${escapeHtml(r.league)}`).join(' · ');
    top += `<div id="lb-reward"><div style="font-size:26px;">🎁</div><div style="flex:1;min-width:180px;"><strong>Récompenses de saison à réclamer : +${rewardText(total, totalB)}</strong><div class="lb-sub">${detail}</div></div>
      <button class="claim-btn" style="margin-top:0;" onclick="claimSeasonRewardsUi()">Réclamer</button></div>`;
  }
  // Grades et récompenses (repliable, en bas de page)
  const myLeague = (me && me.ok) ? me.league : null;
  const rows = LEAGUE_ORDER.map((l,i)=>{
    const from = LEAGUE_FLOORS[l], next = LEAGUE_ORDER[i+1];
    const range = next ? `${from} – ${LEAGUE_FLOORS[next]-1}` : `${from} et +`;
    const r = LEAGUE_REWARDS[l];
    return `<tr class="${l===myLeague?'lb-cur':''}"><td>${LEAGUE_ICONS[l]} ${l}</td><td>${range}</td><td>${r[0]>0?rewardText(r[0], r[1]):'—'}</td></tr>`;
  }).join('');
  if(me && me.ok){
    const floor = LEAGUE_FLOORS[me.league] || 0;
    const pc = me.nextLeagueAt ? Math.max(0, Math.min(1, (me.rating-floor)/(me.nextLeagueAt-floor))) : 1;
    const R = 46, C = 2*Math.PI*R;
    const rw = LEAGUE_REWARDS[me.league] || [0,0];
    const chips = (me.recent||[]).map(c=>`<span class="lb-chip ${c.delta>=0?'up':'down'}" title="${c.won?'Victoire':'Défaite'}">${c.delta>=0?'+':''}${c.delta}</span>`).join('');
    top += `<div id="lb-me-card" class="lb-hero">
      <div class="lb-ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*pc} ${C}"/></svg>
        <div class="lb-ring-in"><span class="lb-ring-ico">${LEAGUE_ICONS[me.league]||''}</span><span class="lb-ring-pts">${me.rating} pts</span></div></div>
      <div class="lb-hero-mid">
        <div class="lb-hero-lbl">${season ? 'Saison de '+escapeHtml(seasonLabel(season)) : 'Classement'}</div>
        <div class="lb-hero-league">${LEAGUE_ICONS[me.league]||''} ${escapeHtml(me.league)}${me.rank?` · #${me.rank} sur <span id="lb-total">…</span>`:''}</div>
        <div class="lb-sub">${me.nextLeagueAt ? `${me.nextLeagueAt-me.rating} pts avant ${escapeHtml(LEAGUE_ORDER[LEAGUE_ORDER.indexOf(me.league)+1]||'')}` : 'Ligue maximale atteinte'} · ${me.wins}V ${me.losses}D · meilleur : ${me.peak}</div>
        ${chips?`<div class="lb-recent">${chips}</div>`:''}
      </div>
      <div class="lb-hero-end"><div class="lb-hero-lbl">Fin de saison</div><div class="lb-reward-val">${rw[0]>0?rewardText(rw[0], rw[1]):'aucune récompense'}</div><div class="lb-sub">Récompense avec votre rang actuel${me.games<5?`<br>Encore ${5-me.games} partie${5-me.games>1?'s':''} classée${5-me.games>1?'s':''} pour y avoir droit.`:''}</div></div>
    </div>`;
  } else {
    top += `<div id="lb-season-head" style="font-family:'Cinzel',serif;color:var(--gold);font-size:15px;">${season ? 'Saison de '+escapeHtml(seasonLabel(season)) : 'Classement'}</div>`;
  }
  const list = `<div class="lb-main">
    <input id="lb-search" type="search" placeholder="Rechercher un joueur par nom..." autocomplete="off" oninput="lbSearchInput(this.value)">
    <div id="lb-players-body"></div>
    <div class="lb-pager"><button id="lb-prev" class="claim-btn" onclick="lbGoPage(-1)">‹ Précédent</button><span id="lb-page-info" class="lb-sub"></span><button id="lb-next" class="claim-btn" onclick="lbGoPage(1)">Suivant ›</button></div>
  </div>`;
  const details = `<details class="lb-details"><summary>Grades et récompenses de fin de saison</summary>
    <table class="lb-grades"><thead><tr><th>Grade</th><th>Points</th><th>Récompense de fin de saison</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="lb-sub lb-rules-mini">+20 points par victoire contre un joueur. Défaite : rien avant l'Argent, −10 de l'Argent à l'Or, −20 à partir du Platine. Récompenses à partir de 5 parties classées.</div></details>`;
  wrap.innerHTML = `<div class="lb-top">${top}</div>` + list + details;
  await loadLeaderboardRows();
}

const GEM_NAMES = {Volonté:'Rubis', Aube:'Diamant', 'Crépuscule':'Obsidienne', Arcane:'Saphir', Prima:'Émeraude', Opale:'Opale'};

async function describeGrantedRewards(granted){
  const parts = [];
  for(const g of granted){
    if(g.type==='gold') parts.push(`+${g.amount} pièces d'or`);
    else if(g.type==='fragment') parts.push(`+${g.amount} fragments ${GEM_NAMES[g.class]||g.class}`);
    else if(g.type==='booster') parts.push(`${g.count} booster${g.count>1?'s':''}`);
    else if(g.type==='card'){
      let name = 'une carte';
      try{
        const { data } = await sb.from('cards').select('data').eq('id', g.card_id).single();
        if(data && data.data && data.data.name) name = `« ${data.data.name} »`;
      }catch(e){}
      parts.push(name);
    }
    else if(g.type==='card_back') parts.push(`dos de carte « ${g.card_back_name||'?'} »`);
  }
  return parts.length ? parts.join(', ') : 'aucune récompense';
}

function claimBurst(btn){
  try{
    if(!btn || window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    const r = btn.getBoundingClientRect(), cx = r.left+r.width/2, cy = r.top+r.height/2;
    for(let i=0;i<16;i++){
      const p = document.createElement('i'); p.className = 'ach-burst';
      p.style.left = cx+'px'; p.style.top = cy+'px';
      document.body.appendChild(p);
      const ang = Math.random()*6.28, d = 30+Math.random()*70;
      requestAnimationFrame(()=>{ p.style.transform = `translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d-30}px)`; p.style.opacity = '0'; });
      setTimeout(()=>p.remove(), 1000);
    }
  }catch(e){}
}

async function claimAchievement(id, btn){
  if(btn){ if(btn.disabled) return; btn.disabled = true; }
  const { data, error } = await sb.rpc('claim_achievement_reward', { p_user_achievement_id: id });
  if(error || !data || data.error){ if(btn) btn.disabled = false; showToast('Impossible de réclamer cette récompense.'); return; }
  claimBurst(btn);
  const detail = await describeGrantedRewards(data.granted || []);
  showToast(`Récompense obtenue : ${detail}`);
  await loadAchievements();
  sb.rpc('progress_collection_achievements').catch(()=>{});
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2600);
}

initSpellcraftAuth().then(loadAchievements).then(()=>{
  // Accès rapide depuis le menu principal : ?view=classement ouvre directement le classement
  try{ if(new URLSearchParams(location.search).get('view')==='classement' && !showingLeaderboard) toggleLeaderboardView(); }catch(e){}
});
playMenuMusicRotation(0.35);
</script>
