<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Les aventuriers de Rimd'Orël</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg-void:#0b0a12;
  --bg-panel:#171325;
  --bg-panel-2:#1f1a30;
  --parchment:#efe6c8;
  --parchment-dim:#d9cfae;
  --ink:#1c1830;
  --arcane:#7c5cff;
  --gold:#d4af37;
  --blood:#c23b3b;
  --frost:#4fb3d9;
  --green:#4a9d6b;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-void);color:var(--parchment);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;}

#app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}

#app-topbar{position:absolute;top:0;left:0;width:100%;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 16px;box-sizing:border-box;}
#app-topbar-title{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:14px;letter-spacing:.5px;flex:1;}
#app-topbar-right{display:flex;align-items:center;gap:10px;}

#board-title{
  position:absolute;top:0.5%;left:50%;transform:translateX(-50%);z-index:5;
  font-family:'Cinzel',serif;font-weight:900;font-size:clamp(14px,2.1vw,26px);color:var(--gold);
  letter-spacing:1px;text-shadow:0 2px 3px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.7);
  pointer-events:none;white-space:nowrap;text-align:center;
}

/* ---------- Le panneau d'affichage : taille classique, centré, jamais étiré ---------- */
#board{
  position:relative;
  width:min(92vw, 92vh * 1448 / 1086);
  height:min(92vh, 92vw * 1086 / 1448);
  background:url('images/hub-bg-board.png') center/100% 100% no-repeat;
  margin:0;
}

.poster{
  position:absolute;display:block;text-decoration:none;color:inherit;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));
  transition:transform .22s cubic-bezier(.2,.8,.3,1), filter .22s ease;
  cursor:pointer;
}
.poster img{display:block;width:100%;height:100%;object-fit:contain;}
.poster:hover{filter:drop-shadow(0 16px 26px rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(212,175,55,.45));}
.poster.soon{cursor:default;}
.poster.soon img{filter:grayscale(75%) brightness(.55);}
.poster.soon:hover{filter:drop-shadow(0 10px 18px rgba(0,0,0,.55));transform:none !important;}
.poster.soon .poster-label{color:var(--parchment-dim);}

/* Le gros tableau central : Recherche de partie */
.poster-center{left:38%;top:19%;width:24%;height:29%;transform:rotate(0deg);}
.poster-center:hover{transform:scale(1.04) translateY(-4px);}

/* Panneau de gauche : Boutique */
.poster-left{left:7.5%;top:44%;width:15%;height:24%;transform:rotate(-3deg);}
.poster-left:hover{transform:rotate(0deg) scale(1.05) translateY(-4px);}

/* Panneau de droite : Collection & Deck */
.poster-right{left:77.5%;top:44%;width:15%;height:24%;transform:rotate(3deg);}
.poster-right:hover{transform:rotate(0deg) scale(1.05) translateY(-4px);}

/* Sur le mur, au-dessus de la Boutique : Cartomancer (même taille que Succès/Quête) */
.poster-wall-left{left:7%;top:6%;width:14%;height:19%;transform:rotate(-4deg);}
.poster-wall-left:hover{transform:rotate(0deg) scale(1.08) translateY(-4px);}

/* Sous Recherche de partie, plus petites : Quête et Succès */
.poster-below-1{left:29%;top:50%;width:14%;height:19%;transform:rotate(-4deg);}
.poster-below-1:hover{transform:rotate(0deg) scale(1.08) translateY(-4px);}
.poster-below-2{left:57%;top:50%;width:14%;height:19%;transform:rotate(4deg);}
.poster-below-2:hover{transform:rotate(0deg) scale(1.08) translateY(-4px);}

.poster-label{
  position:absolute;bottom:-9%;left:50%;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:clamp(10px,1.15vw,14px);font-weight:700;color:var(--gold);
  letter-spacing:.5px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.9);
  pointer-events:none;
}

.soon-ribbon{
  position:absolute;top:40%;left:50%;transform:translateX(-50%) rotate(-8deg);
  background:var(--blood);color:#fff;font-family:'Cinzel',serif;font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:3px;letter-spacing:.5px;box-shadow:0 3px 8px rgba(0,0,0,.5);
  pointer-events:none;white-space:nowrap;
}

.note{
  margin-top:56px;background:var(--bg-panel-2);border:1px solid #3a3260;border-radius:12px;
  padding:14px 20px;max-width:640px;font-size:12.5px;color:var(--parchment-dim);line-height:1.6;text-align:center;
}
.note strong{color:var(--gold);}

footer{margin-top:26px;text-align:center;color:var(--parchment-dim);font-size:11.5px;max-width:600px;line-height:1.6;}
footer strong{color:var(--parchment);}

@media (max-width:760px){
  .poster-center{left:32%;top:23%;width:36%;height:32%;}
  .poster-left{left:2%;top:38%;width:22%;height:24%;}
  .poster-right{left:76%;top:38%;width:22%;height:24%;}
  .poster-wall-left{left:1%;top:3%;width:22%;height:24%;}
  .poster-below-1{left:29%;top:58%;width:19%;height:17%;}
  .poster-below-2{left:52%;top:58%;width:19%;height:17%;}
  .poster-label{font-size:9px;}
}
</style>
</head>
<body>

<div id="app">
  <div id="app-topbar">
    <span id="app-topbar-title">Menu principal</span>
    <div id="app-topbar-right">
      <div id="sc-auth-slot"></div>
      <div id="sc-options-slot"></div>
    </div>
  </div>

  <div id="board">
    <div id="board-title">Les aventuriers de Rimd'Orël</div>

    <a class="poster poster-center" href="spellcraft-lobby.html" title="Affronter l'IA ou un ami">
      <img src="images/hub-poster-jouer.png" alt="Recherche de partie">
      <span class="poster-label">Jouer</span>
    </a>

    <a class="poster poster-left" href="spellcraft-shop.html" title="Boosters, cartes à l'unité, dos de cartes">
      <img src="images/hub-poster-boutique.png" alt="Boutique">
      <span class="poster-label">Boutique</span>
    </a>

    <button class="poster poster-wall-left" id="patchnote-btn" onclick="openPatchNotes()" style="border:none;cursor:pointer;background:none;padding:0;font-family:inherit;position:relative;">
      <img src="images/hub-poster-patchnote.png" alt="Notes de version">
      <span class="poster-label">Notes de version</span>
      <span id="patchnote-badge" style="display:none;position:absolute;top:-6px;right:6px;width:26px;height:26px;border-radius:50%;background:#ffd23f;color:#231d33;font-weight:900;font-size:17px;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(255,210,63,.9);">!</span>
    </button>

    <a class="poster poster-right" href="spellcraft-deckbuilder.html" title="Ta collection et tes decks">
      <img src="images/hub-poster-collection.png" alt="Collection et Deck">
      <span class="poster-label">Collection &amp; Deck</span>
    </a>

    <a href="spellcraft-quests.html" class="poster poster-below-1">
      <img src="images/hub-poster-quete.png" alt="Quête">
      <span class="poster-label">Quêtes</span>
    </a>

    <a href="spellcraft-achievements.html" class="poster poster-below-2" title="Tes badges et récompenses">
      <img src="images/hub-poster-succes.png" alt="Succès">
      <span class="poster-label">Succès</span>
    </a>
  </div>

  <div style="text-align:center;margin-top:10px;">
    <a href="spellcraft-match-history.html" style="color:var(--parchment-dim,#d9cfae);font-size:12px;text-decoration:none;border:1px solid #3a3260;border-radius:8px;padding:6px 14px;">
      📜 Historique des parties
    </a>
  </div>
</div>

<!-- ---------------- Notes de version ---------------- -->
<div id="patchnote-overlay" style="display:none;position:fixed;inset:0;background:rgba(11,10,18,.92);z-index:200;align-items:center;justify-content:center;">
  <div id="patchnote-panel" style="background:#171325;border:1.5px solid #3a3260;border-radius:14px;padding:22px 26px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;position:relative;">
    <button onclick="closePatchNotes()" style="position:absolute;top:12px;right:14px;background:none;border:none;color:#d9cfae;font-size:20px;cursor:pointer;">✕</button>
    <h2 style="font-family:'Cinzel',serif;color:#d4af37;margin:0 0 4px;">Notes de version</h2>
    <button id="patchnote-gear-btn" onclick="openPatchNoteEditor()" title="Modifier (Kroquette uniquement)" style="display:none;position:absolute;top:14px;right:44px;background:none;border:none;font-size:18px;cursor:pointer;">⚙️</button>

    <div id="patchnote-view-mode">
      <div id="patchnote-content" style="font-size:13.5px;line-height:1.6;color:#efe6c8;margin-top:14px;"></div>
      <p id="patchnote-empty" style="display:none;color:#d9cfae;font-size:13px;text-align:center;padding:20px 0;">Aucune note de version pour l'instant.</p>
    </div>

    <div id="patchnote-edit-mode" style="display:none;margin-top:14px;">
      <div id="patchnote-toolbar" style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;">
        <button type="button" onclick="document.execCommand('bold')" style="font-weight:700;" class="pn-tb-btn">G</button>
        <button type="button" onclick="document.execCommand('italic')" style="font-style:italic;" class="pn-tb-btn">I</button>
        <button type="button" onclick="document.execCommand('underline')" style="text-decoration:underline;" class="pn-tb-btn">S</button>
        <button type="button" onclick="document.execCommand('insertUnorderedList')" class="pn-tb-btn">• Liste</button>
        <button type="button" onclick="document.execCommand('formatBlock', false, 'H3')" class="pn-tb-btn">Titre</button>
        <button type="button" onclick="document.execCommand('formatBlock', false, 'P')" class="pn-tb-btn">Texte</button>
      </div>
      <div id="patchnote-editable" contenteditable="true" style="background:#1f1a30;border:1.5px solid #3a3260;border-radius:8px;padding:12px;min-height:220px;color:#efe6c8;font-size:13.5px;line-height:1.6;"></div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button onclick="cancelPatchNoteEdit()" style="flex:1;padding:9px;border-radius:8px;background:transparent;border:1.5px solid #3a3260;color:#d9cfae;cursor:pointer;">Annuler</button>
        <button onclick="savePatchNote()" style="flex:1;padding:9px;border-radius:8px;background:#7c5cff;border:none;color:#fff;font-weight:600;cursor:pointer;">Publier cette version</button>
      </div>
      <div id="patchnote-edit-status" style="font-size:11.5px;color:#d9cfae;margin-top:8px;min-height:14px;"></div>
    </div>
  </div>
</div>

<style>
  .pn-tb-btn{background:#241f38;border:1px solid #3a3260;color:#efe6c8;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .pn-tb-btn:hover{border-color:#d4af37;}
  #patchnote-content h3{font-family:'Cinzel',serif;color:#d4af37;font-size:14px;margin:14px 0 6px;}
  #patchnote-content ul{padding-left:20px;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="spellcraft-shared.js"></script>
<script src="spellcraft-server-client.js"></script>
<script src="spellcraft-auth.js"></script>
<script>
initSpellcraftAuth().then(initPatchNotesBadge);
playMusic('menu', {loop:true, volume:0.35});

let PATCHNOTE_CAN_EDIT = false;
let MY_USER_ID_HUB = null;

async function initPatchNotesBadge(){
  const { data: { user } } = await sb.auth.getUser();
  MY_USER_ID_HUB = user?.id;
  if(!MY_USER_ID_HUB) return;
  const res = await gsGetLatestPatchNote(MY_USER_ID_HUB);
  if(res.error) return;
  document.getElementById('patchnote-badge').style.display = res.hasUnread ? 'flex' : 'none';
}

async function openPatchNotes(){
  const overlay = document.getElementById('patchnote-overlay');
  overlay.style.display = 'flex';
  document.getElementById('patchnote-edit-mode').style.display = 'none';
  document.getElementById('patchnote-view-mode').style.display = 'block';

  const res = await gsGetLatestPatchNote(MY_USER_ID_HUB);
  if(res.error) return;
  PATCHNOTE_CAN_EDIT = !!res.canEdit;
  document.getElementById('patchnote-gear-btn').style.display = PATCHNOTE_CAN_EDIT ? 'block' : 'none';

  if(res.content){
    document.getElementById('patchnote-content').innerHTML = res.content;
    document.getElementById('patchnote-content').style.display = 'block';
    document.getElementById('patchnote-empty').style.display = 'none';
  } else {
    document.getElementById('patchnote-content').style.display = 'none';
    document.getElementById('patchnote-empty').style.display = 'block';
  }

  if(MY_USER_ID_HUB){
    await gsMarkPatchNotesSeen();
    document.getElementById('patchnote-badge').style.display = 'none';
  }
}
function closePatchNotes(){
  document.getElementById('patchnote-overlay').style.display = 'none';
}
function openPatchNoteEditor(){
  document.getElementById('patchnote-view-mode').style.display = 'none';
  document.getElementById('patchnote-edit-mode').style.display = 'block';
  document.getElementById('patchnote-editable').innerHTML = document.getElementById('patchnote-content').innerHTML || '';
  document.getElementById('patchnote-edit-status').textContent = '';
}
function cancelPatchNoteEdit(){
  document.getElementById('patchnote-edit-mode').style.display = 'none';
  document.getElementById('patchnote-view-mode').style.display = 'block';
}
async function savePatchNote(){
  const statusEl = document.getElementById('patchnote-edit-status');
  const content = document.getElementById('patchnote-editable').innerHTML.trim();
  if(!content){ statusEl.textContent = 'Écris quelque chose avant de publier.'; return; }
  statusEl.textContent = 'Publication en cours...';
  const res = await gsPublishPatchNote(content);
  if(res.error){ statusEl.textContent = 'Erreur : ' + res.error; return; }
  statusEl.textContent = 'Publié !';
  setTimeout(()=>{ openPatchNotes(); }, 600);
}
</script>

</body>
</html>
